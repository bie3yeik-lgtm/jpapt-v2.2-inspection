name: Candidate Package Evaluate V2

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Caller correlation ID; generated when blank
        required: false
        default: ""
        type: string
      request_execution_id:
        description: Orchestrator execution correlation ID; generated when blank
        required: false
        default: ""
        type: string
      source_repository:
        description: Source GitHub repo owner/name
        required: true
        type: string
      receipt_repository:
        description: Completion receipt repo owner/name; blank = source repository
        required: false
        default: ""
        type: string
      hf_bucket:
        description: Optional namespace/bucket
        required: false
        default: ""
        type: string
      candidate_id:
        description: candidate-NNNNNN; blank = repository default/latest
        required: false
        default: ""
        type: string
      package_name:
        description: GHCR package name; blank = repository config/repo name
        required: false
        default: ""
        type: string
      dataset_source:
        description: auto, bucket, repository, or custom
        required: false
        default: auto
        type: choice
        options: [auto, bucket, repository, custom]
      dataset_id:
        description: HF dataset repo id for custom/repository source
        required: false
        default: ""
        type: string
      suite:
        description: Validation suite
        required: false
        default: smoke
        type: choice
        options: [smoke, parity, probe]
      executor:
        description: Execution backend
        required: false
        default: github
        type: choice
        options: [github, hf_jobs]
      environment:
        description: Execution environment
        required: false
        default: linux-cpu
        type: choice
        options: [linux-cpu, linux-cuda, macos-coreml]
      hf_flavor:
        description: HF Jobs flavor
        required: false
        default: cpu-basic
        type: string
      hf_jobs_image:
        description: Optional immutable digest-pinned image override; blank = built digest
        required: false
        default: ""
        type: string
      dry_run:
        description: Resolve and estimate only
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  HF_DEFAULT_NAMESPACE: ${{ vars.HF_DEFAULT_NAMESPACE }}

jobs:
  resolve:
    environment: Private-Secrets
    name: Resolve request
    runs-on: ubuntu-latest
    outputs:
      request_id: ${{ steps.resolve.outputs.request_id }}
      request_execution_id: ${{ steps.resolve.outputs.request_execution_id }}
      source_repository: ${{ steps.resolve.outputs.source_repository }}
      receipt_repository: ${{ steps.resolve.outputs.receipt_repository }}
      hf_bucket: ${{ steps.resolve.outputs.hf_bucket }}
      candidate_id: ${{ steps.resolve.outputs.candidate_id }}
      package_name: ${{ steps.resolve.outputs.package_name }}
      image: ${{ steps.resolve.outputs.image }}
      dataset_source: ${{ steps.resolve.outputs.dataset_source }}
      dataset_id: ${{ steps.resolve.outputs.dataset_id }}
      suite: ${{ steps.resolve.outputs.suite }}
      executor: ${{ steps.resolve.outputs.executor }}
      environment: ${{ steps.resolve.outputs.environment }}
      provider: ${{ steps.resolve.outputs.provider }}
      ort_package: ${{ steps.resolve.outputs.ort_package }}
      hf_flavor: ${{ steps.resolve.outputs.hf_flavor }}
      hf_jobs_image: ${{ steps.resolve.outputs.hf_jobs_image }}
      dry_run: ${{ steps.resolve.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable

      - name: Install routing clients
        run: python -m pip install --disable-pip-version-check --upgrade "huggingface_hub>=1.0,<2" pyyaml

      - name: Normalize workflow inputs
        id: inputs
        env:
          I_REQUEST_ID: ${{ inputs.request_id }}
          I_REQUEST_EXECUTION_ID: ${{ inputs.request_execution_id }}
          REQUEST_EXECUTION_PREFIX: eval
          I_SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          I_RECEIPT_REPOSITORY: ${{ inputs.receipt_repository }}
          I_HF_BUCKET: ${{ inputs.hf_bucket }}
          I_CANDIDATE_ID: ${{ inputs.candidate_id }}
          I_PACKAGE_NAME: ${{ inputs.package_name }}
          I_DATASET_SOURCE: ${{ inputs.dataset_source }}
          I_DATASET_ID: ${{ inputs.dataset_id }}
          I_SUITE: ${{ inputs.suite }}
          I_EXECUTOR: ${{ inputs.executor }}
          I_ENVIRONMENT: ${{ inputs.environment }}
          I_HF_FLAVOR: ${{ inputs.hf_flavor }}
          I_HF_JOBS_IMAGE: ${{ inputs.hf_jobs_image }}
          I_DRY_RUN: ${{ inputs.dry_run }}
        run: >-
          python scripts/ci/normalize-candidate-request.py
          --event-name workflow_dispatch
          --output /tmp/request.json
          --github-output "$GITHUB_OUTPUT"

      - name: Fetch source repository routing config
        shell: bash
        env:
          SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
          SOURCE_REPOSITORY: ${{ steps.inputs.outputs.source_repository }}
          GH_FALLBACK_TOKEN: ${{ github.token }}
        run: bash scripts/ci/fetch-source-routing-config.sh "$SOURCE_REPOSITORY" /tmp/source.json

      - name: Infer HF namespace
        id: namespace
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          namespace="${HF_DEFAULT_NAMESPACE:-}"
          if [[ -z "$namespace" && -n "${HF_TOKEN:-}" ]]; then
            namespace="$(HF_TOKEN="$HF_TOKEN" hf auth whoami --format json 2>/dev/null | jq -r '.name // .user // empty' || true)"
          fi
          echo "value=$namespace" >> "$GITHUB_OUTPUT"

      - name: Resolve with Rust contract
        id: resolve
        shell: bash
        env:
          DEFAULT_NAMESPACE: ${{ steps.namespace.outputs.value }}
        run: |
          set -euo pipefail
          cargo run --quiet --locked -p asr-contracts --bin asr-candidate-request -- \
            resolve \
            --inputs-json "$(cat /tmp/request.json)" \
            --config-json "$(cat /tmp/source.json)" \
            --default-namespace "$DEFAULT_NAMESPACE" \
            --registry-owner "$GITHUB_REPOSITORY_OWNER" \
            --github-output "$GITHUB_OUTPUT"

      - name: Build running lifecycle snapshot
        id: lifecycle
        shell: bash
        env:
          REQUEST_ID: ${{ steps.resolve.outputs.request_id }}
          REQUEST_EXECUTION_ID: ${{ steps.resolve.outputs.request_execution_id }}
          SOURCE_REPOSITORY: ${{ steps.resolve.outputs.source_repository }}
          RECEIPT_REPOSITORY: ${{ steps.resolve.outputs.receipt_repository }}
          ORCHESTRATOR_REPOSITORY: ${{ github.repository }}
          EVALUATION_RUN_ID: ${{ github.run_id }}
          EVALUATION_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p .ci/lifecycle
          request_key="$(python scripts/ci/build-candidate-request-lifecycle.py --request-key "$REQUEST_ID")"
          python scripts/ci/build-candidate-request-lifecycle.py \
            --state running \
            --output .ci/lifecycle/candidate-request-lifecycle.json
          echo "request_key=$request_key" >> "$GITHUB_OUTPUT"

      - name: Preserve running lifecycle snapshot
        uses: actions/upload-artifact@v7
        with:
          name: candidate-lifecycle-${{ steps.lifecycle.outputs.request_key }}-running
          path: .ci/lifecycle/candidate-request-lifecycle.json
          retention-days: 30

      - name: Estimate from provenance-matched history
        id: estimate
        env:
          GH_TOKEN: ${{ github.token }}
          SUITE: ${{ steps.resolve.outputs.suite }}
          EXECUTOR: ${{ steps.resolve.outputs.executor }}
          ENVIRONMENT: ${{ steps.resolve.outputs.environment }}
          SOURCE_REPOSITORY: ${{ steps.resolve.outputs.source_repository }}
          HF_BUCKET: ${{ steps.resolve.outputs.hf_bucket }}
          DATASET_SOURCE: ${{ steps.resolve.outputs.dataset_source }}
          DATASET_ID: ${{ steps.resolve.outputs.dataset_id }}
        run: >-
          python scripts/ci/estimate-candidate-runtime.py
          --repository "$GITHUB_REPOSITORY"
          --workflow candidate-package-evaluate-v2.yml
          --suite "$SUITE"
          --executor "$EXECUTOR"
          --environment "$ENVIRONMENT"
          --github-output "$GITHUB_OUTPUT"

      - name: Write execution plan
        shell: bash
        env:
          REQUEST_ID: ${{ steps.resolve.outputs.request_id }}
          REQUEST_EXECUTION_ID: ${{ steps.resolve.outputs.request_execution_id }}
          SOURCE_REPOSITORY: ${{ steps.resolve.outputs.source_repository }}
          RECEIPT_REPOSITORY: ${{ steps.resolve.outputs.receipt_repository }}
          HF_BUCKET: ${{ steps.resolve.outputs.hf_bucket }}
          CANDIDATE_ID: ${{ steps.resolve.outputs.candidate_id }}
          IMAGE: ${{ steps.resolve.outputs.image }}
          DATASET_SOURCE: ${{ steps.resolve.outputs.dataset_source }}
          DATASET_ID: ${{ steps.resolve.outputs.dataset_id }}
          SUITE: ${{ steps.resolve.outputs.suite }}
          EXECUTOR: ${{ steps.resolve.outputs.executor }}
          ENVIRONMENT: ${{ steps.resolve.outputs.environment }}
          PROVIDER: ${{ steps.resolve.outputs.provider }}
          ESTIMATE_METHOD: ${{ steps.estimate.outputs.method }}
          ESTIMATE_COHORT: ${{ steps.estimate.outputs.cohort }}
          ESTIMATE_SAMPLES: ${{ steps.estimate.outputs.samples }}
          ESTIMATE_AVAILABLE: ${{ steps.estimate.outputs.available_samples }}
          ESTIMATE_MINUTES: ${{ steps.estimate.outputs.estimate_minutes }}
          ESTIMATE_P50: ${{ steps.estimate.outputs.p50_minutes }}
          ESTIMATE_P90: ${{ steps.estimate.outputs.p90_minutes }}
        run: |
          candidate="${CANDIDATE_ID:-latest}"
          dataset="${DATASET_ID:-bucket-default}"
          {
            echo '## Candidate evaluation plan'
            echo
            printf -- '- request id: `%s`\n' "$REQUEST_ID"
            printf -- '- request execution id: `%s`\n' "$REQUEST_EXECUTION_ID"
            printf -- '- source: `%s`\n' "$SOURCE_REPOSITORY"
            printf -- '- receipt repository: `%s`\n' "$RECEIPT_REPOSITORY"
            printf -- '- completion event: `jpapt.candidate-completed`\n'
            printf -- '- bucket: `%s`\n' "$HF_BUCKET"
            printf -- '- candidate: `%s`\n' "$candidate"
            printf -- '- package: `%s`\n' "$IMAGE"
            printf -- '- dataset: `%s` / `%s`\n' "$DATASET_SOURCE" "$dataset"
            printf -- '- suite/backend: `%s` / `%s` / `%s`\n' "$SUITE" "$EXECUTOR" "$ENVIRONMENT"
            printf -- '- provider: `%s`\n' "$PROVIDER"
            printf -- '- estimate: `%s` / cohort `%s` / `%s` selected of `%s` samples\n' "$ESTIMATE_METHOD" "$ESTIMATE_COHORT" "$ESTIMATE_SAMPLES" "$ESTIMATE_AVAILABLE"
            printf -- '- estimated upper-bound runtime: **~%s min**\n' "$ESTIMATE_MINUTES"
            if [[ "$ESTIMATE_METHOD" == historical ]]; then
              printf -- '- observed p50 / p90: `%s` / `%s` min\n' "$ESTIMATE_P50" "$ESTIMATE_P90"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Resolve candidate and package image
    needs: resolve
    if: ${{ needs.resolve.outputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      candidate_id: ${{ steps.candidate.outputs.candidate_id }}
      image_ref: ${{ steps.package.outputs.image_ref }}
      image_tag: ${{ steps.package.outputs.image_tag }}
      image_digest: ${{ steps.package.outputs.image_digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install HF CLI
        run: python -m pip install --upgrade "huggingface_hub>=1.0,<2"
      - name: Resolve candidate identity and materialize only when building
        id: candidate
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_BUCKET: ${{ needs.resolve.outputs.hf_bucket }}
          CANDIDATE_ID: ${{ needs.resolve.outputs.candidate_id }}
          EXECUTOR: ${{ needs.resolve.outputs.executor }}
          HF_JOBS_IMAGE: ${{ needs.resolve.outputs.hf_jobs_image }}
          ASR_RUNTIME_VARIANT: ctc
        run: |
          set -euo pipefail
          if [[ "$EXECUTOR" == hf_jobs && -n "$HF_JOBS_IMAGE" ]]; then
            bash scripts/hf/hf-fetch-candidate.sh "${CANDIDATE_ID:-}" --resolve-only
          else
            bash scripts/hf/hf-fetch-candidate.sh "${CANDIDATE_ID:-}"
          fi
      - uses: docker/setup-buildx-action@v3
        if: ${{ needs.resolve.outputs.executor != 'hf_jobs' || needs.resolve.outputs.hf_jobs_image == '' }}
      - uses: docker/login-action@v3
        if: ${{ needs.resolve.outputs.executor != 'hf_jobs' || needs.resolve.outputs.hf_jobs_image == '' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push immutable package
        id: build
        if: ${{ needs.resolve.outputs.executor != 'hf_jobs' || needs.resolve.outputs.hf_jobs_image == '' }}
        shell: bash
        env:
          IMAGE: ${{ needs.resolve.outputs.image }}
          SOURCE_REPOSITORY: ${{ needs.resolve.outputs.source_repository }}
          HF_BUCKET: ${{ needs.resolve.outputs.hf_bucket }}
          PACKAGE_NAME: ${{ needs.resolve.outputs.package_name }}
          CANDIDATE_ID: ${{ steps.candidate.outputs.candidate_id }}
          RUNTIME_ENVIRONMENT: ${{ needs.resolve.outputs.environment }}
          ORT_PACKAGE: ${{ needs.resolve.outputs.ort_package }}
        run: |
          set -euo pipefail
          tag="$IMAGE:$CANDIDATE_ID-$RUNTIME_ENVIRONMENT"
          docker buildx build \
            -f docker/candidate-package/Dockerfile . \
            --build-arg SOURCE_REPOSITORY="$SOURCE_REPOSITORY" \
            --build-arg SOURCE_BUCKET="$HF_BUCKET" \
            --build-arg CANDIDATE_ID="$CANDIDATE_ID" \
            --build-arg PACKAGE_NAME="$PACKAGE_NAME" \
            --build-arg RUNTIME_ENVIRONMENT="$RUNTIME_ENVIRONMENT" \
            --build-arg ORT_PACKAGE="$ORT_PACKAGE" \
            --cache-from "type=gha,scope=candidate-$PACKAGE_NAME-$RUNTIME_ENVIRONMENT" \
            --cache-to "type=gha,mode=max,scope=candidate-$PACKAGE_NAME-$RUNTIME_ENVIRONMENT" \
            --metadata-file /tmp/build-metadata.json \
            --tag "$tag" \
            --tag "$IMAGE:latest-$RUNTIME_ENVIRONMENT" \
            --push
          digest="$(jq -er '."containerimage.digest"' /tmp/build-metadata.json)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::invalid image digest: $digest"; exit 1; }
          {
            echo "image_tag=$tag"
            echo "image_digest=$digest"
            echo "image_ref=$IMAGE@$digest"
          } >> "$GITHUB_OUTPUT"
      - name: Select package image authority
        id: package
        shell: bash
        env:
          EXECUTOR: ${{ needs.resolve.outputs.executor }}
          HF_JOBS_IMAGE: ${{ needs.resolve.outputs.hf_jobs_image }}
          BUILT_IMAGE_REF: ${{ steps.build.outputs.image_ref }}
          BUILT_IMAGE_TAG: ${{ steps.build.outputs.image_tag }}
          BUILT_IMAGE_DIGEST: ${{ steps.build.outputs.image_digest }}
        run: |
          set -euo pipefail
          if [[ "$EXECUTOR" == hf_jobs && -n "$HF_JOBS_IMAGE" ]]; then
            [[ "$HF_JOBS_IMAGE" =~ ^[A-Za-z0-9._/-]+(:[A-Za-z0-9._-]+)?@sha256:[0-9a-f]{64}$ ]] || {
              echo "::error::hf_jobs_image override must be an immutable lowercase sha256 digest reference"
              exit 1
            }
            image_ref="$HF_JOBS_IMAGE"
            image_tag=""
            image_digest="${HF_JOBS_IMAGE##*@}"
          else
            [[ -n "$BUILT_IMAGE_REF" && -n "$BUILT_IMAGE_DIGEST" ]] || {
              echo "::error::package build did not produce immutable image outputs"
              exit 1
            }
            image_ref="$BUILT_IMAGE_REF"
            image_tag="$BUILT_IMAGE_TAG"
            image_digest="$BUILT_IMAGE_DIGEST"
          fi
          {
            echo "image_ref=$image_ref"
            echo "image_tag=$image_tag"
            echo "image_digest=$image_digest"
          } >> "$GITHUB_OUTPUT"

  github-linux-cpu:
    name: GitHub / Linux CPU
    needs: [resolve, build]
    if: ${{ needs.resolve.outputs.executor == 'github' && needs.resolve.outputs.environment == 'linux-cpu' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install clients
        run: python -m pip install --upgrade "huggingface_hub>=1.0,<2" onnx numpy onnxruntime
      - name: Evaluate
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_BUCKET: ${{ needs.resolve.outputs.hf_bucket }}
          CANDIDATE_ID: ${{ needs.build.outputs.candidate_id }}
          SUITE: ${{ needs.resolve.outputs.suite }}
          PROVIDER: CPUExecutionProvider
          ENVIRONMENT: linux-cpu
          DATASET_SOURCE: ${{ needs.resolve.outputs.dataset_source }}
          DATASET_ID: ${{ needs.resolve.outputs.dataset_id }}
          IMAGE_REF: ${{ needs.build.outputs.image_ref }}
          IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
          GHCR_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY: ${{ needs.resolve.outputs.source_repository }}
        run: bash scripts/ci/run-candidate-package-evaluation.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: candidate-package-${{ needs.build.outputs.candidate_id }}-linux-cpu-${{ needs.resolve.outputs.suite }}
          path: results/candidate-package
          retention-days: 14

  github-linux-cuda:
    name: GitHub / Linux CUDA
    needs: [resolve, build]
    if: ${{ needs.resolve.outputs.executor == 'github' && needs.resolve.outputs.environment == 'linux-cuda' }}
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 180
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install clients
        run: python -m pip install --upgrade "huggingface_hub>=1.0,<2" onnx numpy onnxruntime-gpu
      - name: Evaluate
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_BUCKET: ${{ needs.resolve.outputs.hf_bucket }}
          CANDIDATE_ID: ${{ needs.build.outputs.candidate_id }}
          SUITE: ${{ needs.resolve.outputs.suite }}
          PROVIDER: CUDAExecutionProvider
          ENVIRONMENT: linux-cuda
          DATASET_SOURCE: ${{ needs.resolve.outputs.dataset_source }}
          DATASET_ID: ${{ needs.resolve.outputs.dataset_id }}
          IMAGE_REF: ${{ needs.build.outputs.image_ref }}
          IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
          GHCR_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY: ${{ needs.resolve.outputs.source_repository }}
        run: bash scripts/ci/run-candidate-package-evaluation.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: candidate-package-${{ needs.build.outputs.candidate_id }}-linux-cuda-${{ needs.resolve.outputs.suite }}
          path: results/candidate-package
          retention-days: 14

  github-macos-coreml:
    name: GitHub / macOS CoreML
    needs: [resolve, build]
    if: ${{ needs.resolve.outputs.executor == 'github' && needs.resolve.outputs.environment == 'macos-coreml' }}
    runs-on: macos-14
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native runtime
        run: python -m pip install --upgrade "huggingface_hub>=1.0,<2" onnx numpy onnxruntime
      - name: Evaluate
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_BUCKET: ${{ needs.resolve.outputs.hf_bucket }}
          CANDIDATE_ID: ${{ needs.build.outputs.candidate_id }}
          SUITE: ${{ needs.resolve.outputs.suite }}
          PROVIDER: CoreMLExecutionProvider
          ENVIRONMENT: macos-coreml
          DATASET_SOURCE: ${{ needs.resolve.outputs.dataset_source }}
          DATASET_ID: ${{ needs.resolve.outputs.dataset_id }}
          IMAGE_REF: ${{ needs.build.outputs.image_ref }}
          IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
          SOURCE_REPOSITORY: ${{ needs.resolve.outputs.source_repository }}
        run: bash scripts/ci/run-candidate-package-evaluation.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: candidate-package-${{ needs.build.outputs.candidate_id }}-macos-coreml-${{ needs.resolve.outputs.suite }}
          path: results/candidate-package
          retention-days: 14

  github-windows-directml:
    name: GitHub / Windows DirectML
    needs: [resolve, build]
    if: ${{ needs.resolve.outputs.executor == 'github' && needs.resolve.outputs.environment == 'windows-directml' }}
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native runtime
        run: python -m pip install --upgrade "huggingface_hub>=1.0,<2" onnx numpy onnxruntime-directml
      - name: Evaluate
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_BUCKET: ${{ needs.resolve.outputs.hf_bucket }}
          CANDIDATE_ID: ${{ needs.build.outputs.candidate_id }}
          SUITE: ${{ needs.resolve.outputs.suite }}
          PROVIDER: DmlExecutionProvider
          ENVIRONMENT: windows-directml
          DATASET_SOURCE: ${{ needs.resolve.outputs.dataset_source }}
          DATASET_ID: ${{ needs.resolve.outputs.dataset_id }}
          IMAGE_REF: ${{ needs.build.outputs.image_ref }}
          IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
          SOURCE_REPOSITORY: ${{ needs.resolve.outputs.source_repository }}
        run: bash scripts/ci/run-candidate-package-evaluation.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: candidate-package-${{ needs.build.outputs.candidate_id }}-windows-directml-${{ needs.resolve.outputs.suite }}
          path: results/candidate-package
          retention-days: 14

  hf-jobs:
    name: Hugging Face Jobs
    needs: [resolve, build]
    if: ${{ needs.resolve.outputs.executor == 'hf_jobs' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      result_uri: ${{ steps.plan.outputs.result_uri }}
      image_ref: ${{ steps.plan.outputs.image }}
      image_digest: ${{ steps.plan.outputs.image_digest }}
      plan_sha256: ${{ steps.plan.outputs.plan_sha256 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install HF CLI
        run: python -m pip install --upgrade "huggingface_hub>=1.0,<2"
      - name: Plan remote evaluation with Rust
        id: plan
        shell: bash
        env:
          BUILT_IMAGE: ${{ needs.build.outputs.image_ref }}
          HF_JOBS_IMAGE_OVERRIDE: ${{ needs.resolve.outputs.hf_jobs_image }}
          SUITE: ${{ needs.resolve.outputs.suite }}
          ENVIRONMENT: ${{ needs.resolve.outputs.environment }}
          PROVIDER: ${{ needs.resolve.outputs.provider }}
          HF_BUCKET: ${{ needs.resolve.outputs.hf_bucket }}
          DATASET_SOURCE: ${{ needs.resolve.outputs.dataset_source }}
          DATASET_ID: ${{ needs.resolve.outputs.dataset_id }}
          FLAVOR: ${{ needs.resolve.outputs.hf_flavor }}
          CANDIDATE_ID: ${{ needs.build.outputs.candidate_id }}
        run: |
          set -euo pipefail
          mkdir -p .ci/hf-jobs
          cargo run --quiet --locked -p asr-contracts --bin asr-hf-job -- \
            plan \
            --built-image "$BUILT_IMAGE" \
            --image-override "$HF_JOBS_IMAGE_OVERRIDE" \
            --candidate-id "$CANDIDATE_ID" \
            --suite "$SUITE" \
            --environment "$ENVIRONMENT" \
            --provider "$PROVIDER" \
            --hf-bucket "$HF_BUCKET" \
            --dataset-source "$DATASET_SOURCE" \
            --dataset-id "$DATASET_ID" \
            --flavor "$FLAVOR" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output-json .ci/hf-jobs/hf-job-plan.json \
            --github-output "$GITHUB_OUTPUT" >/dev/null
      - name: Preserve validated HF Jobs plan before remote execution
        uses: actions/upload-artifact@v7
        with:
          name: candidate-hf-job-plan-${{ needs.build.outputs.candidate_id }}-${{ needs.resolve.outputs.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci/hf-jobs/hf-job-plan.json
          retention-days: 30
      - name: Verify selected HF Jobs image is anonymously pullable
        shell: bash
        env:
          IMAGE_REF: ${{ steps.plan.outputs.image }}
        run: bash scripts/ci/hf-jobs-image-preflight.sh "$IMAGE_REF"
      - name: Run remote evaluation from validated Rust plan
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: >-
          cargo run --quiet --locked -p asr-contracts --bin asr-hf-job --
          run --plan .ci/hf-jobs/hf-job-plan.json
      - name: Write HF Jobs provenance artifact
        if: always()
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ needs.resolve.outputs.source_repository }}
          HF_BUCKET: ${{ needs.resolve.outputs.hf_bucket }}
          CANDIDATE_ID: ${{ needs.build.outputs.candidate_id }}
          IMAGE_REF: ${{ steps.plan.outputs.image }}
          IMAGE_DIGEST: ${{ steps.plan.outputs.image_digest }}
          SUITE: ${{ needs.resolve.outputs.suite }}
          ENVIRONMENT: ${{ needs.resolve.outputs.environment }}
          PROVIDER: ${{ needs.resolve.outputs.provider }}
          DATASET_SOURCE: ${{ needs.resolve.outputs.dataset_source }}
          DATASET_ID: ${{ needs.resolve.outputs.dataset_id }}
        run: |
          mkdir -p results/candidate-package
          if [[ -f .ci/hf-jobs/hf-job-plan.json ]]; then
            cp .ci/hf-jobs/hf-job-plan.json results/candidate-package/hf-job-plan.json
          fi
          jq -n \
            --arg source_repository "$SOURCE_REPOSITORY" \
            --arg hf_bucket "$HF_BUCKET" \
            --arg candidate_id "$CANDIDATE_ID" \
            --arg image "$IMAGE_REF" \
            --arg image_digest "$IMAGE_DIGEST" \
            --arg suite "$SUITE" \
            --arg environment "$ENVIRONMENT" \
            --arg provider "$PROVIDER" \
            --arg dataset_source "$DATASET_SOURCE" \
            --arg dataset_id "$DATASET_ID" \
            '{schema_version:2,source_repository:$source_repository,hf_bucket:$hf_bucket,candidate_id:$candidate_id,image:$image,image_digest:$image_digest,suite:$suite,environment:$environment,provider:$provider,dataset_source:$dataset_source,dataset_id:$dataset_id,dataset_bytes:0,dataset_files:0,candidate_bytes:0,candidate_files:0,package_bytes:0,executor:"hf_jobs"}' \
            > results/candidate-package/evaluation-provenance.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: candidate-package-${{ needs.build.outputs.candidate_id }}-hf-jobs-${{ needs.resolve.outputs.suite }}
          path: results/candidate-package
          retention-days: 14

  completion:
    environment: Private-Secrets
    name: Emit candidate completion receipt
    needs:
      - resolve
      - build
      - github-linux-cpu
      - github-linux-cuda
      - github-macos-coreml
      - github-windows-directml
      - hf-jobs
    if: ${{ always() && needs.resolve.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build completion receipt and dispatch body
        env:
          REQUEST_ID: ${{ needs.resolve.outputs.request_id }}
          REQUEST_EXECUTION_ID: ${{ needs.resolve.outputs.request_execution_id }}
          SOURCE_REPOSITORY: ${{ needs.resolve.outputs.source_repository }}
          RECEIPT_REPOSITORY: ${{ needs.resolve.outputs.receipt_repository }}
          HF_BUCKET: ${{ needs.resolve.outputs.hf_bucket }}
          DRY_RUN: ${{ needs.resolve.outputs.dry_run }}
          SUITE: ${{ needs.resolve.outputs.suite }}
          EXECUTOR: ${{ needs.resolve.outputs.executor }}
          ENVIRONMENT: ${{ needs.resolve.outputs.environment }}
          PROVIDER: ${{ needs.resolve.outputs.provider }}
          ORCHESTRATOR_REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          REQUESTED_CANDIDATE_ID: ${{ needs.resolve.outputs.candidate_id }}
          RESOLVED_CANDIDATE_ID: ${{ needs.build.outputs.candidate_id }}
          IMAGE_REF: ${{ needs.build.outputs.image_ref }}
          IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
          HF_JOBS_IMAGE_REF: ${{ needs.hf-jobs.outputs.image_ref }}
          HF_JOBS_IMAGE_DIGEST: ${{ needs.hf-jobs.outputs.image_digest }}
          HF_JOBS_RESULT_URI: ${{ needs.hf-jobs.outputs.result_uri }}
          BUILD_RESULT: ${{ needs.build.result }}
          CPU_RESULT: ${{ needs.github-linux-cpu.result }}
          CUDA_RESULT: ${{ needs.github-linux-cuda.result }}
          COREML_RESULT: ${{ needs.github-macos-coreml.result }}
          DIRECTML_RESULT: ${{ needs.github-windows-directml.result }}
          HF_JOBS_RESULT: ${{ needs.hf-jobs.result }}
        run: >-
          cargo run --quiet --locked -p asr-contracts --bin asr-candidate-protocol-build --
          receipt
          --receipt .ci/candidate-completion-receipt.json
          --dispatch-body .ci/candidate-completion-dispatch.json
      - name: Preserve completion receipt
        uses: actions/upload-artifact@v7
        with:
          name: candidate-completion-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci/candidate-completion-receipt.json
          retention-days: 30
      - name: Dispatch completion event
        shell: bash
        env:
          RECEIPT_REPOSITORY: ${{ needs.resolve.outputs.receipt_repository }}
          RECEIPT_TOKEN: ${{ secrets.TARGET_REPO_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          token="$RECEIPT_TOKEN"
          if [[ -z "$token" && "$RECEIPT_REPOSITORY" == "$GITHUB_REPOSITORY" ]]; then
            token="$GITHUB_TOKEN"
          fi
          [[ -n "$token" ]] || {
            echo "::error::TARGET_REPO_TOKEN is required to deliver completion receipt to $RECEIPT_REPOSITORY"
            exit 1
          }
          GH_TOKEN="$token" bash scripts/ci/repository-dispatch-with-retry.sh \
            "$RECEIPT_REPOSITORY" \
            .ci/candidate-completion-dispatch.json \
            3
