name: Phase12 Doc Fix

on:
  push:
    branches: [agent/rust-hf-config-publish-phase12]
    paths:
      - .github/workflows/phase12-doc-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/rust-hf-config-publish-phase12
      - name: Restore main documentation and apply intended Phase 12 edit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git show origin/main:docs/json-reference.md > docs/json-reference.md
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/json-reference.md')
          text = path.read_text()
          old = '**生成:** `scripts/ci/write-runtime-lock.py` / `hf-push-config-version.sh`'
          new = '**生成:** Rust `asr-config-publish prepare`（`hf-push-config-version.sh` から呼び出し）'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one runtime generation marker, got {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
      - name: Commit documentation fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/json-reference.md
          git commit -m "Document Rust config runtime generation"
          git push origin HEAD:agent/rust-hf-config-publish-phase12
