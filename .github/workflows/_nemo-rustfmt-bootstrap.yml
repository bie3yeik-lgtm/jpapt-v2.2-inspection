name: NeMo Rustfmt Bootstrap

on:
  push:
    branches: [agent/nemo-onnx-validation]
    paths:
      - ".github/workflows/_nemo-rustfmt-bootstrap.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/nemo-onnx-validation
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add rust/crates/asr-eval/src/nemo_onnx.rs rust/crates/asr-eval/src/main.rs rust/crates/asr-eval/tests/nemo_onnx_validation.rs
          git diff --cached --quiet && exit 0
          git commit -m "Apply canonical rustfmt to NeMo validation"
          git push origin HEAD:agent/nemo-onnx-validation
