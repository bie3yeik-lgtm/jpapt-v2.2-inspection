name: Phase14 Validate

on:
  push:
    branches: [agent/rust-allocator-readme-phase14]
    paths:
      - .github/workflows/phase14-validate.yml
      - rust/crates/asr-hf/**
      - scripts/hf/hf-update-root-readme.sh

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/rust-allocator-readme-phase14
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Validate Phase 14
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo clippy --locked -p asr-hf --all-targets -- -D warnings
          cargo test --locked -p asr-hf
          bash -n scripts/hf/hf-update-root-readme.sh
          if grep -nE '(^|[^[:alnum:]_])(python|uv run python)([^[:alnum:]_]|$)' scripts/hf/hf-update-root-readme.sh; then
            echo 'Python remains in allocator README update path' >&2
            exit 1
          fi
          tmp="$(mktemp -d)"
          printf '# Bucket\n\nHuman text\n' > "$tmp/README.md"
          printf 'candidate-a-000002/file\ncandidate-b-000005/file\n' > "$tmp/candidates.txt"
          printf 'cpu-full-000003/file\n' > "$tmp/experiments.txt"
          printf 'config-000004/reference.json\n' > "$tmp/config.txt"
          cargo run --quiet --locked -p asr-hf --bin asr-allocator-readme -- \
            --readme "$tmp/README.md" \
            --candidates-listing "$tmp/candidates.txt" \
            --experiments-listing "$tmp/experiments.txt" \
            --config-listing "$tmp/config.txt" \
            --last-id candidate-b-000005 \
            --last-collection candidates \
            --updated-at 2026-08-17T00:00:00Z >/dev/null
          grep -q 'candidates 現在番号: `000005`（`candidate-b-000005`）' "$tmp/README.md"
          grep -q 'experiments 現在番号: `000003`（`cpu-full-000003`）' "$tmp/README.md"
          grep -q 'config 現在番号: `000004`（`config-000004`）' "$tmp/README.md"
          grep -q 'Human text' "$tmp/README.md"
      - name: Commit normalized production files and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/phase14-validate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/crates/asr-hf scripts/hf/hf-update-root-readme.sh .github/workflows/phase14-validate.yml
          git commit -m "Normalize Rust allocator README updater"
          git push origin HEAD:agent/rust-allocator-readme-phase14
