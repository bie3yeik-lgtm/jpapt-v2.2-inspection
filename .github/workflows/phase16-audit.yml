name: Phase16 Audit

on:
  push:
    branches: [agent/rust-asr-catalog-phase16]
    paths:
      - .github/workflows/phase16-audit.yml

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: List resolver references
        shell: bash
        run: |
          set -euo pipefail
          git grep -n 'resolve-asr-catalog.py' || true
