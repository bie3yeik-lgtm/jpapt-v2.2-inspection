name: HF Jobs Rust Plan Contracts

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hf-jobs-rust-plan-contracts.yml
      - rust/crates/asr-contracts/src/bin/asr-hf-job.rs
      - rust/crates/asr-contracts/src/bin/asr-candidate-request.rs
      - Cargo.toml
      - Cargo.lock
  pull_request:
    paths:
      - .github/workflows/hf-jobs-rust-plan-contracts.yml
      - rust/crates/asr-contracts/src/bin/asr-hf-job.rs
      - rust/crates/asr-contracts/src/bin/asr-candidate-request.rs
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hf-jobs-rust-plan-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Validate zero-network HF Jobs smoke planning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: false

      - name: Install pinned actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Lint contract workflow
        run: actionlint -color -shellcheck= .github/workflows/hf-jobs-rust-plan-contracts.yml

      - name: Run focused Rust unit tests
        run: >-
          cargo test --locked -p asr-contracts
          --bin asr-hf-job
          --bin asr-candidate-request

      - name: Build canonical CPU Bucket smoke plan
        shell: bash
        run: |
          set -euo pipefail
          digest="$(printf 'a%.0s' {1..64})"
          : > /tmp/github-output
          cargo run --quiet --locked -p asr-contracts --bin asr-hf-job -- \
            plan \
            --built-image "ghcr.io/owner/package@sha256:$digest" \
            --candidate-id candidate-000123 \
            --suite smoke \
            --environment linux-cpu \
            --provider CPUExecutionProvider \
            --hf-bucket owner/project-bucket \
            --dataset-source bucket \
            --flavor cpu-basic \
            --run-id 9101 \
            --run-attempt 2 \
            --output-json /tmp/hf-job-plan.json \
            --github-output /tmp/github-output >/dev/null

          cargo run --quiet --locked -p asr-contracts --bin asr-hf-job -- \
            validate --plan /tmp/hf-job-plan.json >/tmp/plan-sha

          jq -e --arg digest "sha256:$digest" '
            .schema_version == 2 and
            .candidate_id == "candidate-000123" and
            .suite == "smoke" and
            .timeout == "30m" and
            .environment == "linux-cpu" and
            .provider == "CPUExecutionProvider" and
            .image_digest == $digest and
            .dataset_source == "bucket" and
            .dataset_dir == "/jpapt-output/datasets" and
            (.mounts | length) == 1 and
            (.labels | index("jpapt-purpose=smoke-validation")) != null and
            (.labels | index("jpapt-candidate=candidate-000123")) != null and
            .mounts[0].source == "hf://buckets/owner/project-bucket" and
            .mounts[0].target == "/jpapt-output" and
            .mounts[0].mode == "rw" and
            .result_uri == "hf://buckets/owner/project-bucket/runs/hf-jobs/candidate-000123/smoke-9101-2/result.json" and
            (.hf_args | index("--timeout")) != null and
            (.hf_args | index("30m")) != null and
            .hf_args[0] == "jobs" and
            .hf_args[1] == "run"
          ' /tmp/hf-job-plan.json >/dev/null
          grep -F "image_digest=sha256:$digest" /tmp/github-output
          grep -F 'result_uri=hf://buckets/owner/project-bucket/runs/hf-jobs/candidate-000123/smoke-9101-2/result.json' /tmp/github-output
          grep -F 'timeout=30m' /tmp/github-output
          grep -Eq '^plan_sha256=[0-9a-f]{64}$' /tmp/github-output
          grep -Eq '^[0-9a-f]{64}$' /tmp/plan-sha

      - name: Prove hardware preflight run and result readback without network
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fake-bin
          cat > /tmp/fake-bin/hf <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          : "${HF_FAKE_CALLS:?}"
          if [[ "${1:-}" == jobs && "${2:-}" == hardware ]]; then
            echo hardware >> "$HF_FAKE_CALLS"
            printf 'FLAVOR CPU GPU\ncpu-basic 2 -\na10g-small 4 A10G\n'
            exit 0
          fi
          if [[ "${1:-}" == jobs && "${2:-}" == run ]]; then
            : "${HF_FAKE_ARGS:?}"
            echo run >> "$HF_FAKE_CALLS"
            printf '%s\n' "$@" > "$HF_FAKE_ARGS"
            exit 0
          fi
          if [[ "${1:-}" == buckets && "${2:-}" == cp ]]; then
            echo cp >> "$HF_FAKE_CALLS"
            destination="${@: -1}"
            mkdir -p "$(dirname "$destination")"
            cat > "$destination" <<'JSON'
          {
            "schema_version": 2,
            "suite": "smoke",
            "requested_provider": "CPUExecutionProvider",
            "requested_provider_available": true,
            "provider": "CPUExecutionProvider",
            "provider_fallback": false,
            "cpu_ep_fallback_disabled": false,
            "available_providers": ["CPUExecutionProvider"],
            "models": [{
              "path": "encoder.onnx",
              "passed": true,
              "active_providers": ["CPUExecutionProvider"],
              "inputs": [],
              "outputs": []
            }],
            "cases": [{"case": null, "passed": true, "note": "structural smoke"}],
            "passed": true
          }
          JSON
            exit 0
          fi
          echo "unexpected fake hf invocation: $*" >&2
          exit 97
          EOF
          chmod +x /tmp/fake-bin/hf
          : > /tmp/hf-calls
          rm -rf results/candidate-package

          PATH="/tmp/fake-bin:$PATH" \
          HF_TOKEN=fake-contract-token \
          HF_FAKE_ARGS=/tmp/actual-argv \
          HF_FAKE_CALLS=/tmp/hf-calls \
          cargo run --quiet --locked -p asr-contracts --bin asr-hf-job -- \
            run --plan /tmp/hf-job-plan.json

          python - <<'PY'
          import json
          from pathlib import Path
          plan = json.loads(Path('/tmp/hf-job-plan.json').read_text(encoding='utf-8'))
          actual = Path('/tmp/actual-argv').read_text(encoding='utf-8').splitlines()
          calls = Path('/tmp/hf-calls').read_text(encoding='utf-8').splitlines()
          result = json.loads(Path('results/candidate-package/result.json').read_text(encoding='utf-8'))
          assert actual == plan['hf_args'], (actual, plan['hf_args'])
          assert calls == ['hardware', 'run', 'cp'], calls
          assert result['suite'] == 'smoke'
          assert result['passed'] is True
          PY

          cargo run --quiet --locked -p asr-contracts --bin asr-hf-job -- \
            validate-result \
            --plan /tmp/hf-job-plan.json \
            --result results/candidate-package/result.json >/tmp/result-summary.json
          jq -e '
            .suite == "smoke" and
            .candidate_id == "candidate-000123" and
            .provider == "CPUExecutionProvider" and
            .model_count == 1 and
            .case_count == 1 and
            .passed == true
          ' /tmp/result-summary.json >/dev/null

      - name: Reject invalid remote smoke result after completed job
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bad-result-bin
          cat > /tmp/bad-result-bin/hf <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "${1:-}" == jobs && "${2:-}" == hardware ]]; then
            printf 'FLAVOR CPU GPU\ncpu-basic 2 -\n'
            exit 0
          fi
          if [[ "${1:-}" == jobs && "${2:-}" == run ]]; then
            exit 0
          fi
          if [[ "${1:-}" == buckets && "${2:-}" == cp ]]; then
            destination="${@: -1}"
            mkdir -p "$(dirname "$destination")"
            cat > "$destination" <<'JSON'
          {
            "schema_version": 2,
            "suite": "smoke",
            "requested_provider": "CPUExecutionProvider",
            "requested_provider_available": true,
            "provider": "CPUExecutionProvider",
            "provider_fallback": true,
            "models": [{"path":"encoder.onnx","passed":true,"active_providers":["CPUExecutionProvider"]}],
            "cases": [{"case":null,"passed":true}],
            "passed": true
          }
          JSON
            exit 0
          fi
          exit 98
          EOF
          chmod +x /tmp/bad-result-bin/hf
          rm -rf results/candidate-package
          if PATH="/tmp/bad-result-bin:$PATH" HF_TOKEN=fake \
            cargo run --quiet --locked -p asr-contracts --bin asr-hf-job -- \
              run --plan /tmp/hf-job-plan.json; then
            echo 'invalid remote smoke result unexpectedly accepted' >&2
            exit 1
          fi

      - name: Reject unavailable flavor before smoke job creation
        shell: bash
        run: |
          set -euo pipefail
          digest="$(printf 'a%.0s' {1..64})"
          cargo run --quiet --locked -p asr-contracts --bin asr-hf-job -- \
            plan \
            --built-image "ghcr.io/owner/package@sha256:$digest" \
            --candidate-id candidate-000124 \
            --suite smoke \
            --environment linux-cpu \
            --provider CPUExecutionProvider \
            --hf-bucket owner/project-bucket \
            --dataset-source bucket \
            --flavor cpu-performance \
            --run-id 9103 \
            --run-attempt 1 \
            --output-json /tmp/unavailable-plan.json >/dev/null

          mkdir -p /tmp/unavailable-bin
          cat > /tmp/unavailable-bin/hf <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "${1:-}" == jobs && "${2:-}" == hardware ]]; then
            printf 'FLAVOR CPU GPU\ncpu-basic 2 -\n'
            exit 0
          fi
          echo invoked > /tmp/unexpected-hf-run
          exit 99
          EOF
          chmod +x /tmp/unavailable-bin/hf
          rm -f /tmp/unexpected-hf-run
          if PATH="/tmp/unavailable-bin:$PATH" HF_TOKEN=fake \
            cargo run --quiet --locked -p asr-contracts --bin asr-hf-job -- \
              run --plan /tmp/unavailable-plan.json; then
            echo 'unavailable flavor unexpectedly executed' >&2
            exit 1
          fi
          test ! -e /tmp/unexpected-hf-run

      - name: Build canonical CUDA custom-dataset smoke plan
        shell: bash
        run: |
          set -euo pipefail
          digest="$(printf 'b%.0s' {1..64})"
          cargo run --quiet --locked -p asr-contracts --bin asr-hf-job -- \
            plan \
            --built-image "ghcr.io/owner/package@sha256:$(printf 'a%.0s' {1..64})" \
            --image-override "registry.example.com/model@sha256:$digest" \
            --candidate-id candidate-000999 \
            --suite smoke \
            --environment linux-cuda \
            --provider CUDAExecutionProvider \
            --hf-bucket owner/project-bucket \
            --dataset-source custom \
            --dataset-id japanese-asr/jsut \
            --flavor a10g-small \
            --run-id 9102 \
            --run-attempt 1 \
            --output-json /tmp/hf-job-cuda.json >/dev/null

          jq -e --arg digest "sha256:$digest" '
            .suite == "smoke" and
            .timeout == "30m" and
            .environment == "linux-cuda" and
            .provider == "CUDAExecutionProvider" and
            .image == ("registry.example.com/model@" + $digest) and
            .image_digest == $digest and
            .dataset_dir == "/data" and
            (.mounts | length) == 2 and
            .mounts[1].source == "hf://datasets/japanese-asr/jsut" and
            .mounts[1].target == "/data" and
            .mounts[1].mode == "ro"
          ' /tmp/hf-job-cuda.json >/dev/null

      - name: Reject non-smoke suites before any HF Jobs plan
        shell: bash
        run: |
          set -euo pipefail
          digest="$(printf 'c%.0s' {1..64})"
          for suite in probe parity; do
            if cargo run --quiet --locked -p asr-contracts --bin asr-hf-job -- \
              plan \
              --built-image "ghcr.io/owner/package@sha256:$digest" \
              --candidate-id candidate-000001 \
              --suite "$suite" \
              --environment linux-cpu \
              --provider CPUExecutionProvider \
              --hf-bucket owner/project-bucket \
              --dataset-source bucket \
              --flavor cpu-basic \
              --run-id 1 \
              --run-attempt 1 \
              --output-json "/tmp/non-smoke-$suite.json"; then
              echo "$suite unexpectedly accepted for HF Jobs" >&2
              exit 1
            fi
            test ! -e "/tmp/non-smoke-$suite.json"
          done

      - name: Reject mutable image and inconsistent routing before execution
        shell: bash
        run: |
          set -euo pipefail
          if cargo run --quiet --locked -p asr-contracts --bin asr-hf-job -- \
            plan \
            --built-image ghcr.io/owner/package:latest \
            --candidate-id candidate-000001 \
            --suite smoke \
            --environment linux-cpu \
            --provider CPUExecutionProvider \
            --hf-bucket owner/project-bucket \
            --dataset-source bucket \
            --flavor cpu-basic \
            --run-id 1 \
            --run-attempt 1 \
            --output-json /tmp/mutable.json; then
            echo 'mutable image unexpectedly accepted' >&2
            exit 1
          fi

          digest="$(printf 'c%.0s' {1..64})"
          if cargo run --quiet --locked -p asr-contracts --bin asr-hf-job -- \
            plan \
            --built-image "ghcr.io/owner/package@sha256:$digest" \
            --candidate-id candidate-000001 \
            --suite smoke \
            --environment linux-cuda \
            --provider CPUExecutionProvider \
            --hf-bucket owner/project-bucket \
            --dataset-source bucket \
            --flavor cpu-basic \
            --run-id 1 \
            --run-attempt 1 \
            --output-json /tmp/provider-mismatch.json; then
            echo 'provider mismatch unexpectedly accepted' >&2
            exit 1
          fi

      - name: Reject tampered persisted plan before subprocess
        shell: bash
        run: |
          set -euo pipefail
          jq '.hf_args += ["--tampered"]' /tmp/hf-job-plan.json > /tmp/tampered-argv.json
          if cargo run --quiet --locked -p asr-contracts --bin asr-hf-job -- \
            validate --plan /tmp/tampered-argv.json; then
            echo 'tampered argv unexpectedly accepted' >&2
            exit 1
          fi

          jq '.image_digest = "sha256:ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff"' \
            /tmp/hf-job-plan.json > /tmp/tampered-digest.json
          if cargo run --quiet --locked -p asr-contracts --bin asr-hf-job -- \
            validate --plan /tmp/tampered-digest.json; then
            echo 'tampered image digest unexpectedly accepted' >&2
            exit 1
          fi

          jq '.suite = "parity"' /tmp/hf-job-plan.json > /tmp/tampered-suite.json
          if cargo run --quiet --locked -p asr-contracts --bin asr-hf-job -- \
            validate --plan /tmp/tampered-suite.json; then
            echo 'tampered non-smoke suite unexpectedly accepted' >&2
            exit 1
          fi

          jq '.timeout = "2h"' /tmp/hf-job-plan.json > /tmp/tampered-timeout.json
          if cargo run --quiet --locked -p asr-contracts --bin asr-hf-job -- \
            validate --plan /tmp/tampered-timeout.json; then
            echo 'tampered timeout unexpectedly accepted' >&2
            exit 1
          fi

          mkdir -p /tmp/never-bin
          cat > /tmp/never-bin/hf <<'EOF'
          #!/usr/bin/env bash
          echo invoked > /tmp/unexpected-hf-invocation
          exit 99
          EOF
          chmod +x /tmp/never-bin/hf
          rm -f /tmp/unexpected-hf-invocation
          if PATH="/tmp/never-bin:$PATH" HF_TOKEN=fake \
            cargo run --quiet --locked -p asr-contracts --bin asr-hf-job -- \
              run --plan /tmp/tampered-argv.json; then
            echo 'tampered plan unexpectedly executed' >&2
            exit 1
          fi
          test ! -e /tmp/unexpected-hf-invocation
