name: Phase24 Model Cleanup

on:
  push:
    branches: [agent/review-minimal-json-bucket-phase24]
    paths:
      - ".github/workflows/phase24-model-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/review-minimal-json-bucket-phase24
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Remove duplicated model policy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          paths = [
              Path('config/models/parakeet-tdt_ctc-0.6b-ja.toml'),
              Path('config/models/kotoba-whisper-v1.0.toml'),
              Path('config/models/kotoba-whisper-v2.0.toml'),
          ]
          drop_sections = {
              'evaluation',
              'evaluation.metrics',
              'storage',
              'storage.hf_target',
              'storage.hf_bucket',
              'onnx.artifacts',
          }
          drop_keys = {
              ('reference', 'model_id'),
              ('execution', 'provider_configuration_root'),
              ('onnx.validation', 'tolerance_source'),
              ('rust', 'expected_components'),
          }

          for path in paths:
              lines = path.read_text().splitlines(keepends=True)
              out = []
              section = None
              i = 0
              while i < len(lines):
                  line = lines[i]
                  m = re.match(r'^\[([^]]+)\]\s*$', line.strip())
                  if m:
                      section = m.group(1)
                      if section in drop_sections:
                          i += 1
                          while i < len(lines) and not re.match(r'^\[[^]]+\]\s*$', lines[i].strip()):
                              i += 1
                          while out and out[-1].strip() == '':
                              out.pop()
                          out.append('\n')
                          continue
                      out.append(line)
                      i += 1
                      continue

                  key_match = re.match(r'^([A-Za-z0-9_.-]+)\s*=\s*', line)
                  if key_match and (section, key_match.group(1)) in drop_keys:
                      key = key_match.group(1)
                      # Remove scalar or multiline array assignment.
                      bracket_depth = line.count('[') - line.count(']')
                      i += 1
                      while bracket_depth > 0 and i < len(lines):
                          bracket_depth += lines[i].count('[') - lines[i].count(']')
                          i += 1
                      while out and out[-1].lstrip().startswith('#'):
                          # Only remove immediately adjacent explanatory comments for the removed field.
                          out.pop()
                      while out and out[-1].strip() == '':
                          out.pop()
                      out.append('\n')
                      continue

                  out.append(line)
                  i += 1

              text = ''.join(out)
              text = re.sub(r'\n{3,}', '\n\n', text)
              path.write_text(text)
          PY

          # The remaining execution tables are deliberate runtime compatibility policy.
          grep -q '^supported_providers = ' config/models/parakeet-tdt_ctc-0.6b-ja.toml
          grep -q '^\[execution.platforms\]$' config/models/parakeet-tdt_ctc-0.6b-ja.toml

          # Proven duplicate authorities must be gone from model configs.
          if git grep -nE 'provider_configuration_root|candidate_prefix|reference_prefix|run_prefix|benchmark_prefix|temporary_prefix|smoke_config|parity_config|full_config|storage\.hf_target|expected_components|tolerance_source' -- config/models; then
            echo 'duplicated model policy remains' >&2
            exit 1
          fi
          if git grep -nE '^model_id = ' -- config/models; then
            echo 'duplicated reference.model_id remains' >&2
            exit 1
          fi
      - name: Validate TOML syntax
        run: |
          python - <<'PY'
          import pathlib, tomllib
          for path in pathlib.Path('config/models').glob('*.toml'):
              tomllib.loads(path.read_text())
              print(path)
          PY
      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/models
          if git diff --cached --quiet; then
            echo 'nothing to commit'
          else
            git commit -m 'Remove duplicated model routing policy'
            git push origin HEAD:agent/review-minimal-json-bucket-phase24
          fi
