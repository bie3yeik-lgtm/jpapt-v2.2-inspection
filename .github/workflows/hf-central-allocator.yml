name: HF Central Sequence Allocator
run-name: HF allocate ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Globally unique request identifier supplied by the caller"
        required: true
        type: string
      hf_bucket:
        description: "Hugging Face Bucket in namespace/bucket format"
        required: true
        type: string
      collection:
        description: "Sequence collection"
        required: true
        type: choice
        options: [candidates, experiments, config]
      prefix_key:
        description: "Semantic allocation prefix key from config/hf-allocation-catalog.json"
        required: true
        type: string
      metadata_json:
        description: "Optional allocation provenance JSON"
        required: false
        default: "{}"
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: hf-central-sequence-${{ inputs.hf_bucket }}
  cancel-in-progress: false

jobs:
  allocate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_BUCKET: ${{ inputs.hf_bucket }}
      HF_ALLOCATOR_INTERNAL: "1"
      HF_ALLOCATION_METADATA_JSON: ${{ inputs.metadata_json }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Hugging Face CLI
        run: python -m pip install --upgrade huggingface_hub
      - name: Allocate sequence
        id: allocate
        shell: bash
        run: |
          set -euo pipefail
          ID="$(bash scripts/hf/hf-allocate-id.sh "${{ inputs.collection }}" "${{ inputs.prefix_key }}")"
          PREFIX="$(cargo run --quiet --locked -p asr-hf -- allocation-prefix "${{ inputs.prefix_key }}")"
          CATALOG_ID="$(cargo run --quiet --locked -p asr-hf -- allocation-fingerprint catalog_id)"
          CATALOG_SHA="$(cargo run --quiet --locked -p asr-hf -- allocation-fingerprint sha256)"
          echo "id=${ID}" >> "${GITHUB_OUTPUT}"
          echo "prefix=${PREFIX}" >> "${GITHUB_OUTPUT}"
          echo "allocation_catalog_id=${CATALOG_ID}" >> "${GITHUB_OUTPUT}"
          echo "allocation_catalog_sha256=${CATALOG_SHA}" >> "${GITHUB_OUTPUT}"
      - name: Update Bucket root allocator status
        shell: bash
        env:
          HF_ALLOCATED_ID: ${{ steps.allocate.outputs.id }}
          HF_ALLOCATED_COLLECTION: ${{ inputs.collection }}
        run: |
          set -euo pipefail
          bash scripts/hf/hf-update-root-readme.sh
      - name: Write allocation response
        shell: bash
        run: |
          set -euo pipefail
          cargo run --quiet --locked -p asr-hf -- write-allocation-response \
            --output allocation.json \
            --request-id "${{ inputs.request_id }}" \
            --allocation-id "${{ steps.allocate.outputs.id }}" \
            --bucket "${HF_BUCKET}" \
            --collection "${{ inputs.collection }}" \
            --catalog-id "${{ steps.allocate.outputs.allocation_catalog_id }}" \
            --catalog-sha256 "${{ steps.allocate.outputs.allocation_catalog_sha256 }}" \
            --prefix-key "${{ inputs.prefix_key }}" \
            --resolved-prefix "${{ steps.allocate.outputs.prefix }}"
      - name: Publish allocation response
        uses: actions/upload-artifact@v7
        with:
          name: hf-allocation-${{ inputs.request_id }}
          path: allocation.json
          retention-days: 1
          if-no-files-found: error
