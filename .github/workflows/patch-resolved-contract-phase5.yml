name: Patch Resolved Contract Phase5

on:
  push:
    branches: [agent/rust-revisions-operational-phase5]
    paths:
      - ".github/workflows/patch-resolved-contract-phase5.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/rust-revisions-operational-phase5
      - name: Align resolved.json validator with emitted contract
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("rust/crates/asr-contracts/src/revisions.rs")
          text = path.read_text()

          text, count = re.subn(
              r'(exact_fields\(\s*object,\s*"resolved\.json",\s*&\["schema_version", "config_version"\],\s*)&\[\](,\s*\)\?;)',
              r'\1&["current_version", "selection_source"]\2',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("resolved.json exact_fields block was not uniquely found")

          marker = '''    Ok(value.to_owned())
          }

          fn parse_reference'''
          insertion = '''    if let Some(current_version) = optional_string(object, "current_version", "resolved.json")?
              && !valid_config_version(current_version)
          {
              return Err(ContractError::validation(format!(
                  "resolved.json: current_version must match config-NNNNNN; got {current_version:?}"
              )));
          }
          if let Some(selection_source) = optional_string(object, "selection_source", "resolved.json")?
              && !matches!(selection_source, "current" | "override")
          {
              return Err(ContractError::validation(format!(
                  "resolved.json: selection_source must be current or override; got {selection_source:?}"
              )));
          }
          Ok(value.to_owned())
          }

          fn parse_reference'''
          if marker not in text:
              raise SystemExit("load_config_version return marker was not found")
          path.write_text(text.replace(marker, insertion, 1))
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/crates/asr-contracts/src/revisions.rs
          git commit -m "Accept normalized resolved config metadata"
          git push origin HEAD:agent/rust-revisions-operational-phase5
