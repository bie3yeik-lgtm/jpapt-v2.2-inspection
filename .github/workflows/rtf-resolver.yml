name: RTF Resolver

on:
  workflow_call:
    inputs:
      image:
        description: Immutable GHCR image reference supplied by GHCR Build and Publish
        required: false
        default: ""
        type: string
      dataset_revision:
        description: Common Voice dataset commit
        required: true
        type: string
      fixture_repo_id:
        description: Hugging Face Dataset repo to publish the fixed fixture
        required: true
        type: string
      inspection_profile:
        description: Fixture sizing profile
        required: true
        type: string
    secrets:
      HF_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      image:
        description: Optional immutable image override; blank resolves the newest GHCR package digest
        required: false
        default: ""
        type: string
      dataset_revision:
        description: Common Voice dataset commit
        required: true
        default: bf8819e8d9a5feb51b0c718686bd20ea67a3c729
        type: string
      fixture_repo_id:
        description: Hugging Face Dataset repo to publish the fixed fixture
        required: true
        default: gawohok7/rtf-benchmark-fixtures
        type: string
      inspection_profile:
        description: Fixture sizing profile
        required: true
        default: lough inspection
        type: choice
        options: [lough inspection, precise inspection]

permissions:
  contents: write
  packages: read
  pull-requests: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IMAGE_INPUT: ${{ inputs.image }}
      DATASET_REVISION: ${{ inputs.dataset_revision }}
      FIXTURE_REPO_ID: ${{ inputs.fixture_repo_id }}
      INSPECTION_PROFILE: ${{ inputs.inspection_profile }}
      RUN_ID: rtf-resolver-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7

      - name: Login to GHCR for package pull
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Resolve immutable RTF benchmark image digest
        id: image
        env:
          IMAGE_INPUT: ${{ inputs.image }}
          IMAGE_NAME: ghcr.io/bie3yeik-lgtm/parakeet-rtf-benchmark
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -n "$IMAGE_INPUT" ]]; then
            image="$IMAGE_INPUT"
          else
            image="$(bash scripts/ci/resolve-ghcr-package-digest.sh "$IMAGE_NAME")"
          fi
          [[ "$image" =~ ^ghcr\.io/[A-Za-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]] || {
            echo "image must be a digest-pinned GHCR reference: $image" >&2
            exit 2
          }
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          echo "Resolved benchmark image: $image"

      - name: Validate fixture repository input
        run: |
          set -euo pipefail
          [[ "$FIXTURE_REPO_ID" == gawohok7/rtf-benchmark-fixtures ]] || {
            echo 'fixture_repo_id must be gawohok7/rtf-benchmark-fixtures' >&2
            exit 2
          }

      - name: Resolve fixed Common Voice manifest in Docker
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$HF_TOKEN" ]] || { echo 'HF_TOKEN is required for dataset resolution'; exit 1; }
          case "$INSPECTION_PROFILE" in
            'lough inspection') count_min=20; count_max=50; target_total=5400; max_duration=600 ;;
            'precise inspection') count_min=50; count_max=150; target_total=27000; max_duration=1800 ;;
            *) echo 'unknown inspection profile' >&2; exit 2 ;;
          esac
          rm -rf .ci/rtf-resolver
          mkdir -p .ci/rtf-resolver/audio .ci/rtf-resolver/output
          docker pull "$IMAGE"
          resolver_uid="$(id -u)"
          resolver_gid="$(id -g)"
          docker run --rm \
            --entrypoint bash \
            -e HF_TOKEN \
            -e PYTHONPATH=/opt/rtf-benchmark/benchmark-runner \
            -v "$PWD/.ci/rtf-resolver:/resolver" \
            "$IMAGE" \
            -c "
              set +e
              python -m benchmark_runner.resolve_dataset \\
                --dataset-id japanese-asr/ja_asr.common_voice_8_0 \\
                --revision '$DATASET_REVISION' \\
                --configuration default --split test \\
                --count-min '$count_min' --count-max '$count_max' \\
                --target-total-sec '$target_total' --max-duration-sec '$max_duration' \\
                --seed rtf-benchmark-v1-common-voice-ja \\
                --output-dir /resolver/audio \\
                --manifest /resolver/output/benchmark-v1.jsonl
              resolver_status=\$?
              chown -R '$resolver_uid:$resolver_gid' /resolver
              exit \$resolver_status
            "

      - name: Write resolver receipt and repository manifest
        run: |
          set -euo pipefail
          mkdir -p rtf-scores/benchmark
          manifest=.ci/rtf-resolver/output/benchmark-v1.jsonl
          sha256sum "$manifest" > .ci/rtf-resolver/output/benchmark-v1.jsonl.sha256
          python - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path

          manifest = Path('.ci/rtf-resolver/output/benchmark-v1.jsonl')
          records = [json.loads(line) for line in manifest.read_text().splitlines() if line]
          total = sum(float(record['audio_duration_sec']) for record in records)
          profile = os.environ['INSPECTION_PROFILE']
          if profile == 'lough inspection':
              count_min, count_max, total_min, total_max, duration_max = 20, 50, 3600, 7200, 600
          elif profile == 'precise inspection':
              count_min, count_max, total_min, total_max, duration_max = 50, 150, 18000, 36000, 1800
          else:
              raise SystemExit(f'unknown profile: {profile}')
          if not count_min <= len(records) <= count_max:
              raise SystemExit(f'invalid sample count: {len(records)}')
          if total < total_min:
              raise SystemExit(f'invalid total duration: {total}')
          if total > total_max:
              raise SystemExit(f'invalid total duration: {total}')
          if any(not 30 <= float(record['audio_duration_sec']) <= duration_max for record in records):
              raise SystemExit(f'sample duration outside 30..{duration_max} seconds')
          receipt = {
              'schema_version': 1,
              'run_id': os.environ['RUN_ID'],
              'inspection_profile': profile,
              'image': os.environ['IMAGE'],
              'dataset_id': 'japanese-asr/ja_asr.common_voice_8_0',
              'dataset_revision': os.environ['DATASET_REVISION'],
              'manifest_sha256': hashlib.sha256(manifest.read_bytes()).hexdigest(),
              'sample_count': len(records),
              'total_audio_duration_sec': total,
              'audio_contract': 'float32-mono-16000hz-finite-c-contiguous-wav',
          }
          Path('.ci/rtf-resolver/output/receipt.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n'
          )
          Path('.ci/rtf-resolver/output/benchmark-v1.jsonl').replace(
              Path('rtf-scores/benchmark/benchmark-v1.jsonl')
          )
          Path('.ci/rtf-resolver/output/receipt.json').replace(
              Path('rtf-scores/benchmark/benchmark-v1.receipt.json')
          )
          Path('.ci/rtf-resolver/output/benchmark-v1.jsonl.sha256').replace(
              Path('rtf-scores/benchmark/benchmark-v1.jsonl.sha256')
          )
          PY

      - name: Publish fixture to Hugging Face Dataset
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$HF_TOKEN" ]] || { echo 'HF_TOKEN is required'; exit 1; }
          python -m pip install --disable-pip-version-check --upgrade huggingface_hub
          python - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path
          from huggingface_hub import HfApi

          source = Path('rtf-scores/benchmark/benchmark-v1.jsonl')
          fixture = Path('.ci/rtf-resolver/fixture')
          (fixture / 'audio').mkdir(parents=True, exist_ok=True)
          records = []
          for line in source.read_text().splitlines():
              record = json.loads(line)
              container_path = Path(record['audio_path'])
              try:
                  relative_path = container_path.relative_to('/resolver')
              except ValueError:
                  relative_path = container_path
              host_path = Path('.ci/rtf-resolver') / relative_path
              if not host_path.is_file():
                  raise SystemExit(f'fixture audio is not materialized on the host: {host_path}')
              name = container_path.name
              shutil.copy2(host_path, fixture / 'audio' / name)
              record['audio_path'] = f'audio/{name}'
              records.append(record)
          (fixture / 'benchmark-v1.jsonl').write_text(
              ''.join(json.dumps(record, sort_keys=True) + '\n' for record in records)
          )
          api = HfApi(token=os.environ['HF_TOKEN'])
          api.create_repo(os.environ['FIXTURE_REPO_ID'], repo_type='dataset', private=True, exist_ok=True)
          commit = api.upload_folder(
              repo_id=os.environ['FIXTURE_REPO_ID'],
              repo_type='dataset',
              folder_path=str(fixture),
              commit_message=f"Publish RTF fixture {os.environ['RUN_ID']}",
          )
          Path('.ci/rtf-resolver/output/fixture-revision').write_text(commit.oid)
          source.unlink()
          shutil.copy2(fixture / 'benchmark-v1.jsonl', source)
          canonical_sha = hashlib.sha256(source.read_bytes()).hexdigest()
          Path('rtf-scores/benchmark/benchmark-v1.jsonl.sha256').write_text(canonical_sha + '  benchmark-v1.jsonl\n')
          receipt_path = Path('rtf-scores/benchmark/benchmark-v1.receipt.json')
          receipt = json.loads(receipt_path.read_text())
          receipt['manifest_sha256'] = canonical_sha
          receipt_path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          PY

          fixture_revision="$(cat .ci/rtf-resolver/output/fixture-revision)"
          jq --arg repo "$FIXTURE_REPO_ID" --arg revision "$fixture_revision" \
            '. + {fixture_repo_id:$repo,fixture_revision:$revision}' \
            rtf-scores/benchmark/benchmark-v1.receipt.json > /tmp/receipt.json
          mv /tmp/receipt.json rtf-scores/benchmark/benchmark-v1.receipt.json
          jq -n --arg repo "$FIXTURE_REPO_ID" --arg revision "$fixture_revision" \
            --arg profile "$INSPECTION_PROFILE" \
            '{schema_version:1,fixture_repo_id:$repo,fixture_revision:$revision,inspection_profile:$profile}' \
            > rtf-scores/benchmark/benchmark-v1.fixture.json

      - name: Upload resolved audio and outputs
        uses: actions/upload-artifact@v7
        with:
          name: rtf-resolver-${{ github.run_id }}
          path: |
            rtf-scores/benchmark/benchmark-v1.jsonl
            rtf-scores/benchmark/benchmark-v1.receipt.json
            rtf-scores/benchmark/benchmark-v1.jsonl.sha256
            rtf-scores/benchmark/benchmark-v1.fixture.json
          if-no-files-found: error
          retention-days: 30

      - name: Commit manifest and open PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="inspection/rtf-resolver-${RUN_ID}"
          git fetch --no-tags origin main
          git checkout --no-track -b "$branch" origin/main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- rtf-scores/benchmark
          git commit -m "Add resolved RTF benchmark manifest ${RUN_ID}"
          git push --set-upstream origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --draft \
            --title "Add resolved RTF benchmark manifest ${RUN_ID}" \
            --body "Resolver output for ${IMAGE}. The fixed audio fixture is stored in the revision-pinned Hugging Face Dataset; Git contains only the lightweight manifest, fixture pointer, receipt, and SHA-256."
