name: CPU Full Evaluation

on:
  workflow_dispatch:
    inputs:
      target:
        description: "HF target id"
        required: true
        default: parakeet-tdt_ctc-0.6b-ja
        type: string
      candidate_id:
        description: "HF Bucket candidates/<candidate_id>"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cpu-full-${{ inputs.target }}-${{ inputs.candidate_id }}
  cancel-in-progress: false

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF_TARGETS_JSON: ${{ vars.HF_TARGETS_JSON }}
  HF_BUCKET: ""
  HF_MODEL_REPO: ""

jobs:
  evaluate:
    name: Linux CPU Full Evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python project
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[datasets,onnx,dev]"
          python -m pip install --upgrade huggingface_hub
          python -c "import parakeet_onnx"
          hf --version

      - name: Resolve HF target
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/resolve-hf-target.py \
            --target "${{ inputs.target }}" \
            --targets-json "${HF_TARGETS_JSON:-}" \
            --github-env "${GITHUB_ENV}"

      - name: Validate GitHub configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${HF_TOKEN:-}" ]] || { echo "::error::HF_TOKEN secret is not configured."; exit 1; }
          [[ -n "${HF_BUCKET:-}" ]] || { echo "::error::HF_BUCKET could not be resolved for ${{ inputs.target }}."; exit 1; }
          [[ -n "${HF_MODEL_REPO:-}" ]] || { echo "::error::HF_MODEL_REPO could not be resolved for ${{ inputs.target }}."; exit 1; }
          echo "HF target: ${HF_TARGET_ID}"
          echo "HF Bucket: ${HF_BUCKET}"
          echo "HF Model Repo: ${HF_MODEL_REPO}"

      - name: Prepare directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p \
            .cache/huggingface \
            .cache/models \
            .cache/evaluation/audio \
            .ci/hf/config/revisions \
            .ci/candidate \
            .ci/reference \
            results/linux-cpu-full
          echo "HF_HOME=$(pwd)/.cache/huggingface" >> "${GITHUB_ENV}"

      - name: Fetch revision locks
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/hf/hf-fetch-revisions.sh
          python scripts/ci/validate-revisions.py --root .ci/hf/config/revisions

      - name: Cache model and evaluation assets
        uses: actions/cache@v4
        with:
          path: |
            .cache/huggingface
            .cache/models
            .cache/evaluation
            .ci/candidate
            .ci/reference
          key: >-
            py-full-${{ inputs.target }}-ubuntu-${{ runner.arch }}-${{
              inputs.candidate_id
            }}-${{
              hashFiles(
                '.ci/hf/config/revisions/reference.json',
                '.ci/hf/config/revisions/evaluation-schema.json',
                '.ci/hf/config/revisions/datasets-lock.json',
                'pyproject.toml'
              )
            }}
          restore-keys: |
            py-full-${{ inputs.target }}-ubuntu-${{ runner.arch }}-${{ inputs.candidate_id }}-

      - name: Fetch candidate
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/hf/hf-fetch-candidate.sh "${{ inputs.candidate_id }}"

      - name: Fetch reference assets
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/hf/hf-fetch-reference.sh || true

      - name: Locate ONNX model
        id: model
        shell: bash
        run: |
          set -euo pipefail
          MODEL="$(find .ci/candidate -type f -name '*.onnx' -print -quit)"
          if [[ -z "${MODEL}" ]]; then
            echo "::error::No ONNX model was found under .ci/candidate."
            exit 1
          fi
          echo "path=${MODEL}" >> "${GITHUB_OUTPUT}"
          echo "ONNX model: ${MODEL}"

      - name: Verify Python-first package
        shell: bash
        run: |
          set -euo pipefail
          python scripts/dev/verify-python-first.py

      - name: Evaluate full suite with Python
        shell: bash
        run: |
          set -euo pipefail
          python -m parakeet_onnx.cli.evaluate \
            --provider cpu \
            --environment linux \
            --evaluation full \
            --model "${{ steps.model.outputs.path }}" \
            --candidate-dir ".ci/candidate" \
            --candidate-id "${{ inputs.candidate_id }}" \
            --revisions ".ci/hf/config/revisions" \
            --output "results/linux-cpu-full"

      - name: Validate result contract
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f results/linux-cpu-full/run-context.json ]]; then
            python scripts/ci/validate-result.py results/linux-cpu-full
          fi

      - name: Upload run to HF Bucket
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f results/linux-cpu-full/run-context.json ]]; then
            bash scripts/hf/hf-push-run.sh results/linux-cpu-full
          fi

      - name: Publish full benchmark
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/hf/hf-push-benchmark.sh \
            results/linux-cpu-full/metrics.json \
            linux-cpu-full

      - name: Upload lightweight GitHub artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-full-${{ inputs.target }}-${{ inputs.candidate_id }}
          path: |
            results/linux-cpu-full/run-context.json
            results/linux-cpu-full/metrics.json
            results/linux-cpu-full/samples.jsonl
          retention-days: 7
          if-no-files-found: warn
