name: CPU Full Evaluation

on:
  workflow_dispatch:
    inputs:
      hf_bucket:
        description: "HF_BUCKET value from vars.HF_TARGETS_JSON"
        required: true
        default: gawohok7/jpapt-v2.2-dev-bucket
        type: string
      candidate_id:
        description: "Existing HF Bucket candidates/<candidate_id> to evaluate"
        required: true
        type: string
      runtime_variant:
        description: "Runtime variant from the target profile set (blank = catalog default)"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: cpu-full-${{ inputs.hf_bucket }}-${{ inputs.candidate_id }}-${{ inputs.runtime_variant || 'default' }}
  cancel-in-progress: false

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF_TARGETS_JSON: ${{ vars.HF_TARGETS_JSON }}
  GH_TOKEN: ${{ secrets.HF_ALLOCATOR_GITHUB_TOKEN || github.token }}
  HF_ALLOCATOR_REPOSITORY: bie3yeik-lgtm/jpapt-v2.2-inspection

jobs:
  allocate-experiment:
    name: Allocate experiment ID
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      experiment_id: ${{ steps.allocate.outputs.experiment_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install project for catalog resolution
        run: python -m pip install -e ".[dev]"
      - name: Allocate ID through central allocator
        id: allocate
        shell: bash
        env:
          HF_BUCKET: ${{ inputs.hf_bucket }}
          CANDIDATE_ID: ${{ inputs.candidate_id }}
          EVALUATION_ID: full
          PROVIDER_ID: cpu
          ASR_RUNTIME_VARIANT: ${{ inputs.runtime_variant }}
        run: |
          set -euo pipefail
          ID="$(bash scripts/hf/hf-allocate-id.sh experiments experiment.cpu_full)"
          echo "experiment_id=${ID}" >> "${GITHUB_OUTPUT}"
          echo "Experiment: ${ID}"

  evaluate:
    name: Linux CPU Full Evaluation
    needs: allocate-experiment
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      HF_BUCKET: ""
      HF_MODEL_REPO: ""
      EXPECTED_DEVELOPMENT_REPO_ID: ""
      EXPECTED_UPSTREAM_REPO_ID: ""
      EXPECTED_TOKENIZER_REPO_ID: ""
      EXPECTED_FRAMEWORK: ""
      HF_PROFILE_SET: ""
      ASR_RUNTIME_VARIANT: ""
      EXPECTED_RUNTIME_PROFILE: ""
      EXPECTED_DECODER: ""
      HF_TARGET_ID: ""
      EXPERIMENT_ID: ${{ needs.allocate-experiment.outputs.experiment_id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python project
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[datasets,onnx,transformers-runtime,dev]"
          python -m pip install --upgrade huggingface_hub
          python -c "import parakeet_onnx"
          hf --version

      - name: Resolve HF Bucket and runtime variant
        id: hf
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${HF_TARGETS_JSON:-}" ]] || {
            echo "::error::HF_TARGETS_JSON repository variable is required for Bucket selection."
            exit 1
          }
          ARGS=(
            --bucket "${{ inputs.hf_bucket }}"
            --targets-json "${HF_TARGETS_JSON}"
            --github-env "${GITHUB_ENV}"
            --github-output "${GITHUB_OUTPUT}"
          )
          if [[ -n "${{ inputs.runtime_variant }}" ]]; then
            ARGS+=(--runtime-variant "${{ inputs.runtime_variant }}")
          fi
          cargo run --quiet --locked -p asr-hf -- resolve-target "${ARGS[@]}"

      - name: Validate GitHub configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${HF_TOKEN:-}" ]] || { echo "::error::HF_TOKEN secret is not configured."; exit 1; }
          [[ -n "${HF_BUCKET:-}" ]] || { echo "::error::HF_BUCKET could not be resolved."; exit 1; }
          [[ -n "${HF_MODEL_REPO:-}" ]] || { echo "::error::HF_MODEL_REPO could not be resolved."; exit 1; }
          echo "HF target: ${HF_TARGET_ID}"
          echo "HF Bucket: ${HF_BUCKET}"
          echo "HF Model Repo: ${HF_MODEL_REPO}"
          echo "Profile set: ${HF_PROFILE_SET}"
          echo "Runtime variant: ${ASR_RUNTIME_VARIANT}"
          echo "Runtime profile: ${EXPECTED_RUNTIME_PROFILE}"
          echo "Decoder: ${EXPECTED_DECODER}"
          echo "Experiment: ${EXPERIMENT_ID}"

      - name: Prepare directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p \
            .cache/huggingface \
            .cache/models \
            .cache/evaluation/audio \
            .ci/hf/config/revisions \
            .ci/candidate \
            .ci/reference \
            results/linux-cpu-full
          echo "HF_HOME=$(pwd)/.cache/huggingface" >> "${GITHUB_ENV}"

      - name: Fetch and validate revision locks
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/hf/hf-fetch-revisions.sh
          bash scripts/ci/validate-revisions.sh \
            --root .ci/hf/config/revisions \
            --expected-development-repo-id "${EXPECTED_DEVELOPMENT_REPO_ID}" \
            --expected-upstream-repo-id "${EXPECTED_UPSTREAM_REPO_ID}" \
            --expected-tokenizer-repo-id "${EXPECTED_TOKENIZER_REPO_ID}" \
            --expected-framework "${EXPECTED_FRAMEWORK}" \
            --expected-profile-set "${HF_PROFILE_SET}" \
            --runtime-variant "${ASR_RUNTIME_VARIANT}" \
            --expected-runtime-profile "${EXPECTED_RUNTIME_PROFILE}" \
            --expected-decoder "${EXPECTED_DECODER}"

      - name: Cache model and evaluation assets
        uses: actions/cache@v6
        with:
          path: |
            .cache/huggingface
            .cache/models
            .cache/evaluation
            .ci/candidate
            .ci/reference
          key: >-
            py-full-${{ steps.hf.outputs.target_id }}-${{ steps.hf.outputs.runtime_variant }}-ubuntu-${{ runner.arch }}-${{
              inputs.candidate_id
            }}-${{
              hashFiles(
                '.ci/hf/config/revisions/reference.json',
                '.ci/hf/config/revisions/evaluation-schema.json',
                '.ci/hf/config/revisions/datasets-lock.json',
                '.ci/hf/config/revisions/runtime.json',
                'config/asr-catalog.json',
                'pyproject.toml'
              )
            }}
          restore-keys: |
            py-full-${{ steps.hf.outputs.target_id }}-${{ steps.hf.outputs.runtime_variant }}-ubuntu-${{ runner.arch }}-${{ inputs.candidate_id }}-

      - name: Fetch candidate
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/hf/hf-fetch-candidate.sh "${{ inputs.candidate_id }}"

      - name: Resolve candidate execution contract
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/resolve-candidate-artifacts.py \
            --candidate-dir .ci/candidate \
            --runtime-variant "${ASR_RUNTIME_VARIANT}" \
            --contract-out .ci/candidate-contract.json

      - name: Validate evaluator and candidate capability
        shell: bash
        run: |
          set -euo pipefail
          cargo run --quiet --locked -p asr-contracts --bin asr-evaluator-policy -- \
            --evaluator python-onnx \
            --decoder "${EXPECTED_DECODER}" \
            --runtime-variant "${ASR_RUNTIME_VARIANT}" \
            --provider cpu \
            --candidate-contract .ci/candidate-contract.json

      - name: Fetch reference assets
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/hf/hf-fetch-reference.sh || true

      - name: Verify Python-first package
        shell: bash
        run: python scripts/dev/verify-python-first.py

      - name: Evaluate full suite with Python
        shell: bash
        run: |
          set -euo pipefail
          python -m parakeet_onnx.cli.evaluate \
            --provider cpu \
            --environment linux \
            --evaluation full \
            --model-config "${HF_TARGET_ID}" \
            --runtime-variant "${ASR_RUNTIME_VARIANT}" \
            --candidate-dir ".ci/candidate" \
            --candidate-id "${{ inputs.candidate_id }}" \
            --experiment-id "${EXPERIMENT_ID}" \
            --revisions ".ci/hf/config/revisions" \
            --output "results/linux-cpu-full"

      - name: Validate result contract with Rust
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f results/linux-cpu-full/run-context.json ]]; then
            cargo run --quiet --locked -p asr-contracts --bin asr-contracts -- \
              validate-run results/linux-cpu-full
          fi

      - name: Upload run to HF Bucket
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f results/linux-cpu-full/run-context.json ]]; then
            bash scripts/hf/hf-push-run.sh results/linux-cpu-full
          fi

      - name: Publish full benchmark
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/hf/hf-push-benchmark.sh \
            results/linux-cpu-full/metrics.json \
            linux-cpu-full

      - name: Upload lightweight GitHub artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cpu-full-${{ steps.hf.outputs.target_id }}-${{ steps.hf.outputs.runtime_variant }}-${{ inputs.candidate_id }}
          path: |
            results/linux-cpu-full/run-context.json
            results/linux-cpu-full/metrics.json
            results/linux-cpu-full/samples.jsonl
          retention-days: 7
          if-no-files-found: warn
