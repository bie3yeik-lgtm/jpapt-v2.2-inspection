name: Phase9 Audit

on:
  push:
    branches: [agent/rust-hf-allocation-phase9]
    paths:
      - ".github/workflows/phase9-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Find remaining allocation Python callers
        shell: bash
        run: |
          set -euo pipefail
          echo '--- resolve-allocation-catalog.py ---'
          git grep -n 'resolve-allocation-catalog.py' || true
          echo '--- next-hf-sequence-id.py ---'
          git grep -n 'next-hf-sequence-id.py' || true
          echo '--- allocation_catalog ---'
          git grep -n 'allocation_catalog' || true
          echo '--- hf-allocate-id.sh ---'
          git grep -n 'hf-allocate-id.sh' || true
