name: Phase15 Validate

on:
  push:
    branches: [agent/rust-candidate-plan-phase15]
    paths:
      - .github/workflows/phase15-validate.yml
      - rust/crates/asr-hf/**
      - scripts/hf/hf-push-candidate.sh

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/rust-candidate-plan-phase15
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Validate Phase 15
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo clippy --locked -p asr-hf --all-targets -- -D warnings
          cargo test --locked -p asr-hf
          bash -n scripts/hf/hf-push-candidate.sh
          count="$(grep -c "<<'PY'" scripts/hf/hf-push-candidate.sh || true)"
          test "$count" -eq 1
          grep -q 'CandidateArtifacts' scripts/hf/hf-push-candidate.sh
          grep -q 'validate_candidate_runtime_contract' scripts/hf/hf-push-candidate.sh
          tmp="$(mktemp)"
          printf '{"action":"upload"}\n{"action":"UPLOAD"}\n' > "$tmp"
          output="$(cargo run --quiet --locked -p asr-hf --bin asr-candidate-plan -- "$tmp")"
          test "$output" = 'upload_count=2'
          printf '{"action":"upload"}\n{"action":"delete"}\n' > "$tmp"
          if cargo run --quiet --locked -p asr-hf --bin asr-candidate-plan -- "$tmp"; then
            echo 'unsafe sync plan was accepted' >&2
            exit 1
          fi
      - name: Commit normalized production files and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/phase15-validate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/crates/asr-hf scripts/hf/hf-push-candidate.sh .github/workflows/phase15-validate.yml
          git commit -m "Normalize Rust candidate plan validator"
          git push origin HEAD:agent/rust-candidate-plan-phase15
