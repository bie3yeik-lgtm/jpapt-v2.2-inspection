name: GHCR Contract Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "docker/**"
      - "config/hf-targets/**"
      - "config/models/**"
      - "config/asr-catalog.json"
      - "rust/crates/asr-hf/**"
      - "rust/crates/asr-contracts/**"
      - "scripts/ci/resolve-ghcr-matrix.sh"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "docker/**"
      - "config/hf-targets/**"
      - "config/models/**"
      - "config/asr-catalog.json"
      - "rust/crates/asr-hf/**"
      - "rust/crates/asr-contracts/**"
      - "scripts/ci/resolve-ghcr-matrix.sh"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: ghcr-contracts-${{ github.ref }}
  cancel-in-progress: true

env:
  HF_TARGETS_JSON: ${{ vars.HF_TARGETS_JSON }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Validate resolver and static Docker target contracts
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/ci/resolve-ghcr-matrix.sh
          mkdir -p .ci/ghcr-contracts
          bash scripts/ci/resolve-ghcr-matrix.sh | tee .ci/ghcr-contracts/matrix.json
          jq -e '.include | length > 0' .ci/ghcr-contracts/matrix.json >/dev/null

          # A static GHCR target is identified by config.json. Generic Docker
          # contexts are validated separately and are intentionally excluded.
          while IFS= read -r config; do
            context="$(dirname "$config")"
            dockerfile="$context/Dockerfile"
            [[ -f "$dockerfile" ]] || { echo "::error::$context/config.json requires Dockerfile"; exit 1; }
            source_repo="$(sed -n 's/^LABEL io\.jpapt\.source\.repo_id="\([^"]*\)"[[:space:]]*$/\1/p' "$dockerfile" | tail -n1)"
            framework="$(sed -n 's/^LABEL io\.jpapt\.source\.framework="\([^"]*\)"[[:space:]]*$/\1/p' "$dockerfile" | tail -n1)"
            package="$(sed -n 's/^LABEL io\.jpapt\.ghcr\.package="\([^"]*\)"[[:space:]]*$/\1/p' "$dockerfile" | tail -n1)"
            role="$(sed -n 's/^LABEL io\.jpapt\.role="\([^"]*\)"[[:space:]]*$/\1/p' "$dockerfile" | tail -n1)"
            [[ -n "$source_repo" && -n "$framework" && -n "$package" && -n "$role" ]]
            test "$(jq -er '.source.repo_id' "$config")" = "$source_repo"
            test "$(jq -er '.source.framework' "$config")" = "$framework"
          done < <(find docker -mindepth 2 -maxdepth 2 -type f -name config.json -print | sort)

      - name: Validate generic candidate package contract
        shell: bash
        run: |
          set -euo pipefail
          dockerfile=docker/candidate-package/Dockerfile
          [[ -f "$dockerfile" ]] || { echo "::error::$dockerfile is required"; exit 1; }
          grep -F 'ARG SOURCE_REPOSITORY=unknown/unknown' "$dockerfile"
          grep -F 'ARG SOURCE_BUCKET=unknown/unknown' "$dockerfile"
          grep -F 'ARG CANDIDATE_ID=latest' "$dockerfile"
          grep -F 'ARG PACKAGE_NAME=jpapt-candidate' "$dockerfile"
          grep -F 'ARG RUNTIME_ENVIRONMENT=linux-cpu' "$dockerfile"
          grep -F 'io.jpapt.source.repository="${SOURCE_REPOSITORY}"' "$dockerfile"
          grep -F 'io.jpapt.candidate.id="${CANDIDATE_ID}"' "$dockerfile"
          grep -F 'io.jpapt.runtime.target_environment="${RUNTIME_ENVIRONMENT}"' "$dockerfile"
          docker buildx build --check -f "$dockerfile" .

      - name: Validate repository target and Actions policy
        shell: bash
        run: |
          set -euo pipefail
          cargo run --quiet --locked -p asr-hf -- validate-targets
          cargo run --quiet --locked -p asr-contracts --bin asr-action-policy

      - name: Validate GHCR Buildx cache contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/ghcr-build-publish.yml').read_text()
          required = [
              # GitHub evaluates expression placeholders before this Python
              # snippet runs, so assert stable syntax rather than an empty value.
              'type=gha,scope=',
              'type=registry,ref=',
              ':buildcache',
              'mode=max,scope=',
              'version=2,ignore-error=true',
              "github.event_name != 'pull_request'",
              'image-manifest=true',
              'oci-mediatypes=true',
              'compression=zstd',
          ]
          missing = [item for item in required if item not in workflow]
          if missing:
              raise SystemExit(f'GHCR cache contract is incomplete: {missing}')
          if 'cache-to: type=registry' in workflow:
              raise SystemExit('registry cache export must remain event-gated')
          print('GHCR Buildx cache contract: valid')
          PY

      - name: Validate repository-dispatch contracts with Rust
        shell: bash
        run: |
          set -euo pipefail
          cargo run --quiet --locked -p asr-contracts --bin asr-workflow-dispatch -- validate
          cargo run --quiet --locked -p asr-contracts --bin asr-workflow-dispatch -- list \
            | tee .ci/ghcr-contracts/workflows.tsv
          cargo run --quiet --locked -p asr-contracts --bin asr-workflow-dispatch -- \
            resolve --workflow ghcr-evaluate --ref main --inputs-json '{}' \
            > .ci/ghcr-contracts/dispatch-smoke.json
          digest="$(printf 'e%.0s' {1..64})"
          cargo run --quiet --locked -p asr-contracts --bin asr-workflow-dispatch -- \
            resolve --workflow ghcr-public-verify --ref main \
            --inputs-json "{\"image\":\"ghcr.io/owner/package@sha256:${digest}\",\"require_public\":true}" \
            > .ci/ghcr-contracts/dispatch-smoke-ghcr-public-verify.json

      - uses: actions/upload-artifact@v7
        with:
          name: ghcr-contract-matrix
          path: .ci/ghcr-contracts
          retention-days: 7
          if-no-files-found: error
