name: Phase12 Clean Doc

on:
  push:
    branches: [agent/rust-hf-config-publish-phase12-clean]
    paths:
      - .github/workflows/phase12-clean-doc.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/rust-hf-config-publish-phase12-clean
          fetch-depth: 0
      - name: Normalize documentation from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:docs/json-reference.md > docs/json-reference.md
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/json-reference.md')
          text = path.read_text(encoding='utf-8')
          old = '**生成:** `scripts/ci/write-runtime-lock.py` / `hf-push-config-version.sh`'
          new = '**生成:** Rust `asr-config-publish prepare`（`hf-push-config-version.sh` から呼び出し）'
          if text.count(old) != 1:
              raise SystemExit(f'expected one marker, got {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm .github/workflows/phase12-clean-doc.yml
      - name: Commit normalized documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/json-reference.md .github/workflows/phase12-clean-doc.yml
          git commit -m "Normalize Phase 12 documentation"
          git push origin HEAD:agent/rust-hf-config-publish-phase12-clean
