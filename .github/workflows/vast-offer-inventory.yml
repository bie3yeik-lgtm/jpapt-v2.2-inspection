name: Vast Offer Inventory

on:
  workflow_dispatch:
    inputs:
      pricing_type:
        description: Vast pricing mode; bid is interruptible
        required: true
        default: bid
        type: choice
        options: [bid, on-demand]
      limit:
        description: Maximum offers to return
        required: true
        default: "25"
        type: string
      storage_gb:
        description: Allocated storage passed to Vast CLI --storage
        required: true
        default: "100"
        type: string
      gpu_name:
        description: Optional GPU model filter (RTX_4090 or RTX_4090,RTX_3090)
        required: false
        default: ""
        type: string
      num_gpus:
        description: Optional GPU count filter (1, >=2, or in [1,2,4])
        required: false
        default: ""
        type: string
      gpu_ram:
        description: Optional GPU RAM filter (48, >=48, <=96000)
        required: false
        default: ""
        type: string
      duration:
        description: Optional minimum rental duration filter in seconds (>=3600)
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  search:
    name: Search Vast rentable offers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
      PRICING_TYPE: ${{ inputs.pricing_type }}
      LIMIT: ${{ inputs.limit }}
      STORAGE_GB: ${{ inputs.storage_gb }}
      GPU_NAME: ${{ inputs.gpu_name }}
      NUM_GPUS: ${{ inputs.num_gpus }}
      GPU_RAM: ${{ inputs.gpu_ram }}
      DURATION: ${{ inputs.duration }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate inputs and Vast credential
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$VAST_API_KEY" ]] || { echo 'VAST_API_KEY repository secret is required'; exit 1; }
          [[ "$LIMIT" =~ ^[1-9][0-9]{0,2}$ ]] || { echo 'limit must be an integer from 1 to 999'; exit 2; }
          [[ "$STORAGE_GB" =~ ^[1-9][0-9]{0,3}$ ]] || { echo 'storage_gb must be an integer from 1 to 9999'; exit 2; }

      - name: Install Vast CLI
        shell: bash
        run: python -m pip install --disable-pip-version-check vastai

      - name: Record Vast CLI version
        shell: bash
        run: vastai --version | tee vast-cli-version.txt

      - name: Build Vast search query
        id: query
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vast-offers
          python scripts/vast/build-search-query.py \
            --gpu-name "$GPU_NAME" \
            --num-gpus "$NUM_GPUS" \
            --gpu-ram "$GPU_RAM" \
            --duration "$DURATION" \
            --output-json vast-offers/search-query.json \
            | tee vast-offers/search-query.txt
          query="$(tr -d '\n' < vast-offers/search-query.txt)"
          echo "query=$query" >> "$GITHUB_OUTPUT"
          echo "Built Vast search query: $query"

      - name: Search Vast offers
        shell: bash
        run: |
          set -euo pipefail
          query="$(< vast-offers/search-query.txt)"
          output="vast-offers/search-${PRICING_TYPE}.json"
          echo "Searching pricing=${PRICING_TYPE} storage_gb=${STORAGE_GB}"
          vastai search offers \
            --api-key "$VAST_API_KEY" \
            --raw \
            --no-default \
            --type "$PRICING_TYPE" \
            --order dph_total \
            --storage "$STORAGE_GB" \
            --limit "$LIMIT" \
            "$query" > "$output"

      - name: Normalize offer inventory
        shell: bash
        run: |
          set -euo pipefail
          python scripts/vast/format-offers.py \
            --input-dir vast-offers \
            --output-json vast-offers/inventory.json \
            --output-csv vast-offers/inventory.csv \
            --output-markdown vast-offers/inventory.md \
            --search-query "${{ steps.query.outputs.query }}" \
            --pricing-type "$PRICING_TYPE" \
            --limit "$LIMIT"
          cat vast-offers/inventory.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Vast offer inventory
        uses: actions/upload-artifact@v7
        with:
          name: vast-offers-${{ github.run_id }}
          path: |
            vast-cli-version.txt
            vast-offers/
          if-no-files-found: error
