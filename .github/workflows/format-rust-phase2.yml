name: Format Rust Phase2

on:
  push:
    branches: [agent/rust-contracts-phase2]
    paths:
      - "rust/crates/asr-contracts/**"
      - ".github/workflows/format-rust-phase2.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/rust-contracts-phase2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/crates/asr-contracts
          git commit -m "Format asr-contracts"
          git push origin HEAD:agent/rust-contracts-phase2
