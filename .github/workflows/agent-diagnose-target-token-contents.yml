name: Agent Diagnose TARGET Token Contents

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'docs/current-premiere-integration-spec-20260819' }}
    environment: Private-Secrets
    runs-on: ubuntu-latest
    env:
      TARGET_REPOSITORY: bie3yeik-lgtm/jpapt-protocol-e2e-source
      TARGET_PATH: .jpapt/candidate-receiver.json
    steps:
      - name: Probe TARGET_REPO_TOKEN API scopes without content disclosure
        id: probe
        env:
          GH_TOKEN: ${{ secrets.TARGET_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo '::error::TARGET_REPO_TOKEN missing'; exit 1; }
          probe() {
            local label="$1"
            local accept="$2"
            local endpoint="$3"
            local headers body status
            headers="$(mktemp)"
            body="$(mktemp)"
            if [[ -n "$accept" ]]; then
              if gh api -i -H "Accept: $accept" "$endpoint" >"$body" 2>"$headers"; then
                rc=0
              else
                rc=$?
              fi
            else
              if gh api -i "$endpoint" >"$body" 2>"$headers"; then
                rc=0
              else
                rc=$?
              fi
            fi
            status="$(grep -Eo 'HTTP/[0-9.]+ [0-9]{3}' "$body" "$headers" 2>/dev/null | tail -1 | awk '{print $2}' || true)"
            if [[ -z "$status" ]]; then
              status="$(grep -Eo 'HTTP [0-9]{3}' "$body" "$headers" 2>/dev/null | tail -1 | awk '{print $2}' || true)"
            fi
            printf '%s_status=%s\n' "$label" "${status:-unknown}" >> "$GITHUB_OUTPUT"
            printf '%s_rc=%s\n' "$label" "$rc" >> "$GITHUB_OUTPUT"
            rm -f "$headers" "$body"
          }
          probe repo '' "/repos/$TARGET_REPOSITORY"
          probe contents 'application/vnd.github+json' "/repos/$TARGET_REPOSITORY/contents/$TARGET_PATH?ref=main"
          probe raw 'application/vnd.github.raw+json' "/repos/$TARGET_REPOSITORY/contents/$TARGET_PATH?ref=main"

      - name: Record sanitized diagnostic on issue 70
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_STATUS: ${{ steps.probe.outputs.repo_status }}
          REPO_RC: ${{ steps.probe.outputs.repo_rc }}
          CONTENTS_STATUS: ${{ steps.probe.outputs.contents_status }}
          CONTENTS_RC: ${{ steps.probe.outputs.contents_rc }}
          RAW_STATUS: ${{ steps.probe.outputs.raw_status }}
          RAW_RC: ${{ steps.probe.outputs.raw_rc }}
        run: |
          gh issue comment 70 --repo "$GITHUB_REPOSITORY" --body "TARGET_REPO_TOKEN sanitized Contents diagnostic:\n\n- fixture: \`$TARGET_REPOSITORY\`\n- repo metadata: HTTP \`${REPO_STATUS:-unknown}\`, rc \`${REPO_RC:-unknown}\`\n- normal Contents API: HTTP \`${CONTENTS_STATUS:-unknown}\`, rc \`${CONTENTS_RC:-unknown}\`\n- raw Contents API: HTTP \`${RAW_STATUS:-unknown}\`, rc \`${RAW_RC:-unknown}\`\n\nNo token value or receiver content was logged by this diagnostic."
