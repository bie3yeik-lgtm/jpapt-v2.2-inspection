name: RTF Benchmark Contracts

on:
  pull_request:
    paths:
      - "evaluation/manifests/rtf-phase1.jsonl"
      - "evaluation/schemas/benchmark.schema.json"
      - "rust/crates/asr-eval/**"
      - "rust/crates/asr-metrics/**"
      - "python/src/parakeet_onnx/evaluation/**"
      - ".github/workflows/rtf-resolver.yml"
      - ".github/workflows/ghcr-build-publish.yml"
      - ".github/workflows/rtf-benchmark-run.yml"
      - ".github/workflows/rtf-verification-select.yml"
      - ".github/workflows/rtf-verification-artifact-persist.yml"
      - ".github/workflows/rtf-service-result.yml"
      - "scripts/run-benchmark.sh"
      - ".github/runpod-rtf-services.json"
      - "scripts/ci/check-runpod-rtf-services.py"
      - "scripts/ci/run-runpod-cuda-probe.sh"
      - "scripts/ci/test-runpod-cuda-probe.sh"
      - "evaluation/schemas/runpod-cuda-probe.schema.json"
      - ".github/workflows/runpod-rtf-service-inventory.yml"
      - "scripts/ci/test-rtf-provider-adapters.sh"
      - "scripts/ci/resolve-ghcr-package-digest.sh"
      - "scripts/ci/dispatch-rtf-service-result.sh"
      - "scripts/ci/build-rtf-benchmark-record.py"
      - "docker/rtf-benchmark/**"
      - "evaluation/schemas/rtf-service-*.json"
      - "evaluation/schemas/rtf-provider-content.schema.json"
      - "evaluation/schemas/rtf-benchmark-record.schema.json"
      - "rust/crates/asr-contracts/tests/rtf_service.rs"
      - ".github/workflows/rtf-benchmark-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate deterministic RTF benchmark contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate fixed RTF manifest
        shell: python
        run: |
          import json
          from pathlib import Path

          path = Path("evaluation/manifests/rtf-phase1.jsonl")
          expected = {
              "common-voice-8-ja",
              "jsut-basic5000",
              "reazonspeech-test",
          }
          entries = []
          for line_number, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
              value = json.loads(line)
              required = {
                  "inspection_profile",
                  "dataset_id",
                  "count_min",
                  "count_max",
                  "target_total_duration_sec",
                  "seed",
              }
              optional = {"min_duration_sec", "max_duration_sec"}
              if set(value) - required - optional:
                  raise SystemExit(f"line {line_number}: unknown field")
              if set(value) & required != required:
                  raise SystemExit(f"line {line_number}: missing required field")
              if value["inspection_profile"] != "smoke":
                  raise SystemExit(f"line {line_number}: profile must be smoke")
              if not isinstance(value["count_min"], int) or value["count_min"] <= 0:
                  raise SystemExit(f"line {line_number}: count_min must be positive")
              if not isinstance(value["count_max"], int) or value["count_max"] < value["count_min"]:
                  raise SystemExit(f"line {line_number}: count_max must be >= count_min")
              if value["target_total_duration_sec"] <= 0:
                  raise SystemExit(f"line {line_number}: target duration must be positive")
              if not value["seed"]:
                  raise SystemExit(f"line {line_number}: seed must not be empty")
              if value.get("min_duration_sec", 0) < 0:
                  raise SystemExit(f"line {line_number}: invalid minimum duration")
              if value.get("max_duration_sec", 0) <= value.get("min_duration_sec", 0):
                  raise SystemExit(f"line {line_number}: invalid maximum duration")
              entries.append(value["dataset_id"])
          if set(entries) != expected or len(entries) != len(expected):
              raise SystemExit(f"unexpected dataset set: {entries!r}")
          print("RTF manifest contract: PASS")

      - name: Validate benchmark schema JSON
        run: |
          python -m json.tool evaluation/schemas/benchmark.schema.json >/dev/null
          python -m json.tool evaluation/schemas/rtf-service-result.schema.json >/dev/null
          python -m json.tool evaluation/schemas/rtf-service-metrics.schema.json >/dev/null
          python -m json.tool evaluation/schemas/rtf-provider-content.schema.json >/dev/null
          python -m json.tool evaluation/schemas/rtf-benchmark-record.schema.json >/dev/null

      - name: Validate RTF orchestration syntax
        run: |
          bash -n scripts/run-benchmark.sh
          bash -n scripts/ci/resolve-ghcr-package-digest.sh
          bash -n scripts/ci/dispatch-rtf-service-result.sh
          bash -n docker/rtf-benchmark/entrypoint.sh
          grep -En 'sleep infinity|exec sleep infinity' docker/rtf-benchmark/entrypoint.sh
          python - <<'PY'
          from pathlib import Path
          entrypoint = Path("docker/rtf-benchmark/entrypoint.sh").read_text()
          dockerfile = Path("docker/rtf-benchmark/Dockerfile").read_text()
          if '"$#" -eq 1 && "${1:-}" == "sleep infinity"' not in entrypoint:
              raise SystemExit("ENTRYPOINT must accept RunPod's single-string docker args form")
          if 'CMD ["sleep", "infinity"]' not in dockerfile:
              raise SystemExit("Dockerfile must own the RunPod keepalive CMD")
          print("RunPod docker-args arity contract: PASS")
          PY
          python -m py_compile docker/rtf-benchmark/benchmark-runner/benchmark_runner/*.py scripts/ci/build-rtf-benchmark-record.py
          python -m json.tool .github/runpod-rtf-services.json >/dev/null
          python -m json.tool evaluation/schemas/runpod-cuda-probe.schema.json >/dev/null
          python -m py_compile scripts/ci/check-runpod-rtf-services.py
          bash -n scripts/ci/run-runpod-cuda-probe.sh
          bash -n scripts/ci/test-runpod-cuda-probe.sh
          scripts/ci/test-runpod-cuda-probe.sh
          grep -En 'runpod-rtf-services.json|check-runpod-rtf-services.py|RTF_RUNPOD_MIN_CUDA_VERSION' .github/workflows/rtf-benchmark-run.yml
          grep -REn 'content_probe|RTF_CONTENT_PROBE|provider content gate' docker/rtf-benchmark scripts/run-benchmark.sh
          grep -En 'snapshot_download|revision=args.model_revision|ASRModel.restore_from' docker/rtf-benchmark/benchmark-runner/benchmark_runner/cli.py
          if grep -En 'paths2audio_files' docker/rtf-benchmark/benchmark-runner/benchmark_runner/cli.py; then
            echo 'NeMo transcribe must use positional audio paths' >&2
            exit 1
          fi

      - name: Validate Docker provider path contract
        run: |
          python - <<'PY'
          from pathlib import Path

          script = Path("scripts/run-benchmark.sh").read_text()
          if 'hf jobs run --name "$RTF_RUN_ID"' not in script:
              raise SystemExit("HF Jobs must use a bounded explicit job name")
          if 'RTF_CONTENT_OUTPUT=$RTF_CONTENT_OUTPUT' not in script:
              raise SystemExit("HF Jobs must receive the content probe output path")
          if 'RTF_CONTENT_PROBE=' not in script:
              raise SystemExit("HF Jobs must collect the content probe line")
          if 'provider content gate failed' not in Path("docker/rtf-benchmark/entrypoint.sh").read_text():
              raise SystemExit("provider content gate must block full metrics")
          if '"$IMAGE" /opt/rtf-benchmark/entrypoint.sh \\\n      --batch-size "$RTF_BATCH_SIZE"' not in script:
              raise SystemExit("HF Jobs must pass batch size as an entrypoint argument")
          if '-e "RTF_BATCH_SIZE=$RTF_BATCH_SIZE"' in script:
              raise SystemExit("HF Jobs must not pass batch size as an environment variable")
          if '"$IMAGE" python benchmark.py' in script:
              raise SystemExit("HF Jobs must not invoke a missing benchmark.py path")
          if 't4) HF_FLAVOR="${HF_FLAVOR:-t4-small}"' not in script:
              raise SystemExit("HF T4 must map to the T4 Jobs flavor")
          if 'l4) HF_FLAVOR="${HF_FLAVOR:-l4x1}"' not in script:
              raise SystemExit("HF L4 must map to the L4 Jobs flavor")
          for gpu_id in (
              'NVIDIA RTX A5000',
              'NVIDIA RTX A4000',
              'NVIDIA RTX A4500',
              'NVIDIA A40',
              'NVIDIA L4',
              'NVIDIA GeForce RTX 3090',
              'NVIDIA GeForce RTX 4090',
          ):
              if gpu_id not in script:
                  raise SystemExit(f"RunPod GPU ID mapping is missing: {gpu_id}")
          if 'runpodctl ssh info' not in script:
              raise SystemExit("RunPod must obtain SSH connection info")
          if 'runpodctl exec' in script:
              raise SystemExit("deprecated runpodctl exec must not be used")
          if '--cloud-type SECURE' not in script:
              raise SystemExit("RunPod benchmark Pods must explicitly use Secure Cloud")
          if '--ssh' not in script:
              raise SystemExit("RunPod Pod creation must explicitly enable SSH")
          if '--ports 22/tcp --terminate-after "$terminate_after"' not in script:
              raise SystemExit("RunPod Pod creation must use the provider termination guard")
          if 'runpodctl pod get "$pod_id" --output json' not in script:
              raise SystemExit("RunPod must poll Pod readiness after creation")
          if 'date -u -d "+${RTF_RUNPOD_MAX_HOURS} hours"' not in script:
              raise SystemExit("RunPod termination safety guard must use an absolute UTC DateTime")
          if 'RTF_RUNPOD_WAIT_TIMEOUT_MINUTES' not in script:
              raise SystemExit("RunPod readiness timeout must be configurable")
          if 'RTF_RUNPOD_CREATE_TIMEOUT_MINUTES' not in script:
              raise SystemExit("RunPod Pod creation timeout must be configurable")
          if 'RTF_RUNPOD_MIN_CUDA_VERSION:=13.2' not in script:
              raise SystemExit("RunPod CUDA compatibility floor must be pinned")
          if '--min-cuda-version "$RTF_RUNPOD_MIN_CUDA_VERSION"' not in script:
              raise SystemExit("RunPod Pod creation must select a compatible CUDA version")
          if 'PROVIDER_CUDA_DRIVER_INCOMPATIBLE' not in script:
              raise SystemExit("RunPod CUDA driver incompatibility must be typed")
          content_probe = Path("docker/rtf-benchmark/benchmark-runner/benchmark_runner/content_probe.py").read_text()
          if 'PROVIDER_CUDA_DRIVER_INCOMPATIBLE' not in content_probe:
              raise SystemExit("content probe must classify CUDA driver incompatibility")
          for required in (
              'RTF_RUNPOD_LOG',
              'RTF_RUNPOD_CONTAINER_LOG_TAIL',
              'pod logs <pod-id>',
              '--source container',
              '--follow',
              'RTF_RESULT_RECEIPT=',
              'PIPESTATUS[1]',
              'receipt_completed',
          ):
              if required not in script:
                  raise SystemExit(f"RunPod stdout receipt recovery is missing: {required}")
          workflow = Path(".github/workflows/rtf-benchmark-run.yml").read_text()
          for required in (
              "RTF_FIXTURE_POINTER_MISMATCH",
              "RTF_FIXTURE_REPOSITORY_MISMATCH",
              "RTF_FIXTURE_RECEIPT_REVISION_MISMATCH",
              "RTF_FIXTURE_IMAGE_MISMATCH",
              "receipt_image_digest",
          ):
              if required not in workflow:
                  raise SystemExit(f"RTF Benchmark Run is missing fixture identity gate: {required}")
          if 'phase=pod_create' not in script:
              raise SystemExit("RunPod Pod creation must emit bounded progress")
          if 'runpodctl pod list --all --name "$RTF_RUN_ID"' not in script:
              raise SystemExit("RunPod Pod creation must discover rented Pods by name")
          if 'pod_create_discovered=1' not in script:
              raise SystemExit("RunPod Pod creation must release a blocked CLI after API discovery")
          if 'RUNPOD_POD_CREATE_TIMEOUT' not in script:
              raise SystemExit("RunPod Pod creation timeout must be typed")
          if 'RTF_RUNPOD_POLL_SECONDS' not in script:
              raise SystemExit("RunPod readiness polling interval must be configurable")
          if 'date -u -v+${RTF_RUNPOD_MAX_HOURS}H' not in script:
              raise SystemExit("RunPod termination must support BSD date for local verification")
          if 'trap cleanup_runpod EXIT' not in script:
              raise SystemExit("RunPod must retain a deletion safety trap")
          if 'trap cleanup_on_signal INT TERM HUP' not in script:
              raise SystemExit("RunPod must clean up on workflow cancellation signals")
          if 'runpodctl pod list --all --name "$RTF_RUN_ID"' not in script:
              raise SystemExit("RunPod create failures must clean up Pods by unique name")
          if 'pod_create_failed=1' not in script:
              raise SystemExit("RunPod create failures must activate orphan cleanup")
          if "(.id // .podId // .pod_id) // empty" not in script:
              raise SystemExit("RunPod create errors must not pass a literal null pod id to delete")
          if 'delete_pod\n    ;;' not in script:
              raise SystemExit("RunPod must delete the Pod immediately after result collection")
          if 'runpodctl pod delete "$pod_id"' not in script:
              raise SystemExit("RunPod must delete each benchmark Pod")
          if "exec /opt/rtf-benchmark/entrypoint.sh" not in script:
              raise SystemExit("RunPod must invoke the image entrypoint explicitly")
          if "exec python benchmark.py" in script:
              raise SystemExit("RunPod must not bypass the image entrypoint")
          benchmark_workflow = Path(".github/workflows/rtf-benchmark-run.yml").read_text()
          if "inputs.image" in benchmark_workflow or "description: Optional image override" in benchmark_workflow:
              raise SystemExit("RTF Benchmark Run must always resolve the latest GHCR image")
          if "inputs.batch_size" in benchmark_workflow or "description: Benchmark batch size" in benchmark_workflow:
              raise SystemExit("RTF Benchmark Run must not expose a batch-size input")
          if "batch_sizes=(1)" not in benchmark_workflow:
              raise SystemExit("RTF Benchmark Run must keep guarded mode at batch size one")
          if "batch_sizes=(1 8 32)" not in benchmark_workflow:
              raise SystemExit("RTF Benchmark Run must expose the explicit full-matrix batch sizes")
          if 'for batch_size in "${batch_sizes[@]}"; do' not in benchmark_workflow:
              raise SystemExit("RTF Benchmark Run must iterate only the selected cost-policy batch sizes")
          if "latest GHCR package digest" not in benchmark_workflow:
              raise SystemExit("RTF Benchmark Run must wait for the latest GHCR package digest")
          if "timeout-minutes: 360" not in benchmark_workflow:
              raise SystemExit("RTF Benchmark Run must allow the sequential three-batch provider window")
          if "Verify resolved image contains the RTF loader safety policy" not in benchmark_workflow:
              raise SystemExit("RTF Benchmark Run must verify the resolved image contains the provider fix")
          if 'timeout --signal=TERM "${IMAGE_PULL_TIMEOUT_MINUTES}m" docker pull' not in benchmark_workflow:
              raise SystemExit("RTF image pull must be bounded before provider execution")
          if 'Config.Cmd == ["sleep", "infinity"]' not in benchmark_workflow:
              raise SystemExit("RTF Benchmark Run must verify the published keepalive CMD")
          if "RTF_NUM_WORKERS" in benchmark_workflow or "RTF_NUM_WORKERS" in script:
              raise SystemExit("RTF worker count must be fixed in the image policy, not passed dynamically")
          if 'touch "$HOME/.runpod/.runpod.yaml"' not in benchmark_workflow:
              raise SystemExit("RunPod CLI configuration must initialize its config file")
          if 'runpodctl doctor --output json' not in benchmark_workflow:
              raise SystemExit("RunPod CLI configuration must run doctor validation")
          if '.healthy == true' not in benchmark_workflow:
              raise SystemExit("RunPod CLI configuration must require a healthy doctor result")
          if "benchmark setup did not produce a result receipt" not in benchmark_workflow:
              raise SystemExit("RTF Benchmark Run must normalize setup failures per batch")
          if "Cleanup RunPod Pods after benchmark" not in benchmark_workflow:
              raise SystemExit("RTF Benchmark Run must clean up RunPod Pods after cancellation")
          if "if: always() && inputs.provider == 'runpod'" not in benchmark_workflow:
              raise SystemExit("RunPod cleanup must run after blocked or canceled execution")
          if 'runpodctl pod list --all --name "$run_id"' not in benchmark_workflow:
              raise SystemExit("RunPod cleanup must find Pods by unique batch run id")
          if 'successful_batches=0' not in benchmark_workflow or "all benchmark batches failed; marking the benchmark job as FAILURE" not in benchmark_workflow:
              raise SystemExit("RTF Benchmark Run must fail when every batch is blocked")
          if "max-parallel: 1" not in benchmark_workflow:
              raise SystemExit("RTF result collection must remain sequential")
          selection = Path(".github/workflows/rtf-verification-select.yml").read_text()
          if "inputs.batch_size" in selection or "description: Batch size target" in selection:
              raise SystemExit("RTF Verification Select must not expose a batch-size input")
          if "BATCH_SIZES" not in selection:
              raise SystemExit("RTF Verification Select must publish all batch sizes")
          service_result = Path(".github/workflows/rtf-service-result.yml").read_text()
          if 'tee "$destination/summary.md"' in service_result:
              raise SystemExit("service summary must not be written before artifact branch checkout")
          if 'tee .ci/rtf-service/summary.md' not in service_result:
              raise SystemExit("service summary must use a checkout-independent temporary path")
          if 'cp .ci/rtf-service/summary.md "${destination}/summary.md"' not in service_result:
              raise SystemExit("persist step must copy the temporary service summary")
          if "benchmark-summary.json" not in service_result:
              raise SystemExit("service result must publish the requested benchmark summary")
          resolver = Path(".github/workflows/rtf-resolver.yml").read_text()
          if "chown -R '$resolver_uid:$resolver_gid' /resolver" not in resolver:
              raise SystemExit("Docker resolver must restore host ownership")
          if '--entrypoint bash' not in resolver:
              raise SystemExit("Docker resolver must use a cleanup-capable shell")
          print("Docker provider path contract: PASS")
          PY

      - name: Validate GHCR to RTF Resolver chaining contract
        run: |
          python - <<'PY'
          from pathlib import Path

          build = Path(".github/workflows/ghcr-build-publish.yml").read_text()
          resolver = Path(".github/workflows/rtf-resolver.yml").read_text()
          if "name: Resolve published RTF image identity" not in build:
              raise SystemExit("GHCR workflow must resolve the RTF image after build")
          if "ghcr-build-parakeet-rtf-benchmark" not in build:
              raise SystemExit("GHCR workflow must consume the canonical RTF build artifact")
          if "needs: build" not in build:
              raise SystemExit("RTF image identity must depend on the completed build matrix")
          if "published == true and .role == \"rtf-benchmark\"" not in build:
              raise SystemExit("RTF chain must reject unpublished or wrong-role build artifacts")
          if "uses: ./.github/workflows/rtf-resolver.yml" not in build:
              raise SystemExit("GHCR workflow must call the reusable RTF Resolver")
          if "workflow_call:" not in resolver:
              raise SystemExit("RTF Resolver must expose a reusable workflow entrypoint")
          if "image: ${{ needs.rtf-image.outputs.image }}" not in build:
              raise SystemExit("RTF Resolver must receive the exact published image reference")
          print("GHCR -> RTF Resolver chain: PASS")
          PY

      - name: Validate Rust ranking workflow contract
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/benchmark-ranking.yml").read_text()
          ranker = Path("rust/crates/asr-contracts/src/bin/asr-rtf-rank.rs").read_text()
          module = Path("rust/crates/asr-contracts/src/rtf_rank.rs").read_text()
          if 'scripts/ci/install-rust-cli.sh' not in workflow or 'asr-rtf-rank' not in workflow:
              raise SystemExit("ranking workflow must install and call the released Rust ranker")
          if '--phase "$rank_phase"' not in workflow:
              raise SystemExit("ranking workflow must bind inspection profiles to Rust phase")
          if 'lough' in workflow or 'precise' in workflow:
              raise SystemExit("ranking workflow must not use retired inspection profile names")
          if '--diagnostics rtf-scores/ranking-exclusions.json' not in workflow:
              raise SystemExit("ranking workflow must persist ranking exclusions")
          if 'no accepted completed benchmark records are available for ranking' not in module:
              raise SystemExit("Rust ranker must reject an empty accepted set")
          if 'identity does not match the ranking set' not in module:
              raise SystemExit("Rust ranker must reject mixed accepted identities")
          if 'fn usage()' not in ranker:
              raise SystemExit("Rust ranker CLI contract is missing")
          print("Rust ranking workflow contract: PASS")
          PY

      - name: Run local HF Jobs and RunPod adapter mocks
        run: bash scripts/ci/test-rtf-provider-adapters.sh --mode mock

      - name: Validate RTF cost guard contract
        run: |
          set -euo pipefail
          guarded="$(cargo run --quiet --locked -p asr-contracts --bin asr-rtf-cost-policy -- --policy evaluation/manifests/rtf-cost-policy.json \
            --provider hf --gpu t4 --batch-size 1 --repeat 3 --sample-count 50 \
            --target-total-sec 5400 --max-duration-sec 600 --mode guarded)"
          echo "$guarded" | jq -e '.early_stop_on_failure == true and .remote_timeout == "2h"' >/dev/null
          if cargo run --quiet --locked -p asr-contracts --bin asr-rtf-cost-policy -- --policy evaluation/manifests/rtf-cost-policy.json \
            --provider runpod --gpu a5000 --batch-size 8 --repeat 3 --sample-count 50 \
            --target-total-sec 5400 --max-duration-sec 600 --mode full-matrix; then
            echo 'full-matrix must require explicit approval' >&2
            exit 1
          fi
          echo "RTF cost guard contract: PASS"

      - name: Validate Phase 1 service matrix
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          value = json.loads(Path("evaluation/manifests/rtf-phase1-matrix.json").read_text())
          if value["schema_version"] != 1 or value["repetitions"] != 3:
              raise SystemExit("invalid Phase 1 matrix metadata")
          if len(value["entries"]) != 12:
              raise SystemExit("Phase 1 matrix must contain twelve provider/GPU entries")
          for entry in value["entries"]:
              if entry["service_id"] == "hf-jobs" and not entry["flavor"]:
                  raise SystemExit("HF Jobs entries require a hardware flavor")
              if entry["service_id"] == "hf-jobs" and entry["gpu"] == "t4" and entry["flavor"] != "t4-small":
                  raise SystemExit("HF T4 entries require t4-small")
              if entry["service_id"] == "hf-jobs" and entry["gpu"] == "l4" and entry["flavor"] != "l4x1":
                  raise SystemExit("HF L4 entries require l4x1")
              if entry["service_id"] == "runpod-pod" and entry["flavor"] is not None:
                  raise SystemExit("RunPod Pod entries must not use HF flavor names")
              if entry["provider"] != "cuda" or entry["environment"] != "linux":
                  raise SystemExit("Phase 1 matrix has an invalid provider boundary")
              if entry["batch_sizes"] != [1, 8, 32]:
                  raise SystemExit("Phase 1 batch sizes must be [1, 8, 32]")
          print("RTF Phase 1 matrix contract: PASS")
          PY

      - name: Run Rust RTF contract tests
        run: cargo test --locked -p asr-metrics -p asr-eval -p asr-contracts

      - name: Check Rust formatting and diff whitespace
        run: |
          cargo fmt --all -- --check
          git diff --check
