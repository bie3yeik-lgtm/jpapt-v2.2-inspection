name: Phase8 Normalize

on:
  push:
    branches: [agent/rust-hf-target-routing-phase8]
    paths:
      - ".github/workflows/phase8-normalize.yml"

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/rust-hf-target-routing-phase8
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Refresh lockfile and format
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          cargo fmt --all
      - name: Commit normalized Rust state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock Cargo.toml rust/crates/asr-hf
          git commit -m "Normalize asr-hf workspace state"
          git push origin HEAD:agent/rust-hf-target-routing-phase8
