name: Protocol Maintenance Temporary

on:
  push:
    branches:
      - agent/protocol-production-switch
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: protocol-maintenance-temporary
  cancel-in-progress: false

jobs:
  patch:
    if: ${{ github.event_name == 'push' || github.head_ref == 'agent/protocol-production-switch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/protocol-production-switch
      - name: Apply focused production patch
        run: python scripts/ci/protocol-production-switch.py
      - name: Materialize local commit and report object IDs
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/candidate-package-evaluate-v2.yml \
            .github/workflows/candidate-request-gateway.yml
          git commit -m 'refactor: use Rust candidate protocol builders'
          echo "LOCAL_COMMIT=$(git rev-parse HEAD)"
          git ls-tree HEAD \
            .github/workflows/candidate-package-evaluate-v2.yml \
            .github/workflows/candidate-request-gateway.yml
