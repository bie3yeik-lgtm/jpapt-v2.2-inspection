name: Refresh UV Lock Once

on:
  push:
    branches:
      - agent/rust-hf-destructive-optimization
    paths:
      - ".github/workflows/refresh-uv-lock-once.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/rust-hf-destructive-optimization
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Refresh lock
        run: |
          python -m pip install --disable-pip-version-check uv
          uv lock --python 3.12
          uv lock --check
      - name: Commit lock
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Refresh uv lock for pinned HF CLI"
          git push origin HEAD:agent/rust-hf-destructive-optimization
