name: Phase24 Docs Runner

on:
  push:
    branches:
      - agent/review-minimal-json-bucket-phase24
    paths:
      - .github/workflows/phase24-docs2.yml

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/review-minimal-json-bucket-phase24
      - name: Migrate documentation
        run: python scripts/ci/phase24-docs.py
      - name: Verify obsolete references are gone
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE 'hf-allocation-catalog|HF_TARGETS_JSON|--targets-json|candidate-prefix-key|allocation-fingerprint|prefix_key' -- docs; then
            exit 1
          fi
      - name: Commit documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs
          git commit -m 'Document minimal HF inputs and derived Bucket policy'
          git push origin HEAD:agent/review-minimal-json-bucket-phase24
