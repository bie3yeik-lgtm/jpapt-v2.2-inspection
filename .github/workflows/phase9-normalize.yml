name: Phase9 Normalize

on:
  push:
    branches: [agent/rust-hf-allocation-phase9]
    paths:
      - ".github/workflows/phase9-normalize.yml"

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/rust-hf-allocation-phase9
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Expose allocation module and normalize
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^pub mod allocation;' rust/crates/asr-hf/src/lib.rs || printf '\npub mod allocation;\n' >> rust/crates/asr-hf/src/lib.rs
          cargo generate-lockfile
          cargo fmt --all
          cargo check --locked -p asr-hf
          cargo test --locked -p asr-hf
      - name: Commit normalized state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock rust/crates/asr-hf
          git commit -m "Normalize Phase 9 allocation policy"
          git push origin HEAD:agent/rust-hf-allocation-phase9
