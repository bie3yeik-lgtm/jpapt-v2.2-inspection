name: Bucket Init State Patch

on:
  push:
    branches: [agent/hf-bucket-init]
    paths:
      - ".github/workflows/_bucket-init-state-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/hf-bucket-init
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Replace stale aggregate bucket checks with exact file listing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('rust/crates/asr-eval/src/bucket_init.rs')
          text = path.read_text()

          old = 'const EXPECTED_INITIAL_FILES: usize = 8;\n'
          new = '''const EXPECTED_INITIAL_PATHS: [&str; 8] = [
              "README.md",
              "benchmarks/README.md",
              "bucket-manifest.json",
              "candidates/README.md",
              "config/README.md",
              "config/versions/README.md",
              "experiments/README.md",
              "runs/README.md",
          ];
          '''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''#[derive(Debug, Clone, Deserialize)]
          struct BucketInfo {
              id: String,
              total_files: u64,
          }

          #[derive(Debug, Clone, Deserialize)]
          struct SyncPlanRecord {
          '''
          new = '''#[derive(Debug, Clone, Deserialize)]
          struct BucketInfo {
              id: String,
          }

          #[derive(Debug, Clone, Deserialize, PartialEq, Eq)]
          struct BucketListEntry {
              #[serde(rename = "type")]
              kind: String,
              path: String,
          }

          #[derive(Debug, Clone, Deserialize)]
          struct SyncPlanRecord {
          '''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''fn require_empty_bucket(bucket_id: &str) -> Result<()> {
              let info = fetch_bucket_info(bucket_id)?;
              ensure!(
                  info.id == bucket_id,
                  "bucket identity mismatch: requested={bucket_id}, observed={}",
                  info.id
              );
              ensure!(
                  info.total_files == 0,
                  "refusing to initialize non-empty bucket {bucket_id}: total_files={}",
                  info.total_files
              );
              Ok(())
          }
          '''
          new = '''fn decode_bucket_listing(value: Value) -> Result<Vec<BucketListEntry>> {
              let entries: Vec<BucketListEntry> =
                  serde_json::from_value(value).context("failed to decode recursive bucket listing")?;
              for entry in &entries {
                  ensure!(entry.kind == "file", "unexpected bucket listing entry type: {:?}", entry.kind);
                  validate_nonempty("bucket file path", &entry.path)?;
                  ensure!(
                      !entry.path.starts_with('/') && !entry.path.contains("..") && !entry.path.contains('\\\\'),
                      "unsafe bucket file path returned by Hub: {:?}",
                      entry.path
                  );
              }
              Ok(entries)
          }

          fn list_bucket_files(bucket_id: &str) -> Result<Vec<BucketListEntry>> {
              let value = json_output(&[
                  "buckets",
                  "list",
                  bucket_id,
                  "-R",
                  "--format",
                  "json",
              ])?;
              decode_bucket_listing(value)
          }

          fn require_empty_bucket(bucket_id: &str) -> Result<()> {
              let info = fetch_bucket_info(bucket_id)?;
              ensure!(
                  info.id == bucket_id,
                  "bucket identity mismatch: requested={bucket_id}, observed={}",
                  info.id
              );
              let files = list_bucket_files(bucket_id)?;
              let paths: Vec<_> = files.iter().map(|entry| entry.path.as_str()).collect();
              ensure!(
                  files.is_empty(),
                  "refusing to initialize non-empty bucket {bucket_id}: paths={paths:?}"
              );
              Ok(())
          }

          fn require_exact_initial_files(bucket_id: &str) -> Result<()> {
              let files = list_bucket_files(bucket_id)?;
              let observed: BTreeSet<_> = files.iter().map(|entry| entry.path.as_str()).collect();
              let expected: BTreeSet<_> = EXPECTED_INITIAL_PATHS.into_iter().collect();
              ensure!(
                  observed == expected,
                  "post-initialization bucket file set mismatch: expected={expected:?}, observed={observed:?}"
              );
              Ok(())
          }
          '''
          assert old in text
          text = text.replace(old, new, 1)

          text = text.replace(
              'actions.len() == EXPECTED_INITIAL_FILES,\n        "unexpected initialization file count: expected={EXPECTED_INITIAL_FILES}, planned={}",',
              'actions.len() == EXPECTED_INITIAL_PATHS.len(),\n        "unexpected initialization file count: expected={}, planned={}",\n        EXPECTED_INITIAL_PATHS.len(),',
              1,
          )

          old = '''        let info = fetch_bucket_info(&options.bucket_id)?;
                  ensure!(
                      info.total_files == EXPECTED_INITIAL_FILES as u64,
                      "post-initialization bucket file count mismatch: expected={EXPECTED_INITIAL_FILES}, observed={}",
                      info.total_files
                  );
                  verify_remote_manifest(&options.bucket_id, &bucket_manifest, &temp_root)?;
          '''
          new = '''        require_exact_initial_files(&options.bucket_id)?;
                  verify_remote_manifest(&options.bucket_id, &bucket_manifest, &temp_root)?;
          '''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''    #[test]
              fn rejects_unsafe_hub_ids() {
                  assert!(validate_hub_id("bucket", "gawohok7/ci-test").is_ok());
                  assert!(validate_hub_id("bucket", "gawohok7/../ci-test").is_err());
                  assert!(validate_hub_id("bucket", "ci-test").is_err());
              }
          }
          '''
          new = '''    #[test]
              fn rejects_unsafe_hub_ids() {
                  assert!(validate_hub_id("bucket", "gawohok7/ci-test").is_ok());
                  assert!(validate_hub_id("bucket", "gawohok7/../ci-test").is_err());
                  assert!(validate_hub_id("bucket", "ci-test").is_err());
              }

              #[test]
              fn parses_recursive_bucket_listing() {
                  let entries = decode_bucket_listing(json!([
                      {"type": "file", "path": "README.md", "size": 1},
                      {"type": "file", "path": "config/README.md", "size": 2}
                  ]))
                  .unwrap();
                  assert_eq!(entries.len(), 2);
                  assert_eq!(entries[0].path, "README.md");
                  assert_eq!(entries[1].path, "config/README.md");
              }
          }
          '''
          assert old in text
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY
          cargo fmt --all
          cargo test --locked -p asr-eval --no-default-features --features cpu
      - name: Commit exact bucket state validation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add rust/crates/asr-eval/src/bucket_init.rs
          git diff --cached --quiet && exit 0
          git commit -m "Validate bucket state from exact file listing"
          git push origin HEAD:agent/hf-bucket-init
