name: Bucket Init State Patch

on:
  push:
    branches: [agent/hf-bucket-init]
    paths:
      - ".github/workflows/_bucket-init-state-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/hf-bucket-init
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Accept empty stdout only for an empty Bucket listing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('rust/crates/asr-eval/src/bucket_init.rs')
          text = path.read_text()
          old = '''fn list_bucket_files(bucket_id: &str) -> Result<Vec<BucketListEntry>> {
    let value = json_output(&[
        "buckets",
        "list",
        bucket_id,
        "-R",
        "--format",
        "json",
    ])?;
    decode_bucket_listing(value)
}
'''
          new = '''fn decode_bucket_listing_output(stdout: &[u8]) -> Result<Vec<BucketListEntry>> {
    if stdout.iter().all(u8::is_ascii_whitespace) {
        return Ok(Vec::new());
    }
    let value: Value = serde_json::from_slice(stdout)
        .context("hf buckets list did not return valid JSON or empty output")?;
    decode_bucket_listing(value)
}

fn list_bucket_files(bucket_id: &str) -> Result<Vec<BucketListEntry>> {
    let output = run_hf(&[
        "buckets",
        "list",
        bucket_id,
        "-R",
        "--format",
        "json",
    ])?;
    decode_bucket_listing_output(&output.stdout)
}
'''
          assert old in text
          text = text.replace(old, new, 1)
          old_test = '''    #[test]
    fn parses_recursive_bucket_listing() {
        let entries = decode_bucket_listing(json!([
            {"type": "file", "path": "README.md", "size": 1},
            {"type": "file", "path": "config/README.md", "size": 2}
        ]))
        .unwrap();
        assert_eq!(entries.len(), 2);
        assert_eq!(entries[0].path, "README.md");
        assert_eq!(entries[1].path, "config/README.md");
    }
'''
          new_test = '''    #[test]
    fn parses_recursive_bucket_listing() {
        let entries = decode_bucket_listing(json!([
            {"type": "file", "path": "README.md", "size": 1},
            {"type": "file", "path": "config/README.md", "size": 2}
        ]))
        .unwrap();
        assert_eq!(entries.len(), 2);
        assert_eq!(entries[0].path, "README.md");
        assert_eq!(entries[1].path, "config/README.md");
    }

    #[test]
    fn empty_bucket_listing_accepts_empty_stdout() {
        assert!(decode_bucket_listing_output(b"").unwrap().is_empty());
        assert!(decode_bucket_listing_output(b"  \\n\\t").unwrap().is_empty());
    }

    #[test]
    fn nonempty_invalid_bucket_listing_is_rejected() {
        assert!(decode_bucket_listing_output(b"not-json").is_err());
    }
'''
          assert old_test in text
          text = text.replace(old_test, new_test, 1)
          path.write_text(text)
          PY
          cargo fmt --all
          cargo test --locked -p asr-eval --no-default-features --features cpu
      - name: Commit empty Bucket listing handling
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add rust/crates/asr-eval/src/bucket_init.rs
          git diff --cached --quiet && exit 0
          git commit -m "Handle empty HF Bucket listings strictly"
          git push origin HEAD:agent/hf-bucket-init
