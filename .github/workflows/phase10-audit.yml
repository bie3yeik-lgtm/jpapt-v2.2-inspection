name: Phase10 Audit

on:
  push:
    branches: [agent/rust-hf-allocation-envelope-phase10]
    paths:
      - .github/workflows/phase10-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: List allocation callers
        shell: bash
        run: |
          set -euo pipefail
          echo '--- hf-request-id.sh ---'
          git grep -n 'hf-request-id.sh' || true
          echo '--- hf-allocate-id.sh ---'
          git grep -n 'hf-allocate-id.sh' || true
          echo '--- hf-push-candidate.sh ---'
          git grep -n 'hf-push-candidate.sh' || true
