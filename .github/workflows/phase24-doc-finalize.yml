name: Phase24 Docs Finalize

on:
  push:
    branches: [agent/review-minimal-json-bucket-phase24]
    paths:
      - ".github/workflows/phase24-doc-finalize.yml"

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/review-minimal-json-bucket-phase24
      - name: Align Bucket documentation with canonical IDs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          replacements = {
              'parakeet-candidate-000003': 'candidate-000003',
              'whisper-candidate-000004': 'candidate-000004',
              'parakeet-candidate-000124': 'candidate-000124',
              'whisper-candidate-000042': 'candidate-000042',
              'cpu-full-eval-000005': 'experiment-000005',
              'cross-platform-parity-000006': 'experiment-000006',
              'rust-eval-000007': 'experiment-000007',
              'rust-eval-000125': 'experiment-000125',
              'candidates/parakeet-candidate-000124': 'candidates/candidate-000124',
          }
          for path in Path('docs').glob('*.md'):
              text = path.read_text()
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text)

          path = Path('docs/hf-buckets.md')
          text = path.read_text()
          old = '''現在のprefix:\n\n```text\ncandidate.parakeet-tdt-ctc-v1  -> parakeet-candidate\ncandidate.whisper-autoregressive-v1 -> whisper-candidate\n```\n'''
          new = '''canonical IDはprofile setに依存せず次の1形式です。profile/variantはcandidate metadataとASR catalogから解決します。\n\n```text\ncandidate-NNNNNN\n```\n\n旧Bucketの `ctc/candidate-NNNNNN` / `tdt/candidate-NNNNNN` はread-only fallbackとしてのみ扱い、新規publishでは生成しません。\n'''
          if old not in text:
              raise SystemExit('candidate prefix documentation block not found')
          text = text.replace(old, new)
          old = '''experiment IDも中央Allocator管理です。\n\n```text\nexperiment.cpu_full              -> cpu-full-eval\nexperiment.cross_platform_parity -> cross-platform-parity\nexperiment.rust_eval             -> rust-eval\n```\n\n現状、AllocatorのREADMEがnamespace reservationの最小artifactです。workflowが追加artifactを置く場合も同じexperiment ID配下を使います。'''
          new = '''experiment IDも中央Allocator管理で、workflow種別に依存しない `experiment-NNNNNN` を採番します。workflow種別やevaluation identityは生成metadata側で保持し、ID prefixへ埋め込みません。\n\n現状、AllocatorのREADMEがnamespace reservationの最小artifactです。workflowが追加artifactを置く場合も同じexperiment ID配下を使います。'''
          if old not in text:
              raise SystemExit('experiment prefix documentation block not found')
          text = text.replace(old, new)
          path.write_text(text)
          PY

          if git grep -nE 'parakeet-candidate|whisper-candidate|cpu-full-eval-[0-9]|cross-platform-parity-[0-9]|rust-eval-[0-9]|candidate\.parakeet|candidate\.whisper|experiment\.cpu_full|experiment\.cross_platform_parity|experiment\.rust_eval' -- docs; then
            echo 'stale derived ID naming remains in docs' >&2
            exit 1
          fi
      - name: Commit documentation correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs
          if git diff --cached --quiet; then
            echo 'nothing to commit'
          else
            git commit -m 'Align Bucket docs with derived canonical IDs'
            git push origin HEAD:agent/review-minimal-json-bucket-phase24
          fi
