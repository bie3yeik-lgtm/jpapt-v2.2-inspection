name: RTF Verification Select

on:
  workflow_dispatch:
    inputs:
      service_id:
        description: Verification target service
        required: true
        type: choice
        options: [hf-jobs, runpod-pod]
      gpu:
        description: GPU target (must be compatible with service_id)
        required: true
        type: choice
        options: [t4, l4, a5000, a4000, a4500, a40, rtx2000-ada, rtx4000-ada, rtx3090, rtx4090]
      model_id:
        description: Model target
        required: true
        type: choice
        options: [nvidia/parakeet-tdt_ctc-0.6b-ja, kotoba-tech/kotoba-whisper-v2.0]
      dataset_id:
        description: Dataset target
        required: true
        type: choice
        options: [japanese-asr/ja_asr.common_voice_8_0, japanese-asr/ja_asr.jsut_basic5000, japanese-asr/ja_asr.reazonspeech_test]
      decoder:
        description: Decoder target
        required: true
        type: choice
        options: [tdt, ctc, whisper]

permissions:
  contents: read
  packages: read

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install RunPod CLI for live selectable check
        if: inputs.service_id == 'runpod-pod'
        run: curl -fsSL https://cli.runpod.net | sudo bash

      - name: Check RunPod selectable target
        if: inputs.service_id == 'runpod-pod'
        env:
          RUNPOD_TOKEN: ${{ secrets.RUNPOD_TOKEN }}
          GPU: ${{ inputs.gpu }}
        run: |
          set -euo pipefail
          [[ -n "$RUNPOD_TOKEN" ]] || { echo 'RUNPOD_TOKEN secret is required'; exit 1; }
          mkdir -p "$HOME/.runpod"
          touch "$HOME/.runpod/.runpod.yaml"
          runpodctl config --apiKey="$RUNPOD_TOKEN"
          runpodctl gpu list --include-unavailable --output json > runpod-gpu-inventory.json
          python scripts/ci/check-runpod-rtf-services.py \
            --config .github/runpod-rtf-services.json \
            --inventory runpod-gpu-inventory.json \
            --output runpod-rtf-service-report.json \
            --require-gpu "$GPU"
          jq -r '.entries[] | select(.gpu == env.GPU) | "RunPod selectable: \(.gpu) / CUDA \(.cuda_requirement) / available=\(.available)"' \
            runpod-rtf-service-report.json >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve immutable probe image
        if: inputs.service_id == 'runpod-pod'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          image="$(bash scripts/ci/resolve-ghcr-package-digest.sh "ghcr.io/${GITHUB_REPOSITORY_OWNER}/parakeet-rtf-benchmark")"
          [[ "$image" =~ ^ghcr\.io/[A-Za-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]] || exit 2
          echo "RUNPOD_PROBE_IMAGE=$image" >> "$GITHUB_ENV"

      - name: Prove selected RunPod CUDA capability
        if: inputs.service_id == 'runpod-pod'
        env:
          RUNPOD_TOKEN: ${{ secrets.RUNPOD_TOKEN }}
          GPU: ${{ inputs.gpu }}
        run: |
          set -euo pipefail
          gpu_json="$(jq -cer --arg gpu "$GPU" '.entries[] | select(.gpu == $gpu)' .github/runpod-rtf-services.json)"
          gpu_id="$(jq -er '.gpu_id' <<<"$gpu_json")"
          min_cuda="$(jq -er '.minimum_cuda_version' .github/runpod-rtf-services.json)"
          bash scripts/ci/run-runpod-cuda-probe.sh --gpu "$GPU" --gpu-id "$gpu_id" --image "$RUNPOD_PROBE_IMAGE" --min-cuda-version "$min_cuda" --output runpod-cuda-probe.json
          jq -r '"RunPod CUDA probe: status=\(.status) gpu=\(.gpu) cuda=\(.minimum_cuda_version) cleanup=\(.cleanup_status)"' runpod-cuda-probe.json >> "$GITHUB_STEP_SUMMARY"

      - name: Publish RunPod CUDA probe
        if: always() && inputs.service_id == 'runpod-pod'
        uses: actions/upload-artifact@v7
        with:
          name: runpod-cuda-probe-${{ github.run_id }}
          path: |
            runpod-gpu-inventory.json
            runpod-rtf-service-report.json
            runpod-cuda-probe.json
          if-no-files-found: warn

      - name: Verify provider credential
        env:
          SERVICE_ID: ${{ inputs.service_id }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          RUNPOD_TOKEN: ${{ secrets.RUNPOD_TOKEN }}
        run: |
          set -euo pipefail
          case "$SERVICE_ID" in
            hf-jobs)
              [[ -n "$HF_TOKEN" ]] || { echo 'HF_TOKEN secret is required'; exit 1; }
              curl --fail --silent --show-error \
                -H "Authorization: Bearer $HF_TOKEN" \
                https://huggingface.co/api/whoami-v2 >/dev/null
              ;;
            runpod-pod)
              [[ -n "$RUNPOD_TOKEN" ]] || { echo 'RUNPOD_TOKEN secret is required'; exit 1; }
              curl --fail --silent --show-error \
                -H "Authorization: Bearer $RUNPOD_TOKEN" \
                -H 'Content-Type: application/json' \
                --data '{"query":"query { myself { id } }"}' \
                https://api.runpod.io/graphql >/dev/null
              ;;
            *) echo "unsupported service_id: $SERVICE_ID"; exit 1 ;;
          esac

      - name: Validate selected target
        id: select
        env:
          SERVICE_ID: ${{ inputs.service_id }}
          GPU: ${{ inputs.gpu }}
          MODEL_ID: ${{ inputs.model_id }}
          DATASET_ID: ${{ inputs.dataset_id }}
          DECODER: ${{ inputs.decoder }}
          ACTIONS_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          selected = {key: os.environ[key] for key in (
              "SERVICE_ID", "GPU", "MODEL_ID", "DATASET_ID", "DECODER"
          )}
          matrix = json.loads(Path("evaluation/manifests/rtf-phase1-matrix.json").read_text())
          valid_gpu_service = any(
              entry["service_id"] == selected["SERVICE_ID"]
              and entry["gpu"] == selected["GPU"]
              and entry["batch_sizes"] == [1, 8, 32]
              for entry in matrix["entries"]
          )
          if not valid_gpu_service:
              allowed = sorted({
                  f"{entry['service_id']}/{entry['gpu']}/batch-{batch}"
                  for entry in matrix["entries"]
                  for batch in entry["batch_sizes"]
                  if entry["service_id"] == selected["SERVICE_ID"]
              })
              detail = ", ".join(allowed) or "no GPU is approved for this service"
              raise SystemExit(
                "selected service/GPU is not in the approved Phase 1 matrix; "
                  f"allowed for {selected['SERVICE_ID']}: {detail}"
              )
          if selected["MODEL_ID"] not in matrix["models"]:
              raise SystemExit("selected model is not in the approved matrix")
          if selected["DECODER"] not in matrix["decoders"]:
              raise SystemExit("selected decoder is not in the approved matrix")
          canonical = json.dumps(selected, sort_keys=True, separators=(",", ":"))
          import hashlib

          digest = hashlib.sha256(canonical.encode()).hexdigest()[:16]
          slug = "-".join(
              value.lower().replace("/", "-").replace("_", "-").replace(".", "-")
              for value in (selected["SERVICE_ID"], selected["GPU"], selected["DECODER"])
          )
          selected["BATCH_SIZES"] = [1, 8, 32]
          selected["RUN_ID"] = f"rtf-{slug}-r{os.environ['ACTIONS_RUN_ID']}-{digest}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"run_id={selected['RUN_ID']}\n")
          output = Path("results/rtf-service")
          output.mkdir(parents=True, exist_ok=True)
          (output / "selection.json").write_text(
              json.dumps({"schema_version": 1, **selected}, indent=2) + "\n"
          )
          print("selected RTF verification target: " + json.dumps(selected, sort_keys=True))
          PY

      - name: Publish selected target
        uses: actions/upload-artifact@v7
        with:
          name: rtf-verification-selection-${{ steps.select.outputs.run_id }}
          path: results/rtf-service/selection.json
          if-no-files-found: error
