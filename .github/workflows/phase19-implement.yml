name: Phase19 Implement

on:
  push:
    branches: [agent/rust-evaluator-policy-phase19]
    paths:
      - ".github/workflows/phase19-implement.yml"

permissions:
  contents: write

jobs:
  finalize-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/rust-evaluator-policy-phase19
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate and commit non-workflow migration files
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo clippy --locked -p asr-contracts --all-targets -- -D warnings
          cargo test --locked -p asr-contracts
          rm -f scripts/ci/validate-evaluator-capability.py
          rm -f python/tests/unit/test_evaluator_capability.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/crates/asr-contracts/src/bin/asr-evaluator-policy.rs
          git add -u scripts/ci/validate-evaluator-capability.py python/tests/unit/test_evaluator_capability.py
          if git diff --cached --quiet; then
            echo 'non-workflow files already normalized'
          else
            git commit -m 'Move evaluator capability policy to Rust'
            git push origin HEAD:agent/rust-evaluator-policy-phase19
          fi
