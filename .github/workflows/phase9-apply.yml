name: Phase9 Apply

on:
  push:
    branches: [agent/rust-hf-allocation-phase9]
    paths:
      - ".github/workflows/phase9-apply.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/rust-hf-allocation-phase9
      - name: Migrate workflow allocation policy to Rust
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new, count=None):
              p=Path(path)
              text=p.read_text()
              if old not in text:
                  raise SystemExit(f"missing replacement marker in {path}: {old!r}")
              text=text.replace(old,new, count if count is not None else -1)
              p.write_text(text)

          path='.github/workflows/hf-central-allocator.yml'
          replace(path,
              '      - uses: actions/setup-python@v7\n        with:\n          python-version: "3.12"\n',
              '      - uses: actions/setup-python@v7\n        with:\n          python-version: "3.12"\n      - uses: dtolnay/rust-toolchain@stable\n',
              1)
          replace(path,
              '      - name: Install project and Hugging Face CLI\n        run: |\n          python -m pip install -e ".[dev]"\n          python -m pip install --upgrade huggingface_hub\n',
              '      - name: Install Hugging Face CLI\n        run: python -m pip install --upgrade huggingface_hub\n')
          replace(path,
              'python scripts/ci/resolve-allocation-catalog.py prefix',
              'cargo run --quiet --locked -p asr-hf -- allocation-prefix')
          replace(path,
              'python scripts/ci/resolve-allocation-catalog.py fingerprint catalog_id',
              'cargo run --quiet --locked -p asr-hf -- allocation-fingerprint catalog_id')
          replace(path,
              'python scripts/ci/resolve-allocation-catalog.py fingerprint sha256',
              'cargo run --quiet --locked -p asr-hf -- allocation-fingerprint sha256')

          for path in [
              '.github/workflows/cpu-full-eval.yml',
              '.github/workflows/cross-platform-parity.yml',
              '.github/workflows/rust-eval.yml',
          ]:
              replace(path,
                  '      - uses: actions/setup-python@v7\n        with:\n          python-version: "3.12"\n',
                  '      - uses: actions/setup-python@v7\n        with:\n          python-version: "3.12"\n      - uses: dtolnay/rust-toolchain@stable\n',
                  1)

          path='.github/workflows/validate-hf-layout.yml'
          replace(path,
              '          python scripts/ci/resolve-allocation-catalog.py fingerprint catalog_id\n          python scripts/ci/resolve-allocation-catalog.py fingerprint sha256\n',
              '          cargo run --quiet --locked -p asr-hf -- allocation-fingerprint catalog_id\n          cargo run --quiet --locked -p asr-hf -- allocation-fingerprint sha256\n')
          replace(path,
              '          from parakeet_onnx.config.allocation_catalog import load_repository_allocation_catalog\n',
              '')
          replace(path,
              '          allocation_catalog=load_repository_allocation_catalog(Path.cwd())\n',
              '')
          replace(path,
              '          print(f"HF allocation catalog: {allocation_catalog.catalog_id} {allocation_catalog.sha256}")\n',
              '')
          replace(path,
              '          print("Allocation prefixes:")\n          for key, prefix in sorted(allocation_catalog.prefixes.items()):\n              print(f"- {key}: {prefix}")\n',
              '')
      - name: Commit workflow migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/hf-central-allocator.yml .github/workflows/cpu-full-eval.yml .github/workflows/cross-platform-parity.yml .github/workflows/rust-eval.yml .github/workflows/validate-hf-layout.yml
          git commit -m "Use Rust allocation policy in workflows"
          git push origin HEAD:agent/rust-hf-allocation-phase9
