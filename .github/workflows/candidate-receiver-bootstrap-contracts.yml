name: Candidate Receiver Bootstrap Contracts

on:
  push:
    branches: [main]
    paths:
      - .github/actionlint.yaml
      - .github/workflows/candidate-receiver-bootstrap.yml
      - .github/workflows/candidate-receiver-bootstrap-contracts.yml
      - .github/workflows/candidate-protocol-e2e.yml
      - .github/workflows/candidate-protocol-readiness.yml
      - config/candidate-receiver-bundle.json
      - contracts/candidate-receiver-installation.schema.json
      - scripts/ci/candidate_receiver_bundle.py
      - scripts/ci/build-candidate-receiver-installation.py
      - .github/workflows/candidate-completion-receipt.yml
      - .github/workflows/candidate-request-rejection.yml
      - scripts/ci/candidate_protocol_common.py
      - scripts/ci/build-candidate-completion-receipt.py
      - scripts/ci/build-candidate-completion-ack.py
      - scripts/ci/build-candidate-request-rejection.py
      - scripts/ci/validate-candidate-protocol-binding.py
      - scripts/ci/repository-dispatch-with-retry.sh
  pull_request:
    paths:
      - .github/actionlint.yaml
      - .github/workflows/candidate-receiver-bootstrap.yml
      - .github/workflows/candidate-receiver-bootstrap-contracts.yml
      - .github/workflows/candidate-protocol-e2e.yml
      - .github/workflows/candidate-protocol-readiness.yml
      - config/candidate-receiver-bundle.json
      - contracts/candidate-receiver-installation.schema.json
      - scripts/ci/candidate_receiver_bundle.py
      - scripts/ci/build-candidate-receiver-installation.py
      - .github/workflows/candidate-completion-receipt.yml
      - .github/workflows/candidate-request-rejection.yml
      - scripts/ci/candidate_protocol_common.py
      - scripts/ci/build-candidate-completion-receipt.py
      - scripts/ci/build-candidate-completion-ack.py
      - scripts/ci/build-candidate-request-rejection.py
      - scripts/ci/validate-candidate-protocol-binding.py
      - scripts/ci/repository-dispatch-with-retry.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-receiver-bootstrap-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Validate receiver bootstrap contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: false
      - name: Install pinned actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Lint receiver workflows
        run: >-
          actionlint -color -ignore 'SC2016'
          .github/workflows/candidate-receiver-bootstrap.yml
          .github/workflows/candidate-receiver-bootstrap-contracts.yml
          .github/workflows/candidate-protocol-e2e.yml
          .github/workflows/candidate-protocol-readiness.yml
      - name: Validate bundle and manifest helpers
        run: |
          python -m py_compile \
            scripts/ci/candidate_protocol_common.py \
            scripts/ci/candidate_receiver_bundle.py \
            scripts/ci/build-candidate-receiver-installation.py
          python -m json.tool config/candidate-receiver-bundle.json >/dev/null
          python -m json.tool contracts/candidate-receiver-installation.schema.json >/dev/null
          python scripts/ci/candidate_receiver_bundle.py --validate
      - name: Build canonical installation fixture
        shell: bash
        run: |
          set -euo pipefail
          file_args=()
          while IFS= read -r mapping; do
            file_args+=(--file "$mapping")
          done < <(python scripts/ci/candidate_receiver_bundle.py --mappings)
          RECEIVER_REPOSITORY=owner/receiver \
          ORCHESTRATOR_REPOSITORY=owner/orchestrator \
          ORCHESTRATOR_COMMIT_SHA=0000000000000000000000000000000000000000 \
          INSTALLED_AT=2026-08-17T10:00:00Z \
          python scripts/ci/build-candidate-receiver-installation.py \
            --output /tmp/receiver.json "${file_args[@]}"
          python scripts/ci/build-candidate-receiver-installation.py --validate /tmp/receiver.json
          python scripts/ci/candidate_receiver_bundle.py --assert-installation /tmp/receiver.json
      - name: Reject stale and malformed installations
        shell: bash
        run: |
          set -euo pipefail
          jq '.managed_files = .managed_files[:-1]' /tmp/receiver.json > /tmp/stale.json
          if python scripts/ci/candidate_receiver_bundle.py --assert-installation /tmp/stale.json; then
            echo 'stale installation unexpectedly matched canonical bundle' >&2
            exit 1
          fi

          zero_sha="$(printf '0%.0s' {1..64})"
          jq --arg sha "$zero_sha" '.managed_files += [{"path":"scripts/ci/obsolete-managed.py","sha256":$sha}]' \
            /tmp/receiver.json > /tmp/obsolete.json
          test "$(python scripts/ci/candidate_receiver_bundle.py --obsolete-installation /tmp/obsolete.json)" = scripts/ci/obsolete-managed.py

          jq '.installed_at="2026-08-17T10:00:00"' /tmp/receiver.json > /tmp/naive.json
          if python scripts/ci/build-candidate-receiver-installation.py --validate /tmp/naive.json; then
            echo 'naive installed_at unexpectedly passed validation' >&2
            exit 1
          fi
          jq '.unexpected="x"' /tmp/receiver.json > /tmp/extra.json
          if python scripts/ci/build-candidate-receiver-installation.py --validate /tmp/extra.json; then
            echo 'unknown installation field unexpectedly passed validation' >&2
            exit 1
          fi
      - name: Verify canonical bundle dependency closure
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'from candidate_protocol_common import' scripts/ci/build-candidate-completion-receipt.py
          grep -F 'from candidate_protocol_common import' scripts/ci/build-candidate-completion-ack.py
          grep -F 'from candidate_protocol_common import' scripts/ci/build-candidate-request-rejection.py
          grep -Fx 'scripts/ci/candidate_protocol_common.py' < <(python scripts/ci/candidate_receiver_bundle.py --paths)
          grep -F 'candidate_receiver_bundle.py --mappings' .github/workflows/candidate-receiver-bootstrap.yml
          grep -F 'candidate_receiver_bundle.py --tsv' .github/workflows/candidate-receiver-bootstrap.yml
      - name: Verify managed drift and obsolete-path policy
        shell: bash
        run: |
          set -euo pipefail
          bootstrap=.github/workflows/candidate-receiver-bootstrap.yml
          grep -F 'managed path drifted from the owned installation manifest' "$bootstrap"
          grep -F 'bootstrap refuses to overwrite a modified managed path' "$bootstrap"
          grep -F 'managed path is missing and will be repaired' "$bootstrap"
          grep -F 'existing receiver manifest is stale; bootstrap will converge it to the canonical bundle' "$bootstrap"
          grep -F 'candidate_receiver_bundle.py --obsolete-installation /tmp/existing-receiver.json' "$bootstrap"
          grep -F 'sha:null' "$bootstrap"
          grep -F 'obsolete managed path still exists after bootstrap' "$bootstrap"
      - name: Verify preflight-head and atomic update policy
        shell: bash
        run: |
          set -euo pipefail
          bootstrap=.github/workflows/candidate-receiver-bootstrap.yml
          grep -F 'validated_head_sha=' "$bootstrap"
          grep -F '?ref=$validated_head_sha' "$bootstrap"
          grep -F 'VALIDATED_HEAD_SHA:' "$bootstrap"
          grep -F 'head_sha="$VALIDATED_HEAD_SHA"' "$bootstrap"
          grep -F -- '--arg parent "$head_sha"' "$bootstrap"
          grep -F '{sha:$sha,force:false}' "$bootstrap"
          grep -F 'git/refs/heads/$TARGET_BRANCH' "$bootstrap"
      - name: Verify external receiver safety gates
        shell: bash
        run: |
          set -euo pipefail
          bootstrap=.github/workflows/candidate-receiver-bootstrap.yml
          grep -F '[[ "$TARGET_REPOSITORY" != "$GITHUB_REPOSITORY" ]]' "$bootstrap"
          grep -F 'managed path already exists without jpapt manifest' "$bootstrap"
          grep -F 'existing receiver installation is managed by another orchestrator' "$bootstrap"
          grep -F 'candidate_receiver_bundle.py --assert-installation /tmp/receiver-manifest.json' .github/workflows/candidate-protocol-e2e.yml
          grep -F 'receiver installation manifest is stale or incomplete' .github/workflows/candidate-protocol-e2e.yml
          grep -F 'candidate_receiver_bundle.py --assert-installation /tmp/receiver.json' .github/workflows/candidate-protocol-readiness.yml
          grep -F 'receiver managed installation is stale or incomplete' .github/workflows/candidate-protocol-readiness.yml
      - name: Verify readiness trust contract
        shell: bash
        run: |
          set -euo pipefail
          readiness=.github/workflows/candidate-protocol-readiness.yml
          grep -F 'SOURCE_REPO_TOKEN is not configured' "$readiness"
          grep -F 'HF_TOKEN is not configured' "$readiness"
          grep -F 'JPAPT_ORCHESTRATOR_REPOSITORIES' "$readiness"
          grep -F 'JPAPT_ACK_TOKEN' "$readiness"
          grep -F 'managed path hash mismatch' "$readiness"
          grep -F '**Readiness: PASS**' "$readiness"
      - name: Verify readiness HF Bucket preflight contract
        shell: bash
        run: |
          set -euo pipefail
          readiness=.github/workflows/candidate-protocol-readiness.yml
          grep -F 'hf_bucket:' "$readiness"
          grep -F 'hf://buckets/$HF_BUCKET/candidates' "$readiness"
          grep -F 'hf buckets list --token "$HF_TOKEN" "$remote" -R -q' "$readiness"
          grep -F "re.findall(r'candidate-[0-9]{6}', text)" "$readiness"
          grep -F 'E2E HF Bucket contains no candidate-NNNNNN under candidates/' "$readiness"
          grep -F 'E2E HF Bucket candidate collection: reachable and non-empty' "$readiness"
          if grep -F 'hf buckets sync' "$readiness"; then
            echo 'readiness must not download candidate payloads' >&2
            exit 1
          fi

  diagnose_fixture_receiver:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'agent/diagnose-fixture-receiver-20260820' }}
    name: Diagnose private fixture receiver run
    environment: Private-Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: List matching receiver runs and jobs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.TARGET_REPO_TOKEN }}
          FIXTURE_REPOSITORY: bie3yeik-lgtm/jpapt-protocol-e2e-source
          EXPECTED_AFTER: '2026-08-19T15:01:55Z'
        run: |
          set -euo pipefail
          [[ -n "${GH_TOKEN:-}" ]] || { echo '::error::TARGET_REPO_TOKEN missing'; exit 1; }
          runs="$(gh api "/repos/$FIXTURE_REPOSITORY/actions/workflows/candidate-completion-receipt.yml/runs?event=repository_dispatch&per_page=20")"
          echo '=== receiver runs ==='
          jq -r --arg after "$EXPECTED_AFTER" '.workflow_runs[] | select(.created_at >= $after) | [.id,.status,(.conclusion // ""),.created_at,.head_sha] | @tsv' <<<"$runs"
          run_id="$(jq -r --arg after "$EXPECTED_AFTER" '.workflow_runs[] | select(.created_at >= $after) | .id' <<<"$runs" | head -n1)"
          [[ -n "$run_id" && "$run_id" != null ]] || { echo '::error::receiver run not found'; exit 1; }
          echo "selected_run_id=$run_id"
          echo '=== receiver jobs ==='
          gh api "/repos/$FIXTURE_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" \
            --jq '.jobs[] | [.id,.name,.status,(.conclusion // "")] | @tsv'
