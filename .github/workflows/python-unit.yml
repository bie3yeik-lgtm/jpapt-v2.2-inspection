name: Python Unit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "pyproject.toml"
      - "uv.lock"
      - "config/**"
      - "evaluation/**"
      - "python/**"
      - "scripts/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "pyproject.toml"
      - "uv.lock"
      - "config/**"
      - "evaluation/**"
      - "python/**"
      - "scripts/**"

permissions:
  contents: read

concurrency:
  group: python-unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Sync authoritative environment
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --locked --extra datasets --extra onnx --extra dev
      - name: Verify runtime pins
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import onnxruntime as ort
          if ort.__version__ != "1.28.0":
              raise SystemExit(f"unexpected onnxruntime version: {ort.__version__}")
          print(f"onnxruntime={ort.__version__}")
          print(f"providers={ort.get_available_providers()}")
          PY
      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          uv run python -m pytest -q python/tests/unit
