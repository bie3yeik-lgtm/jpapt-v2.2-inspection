name: Append work history constitution rule

on:
  push:
    branches:
      - agent/nemo-onnx-asr-quality
    paths:
      - .github/workflows/_append-work-history-rule.yml

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/nemo-onnx-asr-quality
      - name: Append work history policy
        shell: bash
        env:
          ADDITION_B64: ""
        run: |
          python -c 'import base64, os; from pathlib import Path; p=Path("AGENTS.md"); t=p.read_text(encoding="utf-8"); a=base64.b64decode(os.environ["ADDITION_B64"]).decode("utf-8"); anchor="## Development direction\n"; assert t.count(anchor)==1; p.write_text(t.replace(anchor, a+anchor, 1), encoding="utf-8")'
      - name: Commit constitution update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add AGENTS.md
          git diff --cached --check
          git commit -m "Define auditable work history policy"
          git push origin HEAD:agent/nemo-onnx-asr-quality
