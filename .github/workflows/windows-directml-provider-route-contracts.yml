name: Windows DirectML Provider Route Contracts

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/windows-directml-provider-route.yml
      - .github/workflows/windows-directml-provider-route-contracts.yml
      - scripts/ci/build-windows-directml-external-receipt.sh
      - evaluation/schemas/windows-directml-external-receipt.schema.json
      - python/tests/unit/test_windows_directml_external_receipt_schema.py
  pull_request:
    paths:
      - .github/workflows/windows-directml-provider-route.yml
      - .github/workflows/windows-directml-provider-route-contracts.yml
      - scripts/ci/build-windows-directml-external-receipt.sh
      - evaluation/schemas/windows-directml-external-receipt.schema.json
      - python/tests/unit/test_windows_directml_external_receipt_schema.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Validate Windows DirectML external receipt and dispatch contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check jsonschema pytest

      - name: Validate helper, schema, and dispatch registration
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/ci/build-windows-directml-external-receipt.sh
          pytest -q python/tests/unit/test_windows_directml_external_receipt_schema.py
          cargo run --quiet --locked -p asr-contracts --bin asr-workflow-dispatch -- describe windows-directml-provider-route

      - name: Accept plan-only external receipt
        shell: bash
        run: |
          set -euo pipefail
          sha="$(printf 'b%.0s' {1..40})"
          bash scripts/ci/build-windows-directml-external-receipt.sh \
            largoyo/Premiere-AutoProcess-Plugin "$sha" gawohok7/example-bucket candidate-000001 smoke \
            /tmp/windows-directml-plan.json true false
          jq -e '.linux_hf_jobs_smoke_equivalent == false and .provider_id == "directml"' \
            /tmp/windows-directml-plan.json >/dev/null
