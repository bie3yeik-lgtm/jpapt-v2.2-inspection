name: NeMo Contract Patch

on:
  push:
    branches:
      - agent/nemo-onnx-validation
    paths:
      - .github/workflows/_nemo-contract-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    env:
      OLD_B64: ""
      NEW_B64: ""
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/nemo-onnx-validation
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Patch validator
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import base64, os, pathlib; p=pathlib.Path("rust/crates/asr-eval/src/nemo_onnx.rs"); s=p.read_text(); old=base64.b64decode(os.environ["OLD_B64"]).decode(); new=base64.b64decode(os.environ["NEW_B64"]).decode(); assert old in s; p.write_text(s.replace(old,new,1))'
          cargo fmt --all
          cargo test --locked -p asr-eval --no-default-features --features cpu
      - name: Commit validator
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add rust/crates/asr-eval/src/nemo_onnx.rs
          git commit -m "Enforce NeMo Model Card constants in Rust"
          git push origin HEAD:agent/nemo-onnx-validation
