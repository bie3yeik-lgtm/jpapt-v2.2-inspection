name: Candidate Request Rejection

on:
  repository_dispatch:
    types: [jpapt.candidate-rejected]
  workflow_dispatch:
    inputs:
      rejection_json:
        description: CandidateRequestRejectionV1 JSON payload
        required: true
        type: string

permissions:
  contents: read

jobs:
  rejection:
    name: Validate candidate request rejection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Materialize rejection payload
        shell: bash
        env:
          PROTOCOL_PAYLOAD: ${{ toJSON(github.event.client_payload.protocol_payload) }}
          LEGACY_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          REJECTION_JSON: ${{ inputs.rejection_json }}
        run: |
          set -euo pipefail
          mkdir -p .ci
          if [[ "$GITHUB_EVENT_NAME" == "repository_dispatch" ]]; then
            if [[ "$PROTOCOL_PAYLOAD" != "null" && -n "$PROTOCOL_PAYLOAD" ]]; then
              printf '%s\n' "$PROTOCOL_PAYLOAD" > .ci/candidate-request-rejection.json
            else
              printf '%s\n' "$LEGACY_PAYLOAD" > .ci/candidate-request-rejection.json
            fi
          else
            printf '%s\n' "$REJECTION_JSON" > .ci/candidate-request-rejection.json
          fi
      - name: Validate CandidateRequestRejectionV1
        run: >-
          python scripts/ci/build-candidate-request-rejection.py
          --validate .ci/candidate-request-rejection.json
      - name: Validate rejection receiver binding
        env:
          ALLOWED_ORCHESTRATORS: ${{ vars.JPAPT_ORCHESTRATOR_REPOSITORIES }}
        run: >-
          python scripts/ci/validate-candidate-protocol-binding.py
          --rejection .ci/candidate-request-rejection.json
          --receiver-repository "${{ github.repository }}"
          --allowed-orchestrators "$ALLOWED_ORCHESTRATORS"
      - name: Preserve received rejection
        uses: actions/upload-artifact@v7
        with:
          name: received-candidate-rejection-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci/candidate-request-rejection.json
          retention-days: 30
