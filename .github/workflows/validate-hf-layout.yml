name: Validate HF Layout

on:
  workflow_dispatch:
    inputs:
      hf_bucket:
        description: "HF_BUCKET value from vars.HF_TARGETS_JSON"
        required: true
        default: gawohok7/jpapt-v2.2-dev-bucket
        type: string
      runtime_variant:
        description: "Runtime variant from target profile set (blank = catalog default)"
        required: false
        default: ""
        type: string
  pull_request:
    paths:
      - ".github/workflows/**"
      - "pyproject.toml"
      - "uv.lock"
      - "config/**"
      - "evaluation/**"
      - "python/src/parakeet_onnx/**"
      - "python/tests/**"
      - "scripts/hf/**"
      - "scripts/ci/**"
      - "docs/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "pyproject.toml"
      - "uv.lock"
      - "config/**"
      - "evaluation/**"
      - "python/src/parakeet_onnx/**"
      - "python/tests/**"
      - "scripts/hf/**"
      - "scripts/ci/**"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: validate-hf-layout-${{ github.ref }}-${{ inputs.hf_bucket || 'local' }}-${{ inputs.runtime_variant || 'default' }}
  cancel-in-progress: true

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF_TARGETS_JSON: ${{ vars.HF_TARGETS_JSON }}

jobs:
  local-contracts:
    name: Validate local HF contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable

      - name: Install locked Python project
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check uv
          uv lock --check
          uv sync --locked --extra datasets --extra onnx --extra hf --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/python - <<'PY'
          import huggingface_hub
          import onnxruntime as ort
          import parakeet_onnx
          assert ort.__version__ == "1.28.0"
          assert huggingface_hub.__version__ == "1.24.0"
          PY

      - name: Validate source-controlled contracts
        shell: bash
        run: |
          set -euo pipefail
          python scripts/dev/verify-python-first.py
          python scripts/dev/doctor.py
          cargo run --quiet --locked -p asr-hf -- validate-targets
          python scripts/ci/validate-github-action-versions.py
          python scripts/ci/resolve-asr-catalog.py fingerprint catalog_id
          python scripts/ci/resolve-asr-catalog.py fingerprint sha256
          cargo run --quiet --locked -p asr-hf -- allocation-fingerprint catalog_id
          cargo run --quiet --locked -p asr-hf -- allocation-fingerprint sha256
          bash -n scripts/hf/hf-allocate-id.sh
          bash -n scripts/hf/hf-request-id.sh
          bash -n scripts/hf/hf-update-root-readme.sh
          bash -n scripts/hf/hf-push-candidate.sh
          bash -n scripts/hf/hf-fetch-candidate.sh
          bash -n scripts/hf/hf-push-config-version.sh
          bash -n scripts/hf/hf-promote-candidate.sh
          python -m pytest -q \
            python/tests/unit/test_revisions_multiframework.py \
            python/tests/unit/test_revision_decoder_shapes.py \
            python/tests/unit/test_candidate_artifacts.py \
            python/tests/unit/test_manifest.py \
            python/tests/unit/test_asr_catalog_normalization.py \
            python/tests/unit/test_catalog_normalization.py \
            python/tests/unit/test_tdt_decoder.py \
            python/tests/unit/test_whisper_runtime_contract.py \
            python/tests/unit/test_runtime_registry.py \
            python/tests/unit/test_evaluator_capability.py \
            python/tests/unit/test_ort_optimizer_canary.py

      - name: List source-controlled runtime catalogs, targets and evaluators
        shell: bash
        run: |
          set -euo pipefail
          echo "HF allocation catalog: $(cargo run --quiet --locked -p asr-hf -- allocation-fingerprint catalog_id) $(cargo run --quiet --locked -p asr-hf -- allocation-fingerprint sha256)"
          python - <<'PY'
          from pathlib import Path
          from parakeet_onnx.config.catalog import load_repository_catalog
          runtime_catalog=load_repository_catalog(Path.cwd())
          targets=sorted(path.stem for path in Path("config/hf-targets").glob("*.toml"))
          evaluators=sorted(path.stem for path in Path("config/evaluators").glob("*.toml"))
          if not targets or not evaluators:
              raise SystemExit("HF targets and evaluator capabilities are required")
          print(f"ASR runtime catalog: {runtime_catalog.catalog_id} {runtime_catalog.sha256}")
          print("Runtime profile sets:")
          for profile_set_id, profile_set in sorted(runtime_catalog.profile_sets.items()):
              print(f"- {profile_set_id}: {dict(profile_set.variants)} default={profile_set.default_variant}")
          print("Configured HF targets:")
          for target in targets: print(f"- {target}")
          print("Configured evaluator capabilities:")
          for evaluator in evaluators: print(f"- {evaluator}")
          PY

  validate-selected:
    name: Validate selected HF configuration
    if: github.event_name == 'workflow_dispatch'
    needs: local-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_BUCKET: ""
      HF_MODEL_REPO: ""
      EXPECTED_DEVELOPMENT_REPO_ID: ""
      EXPECTED_UPSTREAM_REPO_ID: ""
      EXPECTED_TOKENIZER_REPO_ID: ""
      EXPECTED_FRAMEWORK: ""
      HF_PROFILE_SET: ""
      ASR_RUNTIME_VARIANT: ""
      EXPECTED_RUNTIME_PROFILE: ""
      EXPECTED_DECODER: ""
      HF_TARGET_ID: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable

      - name: Install locked target validation tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check uv
          uv lock --check
          uv sync --locked --extra hf --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/hf --version

      - name: Resolve selected HF Bucket and runtime variant
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${HF_TARGETS_JSON:-}" ]] || {
            echo "::error::HF_TARGETS_JSON repository variable is required for Bucket selection."
            exit 1
          }
          ARGS=(
            --bucket "${{ inputs.hf_bucket }}"
            --targets-json "${HF_TARGETS_JSON}"
            --github-env "${GITHUB_ENV}"
          )
          if [[ -n "${{ inputs.runtime_variant }}" ]]; then
            ARGS+=(--runtime-variant "${{ inputs.runtime_variant }}")
          fi
          cargo run --quiet --locked -p asr-hf -- resolve-target "${ARGS[@]}"

      - name: Validate GitHub HF configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${HF_TOKEN:-}" ]] || { echo "::error::HF_TOKEN secret is not configured."; exit 1; }
          [[ -n "${HF_BUCKET:-}" ]] || { echo "::error::HF_BUCKET could not be resolved."; exit 1; }
          [[ -n "${HF_MODEL_REPO:-}" ]] || { echo "::error::HF_MODEL_REPO could not be resolved."; exit 1; }
          echo "HF target: ${HF_TARGET_ID}"
          echo "HF Bucket: ${HF_BUCKET}"
          echo "HF Model Repo: ${HF_MODEL_REPO}"
          echo "Profile set: ${HF_PROFILE_SET}"
          echo "Runtime variant: ${ASR_RUNTIME_VARIANT}"
          echo "Runtime profile: ${EXPECTED_RUNTIME_PROFILE}"

      - name: Fetch and validate current revision configuration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci/hf/config/revisions
          bash scripts/hf/hf-fetch-revisions.sh
          cat .ci/hf/config/resolved.json
          bash scripts/ci/validate-revisions.sh \
            --root .ci/hf/config/revisions \
            --expected-development-repo-id "${EXPECTED_DEVELOPMENT_REPO_ID}" \
            --expected-upstream-repo-id "${EXPECTED_UPSTREAM_REPO_ID}" \
            --expected-tokenizer-repo-id "${EXPECTED_TOKENIZER_REPO_ID}" \
            --expected-framework "${EXPECTED_FRAMEWORK}" \
            --expected-profile-set "${HF_PROFILE_SET}" \
            --runtime-variant "${ASR_RUNTIME_VARIANT}" \
            --expected-runtime-profile "${EXPECTED_RUNTIME_PROFILE}" \
            --expected-decoder "${EXPECTED_DECODER}"

      - name: Validate required HF Bucket layout
        shell: bash
        run: |
          set -euo pipefail
          BUCKET="hf://buckets/${HF_BUCKET}"
          hf buckets list "${BUCKET}/config/current.json" >/dev/null
          CONFIG_VERSION="$(cargo run --quiet --locked -p asr-contracts --bin asr-contracts -- config-version .ci/hf/config/resolved.json)"
          for file in reference.json evaluation-schema.json datasets-lock.json runtime.json; do
            hf buckets list "${BUCKET}/config/versions/${CONFIG_VERSION}/${file}" >/dev/null
          done
          for dir in benchmarks runs candidates experiments reference scripts tmp; do
            echo "Checking ${BUCKET}/${dir}/"
            hf buckets list "${BUCKET}/${dir}" >/dev/null
          done
