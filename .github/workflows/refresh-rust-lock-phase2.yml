name: Refresh Rust Lock Phase2

on:
  push:
    branches: [agent/rust-contracts-phase2]
    paths:
      - "Cargo.toml"
      - "rust/crates/asr-contracts/**"
      - ".github/workflows/refresh-rust-lock-phase2.yml"

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/rust-contracts-phase2
      - uses: dtolnay/rust-toolchain@stable
      - name: Refresh Cargo.lock
        run: cargo generate-lockfile
      - name: Commit lockfile if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "Refresh Cargo.lock for asr-contracts"
          git push origin HEAD:agent/rust-contracts-phase2
