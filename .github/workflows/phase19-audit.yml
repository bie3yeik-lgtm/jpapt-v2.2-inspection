name: Phase19 Audit

on:
  push:
    branches: [agent/rust-evaluator-policy-phase19]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Audit evaluator capability boundary
        shell: bash
        run: |
          set -euo pipefail
          echo '=== validate-evaluator-capability.py callers ==='
          git grep -n 'validate-evaluator-capability.py' || true
          echo '=== candidate-contract.json references ==='
          git grep -n 'candidate-contract.json' || true
          echo '=== resolve-candidate-artifacts references ==='
          git grep -n 'resolve-candidate-artifacts.py' || true
