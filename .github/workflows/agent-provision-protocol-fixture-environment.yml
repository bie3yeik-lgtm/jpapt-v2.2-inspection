name: Agent Provision Protocol Fixture With Environment

on:
  push:
    branches:
      - docs/current-premiere-integration-spec-20260819

permissions:
  contents: read
  issues: write

jobs:
  provision:
    environment: Private-Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_REPO_TOKEN: ${{ secrets.TARGET_REPO_TOKEN }}
      FIXTURE_REPOSITORY: bie3yeik-lgtm/jpapt-protocol-e2e-source
    steps:
      - name: Provision private dedicated fixture
        id: fixture
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ env.TARGET_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo 'reason=target-repo-token-not-injected' >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo 'token_injected=true' >> "$GITHUB_OUTPUT"

          if gh api "/repos/$FIXTURE_REPOSITORY" >/tmp/fixture.json 2>/tmp/get.err; then
            echo 'created=false' >> "$GITHUB_OUTPUT"
          else
            owner="${FIXTURE_REPOSITORY%%/*}"
            name="${FIXTURE_REPOSITORY#*/}"
            [[ "$owner" == bie3yeik-lgtm ]] || {
              echo 'reason=fixture-owner-mismatch' >> "$GITHUB_OUTPUT"
              exit 1
            }
            if ! gh api --method POST /user/repos \
              -f name="$name" \
              -f description='Dedicated JPAPT candidate protocol cross-repository E2E fixture' \
              -F private=true \
              -F auto_init=true \
              >/tmp/fixture.json 2>/tmp/create.err; then
              code="$(grep -oE 'HTTP [0-9]{3}' /tmp/create.err | tail -1 | awk '{print $2}' || true)"
              message="$(tail -n 1 /tmp/create.err | sed 's/[`$]/_/g' | cut -c1-240)"
              echo "reason=create-repository-http-${code:-unknown}" >> "$GITHUB_OUTPUT"
              echo "detail=$message" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            echo 'created=true' >> "$GITHUB_OUTPUT"
          fi

          actual="$(jq -r .full_name /tmp/fixture.json)"
          private="$(jq -r .private /tmp/fixture.json)"
          default_branch="$(jq -r .default_branch /tmp/fixture.json)"
          [[ "$actual" == "$FIXTURE_REPOSITORY" ]] || {
            echo 'reason=unexpected-repository-identity' >> "$GITHUB_OUTPUT"
            exit 1
          }
          [[ "$private" == true ]] || {
            echo 'reason=fixture-not-private' >> "$GITHUB_OUTPUT"
            exit 1
          }
          [[ -n "$default_branch" && "$default_branch" != null ]] || {
            echo 'reason=default-branch-unavailable' >> "$GITHUB_OUTPUT"
            exit 1
          }
          echo "default_branch=$default_branch" >> "$GITHUB_OUTPUT"
          echo 'reason=success' >> "$GITHUB_OUTPUT"

      - name: Record result on issue 70
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.fixture.outcome }}
          TOKEN_INJECTED: ${{ steps.fixture.outputs.token_injected }}
          CREATED: ${{ steps.fixture.outputs.created }}
          DEFAULT_BRANCH: ${{ steps.fixture.outputs.default_branch }}
          REASON: ${{ steps.fixture.outputs.reason }}
          DETAIL: ${{ steps.fixture.outputs.detail }}
        run: |
          set -euo pipefail
          body=$(cat <<EOF
          TARGET_REPO_TOKEN dedicated fixture provisioning attempt after PAT permission update.

          - environment: \`Private-Secrets\`
          - repository: \`$FIXTURE_REPOSITORY\`
          - workflow run: \`$GITHUB_RUN_ID\`
          - source head: \`$GITHUB_SHA\`
          - outcome: \`$OUTCOME\`
          - token injected: \`${TOKEN_INJECTED:-unknown}\`
          - reason: \`${REASON:-unspecified}\`
          - created in this run: \`${CREATED:-unknown}\`
          - default branch: \`${DEFAULT_BRANCH:-unknown}\`
          - API detail: \`${DETAIL:-none}\`

          This step only attempts creation/readback of the dedicated private fixture repository. It does not bootstrap receiver files, configure repository secrets/variables, dispatch protocol events, mutate HF Buckets, run model inference, GPU, Docker evaluation, or HF Jobs.
          EOF
          )
          gh issue comment 70 --repo "$GITHUB_REPOSITORY" --body "$body"

      - name: Fail if provisioning did not succeed
        if: steps.fixture.outcome != 'success'
        shell: bash
        run: exit 1
