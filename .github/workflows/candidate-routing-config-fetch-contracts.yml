name: Candidate Routing Config Fetch Contracts

on:
  pull_request:
    paths:
      - .github/workflows/candidate-routing-config-fetch-contracts.yml

permissions:
  contents: read

jobs:
  base_image_digest_review:
    if: ${{ github.head_ref == 'agent/base-image-digest-review-20260820' }}
    name: Resolve reviewed package base image digest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve Docker Hub manifest-list digest read-only
        id: digest
        shell: bash
        run: |
          set -euo pipefail
          image='python:3.12-slim'
          inspect="$(docker buildx imagetools inspect "$image")"
          printf '%s\n' "$inspect"
          digest="$(printf '%s\n' "$inspect" | awk '/^Digest:/ {print $2; exit}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::unable to resolve canonical digest for $image: $digest"
            exit 1
          }
          pinned="python@${digest}"
          mkdir -p base-image-review
          jq -n \
            --arg source_tag "$image" \
            --arg manifest_digest "$digest" \
            --arg pinned_reference "$pinned" \
            --arg resolved_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schema_version:1,registry:"docker.io",source_tag:$source_tag,manifest_digest:$manifest_digest,pinned_reference:$pinned_reference,resolved_at:$resolved_at,lookup:"docker buildx imagetools inspect",build_started:false,pull_started:false}' \
            > base-image-review/python-3.12-slim.json
          jq -e '.build_started == false and .pull_started == false' base-image-review/python-3.12-slim.json >/dev/null
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"

      - name: Verify pinned reference resolves to identical digest
        shell: bash
        env:
          PINNED: ${{ steps.digest.outputs.pinned }}
          EXPECTED: ${{ steps.digest.outputs.digest }}
        run: |
          set -euo pipefail
          inspect="$(docker buildx imagetools inspect "$PINNED")"
          digest="$(printf '%s\n' "$inspect" | awk '/^Digest:/ {print $2; exit}')"
          [[ "$digest" == "$EXPECTED" ]] || {
            echo "::error::pinned reference digest mismatch: expected=$EXPECTED actual=$digest"
            exit 1
          }

      - uses: actions/upload-artifact@v7
        with:
          name: reviewed-package-base-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: base-image-review/
          if-no-files-found: error
          retention-days: 30
