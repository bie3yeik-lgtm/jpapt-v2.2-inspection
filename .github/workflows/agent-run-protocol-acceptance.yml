name: Agent Run Protocol Acceptance

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  drive:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'docs/current-premiere-integration-spec-20260819' }}
    environment: Private-Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_REF: docs/current-premiere-integration-spec-20260819
      SOURCE_REPOSITORY: largoyo/Premiere-AutoProcess-Plugin
      RECEIPT_REPOSITORY: bie3yeik-lgtm/jpapt-protocol-e2e-source
      HF_BUCKET: gawohok7/tf-v2.2-onnx-dev-bucket
    steps:
      - uses: actions/checkout@v7
        with:
          ref: docs/current-premiere-integration-spec-20260819
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Sync canonical managed receiver bundle to fixture
        id: sync
        env:
          GH_TOKEN: ${{ secrets.TARGET_REPO_TOKEN }}
          TARGET_REPOSITORY: bie3yeik-lgtm/jpapt-protocol-e2e-source
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${GH_TOKEN:-}" ]] || { echo '::error::TARGET_REPO_TOKEN missing'; exit 1; }
          python scripts/ci/candidate_receiver_bundle.py --validate

          default_branch="$(gh api "/repos/$TARGET_REPOSITORY" --jq .default_branch)"
          head_sha="$(gh api "/repos/$TARGET_REPOSITORY/git/ref/heads/$default_branch" --jq .object.sha)"
          base_tree="$(gh api "/repos/$TARGET_REPOSITORY/git/commits/$head_sha" --jq .tree.sha)"

          export RECEIVER_REPOSITORY="$TARGET_REPOSITORY"
          export ORCHESTRATOR_REPOSITORY="$GITHUB_REPOSITORY"
          export ORCHESTRATOR_COMMIT_SHA="$GITHUB_SHA"
          file_args=()
          while IFS= read -r mapping; do
            file_args+=(--file "$mapping")
          done < <(python scripts/ci/candidate_receiver_bundle.py --mappings)
          python scripts/ci/build-candidate-receiver-installation.py \
            --output /tmp/candidate-receiver.json \
            "${file_args[@]}"
          python scripts/ci/build-candidate-receiver-installation.py --validate /tmp/candidate-receiver.json
          python scripts/ci/candidate_receiver_bundle.py --assert-installation /tmp/candidate-receiver.json

          entries='[]'
          add_blob() {
            local target="$1" source="$2" content body blob_sha
            content="$(base64 -w0 "$source")"
            body="$(jq -n --arg content "$content" '{content:$content,encoding:"base64"}')"
            blob_sha="$(gh api --method POST "/repos/$TARGET_REPOSITORY/git/blobs" --input - <<<"$body" --jq .sha)"
            entries="$(jq --arg path "$target" --arg sha "$blob_sha" '. + [{path:$path,mode:"100644",type:"blob",sha:$sha}]' <<<"$entries")"
          }
          while IFS=$'\t' read -r target source; do
            add_blob "$target" "$source"
          done < <(python scripts/ci/candidate_receiver_bundle.py --tsv)
          add_blob .jpapt/candidate-receiver.json /tmp/candidate-receiver.json

          tree_body="$(jq -n --arg base_tree "$base_tree" --argjson tree "$entries" '{base_tree:$base_tree,tree:$tree}')"
          tree_sha="$(gh api --method POST "/repos/$TARGET_REPOSITORY/git/trees" --input - <<<"$tree_body" --jq .sha)"
          commit_body="$(jq -n --arg message 'ci: sync jpapt candidate protocol receiver' --arg tree "$tree_sha" --arg parent "$head_sha" '{message:$message,tree:$tree,parents:[$parent]}')"
          commit_sha="$(gh api --method POST "/repos/$TARGET_REPOSITORY/git/commits" --input - <<<"$commit_body" --jq .sha)"
          ref_body="$(jq -n --arg sha "$commit_sha" '{sha:$sha,force:false}')"
          gh api --method PATCH "/repos/$TARGET_REPOSITORY/git/refs/heads/$default_branch" --input - <<<"$ref_body" >/dev/null
          echo "fixture_commit=$commit_sha" >> "$GITHUB_OUTPUT"

      - name: Dispatch and await readiness
        id: readiness
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          workflow=candidate-protocol-readiness.yml
          before_id="$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?branch=$TARGET_REF&event=workflow_dispatch&per_page=1" --jq '.workflow_runs[0].id // 0')"
          jq -n --arg ref "$TARGET_REF" --arg receipt "$RECEIPT_REPOSITORY" --arg bucket "$HF_BUCKET" \
            '{ref:$ref,inputs:{receipt_repository:$receipt,hf_bucket:$bucket,require_managed_installation:"true"}}' >/tmp/readiness.json
          gh api --method POST "/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/dispatches" --input /tmp/readiness.json
          run_id=""
          for _ in $(seq 1 30); do
            candidate="$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?branch=$TARGET_REF&event=workflow_dispatch&per_page=10" --jq '.workflow_runs[0].id // empty')"
            if [[ -n "$candidate" && "$candidate" -gt "$before_id" ]]; then run_id="$candidate"; break; fi
            sleep 2
          done
          [[ -n "$run_id" ]] || { echo "::error::new readiness run not found"; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          for _ in $(seq 1 120); do
            read -r status conclusion < <(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '[.status, (.conclusion // "")] | @tsv')
            if [[ "$status" == completed ]]; then
              [[ "$conclusion" == success ]] || { echo "::error::readiness failed: run=$run_id conclusion=$conclusion"; exit 1; }
              exit 0
            fi
            sleep 5
          done
          echo "::error::readiness timed out: run=$run_id"; exit 1

      - name: Dispatch and await zero-compute E2E
        id: e2e
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          workflow=candidate-protocol-e2e.yml
          before_id="$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?branch=$TARGET_REF&event=workflow_dispatch&per_page=1" --jq '.workflow_runs[0].id // 0')"
          jq -n --arg ref "$TARGET_REF" --arg source "$SOURCE_REPOSITORY" --arg receipt "$RECEIPT_REPOSITORY" --arg bucket "$HF_BUCKET" \
            '{ref:$ref,inputs:{receipt_repository:$receipt,hf_bucket:$bucket,source_repository:$source,timeout_seconds:"600"}}' >/tmp/e2e.json
          gh api --method POST "/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/dispatches" --input /tmp/e2e.json
          run_id=""
          for _ in $(seq 1 30); do
            candidate="$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?branch=$TARGET_REF&event=workflow_dispatch&per_page=10" --jq '.workflow_runs[0].id // empty')"
            if [[ -n "$candidate" && "$candidate" -gt "$before_id" ]]; then run_id="$candidate"; break; fi
            sleep 2
          done
          [[ -n "$run_id" ]] || { echo "::error::new E2E run not found"; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          for _ in $(seq 1 180); do
            read -r status conclusion < <(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '[.status, (.conclusion // "")] | @tsv')
            if [[ "$status" == completed ]]; then
              [[ "$conclusion" == success ]] || { echo "::error::E2E failed: run=$run_id conclusion=$conclusion"; exit 1; }
              exit 0
            fi
            sleep 5
          done
          echo "::error::E2E timed out: run=$run_id"; exit 1

      - name: Record acceptance evidence
        env:
          GH_TOKEN: ${{ github.token }}
          FIXTURE_COMMIT: ${{ steps.sync.outputs.fixture_commit }}
          READINESS_RUN: ${{ steps.readiness.outputs.run_id }}
          E2E_RUN: ${{ steps.e2e.outputs.run_id }}
        shell: bash
        run: |
          gh issue comment 70 --repo "$GITHUB_REPOSITORY" --body "External protocol positive-path acceptance succeeded after transport-envelope repair.\n\n- source: \`$SOURCE_REPOSITORY\`\n- receiver fixture: \`$RECEIPT_REPOSITORY\`\n- fixture managed commit: \`$FIXTURE_COMMIT\`\n- HF Bucket: \`$HF_BUCKET\`\n- readiness run: \`$READINESS_RUN\`\n- zero-compute E2E run: \`$E2E_RUN\`\n- orchestrator ref: \`$TARGET_REF\`\n- compute: \`dry_run=true\`; no model inference, GPU, Docker evaluation, or HF Jobs workload was launched by this acceptance driver."
