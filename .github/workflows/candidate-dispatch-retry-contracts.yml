name: Candidate Dispatch Retry Contracts

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/candidate-dispatch-retry-contracts.yml
      - .github/workflows/candidate-package-evaluate-v2.yml
      - .github/workflows/candidate-request-gateway.yml
      - scripts/ci/repository-dispatch-with-retry.sh
      - rust/crates/asr-contracts/**
      - Cargo.toml
      - Cargo.lock
  pull_request:
    paths:
      - .github/workflows/candidate-dispatch-retry-contracts.yml
      - .github/workflows/candidate-package-evaluate-v2.yml
      - .github/workflows/candidate-request-gateway.yml
      - scripts/ci/repository-dispatch-with-retry.sh
      - rust/crates/asr-contracts/**
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-dispatch-retry-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Validate bounded repository dispatch retries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate retry helper syntax and integration
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/ci/repository-dispatch-with-retry.sh
          grep -F 'repository-dispatch-with-retry.sh' .github/workflows/candidate-package-evaluate-v2.yml
          grep -F 'candidate-completion-dispatch.json' .github/workflows/candidate-package-evaluate-v2.yml
          grep -F 'repository-dispatch-with-retry.sh' .github/workflows/candidate-request-gateway.yml
          grep -F 'receipt-validate "$payload_file"' scripts/ci/repository-dispatch-with-retry.sh
          grep -F 'rejection-validate "$payload_file"' scripts/ci/repository-dispatch-with-retry.sh
      - name: Prepare fake GitHub CLI and sleep
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fake-bin
          cat > /tmp/fake-bin/gh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          count_file="${FAKE_GH_COUNT_FILE:?}"
          count=0
          [[ ! -f "$count_file" ]] || count="$(cat "$count_file")"
          count=$((count + 1))
          printf '%s\n' "$count" > "$count_file"
          expected_repo="${FAKE_GH_EXPECT_REPOSITORY:-owner/receiver}"
          expected_input="${FAKE_GH_EXPECT_INPUT:-/tmp/dispatch.json}"
          [[ "$*" == *"/repos/$expected_repo/dispatches"* ]] || exit 42
          [[ "$*" == *"--input $expected_input"* ]] || exit 43
          succeed_at="${FAKE_GH_SUCCEED_AT:-1}"
          (( count >= succeed_at ))
          SH
          cat > /tmp/fake-bin/sleep <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          printf '%s\n' "${1:-}" >> "${FAKE_SLEEP_LOG:?}"
          SH
          chmod +x /tmp/fake-bin/gh /tmp/fake-bin/sleep
          cat > /tmp/dispatch.json <<'JSON'
          {"event_type":"jpapt.contract-test","client_payload":{"request_id":"retry-001"}}
          JSON
      - name: Retry until a later attempt succeeds
        shell: bash
        env:
          GH_TOKEN: test-token
          FAKE_GH_COUNT_FILE: /tmp/gh-count-success
          FAKE_GH_SUCCEED_AT: "3"
          FAKE_SLEEP_LOG: /tmp/sleep-success
        run: |
          set -euo pipefail
          PATH="/tmp/fake-bin:$PATH" bash scripts/ci/repository-dispatch-with-retry.sh \
            owner/receiver /tmp/dispatch.json 4
          test "$(cat /tmp/gh-count-success)" = 3
          test "$(wc -l < /tmp/sleep-success)" = 2
          test "$(sed -n '1p' /tmp/sleep-success)" = 2
          test "$(sed -n '2p' /tmp/sleep-success)" = 5
      - name: Stop exactly at max attempts
        shell: bash
        env:
          GH_TOKEN: test-token
          FAKE_GH_COUNT_FILE: /tmp/gh-count-fail
          FAKE_GH_SUCCEED_AT: "99"
          FAKE_SLEEP_LOG: /tmp/sleep-fail
        run: |
          set -euo pipefail
          if PATH="/tmp/fake-bin:$PATH" bash scripts/ci/repository-dispatch-with-retry.sh \
            owner/receiver /tmp/dispatch.json 2; then
            echo 'dispatch unexpectedly succeeded' >&2
            exit 1
          fi
          test "$(cat /tmp/gh-count-fail)" = 2
          test "$(wc -l < /tmp/sleep-fail)" = 1
      - name: Reject invalid invocation before dispatch
        shell: bash
        env:
          GH_TOKEN: test-token
          FAKE_GH_COUNT_FILE: /tmp/gh-count-invalid
          FAKE_GH_SUCCEED_AT: "1"
          FAKE_SLEEP_LOG: /tmp/sleep-invalid
        run: |
          set -euo pipefail
          set +e
          PATH="/tmp/fake-bin:$PATH" bash scripts/ci/repository-dispatch-with-retry.sh \
            invalid-repository /tmp/dispatch.json 3
          status=$?
          set -e
          test "$status" = 2
          test ! -e /tmp/gh-count-invalid
      - name: Reject dot-segment repository targets before dispatch
        shell: bash
        env:
          GH_TOKEN: test-token
          FAKE_GH_COUNT_FILE: /tmp/gh-count-dot-segment
          FAKE_GH_SUCCEED_AT: "1"
          FAKE_SLEEP_LOG: /tmp/sleep-dot-segment
        run: |
          set -euo pipefail
          for repository in ./repo ../repo owner/. owner/..; do
            set +e
            PATH="/tmp/fake-bin:$PATH" bash scripts/ci/repository-dispatch-with-retry.sh \
              "$repository" /tmp/dispatch.json 3
            status=$?
            set -e
            test "$status" = 2
          done
          test ! -e /tmp/gh-count-dot-segment
      - name: Reject malformed dispatch body before dispatch
        shell: bash
        env:
          GH_TOKEN: test-token
        run: |
          set -euo pipefail
          cat > /tmp/fake-bin/gh <<'SH'
          #!/usr/bin/env bash
          echo 'gh must not be called for invalid repository dispatch body' >&2
          exit 99
          SH
          chmod +x /tmp/fake-bin/gh

          printf '{broken\n' > /tmp/invalid-json.json
          printf '{"client_payload":{}}\n' > /tmp/missing-event.json
          printf '{"event_type":"","client_payload":{}}\n' > /tmp/empty-event.json
          printf '{"event_type":"jpapt.test","client_payload":[]}\n' > /tmp/bad-payload.json
          python - <<'PY' > /tmp/long-event.json
          import json
          print(json.dumps({"event_type": "x" * 101, "client_payload": {}}))
          PY

          for body in /tmp/invalid-json.json /tmp/missing-event.json /tmp/empty-event.json /tmp/bad-payload.json /tmp/long-event.json; do
            if PATH="/tmp/fake-bin:$PATH" GH_TOKEN=test-token \
              bash scripts/ci/repository-dispatch-with-retry.sh owner/receiver "$body" 3; then
              echo "invalid repository dispatch body unexpectedly succeeded: $body" >&2
              exit 1
            fi
          done
      - name: Validate completion receipt before network dispatch
        shell: bash
        env:
          REQUEST_ID: dispatch-authority-001
          REQUEST_EXECUTION_ID: eval-9301-1
          SOURCE_REPOSITORY: owner/source
          RECEIPT_REPOSITORY: owner/receiver
          HF_BUCKET: owner/source-bucket
          DRY_RUN: "true"
          SUITE: probe
          EXECUTOR: github
          ENVIRONMENT: linux-cpu
          PROVIDER: CPUExecutionProvider
          ORCHESTRATOR_REPOSITORY: owner/orchestrator
          RUN_ID: "9301"
          RUN_ATTEMPT: "1"
          RUN_URL: https://github.com/owner/orchestrator/actions/runs/9301
          COMMIT_SHA: "0000000000000000000000000000000000000000"
          REQUESTED_CANDIDATE_ID: latest
          BUILD_RESULT: skipped
          CPU_RESULT: skipped
          CUDA_RESULT: skipped
          COREML_RESULT: skipped
          DIRECTML_RESULT: skipped
          HF_JOBS_RESULT: skipped
          COMPLETED_AT: 2026-08-19T03:30:00Z
          GH_TOKEN: test-token
          FAKE_GH_COUNT_FILE: /tmp/gh-count-completion
          FAKE_GH_SUCCEED_AT: "1"
          FAKE_GH_EXPECT_REPOSITORY: owner/receiver
          FAKE_GH_EXPECT_INPUT: /tmp/completion-dispatch.json
        run: |
          set -euo pipefail
          cat > /tmp/fake-bin/gh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          count_file="${FAKE_GH_COUNT_FILE:?}"
          count=0
          [[ ! -f "$count_file" ]] || count="$(cat "$count_file")"
          count=$((count + 1))
          printf '%s\n' "$count" > "$count_file"
          [[ "$*" == *"/repos/${FAKE_GH_EXPECT_REPOSITORY}/dispatches"* ]] || exit 42
          [[ "$*" == *"--input ${FAKE_GH_EXPECT_INPUT}"* ]] || exit 43
          SH
          chmod +x /tmp/fake-bin/gh
          cargo run --quiet --locked -p asr-contracts --bin asr-candidate-protocol-build -- \
            receipt \
            --receipt /tmp/completion-receipt.json \
            --dispatch-body /tmp/completion-dispatch.json >/dev/null
          PATH="/tmp/fake-bin:$PATH" bash scripts/ci/repository-dispatch-with-retry.sh \
            owner/receiver /tmp/completion-dispatch.json 1
          test "$(cat /tmp/gh-count-completion)" = 1
      - name: Reject completion target mismatch before network dispatch
        shell: bash
        env:
          GH_TOKEN: test-token
          FAKE_GH_COUNT_FILE: /tmp/gh-count-completion-mismatch
        run: |
          set -euo pipefail
          rm -f /tmp/gh-count-completion-mismatch
          set +e
          PATH="/tmp/fake-bin:$PATH" bash scripts/ci/repository-dispatch-with-retry.sh \
            owner/other /tmp/completion-dispatch.json 1
          status=$?
          set -e
          test "$status" = 2
          test ! -e /tmp/gh-count-completion-mismatch
      - name: Reject invalid completion payload before network dispatch
        shell: bash
        env:
          GH_TOKEN: test-token
          FAKE_GH_COUNT_FILE: /tmp/gh-count-invalid-completion
        run: |
          set -euo pipefail
          cat > /tmp/invalid-completion-dispatch.json <<'JSON'
          {"event_type":"jpapt.candidate-completed","client_payload":{"receipt_repository":"owner/receiver"}}
          JSON
          rm -f /tmp/gh-count-invalid-completion
          set +e
          PATH="/tmp/fake-bin:$PATH" bash scripts/ci/repository-dispatch-with-retry.sh \
            owner/receiver /tmp/invalid-completion-dispatch.json 1
          status=$?
          set -e
          test "$status" != 0
          test ! -e /tmp/gh-count-invalid-completion
