name: Phase8 Format

on:
  push:
    branches: [agent/rust-hf-target-routing-phase8]
    paths:
      - ".github/workflows/phase8-format.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/rust-hf-target-routing-phase8
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/crates/asr-hf
          git commit -m "Format asr-hf routing tests"
          git push origin HEAD:agent/rust-hf-target-routing-phase8
