name: Phase7 Normalize

on:
  push:
    branches: [agent/rust-run-context-phase7-final]
    paths:
      - ".github/workflows/phase7-normalize.yml"

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/rust-run-context-phase7-final
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Refresh lockfile and format
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          cargo fmt --all
      - name: Commit normalized Rust state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock rust/crates/asr-contracts
          if git diff --cached --quiet; then
            echo "No normalization changes"
            exit 0
          fi
          git commit -m "Normalize Rust run context implementation"
          git push origin HEAD:agent/rust-run-context-phase7-final
