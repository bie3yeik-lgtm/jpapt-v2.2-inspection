name: Fixture Generation And Inspection Contracts

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fixture-generation-and-inspection.yml
      - .github/workflows/fixture-generation-and-inspection-contracts.yml
      - scripts/ci/build-fixture-generation-receipt.sh
      - scripts/ci/bind-fixture-completion-receipt.py
      - scripts/ci/wait-candidate-lifecycle.sh
      - evaluation/schemas/fixture-generation-receipt.schema.json
      - evaluation/schemas/fixture-completion-binding.schema.json
      - scripts/ci/build-fixture-completion-binding.py
      - python/tests/unit/test_fixture_generation_receipt_schema.py
      - python/tests/unit/test_bind_fixture_completion_receipt.py
  pull_request:
    paths:
      - .github/workflows/fixture-generation-and-inspection.yml
      - .github/workflows/fixture-generation-and-inspection-contracts.yml
      - scripts/ci/build-fixture-generation-receipt.sh
      - scripts/ci/bind-fixture-completion-receipt.py
      - scripts/ci/wait-candidate-lifecycle.sh
      - evaluation/schemas/fixture-generation-receipt.schema.json
      - evaluation/schemas/fixture-completion-binding.schema.json
      - scripts/ci/build-fixture-completion-binding.py
      - python/tests/unit/test_fixture_generation_receipt_schema.py
      - python/tests/unit/test_bind_fixture_completion_receipt.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Validate fixture generation receipt and dispatch contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check jsonschema pytest

      - name: Validate helper, schema, and dispatch registration
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/ci/build-fixture-generation-receipt.sh
          bash -n scripts/ci/wait-candidate-lifecycle.sh
          python -m py_compile scripts/ci/bind-fixture-completion-receipt.py
          pytest -q --confcutdir=python/tests/unit \
            python/tests/unit/test_fixture_generation_receipt_schema.py \
            python/tests/unit/test_bind_fixture_completion_receipt.py
          cargo run --quiet --locked -p asr-contracts --bin asr-workflow-dispatch -- describe fixture-generation-and-inspection

      - name: Accept plan-only receipt without execute
        shell: bash
        run: |
          set -euo pipefail
          sha="$(printf 'f%.0s' {1..40})"
          bash scripts/ci/build-fixture-generation-receipt.sh \
            gen-001 "$sha" gawohok7/example-bucket /tmp/fixture-plan.json true false
          jq -e '.status == "planned" and .execute == false and .generation_id != .inspection_id' \
            /tmp/fixture-plan.json >/dev/null

      - name: Reject execute with dry_run true
        shell: bash
        run: |
          set -euo pipefail
          sha="$(printf 'a%.0s' {1..40})"
          if bash scripts/ci/build-fixture-generation-receipt.sh \
            gen-002 "$sha" gawohok7/example-bucket /tmp/fixture-bad.json true true; then
            echo 'execute=true with dry_run=true unexpectedly accepted' >&2
            exit 1
          fi

      - name: Require evaluator dispatch on reviewed execute
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'candidate-request-gateway.yml' .github/workflows/fixture-generation-and-inspection.yml
          grep -F 'bind-fixture-completion-receipt.py' .github/workflows/fixture-generation-and-inspection.yml
          if grep -F 'HF Jobs dispatch remains a separate reviewed action' \
            .github/workflows/fixture-generation-and-inspection.yml; then
            echo 'fixture execute still treats HF Jobs as a separate gate' >&2
            exit 1
          fi
