name: Phase9 Clippy Fix

on:
  push:
    branches:
      - agent/rust-hf-allocation-phase9
    paths:
      - scripts/ci/phase9-structure-readme.py
      - .github/workflows/phase9-clippy-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/rust-hf-allocation-phase9
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Apply refactor
        run: python scripts/ci/phase9-structure-readme.py
      - name: Validate
        run: |
          cargo fmt --all
          cargo clippy --locked -p asr-hf --all-targets -- -D warnings
          cargo test --locked -p asr-hf
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/crates/asr-hf
          git commit -m "Structure allocation README input"
          git push origin HEAD:agent/rust-hf-allocation-phase9
