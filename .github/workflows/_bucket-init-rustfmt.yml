name: Bucket Init Rustfmt Bootstrap

on:
  push:
    branches: [agent/hf-bucket-init]
    paths:
      - ".github/workflows/_bucket-init-rustfmt.yml"
      - "rust/crates/asr-eval/src/bucket_init.rs"
      - "rust/crates/asr-eval/src/cli.rs"
      - "rust/crates/asr-eval/src/lib.rs"
      - "rust/crates/asr-eval/src/main.rs"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/hf-bucket-init
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply canonical Rust formatting
        shell: bash
        run: cargo fmt --all
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No rustfmt changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/crates/asr-eval/src
          git commit -m "Apply canonical rustfmt to bucket initializer"
          git push origin HEAD:agent/hf-bucket-init
