name: Apply Receiver Token Role With TARGET PAT

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  apply:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'docs/current-premiere-integration-spec-20260819' }}
    environment: Private-Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: docs/current-premiere-integration-spec-20260819
          token: ${{ secrets.TARGET_REPO_TOKEN }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply migration and push
        env:
          GH_TOKEN: ${{ secrets.TARGET_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo '::error::TARGET_REPO_TOKEN missing'; exit 1; }
          gh api "/repos/$GITHUB_REPOSITORY" --jq .full_name
          python scripts/ci/apply-receiver-token-role.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/candidate-package-evaluate-v2.yml \
                  .github/workflows/candidate-protocol-readiness.yml \
                  .github/workflows/candidate-protocol-e2e.yml \
                  .github/workflows/candidate-receiver-bootstrap.yml \
                  .github/workflows/candidate-completion-reconcile.yml
          if git diff --cached --quiet; then
            echo 'No migration changes required.'
            exit 0
          fi
          git commit -m 'fix(ci): split source and receiver repository tokens'
          git push origin HEAD:docs/current-premiere-integration-spec-20260819
