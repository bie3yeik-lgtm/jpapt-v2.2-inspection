name: Resolve Cargo Lock

on:
  push:
    branches:
      - agent/rust-hf-destructive-optimization
    paths:
      - ".github/workflows/resolve-cargo-lock.yml"
      - "Cargo.toml"
      - "rust/crates/**/Cargo.toml"

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/rust-hf-destructive-optimization
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate authoritative lockfile
        shell: bash
        run: |
          set -euo pipefail
          rm -f Cargo.lock
          cargo generate-lockfile
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
      - name: Commit lockfile
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          if git diff --cached --quiet; then
            echo "Cargo.lock is already authoritative."
            exit 0
          fi
          git commit -m "Resolve authoritative Cargo lockfile"
          git push origin HEAD:agent/rust-hf-destructive-optimization
