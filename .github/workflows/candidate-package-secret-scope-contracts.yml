name: Candidate package secret scope contracts

on:
  pull_request:
    paths:
      - ".github/workflows/candidate-package-evaluate-v2.yml"
      - ".github/workflows/candidate-package-secret-scope-contracts.yml"
      - "scripts/ci/check-candidate-package-secret-scope.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check candidate package credential scope
        run: python scripts/ci/check-candidate-package-secret-scope.py
