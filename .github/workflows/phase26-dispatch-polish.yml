name: Phase 26 Dispatch Polish

on:
  workflow_dispatch:
  push:
    branches: [agent/ghcr-ci-phase25]
    paths:
      - ".github/workflows/phase26-dispatch-polish.yml"

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/ghcr-ci-phase25
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Extend dispatch resolver and validate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("rust/crates/asr-contracts/src/bin/asr-workflow-dispatch.rs")
          text = path.read_text()

          replacements = [
              (
                  '''struct InputSpec {\n    required: bool,\n    #[serde(rename = "type")]\n    kind: String,''',
                  '''struct InputSpec {\n    required: bool,\n    #[serde(skip_serializing_if = "Option::is_none")]\n    description: Option<String>,\n    #[serde(rename = "type")]\n    kind: String,'''
              ),
              (
                  '''    let raw: Value = serde_json::from_str(&inputs_json)\n        .map_err(|error| format!("--inputs-json is invalid JSON: {error}"))?;''',
                  '''    if inputs_json.len() > 65_535 {\n        return Err("--inputs-json exceeds GitHub workflow_dispatch's 65,535 character limit".to_owned());\n    }\n    let raw: Value = serde_json::from_str(&inputs_json)\n        .map_err(|error| format!("--inputs-json is invalid JSON: {error}"))?;'''
              ),
              (
                  '''        "string" | "" => {\n            if !value.is_string() {\n                return Err(format!("{workflow} input {name:?} must be string"));\n            }\n        }''',
                  '''        "number" => {\n            if !value.is_number() {\n                return Err(format!("{workflow} input {name:?} must be number"));\n            }\n        }\n        "environment" | "string" | "" => {\n            if !value.is_string() {\n                return Err(format!("{workflow} input {name:?} must be string"));\n            }\n        }'''
              ),
              (
                  '''        .filter(|path| path.extension().and_then(|value| value.to_str()) == Some("yml"))''',
                  '''        .filter(|path| {\n            matches!(\n                path.extension().and_then(|value| value.to_str()),\n                Some("yml" | "yaml")\n            )\n        })'''
              ),
              (
                  '''    let alias = file.strip_suffix(".yml").unwrap_or(&file).to_owned();''',
                  '''    let alias = file\n        .strip_suffix(".yaml")\n        .or_else(|| file.strip_suffix(".yml"))\n        .unwrap_or(&file)\n        .to_owned();'''
              ),
              (
                  '''    let mut spec = InputSpec {\n        kind: "string".to_owned(),\n        ..InputSpec::default()\n    };''',
                  '''    let mut spec = InputSpec {\n        kind: "string".to_owned(),\n        ..InputSpec::default()\n    };'''
              ),
              (
                  '''            "description" => {}''',
                  '''            "description" => spec.description = Some(unquote(raw))'''
              ),
              (
                  '''        for (name, spec) in &workflow.inputs {''',
                  '''        if workflow.inputs.len() > 25 {\n            errors.push(format!(\n                "{} has {} workflow_dispatch inputs; GitHub allows at most 25",\n                workflow.file,\n                workflow.inputs.len()\n            ));\n        }\n        for (name, spec) in &workflow.inputs {'''
              ),
              (
                  '''fn parse_scalar(raw: &str) -> Value {\n    let text = unquote(raw);\n    match text.as_str() {\n        "true" => Value::Bool(true),\n        "false" => Value::Bool(false),\n        _ => Value::String(text),\n    }\n}''',
                  '''fn parse_scalar(raw: &str) -> Value {\n    let raw = raw.trim();\n    let quoted = raw.len() >= 2\n        && ((raw.starts_with('"') && raw.ends_with('"'))\n            || (raw.starts_with('\\'') && raw.ends_with('\\'')));\n    let text = unquote(raw);\n    if quoted {\n        return Value::String(text);\n    }\n    match text.as_str() {\n        "true" => Value::Bool(true),\n        "false" => Value::Bool(false),\n        _ => {\n            if let Ok(value) = text.parse::<i64>() {\n                Value::Number(value.into())\n            } else if let Ok(value) = text.parse::<u64>() {\n                Value::Number(value.into())\n            } else if let Ok(value) = text.parse::<f64>() {\n                serde_json::Number::from_f64(value)\n                    .map(Value::Number)\n                    .unwrap_or_else(|| Value::String(text))\n            } else {\n                Value::String(text)\n            }\n        }\n    }\n}'''
              ),
              (
                  '''        let spec = InputSpec {\n            required: false,\n            kind: "choice".to_owned(),''',
                  '''        let spec = InputSpec {\n            required: false,\n            description: Some("Evaluation suite".to_owned()),\n            kind: "choice".to_owned(),'''
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"expected source fragment not found:\n{old}")
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          cargo fmt --all
          cargo test --locked -p asr-contracts --bin asr-workflow-dispatch
          cargo run --quiet --locked -p asr-contracts --bin asr-workflow-dispatch -- validate
          cargo run --quiet --locked -p asr-contracts --bin asr-workflow-dispatch -- describe ghcr-evaluate > /tmp/ghcr.json
          jq -e '.inputs.evaluation.description | length > 0' /tmp/ghcr.json >/dev/null

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add rust/crates/asr-contracts/src/bin/asr-workflow-dispatch.rs
          git commit -m "Improve workflow dispatch introspection"
          git push origin HEAD:agent/ghcr-ci-phase25
