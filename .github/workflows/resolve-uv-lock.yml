name: Resolve UV Lock

on:
  push:
    branches:
      - agent/rust-hf-destructive-optimization
    paths:
      - ".github/workflows/resolve-uv-lock.yml"

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/rust-hf-destructive-optimization
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Resolve authoritative lockfile
        shell: bash
        run: |
          set -euo pipefail
          rm -f uv.lock
          uv lock --python 3.12
          uv lock --check
      - name: Commit lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          if git diff --cached --quiet; then
            echo "uv.lock is already authoritative."
            exit 0
          fi
          git commit -m "Resolve authoritative uv lockfile"
          git push origin HEAD:agent/rust-hf-destructive-optimization
