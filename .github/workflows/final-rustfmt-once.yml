name: Final Rustfmt Once

on:
  push:
    branches:
      - agent/final-ci-green
    paths:
      - ".github/workflows/final-rustfmt-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/final-ci-green
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format workspace
        run: cargo fmt --all
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Apply canonical rustfmt"
          git push origin HEAD:agent/final-ci-green
