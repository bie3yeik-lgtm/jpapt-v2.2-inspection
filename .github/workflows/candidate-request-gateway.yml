name: Candidate Request Gateway

on:
  repository_dispatch:
    types: [jpapt.candidate-request]
  workflow_dispatch:
    inputs:
      request_id:
        description: Optional caller correlation ID; generated when blank
        required: false
        default: ""
        type: string
      source_repository:
        description: Source GitHub repo owner/name
        required: true
        type: string
      receipt_repository:
        description: Completion receipt repo owner/name; blank = source repository
        required: false
        default: ""
        type: string
      hf_bucket:
        description: Optional namespace/bucket
        required: false
        default: ""
        type: string
      candidate_id:
        description: candidate-NNNNNN; blank = repository default/latest
        required: false
        default: ""
        type: string
      package_name:
        description: Optional GHCR package name
        required: false
        default: ""
        type: string
      dataset_source:
        description: auto, bucket, repository, or custom
        required: false
        default: auto
        type: choice
        options: [auto, bucket, repository, custom]
      dataset_id:
        description: HF dataset repo id for repository/custom
        required: false
        default: ""
        type: string
      suite:
        description: Validation suite
        required: false
        default: smoke
        type: choice
        options: [smoke, parity, probe]
      executor:
        description: Execution backend
        required: false
        default: github
        type: choice
        options: [github, hf_jobs]
      environment:
        description: Execution environment
        required: false
        default: linux-cpu
        type: choice
        options: [linux-cpu, linux-cuda, macos-coreml, windows-directml]
      hf_flavor:
        description: HF Jobs flavor
        required: false
        default: cpu-basic
        type: string
      hf_jobs_image:
        description: Optional image override that HF Jobs can pull
        required: false
        default: ""
        type: string
      dry_run:
        description: Dispatch V2 in resolve-and-estimate-only mode
        required: false
        default: false
        type: boolean
      execute:
        description: Dispatch Candidate Package Evaluate V2 after validation
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  HF_DEFAULT_NAMESPACE: ${{ vars.HF_DEFAULT_NAMESPACE }}

jobs:
  plan:
    name: Resolve and estimate request
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      body: ${{ steps.body.outputs.body }}
      execute: ${{ steps.inputs.outputs.execute }}
      request_id: ${{ steps.resolve.outputs.request_id }}
      request_execution_id: ${{ steps.resolve.outputs.request_execution_id }}
      request_key: ${{ steps.lifecycle.outputs.request_key }}
      source_repository: ${{ steps.resolve.outputs.source_repository }}
      receipt_repository: ${{ steps.resolve.outputs.receipt_repository }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install routing clients
        run: python -m pip install --disable-pip-version-check --upgrade "huggingface_hub>=1.0,<2" pyyaml
      - name: Normalize event inputs
        id: inputs
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          I_REQUEST_ID: ${{ inputs.request_id }}
          I_SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          I_RECEIPT_REPOSITORY: ${{ inputs.receipt_repository }}
          I_HF_BUCKET: ${{ inputs.hf_bucket }}
          I_CANDIDATE_ID: ${{ inputs.candidate_id }}
          I_PACKAGE_NAME: ${{ inputs.package_name }}
          I_DATASET_SOURCE: ${{ inputs.dataset_source }}
          I_DATASET_ID: ${{ inputs.dataset_id }}
          I_SUITE: ${{ inputs.suite }}
          I_EXECUTOR: ${{ inputs.executor }}
          I_ENVIRONMENT: ${{ inputs.environment }}
          I_HF_FLAVOR: ${{ inputs.hf_flavor }}
          I_HF_JOBS_IMAGE: ${{ inputs.hf_jobs_image }}
          I_DRY_RUN: ${{ inputs.dry_run }}
          I_EXECUTE: ${{ inputs.execute }}
          REQUEST_EXECUTION_PREFIX: gw
        run: >-
          python scripts/ci/normalize-candidate-request.py
          --event-name "$GITHUB_EVENT_NAME"
          --output /tmp/request.json
          --github-output "$GITHUB_OUTPUT"
      - name: Fetch source repository routing config
        shell: bash
        env:
          SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
          SOURCE_REPOSITORY: ${{ steps.inputs.outputs.source_repository }}
          GH_FALLBACK_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          token="${SOURCE_REPO_TOKEN:-$GH_FALLBACK_TOKEN}"
          encoded="$(GH_TOKEN="$token" gh api "/repos/$SOURCE_REPOSITORY/contents/.jpapt/hf-bucket.yml" --jq .content 2>/dev/null || true)"
          if [[ -n "$encoded" ]]; then
            printf '%s' "$encoded" | tr -d '\n' | base64 -d > /tmp/source.yml
            python - <<'PY' > /tmp/source.json
          import json
          import yaml
          with open('/tmp/source.yml', encoding='utf-8') as handle:
              print(json.dumps(yaml.safe_load(handle) or {}))
          PY
          else
            echo '{}' > /tmp/source.json
          fi
      - name: Infer HF namespace
        id: namespace
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          namespace="${HF_DEFAULT_NAMESPACE:-}"
          if [[ -z "$namespace" && -n "${HF_TOKEN:-}" ]]; then
            namespace="$(HF_TOKEN="$HF_TOKEN" hf auth whoami --format json 2>/dev/null | jq -r '.name // .user // empty' || true)"
          fi
          echo "value=$namespace" >> "$GITHUB_OUTPUT"
      - name: Resolve request with Rust contract
        id: resolve
        shell: bash
        env:
          DEFAULT_NAMESPACE: ${{ steps.namespace.outputs.value }}
        run: |
          set -euo pipefail
          cargo run --quiet --locked -p asr-contracts --bin asr-candidate-request -- \
            resolve \
            --inputs-json "$(cat /tmp/request.json)" \
            --config-json "$(cat /tmp/source.json)" \
            --default-namespace "$DEFAULT_NAMESPACE" \
            --registry-owner "$GITHUB_REPOSITORY_OWNER" \
            --github-output "$GITHUB_OUTPUT"
      - name: Build planned lifecycle snapshot
        id: lifecycle
        shell: bash
        env:
          REQUEST_ID: ${{ steps.resolve.outputs.request_id }}
          REQUEST_EXECUTION_ID: ${{ steps.resolve.outputs.request_execution_id }}
          SOURCE_REPOSITORY: ${{ steps.resolve.outputs.source_repository }}
          RECEIPT_REPOSITORY: ${{ steps.resolve.outputs.receipt_repository }}
          ORCHESTRATOR_REPOSITORY: ${{ github.repository }}
          GATEWAY_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p .ci/lifecycle
          request_key="$(python scripts/ci/build-candidate-request-lifecycle.py --request-key "$REQUEST_ID")"
          python scripts/ci/build-candidate-request-lifecycle.py --state planned --output .ci/lifecycle/candidate-request-lifecycle.json
          echo "request_key=$request_key" >> "$GITHUB_OUTPUT"
      - name: Preserve planned lifecycle snapshot
        uses: actions/upload-artifact@v7
        with:
          name: candidate-lifecycle-${{ steps.lifecycle.outputs.request_key }}-planned
          path: .ci/lifecycle/candidate-request-lifecycle.json
          retention-days: 30
      - name: Estimate from canonical V2 history
        id: estimate
        env:
          GH_TOKEN: ${{ github.token }}
          SUITE: ${{ steps.resolve.outputs.suite }}
          EXECUTOR: ${{ steps.resolve.outputs.executor }}
          ENVIRONMENT: ${{ steps.resolve.outputs.environment }}
          SOURCE_REPOSITORY: ${{ steps.resolve.outputs.source_repository }}
          HF_BUCKET: ${{ steps.resolve.outputs.hf_bucket }}
          DATASET_SOURCE: ${{ steps.resolve.outputs.dataset_source }}
          DATASET_ID: ${{ steps.resolve.outputs.dataset_id }}
        run: >-
          python scripts/ci/estimate-candidate-runtime.py
          --repository "$GITHUB_REPOSITORY"
          --workflow candidate-package-evaluate-v2.yml
          --suite "$SUITE"
          --executor "$EXECUTOR"
          --environment "$ENVIRONMENT"
          --github-output "$GITHUB_OUTPUT"
      - name: Write normalized plan
        shell: bash
        env:
          REQUEST_ID: ${{ steps.resolve.outputs.request_id }}
          REQUEST_EXECUTION_ID: ${{ steps.resolve.outputs.request_execution_id }}
          SOURCE_REPOSITORY: ${{ steps.resolve.outputs.source_repository }}
          RECEIPT_REPOSITORY: ${{ steps.resolve.outputs.receipt_repository }}
          HF_BUCKET: ${{ steps.resolve.outputs.hf_bucket }}
          CANDIDATE_ID: ${{ steps.resolve.outputs.candidate_id }}
          IMAGE: ${{ steps.resolve.outputs.image }}
          DATASET_SOURCE: ${{ steps.resolve.outputs.dataset_source }}
          DATASET_ID: ${{ steps.resolve.outputs.dataset_id }}
          SUITE: ${{ steps.resolve.outputs.suite }}
          EXECUTOR: ${{ steps.resolve.outputs.executor }}
          ENVIRONMENT: ${{ steps.resolve.outputs.environment }}
          PROVIDER: ${{ steps.resolve.outputs.provider }}
          DRY_RUN: ${{ steps.resolve.outputs.dry_run }}
          ESTIMATE_METHOD: ${{ steps.estimate.outputs.method }}
          ESTIMATE_COHORT: ${{ steps.estimate.outputs.cohort }}
          ESTIMATE_SAMPLES: ${{ steps.estimate.outputs.samples }}
          ESTIMATE_AVAILABLE_SAMPLES: ${{ steps.estimate.outputs.available_samples }}
          ESTIMATE_MINUTES: ${{ steps.estimate.outputs.estimate_minutes }}
          ESTIMATE_P50: ${{ steps.estimate.outputs.p50_minutes }}
          ESTIMATE_P90: ${{ steps.estimate.outputs.p90_minutes }}
          OBSERVED_DATASET_BYTES: ${{ steps.estimate.outputs.observed_dataset_bytes_p50 }}
          OBSERVED_PACKAGE_BYTES: ${{ steps.estimate.outputs.observed_package_bytes_p50 }}
          OBSERVED_CANDIDATE_BYTES: ${{ steps.estimate.outputs.observed_candidate_bytes_p50 }}
          EXECUTE: ${{ steps.inputs.outputs.execute }}
        run: |
          candidate="${CANDIDATE_ID:-latest}"
          dataset="${DATASET_ID:-bucket-default}"
          {
            echo '## Candidate request plan'
            echo
            printf -- '- request id: `%s`\n' "$REQUEST_ID"
            printf -- '- request execution id: `%s`\n' "$REQUEST_EXECUTION_ID"
            printf -- '- lifecycle artifact key: `%s`\n' "${{ steps.lifecycle.outputs.request_key }}"
            printf -- '- source: `%s`\n' "$SOURCE_REPOSITORY"
            printf -- '- receipt repository: `%s`\n' "$RECEIPT_REPOSITORY"
            printf -- '- completion event: `jpapt.candidate-completed`\n'
            printf -- '- rejection event: `jpapt.candidate-rejected`\n'
            printf -- '- bucket: `%s`\n' "$HF_BUCKET"
            printf -- '- candidate: `%s`\n' "$candidate"
            printf -- '- package: `%s`\n' "$IMAGE"
            printf -- '- dataset: `%s` / `%s`\n' "$DATASET_SOURCE" "$dataset"
            printf -- '- suite/backend: `%s` / `%s` / `%s`\n' "$SUITE" "$EXECUTOR" "$ENVIRONMENT"
            printf -- '- provider: `%s`\n' "$PROVIDER"
            printf -- '- dry-run: `%s`\n' "$DRY_RUN"
            printf -- '- estimate method/cohort: `%s` / `%s`\n' "$ESTIMATE_METHOD" "$ESTIMATE_COHORT"
            printf -- '- estimate samples: `%s` selected / `%s` available\n' "$ESTIMATE_SAMPLES" "$ESTIMATE_AVAILABLE_SAMPLES"
            printf -- '- estimated upper-bound runtime: **~%s min**\n' "$ESTIMATE_MINUTES"
            if [[ "$ESTIMATE_METHOD" == historical ]]; then
              printf -- '- observed p50 / p90: `%s` / `%s` min\n' "$ESTIMATE_P50" "$ESTIMATE_P90"
              [[ -n "$OBSERVED_DATASET_BYTES" ]] && printf -- '- cohort median dataset bytes: `%s`\n' "$OBSERVED_DATASET_BYTES"
              [[ -n "$OBSERVED_PACKAGE_BYTES" ]] && printf -- '- cohort median package bytes: `%s`\n' "$OBSERVED_PACKAGE_BYTES"
              [[ -n "$OBSERVED_CANDIDATE_BYTES" ]] && printf -- '- cohort median native candidate bytes: `%s`\n' "$OBSERVED_CANDIDATE_BYTES"
            fi
            printf -- '- execute: `%s`\n' "$EXECUTE"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build normalized workflow dispatch body
        id: body
        env:
          REQUEST_ID: ${{ steps.resolve.outputs.request_id }}
          REQUEST_EXECUTION_ID: ${{ steps.resolve.outputs.request_execution_id }}
          SOURCE_REPOSITORY: ${{ steps.resolve.outputs.source_repository }}
          RECEIPT_REPOSITORY: ${{ steps.resolve.outputs.receipt_repository }}
          HF_BUCKET: ${{ steps.resolve.outputs.hf_bucket }}
          CANDIDATE_ID: ${{ steps.resolve.outputs.candidate_id }}
          PACKAGE_NAME: ${{ steps.resolve.outputs.package_name }}
          DATASET_SOURCE: ${{ steps.resolve.outputs.dataset_source }}
          DATASET_ID: ${{ steps.resolve.outputs.dataset_id }}
          SUITE: ${{ steps.resolve.outputs.suite }}
          EXECUTOR: ${{ steps.resolve.outputs.executor }}
          ENVIRONMENT: ${{ steps.resolve.outputs.environment }}
          HF_FLAVOR: ${{ steps.resolve.outputs.hf_flavor }}
          HF_JOBS_IMAGE: ${{ steps.resolve.outputs.hf_jobs_image }}
          DRY_RUN: ${{ steps.resolve.outputs.dry_run }}
          INCLUDE_REQUEST_EXECUTION_ID: "true"
        run: python scripts/ci/build-candidate-dispatch-body.py --github-output "$GITHUB_OUTPUT"

  execute:
    name: Dispatch normalized evaluation V2
    needs: plan
    if: ${{ needs.plan.outputs.execute == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
      - name: Dispatch Candidate Package Evaluate V2 with bounded retry
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ needs.plan.outputs.body }}
        run: |
          set -euo pipefail
          printf '%s\n' "$BODY" > /tmp/v2-dispatch.json
          bash scripts/ci/workflow-dispatch-with-retry.sh \
            "$GITHUB_REPOSITORY" \
            candidate-package-evaluate-v2.yml \
            /tmp/v2-dispatch.json \
            3
      - name: Build dispatched lifecycle snapshot
        env:
          REQUEST_ID: ${{ needs.plan.outputs.request_id }}
          REQUEST_EXECUTION_ID: ${{ needs.plan.outputs.request_execution_id }}
          SOURCE_REPOSITORY: ${{ needs.plan.outputs.source_repository }}
          RECEIPT_REPOSITORY: ${{ needs.plan.outputs.receipt_repository }}
          ORCHESTRATOR_REPOSITORY: ${{ github.repository }}
          GATEWAY_RUN_ID: ${{ github.run_id }}
        run: >-
          python scripts/ci/build-candidate-request-lifecycle.py
          --state dispatched
          --output .ci/candidate-request-lifecycle.json
      - name: Preserve dispatched lifecycle snapshot
        uses: actions/upload-artifact@v7
        with:
          name: candidate-lifecycle-${{ needs.plan.outputs.request_key }}-dispatched
          path: .ci/candidate-request-lifecycle.json
          retention-days: 30

  reject:
    name: Emit candidate request rejection
    needs: plan
    if: ${{ always() && needs.plan.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build rejection evidence
        id: rejection
        shell: bash
        env:
          REQUEST_ID: ${{ github.event.client_payload.request_id || inputs.request_id }}
          REQUEST_EXECUTION_ID: gw-${{ github.run_id }}-${{ github.run_attempt }}
          SOURCE_REPOSITORY: ${{ github.event.client_payload.source_repository || inputs.source_repository }}
          RECEIPT_REPOSITORY: ${{ github.event.client_payload.receipt_repository || inputs.receipt_repository || github.event.client_payload.source_repository || inputs.source_repository }}
          ORCHESTRATOR_REPOSITORY: ${{ github.repository }}
          GATEWAY_RUN_ID: ${{ github.run_id }}
          GATEWAY_RUN_ATTEMPT: ${{ github.run_attempt }}
          GATEWAY_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p .ci/rejection
          cargo run --quiet --locked -p asr-contracts --bin asr-candidate-protocol-build -- \
            rejection \
            --rejection .ci/rejection/candidate-request-rejection.json \
            --dispatch-body .ci/rejection/candidate-request-rejection-dispatch.json
          request_id="$(jq -er '.request_id' .ci/rejection/candidate-request-rejection.json)"
          receipt_repository="$(jq -er '.receipt_repository' .ci/rejection/candidate-request-rejection.json)"
          request_key="$(python scripts/ci/build-candidate-request-lifecycle.py --request-key "$request_id")"
          python scripts/ci/build-candidate-request-lifecycle.py \
            --state rejected \
            --rejection .ci/rejection/candidate-request-rejection.json \
            --output .ci/rejection/candidate-request-lifecycle.json
          {
            echo "request_key=$request_key"
            echo "receipt_repository=$receipt_repository"
          } >> "$GITHUB_OUTPUT"
      - name: Preserve rejection evidence
        uses: actions/upload-artifact@v7
        with:
          name: candidate-rejection-${{ steps.rejection.outputs.request_key }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci/rejection/candidate-request-rejection.json
          retention-days: 30
      - name: Preserve rejected lifecycle snapshot
        uses: actions/upload-artifact@v7
        with:
          name: candidate-lifecycle-${{ steps.rejection.outputs.request_key }}-rejected
          path: .ci/rejection/candidate-request-lifecycle.json
          retention-days: 30
      - name: Dispatch rejection event
        shell: bash
        env:
          RECEIPT_REPOSITORY: ${{ steps.rejection.outputs.receipt_repository }}
          RECEIPT_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          token="$RECEIPT_TOKEN"
          if [[ -z "$token" && "$RECEIPT_REPOSITORY" == "$GITHUB_REPOSITORY" ]]; then
            token="$GITHUB_TOKEN"
          fi
          [[ -n "$token" ]] || {
            echo "::error::SOURCE_REPO_TOKEN is required to deliver rejection to $RECEIPT_REPOSITORY"
            exit 1
          }
          GH_TOKEN="$token" bash scripts/ci/repository-dispatch-with-retry.sh \
            "$RECEIPT_REPOSITORY" \
            .ci/rejection/candidate-request-rejection-dispatch.json \
            3
