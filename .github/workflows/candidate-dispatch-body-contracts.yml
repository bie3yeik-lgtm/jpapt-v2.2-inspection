name: Candidate Dispatch Body Contracts

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/candidate-dispatch-body-contracts.yml
      - .github/workflows/candidate-request-gateway.yml
      - scripts/ci/build-candidate-dispatch-body.py
      - scripts/ci/normalize-candidate-request.py
      - rust/crates/asr-contracts/src/bin/asr-candidate-request.rs
  pull_request:
    paths:
      - .github/workflows/candidate-dispatch-body-contracts.yml
      - .github/workflows/candidate-request-gateway.yml
      - scripts/ci/build-candidate-dispatch-body.py
      - scripts/ci/normalize-candidate-request.py
      - rust/crates/asr-contracts/src/bin/asr-candidate-request.rs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-dispatch-body-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Validate dispatch body caller intent
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Validate helper syntax
        run: >-
          python -m py_compile
          scripts/ci/build-candidate-dispatch-body.py
          scripts/ci/normalize-candidate-request.py
      - name: Verify Gateway exposes dry-run end to end
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'dry_run:' .github/workflows/candidate-request-gateway.yml
          grep -F 'I_DRY_RUN: ${{ inputs.dry_run }}' .github/workflows/candidate-request-gateway.yml
          grep -F 'DRY_RUN: ${{ steps.resolve.outputs.dry_run }}' .github/workflows/candidate-request-gateway.yml
          grep -F "printf -- '- dry-run:" .github/workflows/candidate-request-gateway.yml
      - name: Normalize manual Gateway dry-run
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/normalized-output
          I_REQUEST_ID=manual-dry-run-001 \
          I_SOURCE_REPOSITORY=owner/source \
          I_DRY_RUN=true \
          I_EXECUTE=true \
          python scripts/ci/normalize-candidate-request.py \
            --event-name workflow_dispatch \
            --output /tmp/request.json \
            --github-output /tmp/normalized-output >/dev/null
          test "$(jq -r .dry_run /tmp/request.json)" = true
          grep -Fx 'execute=true' /tmp/normalized-output
      - name: Inherit dry-run from normalized Gateway request
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/request.json <<'JSON'
          {"request_id":"dry-run-001","source_repository":"owner/source","dry_run":true}
          JSON
          : > /tmp/github-output
          REQUEST_ID=dry-run-001 \
          SOURCE_REPOSITORY=owner/source \
          RECEIPT_REPOSITORY=owner/receiver \
          HF_BUCKET=owner/bucket \
          DATASET_SOURCE=bucket \
          SUITE=probe \
          EXECUTOR=github \
          ENVIRONMENT=linux-cpu \
          python scripts/ci/build-candidate-dispatch-body.py \
            --github-output /tmp/github-output > /tmp/body.json
          test "$(jq -r '.inputs.dry_run' /tmp/body.json)" = true
      - name: Explicit resolved dry-run overrides request file
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/request.json <<'JSON'
          {"request_id":"dry-run-002","source_repository":"owner/source","dry_run":true}
          JSON
          : > /tmp/github-output
          DRY_RUN=false \
          REQUEST_ID=dry-run-002 \
          SOURCE_REPOSITORY=owner/source \
          RECEIPT_REPOSITORY=owner/receiver \
          HF_BUCKET=owner/bucket \
          DATASET_SOURCE=bucket \
          SUITE=probe \
          EXECUTOR=github \
          ENVIRONMENT=linux-cpu \
          python scripts/ci/build-candidate-dispatch-body.py \
            --github-output /tmp/github-output > /tmp/body-override.json
          test "$(jq -r '.inputs.dry_run' /tmp/body-override.json)" = false
      - name: Reject invalid dry-run intent
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/request.json <<'JSON'
          {"request_id":"dry-run-003","source_repository":"owner/source","dry_run":"maybe"}
          JSON
          : > /tmp/github-output
          if REQUEST_ID=dry-run-003 \
            SOURCE_REPOSITORY=owner/source \
            python scripts/ci/build-candidate-dispatch-body.py \
              --github-output /tmp/github-output; then
            echo 'invalid dry_run unexpectedly accepted' >&2
            exit 1
          fi
