name: Agent Apply Private Secrets Bindings

on:
  push:
    branches:
      - docs/current-premiere-integration-spec-20260819

permissions:
  contents: write
  issues: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: docs/current-premiere-integration-spec-20260819
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Patch and verify canonical workflows
        id: patch
        run: |
          set -euo pipefail
          python scripts/ci/bind-private-secrets-environment.py --write
          python scripts/ci/bind-private-secrets-environment.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows
          if git diff --cached --quiet; then
            echo 'committed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m 'fix(ci): bind environment-scoped protocol secrets'
          git push origin HEAD:docs/current-premiere-integration-spec-20260819
          echo 'committed=true' >> "$GITHUB_OUTPUT"
      - name: Report to authority acceptance issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.patch.outcome }}
          COMMITTED: ${{ steps.patch.outputs.committed }}
        run: |
          gh issue comment 109 --repo "$GITHUB_REPOSITORY" --body "Private-Secrets binding run \\`$GITHUB_RUN_ID\\`: outcome=\\`${OUTCOME:-unknown}\\`, committed=\\`${COMMITTED:-unknown}\\`, input=\\`$GITHUB_SHA\\`."
