name: Agent Provision Protocol Fixture

on:
  push:
    branches:
      - agent/provision-protocol-fixture-20260819

permissions:
  contents: read
  issues: write

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
      FIXTURE_REPOSITORY: bie3yeik-lgtm/jpapt-protocol-e2e-source
    steps:
      - name: Require source repository token
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${SOURCE_REPO_TOKEN:-}" ]] || {
            echo '::error::SOURCE_REPO_TOKEN is required'
            exit 1
          }
      - name: Create private dedicated fixture when absent
        id: fixture
        shell: bash
        env:
          GH_TOKEN: ${{ env.SOURCE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if gh api "/repos/$FIXTURE_REPOSITORY" >/tmp/fixture.json 2>/tmp/fixture.err; then
            echo 'created=false' >> "$GITHUB_OUTPUT"
          else
            owner="${FIXTURE_REPOSITORY%%/*}"
            name="${FIXTURE_REPOSITORY#*/}"
            [[ "$owner" == bie3yeik-lgtm ]] || {
              echo '::error::fixture owner must be bie3yeik-lgtm'
              exit 1
            }
            gh api --method POST /user/repos \
              -f name="$name" \
              -f description='Dedicated JPAPT candidate protocol cross-repository E2E fixture' \
              -F private=true \
              -F auto_init=true \
              >/tmp/fixture.json
            echo 'created=true' >> "$GITHUB_OUTPUT"
          fi
          actual="$(jq -r .full_name /tmp/fixture.json)"
          private="$(jq -r .private /tmp/fixture.json)"
          default_branch="$(jq -r .default_branch /tmp/fixture.json)"
          [[ "$actual" == "$FIXTURE_REPOSITORY" ]] || {
            echo "::error::unexpected repository identity: $actual"
            exit 1
          }
          [[ "$private" == true ]] || {
            echo '::error::fixture repository must be private'
            exit 1
          }
          [[ -n "$default_branch" && "$default_branch" != null ]] || {
            echo '::error::fixture default branch unavailable'
            exit 1
          }
          echo "default_branch=$default_branch" >> "$GITHUB_OUTPUT"
      - name: Record provisioning result on issue 70
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CREATED: ${{ steps.fixture.outputs.created }}
          DEFAULT_BRANCH: ${{ steps.fixture.outputs.default_branch }}
        run: |
          set -euo pipefail
          body=$(cat <<EOF
          Dedicated fixture provisioning succeeded from trusted branch push.

          - repository: \`$FIXTURE_REPOSITORY\`
          - private: \`true\`
          - created in this run: \`$CREATED\`
          - default branch: \`$DEFAULT_BRANCH\`
          - workflow run: \`$GITHUB_RUN_ID\`
          - source head: \`$GITHUB_SHA\`

          No receiver bootstrap, repository dispatch, HF Bucket mutation, model compute, or HF Jobs workload was performed in this provisioning step.
          EOF
          )
          gh issue comment 70 --repo "$GITHUB_REPOSITORY" --body "$body"
