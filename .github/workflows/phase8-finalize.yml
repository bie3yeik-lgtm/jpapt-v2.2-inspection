name: Phase8 Finalize

on:
  push:
    branches: [agent/rust-hf-target-routing-phase8]
    paths:
      - ".github/workflows/phase8-finalize.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/rust-hf-target-routing-phase8
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Audit removed Python HF target policy and format Rust
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE 'resolve-hf-target\.py|validate-hf-targets\.py'; then
            echo 'legacy HF target Python policy references remain' >&2
            exit 1
          fi
          cargo fmt --all
      - name: Commit final formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/crates/asr-hf
          if git diff --cached --quiet; then
            echo 'No formatting changes'
            exit 0
          fi
          git commit -m "Finalize asr-hf target policy"
          git push origin HEAD:agent/rust-hf-target-routing-phase8
