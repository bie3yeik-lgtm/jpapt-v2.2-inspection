name: Format Rust Once

on:
  push:
    branches:
      - agent/rust-hf-destructive-optimization
    paths:
      - ".github/workflows/format-rust-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/rust-hf-destructive-optimization
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format workspace
        run: cargo fmt --all
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust
          if git diff --cached --quiet; then
            echo "Rust workspace is already formatted."
            exit 0
          fi
          git commit -m "Format entire Rust workspace"
          git push origin HEAD:agent/rust-hf-destructive-optimization
