name: Repository Dispatch Router

on:
  repository_dispatch:
    types: [jpapt.workflow]
  workflow_dispatch:
    inputs:
      workflow:
        description: "Workflow filename or alias, e.g. ghcr-evaluate"
        required: true
        type: string
      ref:
        description: "Git ref passed to workflow_dispatch"
        required: false
        default: main
        type: string
      inputs_json:
        description: "JSON object passed as workflow_dispatch inputs"
        required: false
        default: "{}"
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: repository-dispatch-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Resolve and validate dispatch request with Rust
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PAYLOAD_WORKFLOW: ${{ github.event.client_payload.workflow }}
          PAYLOAD_REF: ${{ github.event.client_payload.ref }}
          PAYLOAD_INPUTS: ${{ toJSON(github.event.client_payload.inputs) }}
          MANUAL_WORKFLOW: ${{ inputs.workflow }}
          MANUAL_REF: ${{ inputs.ref }}
          MANUAL_INPUTS: ${{ inputs.inputs_json }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == repository_dispatch ]]; then
            workflow="$PAYLOAD_WORKFLOW"
            ref="${PAYLOAD_REF:-main}"
            inputs_json="$PAYLOAD_INPUTS"
            [[ "$inputs_json" != null && -n "$inputs_json" ]] || inputs_json='{}'
          else
            workflow="$MANUAL_WORKFLOW"
            ref="${MANUAL_REF:-main}"
            inputs_json="${MANUAL_INPUTS:-{}}"
          fi

          cargo run --quiet --locked -p asr-contracts --bin asr-workflow-dispatch -- \
            resolve \
            --workflow "$workflow" \
            --ref "$ref" \
            --inputs-json "$inputs_json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Dispatch workflow
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: ${{ steps.request.outputs.workflow }}
          REQUEST_BODY: ${{ steps.request.outputs.body }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$REQUEST_BODY" | gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW}/dispatches" \
            --input -
          echo "Dispatched ${{ steps.request.outputs.alias }} ($WORKFLOW) on ${{ steps.request.outputs.ref }}"
