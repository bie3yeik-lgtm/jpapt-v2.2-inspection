name: Bucket Init Reset CI Test

on:
  push:
    branches: [agent/hf-bucket-init]
    paths:
      - ".github/workflows/_bucket-init-reset-ci-test.yml"

permissions:
  contents: read

jobs:
  reset:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify and reset only the known ci-test fixture
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "huggingface_hub==1.24.0"
          hf buckets list gawohok7/ci-test -R --format json > /tmp/list.json
          hf buckets cp hf://buckets/gawohok7/ci-test/bucket-manifest.json /tmp/bucket-manifest.json
          python - <<'PY'
          import json
          from pathlib import Path

          expected_paths = {
              "README.md",
              "benchmarks/README.md",
              "bucket-manifest.json",
              "candidates/README.md",
              "config/README.md",
              "config/versions/README.md",
              "experiments/README.md",
              "runs/README.md",
          }
          listing = json.loads(Path('/tmp/list.json').read_text())
          observed = {item['path'] for item in listing if item.get('type') == 'file'}
          if observed != expected_paths:
              raise SystemExit(f'refusing reset: unexpected bucket paths: {sorted(observed)}')

          manifest = json.loads(Path('/tmp/bucket-manifest.json').read_text())
          expected = {
              'schema_version': 1,
              'bucket_id': 'gawohok7/ci-test',
              'profile_set': 'whisper-autoregressive-v1',
          }
          for key, value in expected.items():
              if manifest.get(key) != value:
                  raise SystemExit(f'refusing reset: manifest {key} mismatch')
          source = manifest.get('source_model', {})
          expected_source = {
              'repo_id': 'kotoba-tech/kotoba-whisper-v2.0',
              'revision_requested': 'main',
              'revision_resolved': '7eb575277d18909a4af8a24e3ae8cce2e99794ae',
              'task': 'automatic-speech-recognition',
              'library': 'transformers',
              'language': 'ja',
              'license': 'apache-2.0',
              'architecture': 'whisper',
          }
          if source != expected_source:
              raise SystemExit(f'refusing reset: source_model mismatch: {source!r}')
          print('verified exact disposable ci-test fixture')
          PY

          while IFS= read -r path; do
            hf buckets rm "gawohok7/ci-test/$path"
          done <<'EOF'
          README.md
          benchmarks/README.md
          bucket-manifest.json
          candidates/README.md
          config/README.md
          config/versions/README.md
          experiments/README.md
          runs/README.md
          EOF

          for attempt in $(seq 1 10); do
            hf buckets list gawohok7/ci-test -R --format json > /tmp/after.json
            if python - <<'PY'
          import json
          from pathlib import Path
          raise SystemExit(0 if json.loads(Path('/tmp/after.json').read_text()) == [] else 1)
          PY
            then
              echo 'ci-test is empty'
              exit 0
            fi
            sleep 1
          done
          echo 'bucket did not become observably empty after reset' >&2
          cat /tmp/after.json >&2
          exit 1
