name: HF Bucket Identity Parity Contracts

on:
  push:
    branches: [main]
    paths:
      - scripts/hf/hf-identity.sh
      - scripts/hf/hf-fetch-candidate.sh
      - scripts/hf/hf-fetch-reference.sh
      - scripts/hf/hf-fetch-revisions.sh
      - scripts/hf/hf-request-id.sh
      - scripts/hf/hf-push-candidate.sh
      - scripts/hf/hf-push-config-version.sh
      - scripts/hf/hf-promote-candidate.sh
      - scripts/hf/hf-push-run.sh
      - scripts/hf/hf-push-benchmark.sh
      - .github/workflows/hf-bucket-identity-parity-contracts.yml
  pull_request:
    paths:
      - scripts/hf/hf-identity.sh
      - scripts/hf/hf-fetch-candidate.sh
      - scripts/hf/hf-fetch-reference.sh
      - scripts/hf/hf-fetch-revisions.sh
      - scripts/hf/hf-request-id.sh
      - scripts/hf/hf-push-candidate.sh
      - scripts/hf/hf-push-config-version.sh
      - scripts/hf/hf-promote-candidate.sh
      - scripts/hf/hf-push-run.sh
      - scripts/hf/hf-push-benchmark.sh
      - .github/workflows/hf-bucket-identity-parity-contracts.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Validate canonical HF Bucket identity across helpers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate helper syntax and grammar parity
        shell: bash
        run: |
          set -euo pipefail
          for script in \
            scripts/hf/hf-fetch-candidate.sh \
            scripts/hf/hf-fetch-reference.sh \
            scripts/hf/hf-push-run.sh \
            scripts/hf/hf-push-benchmark.sh; do
            bash -n "$script"
            grep -F '[[ "$value" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]' "$script" >/dev/null
            grep -F '[[ "$namespace" == "." || "$namespace" == ".." || "$bucket" == "." || "$bucket" == ".." ]]' "$script" >/dev/null
            grep -F 'value="${value#hf://buckets/}"' "$script" >/dev/null
            grep -F 'value="${value%/}"' "$script" >/dev/null
          done
          for script in \
            scripts/hf/hf-identity.sh \
            scripts/hf/hf-request-id.sh \
            scripts/hf/hf-push-candidate.sh \
            scripts/hf/hf-fetch-revisions.sh \
            scripts/hf/hf-push-config-version.sh \
            scripts/hf/hf-promote-candidate.sh; do
            bash -n "$script"
          done
          for script in \
            scripts/hf/hf-request-id.sh \
            scripts/hf/hf-push-candidate.sh \
            scripts/hf/hf-fetch-revisions.sh \
            scripts/hf/hf-push-config-version.sh \
            scripts/hf/hf-promote-candidate.sh; do
            grep -F 'source "$SCRIPT_DIR/hf-identity.sh"' "$script" >/dev/null
          done
      - name: Validate shared identity grammar directly
        shell: bash
        run: |
          set -euo pipefail
          source scripts/hf/hf-identity.sh
          test "$(hf_normalize_bucket_id 'hf://buckets/.namespace/.bucket/')" = '.namespace/.bucket'
          test "$(hf_normalize_model_repo_id 'hf://models/.namespace/.model/')" = '.namespace/.model'
          for value in 'ns//bucket' './bucket' 'ns/..' 'ns/bucket/extra' 'ns/bad bucket' '/ns/bucket'; do
            if hf_normalize_bucket_id "$value" >/dev/null; then
              echo "invalid Bucket unexpectedly accepted: $value" >&2
              exit 1
            fi
          done
          for value in 'ns//model' './model' 'ns/..' 'ns/model/extra' 'ns/bad model' '/ns/model'; do
            if hf_normalize_model_repo_id "$value" >/dev/null; then
              echo "invalid model repo unexpectedly accepted: $value" >&2
              exit 1
            fi
          done
      - name: Prepare fake HF and Rust clients
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fake-bin /tmp/run-fixture /tmp/identity-fixture
          cat > /tmp/fake-bin/hf <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          printf 'hf %s\n' "$*" >> /tmp/remote-invocations
          if [[ "${1:-}" == buckets && "${2:-}" == sync ]]; then
            destination="${@: -1}"
            if [[ "$destination" != hf://* ]]; then
              mkdir -p "$destination"
              printf 'reference\n' > "$destination/fixture.txt"
            fi
          fi
          exit 0
          SH
          cat > /tmp/fake-bin/gh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          printf 'gh %s\n' "$*" >> /tmp/remote-invocations
          exit 99
          SH
          cat > /tmp/fake-bin/cargo <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          args="$*"
          if [[ "$args" == *'--bin asr-benchmark'* ]]; then
            metrics="${@: -1}"
            printf 'metrics_path=%s\n' "$metrics"
            printf 'run_id=run-001\n'
            printf 'candidate_id=candidate-000001\n'
          elif [[ "$args" == *'--bin asr-contracts'* ]]; then
            printf 'run_id=run-001\n'
            printf 'sample_count=1\n'
          elif [[ "$args" == *'--bin asr-capsule'* ]]; then
            printf 'sample_count=1\n'
          else
            echo "unexpected cargo invocation: $args" >&2
            exit 99
          fi
          SH
          chmod +x /tmp/fake-bin/hf /tmp/fake-bin/gh /tmp/fake-bin/cargo
          printf '{}\n' > /tmp/metrics.json
          printf '{}\n' > /tmp/run-fixture/run-context.json
          printf '{}\n' > /tmp/run-fixture/metrics.json
          printf '{}\n' > /tmp/run-fixture/samples.jsonl
          printf 'parquet\n' > /tmp/run-fixture/run.parquet
      - name: Reject malformed Bucket identities before reference HF access
        shell: bash
        run: |
          set -euo pipefail
          for bucket in 'ns//bucket' './bucket' 'ns/..' 'ns/bucket/extra' 'ns/bad bucket'; do
            rm -f /tmp/remote-invocations
            rm -rf .ci/reference
            if HF_TOKEN=synthetic HF_BUCKET="$bucket" PATH="/tmp/fake-bin:$PATH" \
              bash scripts/hf/hf-fetch-reference.sh; then
              echo "invalid reference Bucket unexpectedly accepted: $bucket" >&2
              exit 1
            fi
            test ! -e /tmp/remote-invocations
          done
      - name: Reject malformed Bucket identities before run upload
        shell: bash
        run: |
          set -euo pipefail
          for bucket in 'ns//bucket' './bucket' 'ns/..' 'ns/bucket/extra' 'ns/bad bucket'; do
            rm -f /tmp/remote-invocations
            if HF_TOKEN=synthetic HF_BUCKET="$bucket" PATH="/tmp/fake-bin:$PATH" \
              bash scripts/hf/hf-push-run.sh /tmp/run-fixture; then
              echo "invalid run Bucket unexpectedly accepted: $bucket" >&2
              exit 1
            fi
            test ! -e /tmp/remote-invocations
          done
      - name: Reject malformed Bucket identities before benchmark upload
        shell: bash
        run: |
          set -euo pipefail
          for bucket in 'ns//bucket' './bucket' 'ns/..' 'ns/bucket/extra' 'ns/bad bucket'; do
            rm -f /tmp/remote-invocations
            if HF_TOKEN=synthetic HF_BUCKET="$bucket" PATH="/tmp/fake-bin:$PATH" \
              bash scripts/hf/hf-push-benchmark.sh /tmp/metrics.json smoke; then
              echo "invalid benchmark Bucket unexpectedly accepted: $bucket" >&2
              exit 1
            fi
            test ! -e /tmp/remote-invocations
          done
      - name: Reject malformed identities before allocator and authority transport
        shell: bash
        run: |
          set -euo pipefail
          for bucket in 'ns//bucket' './bucket' 'ns/..' 'ns/bucket/extra' 'ns/bad bucket'; do
            for command in \
              "bash scripts/hf/hf-request-id.sh candidates" \
              "bash scripts/hf/hf-fetch-revisions.sh" \
              "bash scripts/hf/hf-push-candidate.sh /tmp/identity-fixture" \
              "bash scripts/hf/hf-push-config-version.sh /tmp/identity-fixture"; do
              rm -f /tmp/remote-invocations
              if HF_TOKEN=synthetic GH_TOKEN=synthetic HF_PROFILE_SET=synthetic HF_BUCKET="$bucket" PATH="/tmp/fake-bin:$PATH" \
                bash -c "$command"; then
                echo "invalid Bucket unexpectedly accepted by: $command ($bucket)" >&2
                exit 1
              fi
              test ! -e /tmp/remote-invocations
            done
            rm -f /tmp/remote-invocations
            if HF_TOKEN=synthetic HF_BUCKET="$bucket" HF_MODEL_REPO='ns/model' PATH="/tmp/fake-bin:$PATH" \
              bash scripts/hf/hf-promote-candidate.sh candidate-000001 /tmp/identity-fixture; then
              echo "invalid promotion Bucket unexpectedly accepted: $bucket" >&2
              exit 1
            fi
            test ! -e /tmp/remote-invocations
          done
          for model in 'ns//model' './model' 'ns/..' 'ns/model/extra' 'ns/bad model'; do
            rm -f /tmp/remote-invocations
            if HF_TOKEN=synthetic HF_BUCKET='ns/bucket' HF_MODEL_REPO="$model" PATH="/tmp/fake-bin:$PATH" \
              bash scripts/hf/hf-promote-candidate.sh candidate-000001 /tmp/identity-fixture; then
              echo "invalid promotion model repo unexpectedly accepted: $model" >&2
              exit 1
            fi
            test ! -e /tmp/remote-invocations
          done
      - name: Preserve compatible prefixed and dot-prefixed Bucket identities
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/remote-invocations
          rm -rf .ci/reference
          HF_TOKEN=synthetic HF_BUCKET='hf://buckets/.namespace/.bucket/' PATH="/tmp/fake-bin:$PATH" \
            bash scripts/hf/hf-fetch-reference.sh
          HF_TOKEN=synthetic HF_BUCKET='hf://buckets/.namespace/.bucket/' PATH="/tmp/fake-bin:$PATH" \
            bash scripts/hf/hf-push-run.sh /tmp/run-fixture
          HF_TOKEN=synthetic HF_BUCKET='hf://buckets/.namespace/.bucket/' PATH="/tmp/fake-bin:$PATH" \
            bash scripts/hf/hf-push-benchmark.sh /tmp/metrics.json smoke
          test "$(wc -l < /tmp/remote-invocations)" = 3
          grep -F 'hf://buckets/.namespace/.bucket/reference' /tmp/remote-invocations >/dev/null
          grep -F 'hf://buckets/.namespace/.bucket/runs/run-001' /tmp/remote-invocations >/dev/null
          grep -F 'hf://buckets/.namespace/.bucket/benchmarks/candidate-000001/smoke/run-001.json' /tmp/remote-invocations >/dev/null
