name: Fixture Generation Completion Binding

on:
  workflow_dispatch:
    inputs:
      generation_id:
        required: true
        type: string
      inspection_id:
        required: true
        type: string
      source_revision:
        required: true
        type: string
      hf_bucket:
        required: true
        type: string
      evaluation_run_id:
        required: true
        type: string
      evaluation_run_attempt:
        required: false
        default: "1"
        type: string
      ack_run_id:
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

jobs:
  bind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          run-id: ${{ inputs.evaluation_run_id }}
          name: candidate-completion-${{ inputs.evaluation_run_id }}-${{ inputs.evaluation_run_attempt }}
          path: .ci/candidate
          github-token: ${{ github.token }}
      - name: Build and validate fixture binding
        env:
          ACK_RUN_ID: ${{ inputs.ack_run_id }}
        run: |
          set -euo pipefail
          args=(
            --generation-id '${{ inputs.generation_id }}'
            --inspection-id '${{ inputs.inspection_id }}'
            --source-revision '${{ inputs.source_revision }}'
            --hf-bucket '${{ inputs.hf_bucket }}'
            --evaluation-run-id '${{ inputs.evaluation_run_id }}'
            --evaluation-run-attempt '${{ inputs.evaluation_run_attempt }}'
            --candidate-receipt .ci/candidate/candidate-completion-receipt.json
            --output .ci/fixture-generation/fixture-completion-binding.json
          )
          if [[ -n "$ACK_RUN_ID" ]]; then args+=(--ack-run-id "$ACK_RUN_ID"); fi
          python scripts/ci/build-fixture-completion-binding.py "${args[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: fixture-completion-binding-${{ inputs.generation_id }}-${{ inputs.evaluation_run_id }}
          path: .ci/fixture-generation/fixture-completion-binding.json
          if-no-files-found: error
