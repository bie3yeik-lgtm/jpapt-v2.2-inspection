name: Fixture Bootstrap PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  bootstrap:
    if: github.head_ref == 'docs/current-premiere-integration-spec-20260819'
    environment: Private-Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_REPOSITORY: bie3yeik-lgtm/jpapt-protocol-e2e-source
      ORCHESTRATOR_REPOSITORY: bie3yeik-lgtm/jpapt-v2.2-inspection
      SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
      TARGET_REPO_TOKEN: ${{ secrets.TARGET_REPO_TOKEN }}
      JPAPT_ACK_TOKEN: ${{ secrets.JPAPT_ACK_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Require provisioning capabilities
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TARGET_REPO_TOKEN:-}" || { echo '::error::TARGET_REPO_TOKEN missing'; exit 1; }
          test -n "${JPAPT_ACK_TOKEN:-}" || { echo '::error::JPAPT_ACK_TOKEN missing'; exit 1; }

      - name: Materialize canonical managed bundle
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/candidate_receiver_bundle.py --validate
          mkdir -p /tmp/fixture-bundle
          while IFS=$'\t' read -r target source; do
            dest="/tmp/fixture-bundle/$target"
            mkdir -p "$(dirname "$dest")"
            cp "$source" "$dest"
          done < <(python scripts/ci/candidate_receiver_bundle.py --tsv)

          export RECEIVER_REPOSITORY="$TARGET_REPOSITORY"
          export ORCHESTRATOR_REPOSITORY="$ORCHESTRATOR_REPOSITORY"
          export ORCHESTRATOR_COMMIT_SHA="$GITHUB_SHA"
          file_args=()
          while IFS= read -r mapping; do
            target="${mapping%%=*}"
            source="${mapping#*=}"
            file_args+=(--file "$target=$source")
          done < <(python scripts/ci/candidate_receiver_bundle.py --mappings)
          python scripts/ci/build-candidate-receiver-installation.py \
            --output /tmp/fixture-bundle/.jpapt/candidate-receiver.json \
            "${file_args[@]}"
          python scripts/ci/build-candidate-receiver-installation.py \
            --validate /tmp/fixture-bundle/.jpapt/candidate-receiver.json

      - name: Install managed bundle in fixture
        shell: bash
        env:
          GH_TOKEN: ${{ env.TARGET_REPO_TOKEN }}
        run: |
          set -euo pipefail
          default_branch="$(gh api "/repos/$TARGET_REPOSITORY" --jq .default_branch)"
          head_sha="$(gh api "/repos/$TARGET_REPOSITORY/git/ref/heads/$default_branch" --jq .object.sha)"
          base_tree="$(gh api "/repos/$TARGET_REPOSITORY/git/commits/$head_sha" --jq .tree.sha)"
          entries='[]'

          add_blob() {
            local target="$1"
            local source="$2"
            local content body blob_sha
            content="$(base64 -w0 "$source")"
            body="$(jq -n --arg content "$content" '{content:$content,encoding:"base64"}')"
            blob_sha="$(gh api --method POST "/repos/$TARGET_REPOSITORY/git/blobs" --input - <<<"$body" --jq .sha)"
            entries="$(jq --arg path "$target" --arg sha "$blob_sha" '. + [{path:$path,mode:"100644",type:"blob",sha:$sha}]' <<<"$entries")"
          }

          while IFS=$'\t' read -r target source; do
            add_blob "$target" "$source"
          done < <(python scripts/ci/candidate_receiver_bundle.py --tsv)
          add_blob .jpapt/candidate-receiver.json /tmp/fixture-bundle/.jpapt/candidate-receiver.json

          tree_body="$(jq -n --arg base_tree "$base_tree" --argjson tree "$entries" '{base_tree:$base_tree,tree:$tree}')"
          tree_sha="$(gh api --method POST "/repos/$TARGET_REPOSITORY/git/trees" --input - <<<"$tree_body" --jq .sha)"
          commit_body="$(jq -n --arg message 'ci: install jpapt candidate protocol receiver' --arg tree "$tree_sha" --arg parent "$head_sha" '{message:$message,tree:$tree,parents:[$parent]}')"
          commit_sha="$(gh api --method POST "/repos/$TARGET_REPOSITORY/git/commits" --input - <<<"$commit_body" --jq .sha)"
          ref_body="$(jq -n --arg sha "$commit_sha" '{sha:$sha,force:false}')"
          gh api --method PATCH "/repos/$TARGET_REPOSITORY/git/refs/heads/$default_branch" --input - <<<"$ref_body" >/dev/null
          echo "installed_commit=$commit_sha" >> "$GITHUB_ENV"

      - name: Configure fixture trust variable and ACK secret
        shell: bash
        env:
          GH_TOKEN: ${{ env.TARGET_REPO_TOKEN }}
        run: |
          set -euo pipefail
          gh variable set JPAPT_ORCHESTRATOR_REPOSITORIES \
            --repo "$TARGET_REPOSITORY" \
            --body "$ORCHESTRATOR_REPOSITORY"
          printf '%s' "$JPAPT_ACK_TOKEN" | gh secret set JPAPT_ACK_TOKEN \
            --repo "$TARGET_REPOSITORY" \
            --body -

      - name: Verify runtime SOURCE_REPO_TOKEN can access fixture
        shell: bash
        env:
          GH_TOKEN: ${{ env.SOURCE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo '::error::SOURCE_REPO_TOKEN missing'; exit 1; }
          test "$(gh api "/repos/$TARGET_REPOSITORY" --jq .full_name)" = "$TARGET_REPOSITORY"
          test "$(gh api "/repos/$TARGET_REPOSITORY" --jq .private)" = true
          gh api "/repos/$TARGET_REPOSITORY/contents/.jpapt/candidate-receiver.json?ref=$installed_commit" --jq .sha >/dev/null

      - name: Record bootstrap success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 70 --repo "$GITHUB_REPOSITORY" --body "Dedicated fixture receiver bootstrap succeeded. Fixture: \`$TARGET_REPOSITORY\`; workflow run: \`$GITHUB_RUN_ID\`; installed commit: \`$installed_commit\`. Managed receiver bundle installed, \`JPAPT_ORCHESTRATOR_REPOSITORIES\` configured to the public authority, \`JPAPT_ACK_TOKEN\` stored as a target repository secret, and runtime \`SOURCE_REPO_TOKEN\` read access to the private fixture verified. Token values were not emitted."
