name: External Candidate Workflow Contracts

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/candidate-package-evaluate.yml
      - .github/workflows/external-bucket-bootstrap.yml
      - .github/workflows/external-candidate-contracts.yml
      - docker/candidate-package/Dockerfile
      - scripts/ci/generic-candidate-evaluate.py
      - scripts/ci/run-candidate-package-evaluation.sh
  pull_request:
    paths:
      - .github/workflows/candidate-package-evaluate.yml
      - .github/workflows/external-bucket-bootstrap.yml
      - .github/workflows/external-candidate-contracts.yml
      - docker/candidate-package/Dockerfile
      - scripts/ci/generic-candidate-evaluate.py
      - scripts/ci/run-candidate-package-evaluation.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-candidate-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Lint workflow and helper contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Cache Go build state
        uses: actions/cache@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: actionlint-v1.7.12-${{ runner.os }}-${{ runner.arch }}

      - name: Install pinned actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Lint external candidate workflows
        shell: bash
        run: |
          set -euo pipefail
          actionlint -color \
            .github/workflows/candidate-package-evaluate.yml \
            .github/workflows/external-bucket-bootstrap.yml \
            .github/workflows/external-candidate-contracts.yml

      - name: Validate Bash helper syntax
        shell: bash
        run: bash -n scripts/ci/run-candidate-package-evaluation.sh

      - name: Validate Python evaluator syntax
        run: python -m py_compile scripts/ci/generic-candidate-evaluate.py

      - name: Verify candidate Dockerfile parses
        run: docker buildx build --check -f docker/candidate-package/Dockerfile .
