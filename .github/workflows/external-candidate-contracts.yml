name: External Candidate Workflow Contracts

on:
  push:
    branches:
      - main
    paths:
      - .github/actionlint.yaml
      - .github/workflows/candidate-completion-ack.yml
      - .github/workflows/candidate-completion-receipt.yml
      - .github/workflows/candidate-completion-reconcile.yml
      - .github/workflows/candidate-package-evaluate.yml
      - .github/workflows/candidate-package-evaluate-v2.yml
      - .github/workflows/candidate-request-gateway.yml
      - .github/workflows/external-bucket-bootstrap.yml
      - .github/workflows/external-candidate-contracts.yml
      - contracts/candidate-completion-ack.schema.json
      - contracts/candidate-completion-receipt.schema.json
      - docker/candidate-package/Dockerfile
      - scripts/ci/build-candidate-completion-ack.py
      - scripts/ci/build-candidate-completion-receipt.py
      - scripts/ci/build-candidate-dispatch-body.py
      - scripts/ci/estimate-candidate-runtime.py
      - scripts/ci/generic-candidate-evaluate.py
      - scripts/ci/normalize-candidate-request.py
      - scripts/ci/repository-dispatch-with-retry.sh
      - scripts/ci/run-candidate-package-evaluation.sh
      - rust/crates/asr-contracts/src/bin/asr-candidate-request.rs
  pull_request:
    paths:
      - .github/actionlint.yaml
      - .github/workflows/candidate-completion-ack.yml
      - .github/workflows/candidate-completion-receipt.yml
      - .github/workflows/candidate-completion-reconcile.yml
      - .github/workflows/candidate-package-evaluate.yml
      - .github/workflows/candidate-package-evaluate-v2.yml
      - .github/workflows/candidate-request-gateway.yml
      - .github/workflows/external-bucket-bootstrap.yml
      - .github/workflows/external-candidate-contracts.yml
      - contracts/candidate-completion-ack.schema.json
      - contracts/candidate-completion-receipt.schema.json
      - docker/candidate-package/Dockerfile
      - scripts/ci/build-candidate-completion-ack.py
      - scripts/ci/build-candidate-completion-receipt.py
      - scripts/ci/build-candidate-dispatch-body.py
      - scripts/ci/estimate-candidate-runtime.py
      - scripts/ci/generic-candidate-evaluate.py
      - scripts/ci/normalize-candidate-request.py
      - scripts/ci/repository-dispatch-with-retry.sh
      - scripts/ci/run-candidate-package-evaluation.sh
      - rust/crates/asr-contracts/src/bin/asr-candidate-request.rs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-candidate-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Lint workflow and helper contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: false

      - name: Cache Go build state
        uses: actions/cache@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: actionlint-v1.7.12-${{ runner.os }}-${{ runner.arch }}

      - name: Install pinned actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Lint external candidate workflows
        shell: bash
        run: |
          set -euo pipefail
          actionlint -color \
            .github/workflows/candidate-completion-ack.yml \
            .github/workflows/candidate-completion-receipt.yml \
            .github/workflows/candidate-package-evaluate.yml \
            .github/workflows/external-bucket-bootstrap.yml \
            .github/workflows/external-candidate-contracts.yml
          # Summary-only Markdown printf strings contain literal backticks.
          # Ignore SC2016 only for the workflows that intentionally use them.
          actionlint -color -ignore 'SC2016' \
            .github/workflows/candidate-completion-reconcile.yml \
            .github/workflows/candidate-package-evaluate-v2.yml \
            .github/workflows/candidate-request-gateway.yml

      - name: Validate Bash helper syntax
        shell: bash
        run: |
          bash -n scripts/ci/run-candidate-package-evaluation.sh
          bash -n scripts/ci/repository-dispatch-with-retry.sh

      - name: Validate Python helper syntax
        run: |
          python -m py_compile \
            scripts/ci/build-candidate-completion-ack.py \
            scripts/ci/build-candidate-completion-receipt.py \
            scripts/ci/build-candidate-dispatch-body.py \
            scripts/ci/estimate-candidate-runtime.py \
            scripts/ci/generic-candidate-evaluate.py \
            scripts/ci/normalize-candidate-request.py

      - name: Validate completion protocol schema JSON
        run: |
          python -m json.tool contracts/candidate-completion-receipt.schema.json >/dev/null
          python -m json.tool contracts/candidate-completion-ack.schema.json >/dev/null

      - name: Exercise completion receipt and acknowledgement contract
        shell: bash
        run: |
          set -euo pipefail
          REQUEST_ID=req-contract-001 \
          SOURCE_REPOSITORY=owner/source \
          RECEIPT_REPOSITORY=owner/source \
          HF_BUCKET=owner/source-bucket \
          DRY_RUN=false \
          SUITE=smoke \
          EXECUTOR=github \
          ENVIRONMENT=linux-cpu \
          PROVIDER=CPUExecutionProvider \
          ORCHESTRATOR_REPOSITORY=owner/orchestrator \
          RUN_ID=12345 \
          RUN_ATTEMPT=1 \
          RUN_URL=https://github.com/owner/orchestrator/actions/runs/12345 \
          COMMIT_SHA=0000000000000000000000000000000000000000 \
          REQUESTED_CANDIDATE_ID=candidate-000001 \
          RESOLVED_CANDIDATE_ID=candidate-000001 \
          IMAGE_REF=ghcr.io/owner/source@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
          IMAGE_DIGEST=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
          BUILD_RESULT=success \
          CPU_RESULT=success \
          CUDA_RESULT=skipped \
          COREML_RESULT=skipped \
          DIRECTML_RESULT=skipped \
          HF_JOBS_RESULT=skipped \
          python scripts/ci/build-candidate-completion-receipt.py \
            --receipt /tmp/receipt.json \
            --dispatch-body /tmp/dispatch.json
          python scripts/ci/build-candidate-completion-receipt.py --validate /tmp/receipt.json

          RECEIVER_REPOSITORY=owner/source \
          RECEIVER_RUN_ID=67890 \
          RECEIVER_RUN_ATTEMPT=1 \
          RECEIVER_RUN_URL=https://github.com/owner/source/actions/runs/67890 \
          ACCEPTED_AT=2026-08-17T00:00:01Z \
          python scripts/ci/build-candidate-completion-ack.py \
            --receipt /tmp/receipt.json \
            --ack /tmp/ack.json \
            --dispatch-body /tmp/ack-dispatch.json
          python scripts/ci/build-candidate-completion-ack.py --validate /tmp/ack.json

          receipt_sha="$(python scripts/ci/build-candidate-completion-ack.py --receipt-sha /tmp/receipt.json)"

          python - <<'PY'
          import json
          from pathlib import Path

          dispatch = json.loads(Path('/tmp/dispatch.json').read_text())
          ack_dispatch = json.loads(Path('/tmp/ack-dispatch.json').read_text())
          ack = ack_dispatch['client_payload']
          assert dispatch['event_type'] == 'jpapt.candidate-completed'
          assert dispatch['client_payload']['request_id'] == 'req-contract-001'
          assert dispatch['client_payload']['conclusion'] == 'success'
          assert ack_dispatch['event_type'] == 'jpapt.candidate-completion-ack'
          assert ack['request_id'] == 'req-contract-001'
          assert len(ack['receipt_sha256']) == 64

          receipt = json.loads(Path('/tmp/receipt.json').read_text())
          reversed_receipt = {key: receipt[key] for key in reversed(list(receipt))}
          Path('/tmp/receipt-reordered.json').write_text(json.dumps(reversed_receipt), encoding='utf-8')
          PY

          RECEIVER_REPOSITORY=owner/source \
          RECEIVER_RUN_ID=67891 \
          RECEIVER_RUN_ATTEMPT=1 \
          RECEIVER_RUN_URL=https://github.com/owner/source/actions/runs/67891 \
          ACCEPTED_AT=2026-08-17T00:00:02Z \
          python scripts/ci/build-candidate-completion-ack.py \
            --receipt /tmp/receipt-reordered.json \
            --ack /tmp/ack-reordered.json \
            --dispatch-body /tmp/ack-reordered-dispatch.json

          reordered_sha="$(python scripts/ci/build-candidate-completion-ack.py --receipt-sha /tmp/receipt-reordered.json)"
          [[ "$receipt_sha" == "$reordered_sha" ]]

          python - <<'PY'
          import json
          from pathlib import Path
          first = json.loads(Path('/tmp/ack.json').read_text())
          second = json.loads(Path('/tmp/ack-reordered.json').read_text())
          assert first['receipt_sha256'] == second['receipt_sha256']
          PY

      - name: Test Rust candidate request contract
        run: cargo test --locked -p asr-contracts --bin asr-candidate-request

      - name: Verify candidate Dockerfile parses
        run: docker buildx build --check -f docker/candidate-package/Dockerfile .
