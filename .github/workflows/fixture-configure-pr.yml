name: Fixture Configure PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  configure:
    if: github.head_ref == 'docs/current-premiere-integration-spec-20260819'
    environment: Private-Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_REPOSITORY: bie3yeik-lgtm/jpapt-protocol-e2e-source
      ORCHESTRATOR_REPOSITORY: bie3yeik-lgtm/jpapt-v2.2-inspection
      SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
      TARGET_REPO_TOKEN: ${{ secrets.TARGET_REPO_TOKEN }}
      JPAPT_ACK_TOKEN: ${{ secrets.JPAPT_ACK_TOKEN }}
    steps:
      - name: Configure trust variable and ACK secret
        shell: bash
        env:
          GH_TOKEN: ${{ env.TARGET_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo '::error::TARGET_REPO_TOKEN missing'; exit 1; }
          test -n "${JPAPT_ACK_TOKEN:-}" || { echo '::error::JPAPT_ACK_TOKEN missing'; exit 1; }
          gh variable set JPAPT_ORCHESTRATOR_REPOSITORIES --repo "$TARGET_REPOSITORY" --body "$ORCHESTRATOR_REPOSITORY"
          printf '%s' "$JPAPT_ACK_TOKEN" | gh secret set JPAPT_ACK_TOKEN --repo "$TARGET_REPOSITORY" --body -

      - name: Verify runtime source token can read fixture
        shell: bash
        env:
          GH_TOKEN: ${{ env.SOURCE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo '::error::SOURCE_REPO_TOKEN missing'; exit 1; }
          test "$(gh api "/repos/$TARGET_REPOSITORY" --jq .full_name)" = "$TARGET_REPOSITORY"
          test "$(gh api "/repos/$TARGET_REPOSITORY" --jq .private)" = true
          gh api "/repos/$TARGET_REPOSITORY/contents/.github/workflows/candidate-completion-receipt.yml" --jq .sha >/dev/null

      - name: Record success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 70 --repo "$GITHUB_REPOSITORY" --body "Fixture trust configuration succeeded in run \`$GITHUB_RUN_ID\`: \`JPAPT_ORCHESTRATOR_REPOSITORIES\` set to \`$ORCHESTRATOR_REPOSITORY\`, \`JPAPT_ACK_TOKEN\` stored in the fixture repository, and runtime \`SOURCE_REPO_TOKEN\` read access to the private fixture verified. Secret values were not emitted."
