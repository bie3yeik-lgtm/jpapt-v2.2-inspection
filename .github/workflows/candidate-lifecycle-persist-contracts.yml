name: Candidate Lifecycle Persist Contracts

on:
  push:
    branches: [main]
    paths:
      - .github/actionlint.yaml
      - .github/workflows/candidate-lifecycle-persist.yml
      - .github/workflows/candidate-lifecycle-persist-contracts.yml
      - .github/workflows/candidate-request-status.yml
      - scripts/ci/build-candidate-request-lifecycle.py
      - scripts/ci/persist-candidate-lifecycle.sh
      - scripts/ci/reduce-candidate-lifecycle.py
      - scripts/ci/compare-candidate-lifecycle-state.py
  pull_request:
    paths:
      - .github/actionlint.yaml
      - .github/workflows/candidate-lifecycle-persist.yml
      - .github/workflows/candidate-lifecycle-persist-contracts.yml
      - .github/workflows/candidate-request-status.yml
      - scripts/ci/build-candidate-request-lifecycle.py
      - scripts/ci/persist-candidate-lifecycle.sh
      - scripts/ci/reduce-candidate-lifecycle.py
      - scripts/ci/compare-candidate-lifecycle-state.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-lifecycle-persist-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Validate persistent lifecycle contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: false
      - name: Install pinned actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Lint lifecycle workflows
        run: >-
          actionlint -color -ignore 'SC2016'
          .github/workflows/candidate-lifecycle-persist.yml
          .github/workflows/candidate-lifecycle-persist-contracts.yml
          .github/workflows/candidate-request-status.yml
      - name: Validate persistence helpers
        run: |
          bash -n scripts/ci/persist-candidate-lifecycle.sh
          python -m py_compile \
            scripts/ci/reduce-candidate-lifecycle.py \
            scripts/ci/compare-candidate-lifecycle-state.py
      - name: Exercise local no-op persistence contract
        shell: bash
        run: |
          set -euo pipefail
          REQUEST_ID=persist-contract-001 \
          SOURCE_REPOSITORY=owner/source \
          RECEIPT_REPOSITORY=owner/source \
          ORCHESTRATOR_REPOSITORY=owner/orchestrator \
          GATEWAY_RUN_ID=101 \
          UPDATED_AT=2026-08-17T10:00:00Z \
          python scripts/ci/build-candidate-request-lifecycle.py \
            --state dispatched \
            --output /tmp/lifecycle.json >/dev/null
          env -u HF_LIFECYCLE_BUCKET -u HF_TOKEN \
            bash scripts/ci/persist-candidate-lifecycle.sh /tmp/lifecycle.json
      - name: Verify persistent storage layout contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F '"$base/events/$evidence_key.lifecycle.json"' scripts/ci/persist-candidate-lifecycle.sh
          grep -F '"$base/states/$state.json"' scripts/ci/persist-candidate-lifecycle.sh
          grep -F '"$base/evidence/$digest-$name"' scripts/ci/persist-candidate-lifecycle.sh
          grep -F 'state in {"planned", "dispatched", "rejected"}' scripts/ci/persist-candidate-lifecycle.sh
          grep -F 'snapshot_key = hashlib.sha256(snapshot_bytes).hexdigest()[:16]' scripts/ci/persist-candidate-lifecycle.sh
          grep -F 'f"gateway-{run_id or '\''unknown'\''}-{state}-{snapshot_key}"' scripts/ci/persist-candidate-lifecycle.sh
          grep -F 'f"{snapshot['\''evaluation_run_attempt'\'']}-running-{snapshot_key}"' scripts/ci/persist-candidate-lifecycle.sh
          grep -F 'f"{snapshot['\''evaluation_run_attempt'\'']}-completed-{snapshot_key}"' scripts/ci/persist-candidate-lifecycle.sh
          grep -F 'f"{snapshot['\''receiver_run_id'\'']}-acknowledged-{snapshot_key}"' scripts/ci/persist-candidate-lifecycle.sh
          grep -F 'compare-candidate-lifecycle-state.py' scripts/ci/persist-candidate-lifecycle.sh
          grep -F 'group: candidate-lifecycle-persist-${{ github.repository }}' .github/workflows/candidate-lifecycle-persist.yml
          grep -F 'cancel-in-progress: false' .github/workflows/candidate-lifecycle-persist.yml
          grep -F 'newer retry may legitimately be' .github/workflows/candidate-request-status.yml
          grep -F 'scripts/ci/reduce-candidate-lifecycle.py' .github/workflows/candidate-request-status.yml
      - name: Verify materialized-state monotonic comparator
        shell: bash
        run: |
          set -euo pipefail
          REQUEST_ID=monotonic-status-001 \
          SOURCE_REPOSITORY=owner/source \
          RECEIPT_REPOSITORY=owner/receiver \
          ORCHESTRATOR_REPOSITORY=owner/orchestrator \
          EVALUATION_RUN_ID=100 \
          EVALUATION_RUN_ATTEMPT=1 \
          UPDATED_AT=2026-08-17T10:00:00Z \
          python scripts/ci/build-candidate-request-lifecycle.py \
            --state running --output /tmp/existing-running.json >/dev/null

          REQUEST_ID=monotonic-status-001 \
          SOURCE_REPOSITORY=owner/source \
          RECEIPT_REPOSITORY=owner/receiver \
          ORCHESTRATOR_REPOSITORY=owner/orchestrator \
          EVALUATION_RUN_ID=101 \
          EVALUATION_RUN_ATTEMPT=1 \
          UPDATED_AT=2026-08-17T09:00:00Z \
          python scripts/ci/build-candidate-request-lifecycle.py \
            --state running --output /tmp/older-running.json >/dev/null

          REQUEST_ID=monotonic-status-001 \
          SOURCE_REPOSITORY=owner/source \
          RECEIPT_REPOSITORY=owner/receiver \
          ORCHESTRATOR_REPOSITORY=owner/orchestrator \
          EVALUATION_RUN_ID=102 \
          EVALUATION_RUN_ATTEMPT=1 \
          UPDATED_AT=2026-08-17T11:00:00Z \
          python scripts/ci/build-candidate-request-lifecycle.py \
            --state running --output /tmp/newer-running.json >/dev/null

          test "$(python scripts/ci/compare-candidate-lifecycle-state.py \
            --existing /tmp/existing-running.json --incoming /tmp/older-running.json)" = false
          test "$(python scripts/ci/compare-candidate-lifecycle-state.py \
            --existing /tmp/existing-running.json --incoming /tmp/newer-running.json)" = true
          test "$(python scripts/ci/compare-candidate-lifecycle-state.py \
            --existing /tmp/existing-running.json --incoming /tmp/existing-running.json)" = true
      - name: Reject materialized-state identity mismatch
        shell: bash
        run: |
          set -euo pipefail
          REQUEST_ID=other-request \
          SOURCE_REPOSITORY=owner/source \
          RECEIPT_REPOSITORY=owner/receiver \
          ORCHESTRATOR_REPOSITORY=owner/orchestrator \
          EVALUATION_RUN_ID=103 \
          EVALUATION_RUN_ATTEMPT=1 \
          UPDATED_AT=2026-08-17T12:00:00Z \
          python scripts/ci/build-candidate-request-lifecycle.py \
            --state running --output /tmp/other-running.json >/dev/null
          if python scripts/ci/compare-candidate-lifecycle-state.py \
            --existing /tmp/existing-running.json \
            --incoming /tmp/other-running.json; then
            echo 'identity mismatch unexpectedly accepted' >&2
            exit 1
          fi
      - name: Verify latest observation wins across retries
        shell: bash
        run: |
          set -euo pipefail
          REQUEST_ID=retry-status-001 \
          SOURCE_REPOSITORY=owner/source \
          RECEIPT_REPOSITORY=owner/receiver \
          ORCHESTRATOR_REPOSITORY=owner/orchestrator \
          EVALUATION_RUN_ID=100 \
          EVALUATION_RUN_ATTEMPT=1 \
          RECEIPT_SHA256=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
          RECEIVER_RUN_ID=200 \
          UPDATED_AT=2026-08-17T10:00:00Z \
          python scripts/ci/build-candidate-request-lifecycle.py \
            --state acknowledged --output /tmp/old-ack.json >/dev/null

          REQUEST_ID=retry-status-001 \
          SOURCE_REPOSITORY=owner/source \
          RECEIPT_REPOSITORY=owner/receiver \
          ORCHESTRATOR_REPOSITORY=owner/orchestrator \
          EVALUATION_RUN_ID=300 \
          EVALUATION_RUN_ATTEMPT=1 \
          UPDATED_AT=2026-08-17T11:00:00Z \
          python scripts/ci/build-candidate-request-lifecycle.py \
            --state running --output /tmp/new-running.json >/dev/null

          python scripts/ci/reduce-candidate-lifecycle.py \
            --request-id retry-status-001 \
            --candidate hf-bucket=/tmp/old-ack.json \
            --candidate github-artifact=/tmp/new-running.json \
            --output /tmp/reduced.json
          test "$(jq -r .state /tmp/reduced.json)" = running
          test "$(jq -r .evaluation_run_id /tmp/reduced.json)" = 300
      - name: Verify state rank only breaks timestamp ties
        shell: bash
        run: |
          set -euo pipefail
          REQUEST_ID=tie-status-001 \
          SOURCE_REPOSITORY=owner/source \
          RECEIPT_REPOSITORY=owner/receiver \
          ORCHESTRATOR_REPOSITORY=owner/orchestrator \
          EVALUATION_RUN_ID=400 \
          EVALUATION_RUN_ATTEMPT=1 \
          UPDATED_AT=2026-08-17T12:00:00Z \
          python scripts/ci/build-candidate-request-lifecycle.py \
            --state running --output /tmp/tie-running.json >/dev/null

          REQUEST_ID=tie-status-001 \
          SOURCE_REPOSITORY=owner/source \
          RECEIPT_REPOSITORY=owner/receiver \
          ORCHESTRATOR_REPOSITORY=owner/orchestrator \
          EVALUATION_RUN_ID=400 \
          EVALUATION_RUN_ATTEMPT=1 \
          RECEIPT_SHA256=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
          UPDATED_AT=2026-08-17T12:00:00Z \
          python scripts/ci/build-candidate-request-lifecycle.py \
            --state completed --output /tmp/tie-completed.json >/dev/null

          python scripts/ci/reduce-candidate-lifecycle.py \
            --request-id tie-status-001 \
            --candidate artifact=/tmp/tie-running.json \
            --candidate bucket=/tmp/tie-completed.json \
            --output /tmp/tie-reduced.json
          test "$(jq -r .state /tmp/tie-reduced.json)" = completed
