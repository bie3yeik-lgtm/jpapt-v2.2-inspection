name: Candidate Gateway Secret Scope Contracts

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/candidate-request-gateway.yml
      - .github/workflows/candidate-gateway-secret-scope-contracts.yml
      - scripts/ci/check-candidate-gateway-secret-scope.py
  pull_request:
    paths:
      - .github/workflows/candidate-request-gateway.yml
      - .github/workflows/candidate-gateway-secret-scope-contracts.yml
      - scripts/ci/check-candidate-gateway-secret-scope.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check Candidate Request Gateway credential scope
        run: python scripts/ci/check-candidate-gateway-secret-scope.py
