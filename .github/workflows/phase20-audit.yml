name: Phase20 Cleanup

on:
  push:
    branches: [agent/rust-python-boundary-cleanup-phase20]
    paths:
      - ".github/workflows/phase20-audit.yml"

permissions:
  contents: write

jobs:
  cleanup-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/rust-python-boundary-cleanup-phase20
      - name: Remove dead Python entrypoint and repair docs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          tools = Path('tools/README.md')
          text = tools.read_text(encoding='utf-8')
          old = '''scripts/ci/validate-revisions.py
          scripts/ci/validate-result.py
          scripts/ci/make-run-context.py'''
          new = '''scripts/ci/validate-revisions.sh
          scripts/ci/resolve-candidate-artifacts.py
          scripts/ci/prepare-rust-manifest.py'''
          if text.count(old) != 1:
              raise SystemExit('tools/README.md legacy CI example block not found exactly once')
          tools.write_text(text.replace(old, new, 1), encoding='utf-8')

          docs = Path('docs/workflows.md')
          text = docs.read_text(encoding='utf-8')
          old = '''python scripts/ci/prepare-rust-run-context.py \\
            --provider cpu \\
            --evaluation full \\
            --environment linux \\
            --model-config parakeet-tdt_ctc-0.6b-ja \\
            --candidate-dir .ci/hf/candidate \\
            --runtime-variant ctc \\
            --revisions .ci/hf/config/revisions \\
            --output .ci/run-context.json'''
          new = '''cargo run --quiet --locked -p asr-contracts --bin asr-contracts -- \\
            build-run-context \\
            --repository-root . \\
            --model parakeet-tdt_ctc-0.6b-ja \\
            --provider cpu \\
            --evaluation full \\
            --environment linux \\
            --revisions .ci/hf/config/revisions \\
            --candidate-contract .ci/candidate-contract.json \\
            --runtime-variant ctc \\
            --output .ci/run-context.json'''
          if text.count(old) != 1:
              raise SystemExit('docs/workflows.md legacy run-context block not found exactly once')
          docs.write_text(text.replace(old, new, 1), encoding='utf-8')

          Path('scripts/ci/make-run-context.py').unlink()
          PY

          if git grep -n 'make-run-context.py' -- ':!.github/workflows/phase20-audit.yml'; then
            echo 'dead make-run-context.py reference remains' >&2
            exit 1
          fi
          if git grep -n 'prepare-rust-run-context.py' -- ':!.github/workflows/provider-strict-probes.yml' ':!.github/workflows/phase20-audit.yml'; then
            echo 'legacy prepare-rust-run-context.py reference remains outside provider stale path' >&2
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/workflows.md tools/README.md
          git add -u scripts/ci/make-run-context.py
          git commit -m 'Remove dead Python run-context entrypoint'
          git push origin HEAD:agent/rust-python-boundary-cleanup-phase20
