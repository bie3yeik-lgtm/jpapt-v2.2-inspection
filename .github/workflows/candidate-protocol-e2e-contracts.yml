name: Candidate Protocol E2E Contracts

on:
  push:
    branches: [main]
    paths:
      - .github/actionlint.yaml
      - .github/workflows/candidate-protocol-e2e.yml
      - .github/workflows/candidate-protocol-negative-e2e.yml
      - .github/workflows/candidate-protocol-e2e-contracts.yml
      - docs/candidate-protocol-e2e.md
      - config/candidate-receiver-bundle.json
      - scripts/ci/candidate_receiver_bundle.py
      - scripts/ci/candidate_protocol_common.py
      - scripts/ci/workflow-dispatch-with-retry.sh
      - scripts/ci/build-candidate-request-lifecycle.py
      - scripts/ci/build-candidate-completion-receipt.py
      - scripts/ci/build-candidate-completion-ack.py
      - scripts/ci/validate-candidate-protocol-binding.py
      - rust/crates/asr-contracts/src/bin/asr-candidate-protocol.rs
      - rust/crates/asr-contracts/src/bin/asr-candidate-protocol-build.rs
      - Cargo.toml
      - Cargo.lock
  pull_request:
    paths:
      - .github/actionlint.yaml
      - .github/workflows/candidate-protocol-e2e.yml
      - .github/workflows/candidate-protocol-negative-e2e.yml
      - .github/workflows/candidate-protocol-e2e-contracts.yml
      - docs/candidate-protocol-e2e.md
      - config/candidate-receiver-bundle.json
      - scripts/ci/candidate_receiver_bundle.py
      - scripts/ci/candidate_protocol_common.py
      - scripts/ci/workflow-dispatch-with-retry.sh
      - scripts/ci/build-candidate-request-lifecycle.py
      - scripts/ci/build-candidate-completion-receipt.py
      - scripts/ci/build-candidate-completion-ack.py
      - scripts/ci/validate-candidate-protocol-binding.py
      - rust/crates/asr-contracts/src/bin/asr-candidate-protocol.rs
      - rust/crates/asr-contracts/src/bin/asr-candidate-protocol-build.rs
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-protocol-e2e-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Validate cross-repository E2E harness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: false
      - name: Install pinned actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Lint E2E workflows
        run: >-
          actionlint -color -ignore 'SC2016'
          .github/workflows/candidate-protocol-e2e.yml
          .github/workflows/candidate-protocol-negative-e2e.yml
          .github/workflows/candidate-protocol-e2e-contracts.yml
      - name: Validate canonical receiver bundle
        run: |
          python -m py_compile scripts/ci/candidate_receiver_bundle.py
          python -m json.tool config/candidate-receiver-bundle.json >/dev/null
          python scripts/ci/candidate_receiver_bundle.py --validate
      - name: Verify manual-only and cross-repository guard
        shell: bash
        run: |
          set -euo pipefail
          for workflow in \
            .github/workflows/candidate-protocol-e2e.yml \
            .github/workflows/candidate-protocol-negative-e2e.yml; do
            grep -F 'workflow_dispatch:' "$workflow"
            if grep -Eq '^  (push|pull_request|schedule|repository_dispatch|workflow_run):' "$workflow"; then
              echo "E2E workflow unexpectedly has an automatic trigger: $workflow" >&2
              exit 1
            fi
            grep -F '[[ "$RECEIPT_REPOSITORY" != "$GITHUB_REPOSITORY" ]]' "$workflow"
          done
      - name: Verify dry-run cost boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'dry_run: true' .github/workflows/candidate-protocol-e2e.yml
          grep -F "assert receipt['dry_run'] is True" .github/workflows/candidate-protocol-e2e.yml
          grep -F "assert receipt['conclusion'] == 'success'" .github/workflows/candidate-protocol-e2e.yml
          for workflow in \
            .github/workflows/candidate-protocol-e2e.yml \
            .github/workflows/candidate-protocol-negative-e2e.yml; do
            if grep -F 'hf jobs run' "$workflow"; then
              echo "E2E workflow must not launch Hugging Face Jobs directly: $workflow" >&2
              exit 1
            fi
          done
      - name: Verify bounded V2 dispatch
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'workflow-dispatch-with-retry.sh' .github/workflows/candidate-protocol-e2e.yml
          grep -F 'candidate-package-evaluate-v2.yml' .github/workflows/candidate-protocol-e2e.yml
          if grep -F 'actions/workflows/candidate-package-evaluate-v2.yml/dispatches' .github/workflows/candidate-protocol-e2e.yml; then
            echo 'E2E workflow must not bypass bounded workflow dispatch helper' >&2
            exit 1
          fi
      - name: Verify lifecycle correlation contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}' .github/workflows/candidate-protocol-e2e.yml
          grep -F 'candidate-lifecycle-$REQUEST_KEY-$state' .github/workflows/candidate-protocol-e2e.yml
          grep -F 'for state in acknowledged completed running' .github/workflows/candidate-protocol-e2e.yml
          grep -F 'candidate-completion-$evaluation_run_id-$evaluation_run_attempt' .github/workflows/candidate-protocol-e2e.yml
          grep -F 'candidate-completion-ack-$receipt_sha' .github/workflows/candidate-protocol-e2e.yml
      - name: Verify orchestrator evidence recovery uses Rust authority
        shell: bash
        run: |
          set -euo pipefail
          e2e=.github/workflows/candidate-protocol-e2e.yml
          grep -F 'dtolnay/rust-toolchain@stable' "$e2e"
          grep -F 'asr-candidate-protocol --' "$e2e"
          grep -F 'receipt-validate "$receipt"' "$e2e"
          grep -F 'ack-validate "$ack"' "$e2e"
          grep -F 'ack-binding' "$e2e"
          grep -F -- '--receipt "$receipt"' "$e2e"
          grep -F -- '--ack "$ack"' "$e2e"
          grep -F -- '--orchestrator "$GITHUB_REPOSITORY"' "$e2e"
          if grep -F 'build-candidate-completion-receipt.py --validate' "$e2e"; then
            echo 'orchestrator E2E unexpectedly reverted receipt validation to Python' >&2
            exit 1
          fi
          if grep -F 'build-candidate-completion-ack.py --validate' "$e2e"; then
            echo 'orchestrator E2E unexpectedly reverted ACK validation to Python' >&2
            exit 1
          fi
          if grep -F 'validate-candidate-protocol-binding.py' "$e2e"; then
            echo 'orchestrator E2E unexpectedly reverted ACK binding authority to Python' >&2
            exit 1
          fi
      - name: Verify receiver preflight contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'actions/workflows/candidate-completion-receipt.yml' .github/workflows/candidate-protocol-e2e.yml
          grep -F 'candidate_receiver_bundle.py --assert-installation /tmp/receiver-manifest.json' .github/workflows/candidate-protocol-e2e.yml
          grep -F 'receiver installation manifest is stale or incomplete' .github/workflows/candidate-protocol-e2e.yml
          grep -F 'candidate_receiver_bundle.py --paths' .github/workflows/candidate-protocol-e2e.yml
          for path in \
            .github/workflows/candidate-completion-receipt.yml \
            .github/workflows/candidate-request-rejection.yml \
            scripts/ci/candidate_protocol_common.py \
            scripts/ci/build-candidate-completion-receipt.py \
            scripts/ci/build-candidate-completion-ack.py \
            scripts/ci/build-candidate-request-rejection.py \
            scripts/ci/validate-candidate-protocol-binding.py \
            scripts/ci/repository-dispatch-with-retry.sh; do
            grep -Fx "$path" < <(python scripts/ci/candidate_receiver_bundle.py --paths)
          done
      - name: Verify external negative E2E fail-closed contract
        shell: bash
        run: |
          set -euo pipefail
          negative=.github/workflows/candidate-protocol-negative-e2e.yml
          grep -F 'environment: Private-Secrets' "$negative"
          grep -F 'TARGET_REPO_TOKEN is required for external negative E2E' "$negative"
          grep -F 'jpapt.candidate-completed' "$negative"
          grep -F 'run_case malformed' "$negative"
          grep -F 'run_case wrong-orchestrator' "$negative"
          grep -F 'run_case wrong-receipt-repository' "$negative"
          grep -F 'Validate CandidateCompletionReceiptV1' "$negative"
          grep -F 'Validate receiver and orchestrator binding' "$negative"
          grep -F 'Build CandidateCompletionAckV1' "$negative"
          grep -F 'Dispatch acknowledgement to orchestrator' "$negative"
          grep -F '[[ "$build_result" == skipped ]]' "$negative"
          grep -F '[[ "$dispatch_result" == skipped ]]' "$negative"
          grep -F 'retention-days: 30' "$negative"
          if grep -F 'secrets.SOURCE_REPO_TOKEN' "$negative"; then
            echo 'external negative E2E must not use source token' >&2
            exit 1
          fi
