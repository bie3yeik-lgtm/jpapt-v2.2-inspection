name: Fixture Provision Once

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  provision:
    environment: Private-Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_REPO_TOKEN: ${{ secrets.TARGET_REPO_TOKEN }}
      SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
      FIXTURE_REPOSITORY: bie3yeik-lgtm/jpapt-protocol-e2e-source
    steps:
      - name: Create or confirm dedicated fixture
        id: fixture
        shell: bash
        run: |
          set -euo pipefail
          choose_token() {
            if [[ -n "${TARGET_REPO_TOKEN:-}" ]]; then
              printf '%s' "$TARGET_REPO_TOKEN"
            elif [[ -n "${SOURCE_REPO_TOKEN:-}" ]]; then
              printf '%s' "$SOURCE_REPO_TOKEN"
            else
              return 1
            fi
          }
          token="$(choose_token)" || {
            echo 'reason=no-environment-token' >> "$GITHUB_OUTPUT"
            exit 1
          }
          export GH_TOKEN="$token"
          echo 'token_injected=true' >> "$GITHUB_OUTPUT"

          if gh api "/repos/$FIXTURE_REPOSITORY" >/tmp/repo.json 2>/tmp/get.err; then
            echo 'created=false' >> "$GITHUB_OUTPUT"
          else
            name="${FIXTURE_REPOSITORY#*/}"
            gh api --method POST /user/repos \
              -f name="$name" \
              -f description='Dedicated JPAPT candidate protocol cross-repository E2E fixture' \
              -F private=true \
              -F auto_init=true \
              >/tmp/repo.json
            echo 'created=true' >> "$GITHUB_OUTPUT"
          fi

          actual="$(jq -r .full_name /tmp/repo.json)"
          private="$(jq -r .private /tmp/repo.json)"
          default_branch="$(jq -r .default_branch /tmp/repo.json)"
          [[ "$actual" == "$FIXTURE_REPOSITORY" ]]
          [[ "$private" == true ]]
          [[ -n "$default_branch" && "$default_branch" != null ]]
          echo "default_branch=$default_branch" >> "$GITHUB_OUTPUT"
          echo 'reason=success' >> "$GITHUB_OUTPUT"

      - name: Record success on issue 70
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          CREATED: ${{ steps.fixture.outputs.created }}
          DEFAULT_BRANCH: ${{ steps.fixture.outputs.default_branch }}
        run: |
          gh issue comment 70 --repo "$GITHUB_REPOSITORY" --body "Dedicated fixture provisioning succeeded after PAT permission update. Repository: \`$FIXTURE_REPOSITORY\`; run: \`$GITHUB_RUN_ID\`; created: \`${CREATED}\`; private: \`true\`; default branch: \`${DEFAULT_BRANCH}\`. No receiver bootstrap, protocol dispatch, HF Bucket mutation, model compute, GPU, Docker evaluation, or HF Jobs was performed by this step."
