name: Migrate Revision Validator Phase6

on:
  push:
    branches: [agent/remove-revision-python-shim-phase6]
    paths:
      - "scripts/ci/validate-revisions.sh"
      - ".github/workflows/migrate-revision-validator-phase6.yml"

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/remove-revision-python-shim-phase6
      - name: Replace Python revision validator entrypoints
        shell: bash
        run: |
          set -euo pipefail
          grep -RIl --include='*.yml' 'python scripts/ci/validate-revisions.py' .github/workflows \
            | while read -r file; do
                sed -i 's#python scripts/ci/validate-revisions.py#bash scripts/ci/validate-revisions.sh#g' "$file"
              done
      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows
          git commit -m "Route revision validation workflows to Rust"
          git push origin HEAD:agent/remove-revision-python-shim-phase6
