name: Candidate Receiver Bootstrap

on:
  workflow_dispatch:
    inputs:
      repository:
        description: External receiver repository in owner/name form
        required: true
        type: string
      adopt_existing:
        description: Allow replacing managed paths when no jpapt installation manifest exists
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}

jobs:
  bootstrap:
    name: Install or update candidate protocol receiver
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Resolve target and ownership boundary
        id: target
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
          TARGET_REPOSITORY: ${{ inputs.repository }}
          ADOPT_EXISTING: ${{ inputs.adopt_existing }}
        run: |
          set -euo pipefail
          repo_re='^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'
          [[ "$TARGET_REPOSITORY" =~ $repo_re ]] || {
            echo "::error::repository must use owner/name"
            exit 1
          }
          [[ "$TARGET_REPOSITORY" != "$GITHUB_REPOSITORY" ]] || {
            echo "::error::bootstrap target must be an external repository"
            exit 1
          }
          [[ -n "${GH_TOKEN:-}" ]] || {
            echo "::error::SOURCE_REPO_TOKEN is required for receiver bootstrap"
            exit 1
          }
          python scripts/ci/candidate_receiver_bundle.py --validate

          meta="$(gh api "/repos/$TARGET_REPOSITORY")"
          default_branch="$(jq -r '.default_branch' <<<"$meta")"
          [[ -n "$default_branch" && "$default_branch" != null ]] || {
            echo "::error::unable to resolve target default branch"
            exit 1
          }

          manifest_encoded="$(gh api "/repos/$TARGET_REPOSITORY/contents/.jpapt/candidate-receiver.json?ref=$default_branch" --jq .content 2>/dev/null || true)"
          if [[ -n "$manifest_encoded" ]]; then
            printf '%s' "$manifest_encoded" | tr -d '\n' | base64 -d > /tmp/existing-receiver.json
            python scripts/ci/build-candidate-receiver-installation.py --validate /tmp/existing-receiver.json
            python - "$TARGET_REPOSITORY" "$GITHUB_REPOSITORY" <<'PY'
          import json
          import sys
          from pathlib import Path
          value = json.loads(Path('/tmp/existing-receiver.json').read_text(encoding='utf-8'))
          if value['receiver_repository'] != sys.argv[1]:
              raise SystemExit('existing receiver manifest belongs to another repository')
          if value['orchestrator_repository'] != sys.argv[2]:
              raise SystemExit('existing receiver installation is managed by another orchestrator')
          PY

            python - /tmp/existing-receiver.json <<'PY' > /tmp/existing-managed.tsv
          import json
          import sys
          from pathlib import Path
          value = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          for item in value['managed_files']:
              print(f"{item['sha256']}\t{item['path']}")
          PY
            while IFS=$'\t' read -r expected path; do
              encoded="$(gh api "/repos/$TARGET_REPOSITORY/contents/$path?ref=$default_branch" --jq .content 2>/dev/null || true)"
              if [[ -z "$encoded" ]]; then
                echo "::notice::managed path is missing and will be repaired: $path"
                continue
              fi
              actual="$(printf '%s' "$encoded" | tr -d '\n' | base64 -d | sha256sum | awk '{print $1}')"
              [[ "$actual" == "$expected" ]] || {
                echo "::error::managed path drifted from the owned installation manifest: $path"
                echo "::error::bootstrap refuses to overwrite a modified managed path; review or restore it first"
                exit 1
              }
            done < /tmp/existing-managed.tsv

            if ! python scripts/ci/candidate_receiver_bundle.py --assert-installation /tmp/existing-receiver.json; then
              echo "::notice::existing receiver manifest is stale; bootstrap will converge it to the canonical bundle"
            fi
          else
            mapfile -t managed_mappings < <(python scripts/ci/candidate_receiver_bundle.py --mappings)
            for mapping in "${managed_mappings[@]}"; do
              target="${mapping%%=*}"
              source="${mapping#*=}"
              encoded="$(gh api "/repos/$TARGET_REPOSITORY/contents/$target?ref=$default_branch" --jq .content 2>/dev/null || true)"
              [[ -n "$encoded" ]] || continue
              remote_hash="$(printf '%s' "$encoded" | tr -d '\n' | base64 -d | sha256sum | awk '{print $1}')"
              local_hash="$(sha256sum "$source" | awk '{print $1}')"
              if [[ "$remote_hash" == "$local_hash" ]]; then
                echo "::notice::recoverable partial install already matches canonical source: $target"
                continue
              fi
              if [[ "$ADOPT_EXISTING" != true ]]; then
                echo "::error::managed path already exists without jpapt manifest and differs from canonical source: $target"
                echo "::error::rerun with adopt_existing=true only after reviewing the target repository"
                exit 1
              fi
            done
          fi

          echo "default_branch=$default_branch" >> "$GITHUB_OUTPUT"

      - name: Build installation manifest
        shell: bash
        env:
          RECEIVER_REPOSITORY: ${{ inputs.repository }}
          ORCHESTRATOR_REPOSITORY: ${{ github.repository }}
          ORCHESTRATOR_COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          file_args=()
          while IFS= read -r mapping; do
            file_args+=(--file "$mapping")
          done < <(python scripts/ci/candidate_receiver_bundle.py --mappings)
          python scripts/ci/build-candidate-receiver-installation.py \
            --output /tmp/candidate-receiver.json \
            "${file_args[@]}"
          python scripts/ci/build-candidate-receiver-installation.py --validate /tmp/candidate-receiver.json
          python scripts/ci/candidate_receiver_bundle.py --assert-installation /tmp/candidate-receiver.json

      - name: Install receiver bundle atomically
        id: install
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
          TARGET_REPOSITORY: ${{ inputs.repository }}
          TARGET_BRANCH: ${{ steps.target.outputs.default_branch }}
        run: |
          set -euo pipefail
          head_sha="$(gh api "/repos/$TARGET_REPOSITORY/git/ref/heads/$TARGET_BRANCH" --jq .object.sha)"
          base_tree="$(gh api "/repos/$TARGET_REPOSITORY/git/commits/$head_sha" --jq .tree.sha)"
          entries='[]'

          add_blob() {
            local target="$1"
            local source="$2"
            local content body blob_sha
            content="$(base64 -w0 "$source")"
            body="$(jq -n --arg content "$content" '{content:$content,encoding:"base64"}')"
            blob_sha="$(gh api --method POST "/repos/$TARGET_REPOSITORY/git/blobs" --input - <<<"$body" --jq .sha)"
            entries="$(jq --arg path "$target" --arg sha "$blob_sha" \
              '. + [{path:$path,mode:"100644",type:"blob",sha:$sha}]' <<<"$entries")"
          }

          while IFS=$'\t' read -r target source; do
            add_blob "$target" "$source"
          done < <(python scripts/ci/candidate_receiver_bundle.py --tsv)

          if [[ -f /tmp/existing-receiver.json ]]; then
            while IFS= read -r obsolete; do
              [[ -n "$obsolete" ]] || continue
              echo "::notice::removing obsolete previously managed path: $obsolete"
              entries="$(jq --arg path "$obsolete" \
                '. + [{path:$path,mode:"100644",type:"blob",sha:null}]' <<<"$entries")"
            done < <(python scripts/ci/candidate_receiver_bundle.py --obsolete-installation /tmp/existing-receiver.json)
          fi

          add_blob .jpapt/candidate-receiver.json /tmp/candidate-receiver.json

          tree_body="$(jq -n --arg base_tree "$base_tree" --argjson tree "$entries" '{base_tree:$base_tree,tree:$tree}')"
          tree_sha="$(gh api --method POST "/repos/$TARGET_REPOSITORY/git/trees" --input - <<<"$tree_body" --jq .sha)"
          commit_body="$(jq -n \
            --arg message 'ci: install jpapt candidate protocol receiver' \
            --arg tree "$tree_sha" \
            --arg parent "$head_sha" \
            '{message:$message,tree:$tree,parents:[$parent]}')"
          commit_sha="$(gh api --method POST "/repos/$TARGET_REPOSITORY/git/commits" --input - <<<"$commit_body" --jq .sha)"
          ref_body="$(jq -n --arg sha "$commit_sha" '{sha:$sha,force:false}')"
          gh api --method PATCH "/repos/$TARGET_REPOSITORY/git/refs/heads/$TARGET_BRANCH" --input - <<<"$ref_body" >/dev/null
          echo "target_commit=$commit_sha" >> "$GITHUB_OUTPUT"

      - name: Verify installed hashes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
          TARGET_REPOSITORY: ${{ inputs.repository }}
          TARGET_BRANCH: ${{ steps.target.outputs.default_branch }}
        run: |
          set -euo pipefail
          python - /tmp/candidate-receiver.json <<'PY' > /tmp/managed.tsv
          import json
          import sys
          from pathlib import Path
          value = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          for item in value['managed_files']:
              print(f"{item['sha256']}\t{item['path']}")
          PY
          while IFS=$'\t' read -r expected path; do
            encoded="$(gh api "/repos/$TARGET_REPOSITORY/contents/$path?ref=$TARGET_BRANCH" --jq .content)"
            actual="$(printf '%s' "$encoded" | tr -d '\n' | base64 -d | sha256sum | awk '{print $1}')"
            [[ "$actual" == "$expected" ]] || {
              echo "::error::installed receiver hash mismatch: $path"
              exit 1
            }
          done < /tmp/managed.tsv

          if [[ -f /tmp/existing-receiver.json ]]; then
            while IFS= read -r obsolete; do
              [[ -n "$obsolete" ]] || continue
              if gh api "/repos/$TARGET_REPOSITORY/contents/$obsolete?ref=$TARGET_BRANCH" >/dev/null 2>&1; then
                echo "::error::obsolete managed path still exists after bootstrap: $obsolete"
                exit 1
              fi
            done < <(python scripts/ci/candidate_receiver_bundle.py --obsolete-installation /tmp/existing-receiver.json)
          fi

      - name: Summary
        shell: bash
        run: |
          {
            echo '## Candidate receiver bootstrap'
            echo
            printf -- '- receiver: `%s`\n' '${{ inputs.repository }}'
            printf -- '- orchestrator: `%s`\n' "$GITHUB_REPOSITORY"
            printf -- '- branch: `%s`\n' '${{ steps.target.outputs.default_branch }}'
            printf -- '- target commit: `%s`\n' '${{ steps.install.outputs.target_commit }}'
            printf -- '- manifest: `.jpapt/candidate-receiver.json`\n'
            printf -- '- bundle: `config/candidate-receiver-bundle.json`\n'
            printf -- '- update mode: `single commit / fast-forward ref`\n'
            printf -- '- managed drift policy: `fail closed; missing files repaired`\n'
            printf -- '- obsolete managed paths: `removed atomically`\n'
            echo
            echo '> Receiver Actions variable `JPAPT_ORCHESTRATOR_REPOSITORIES` and secret `JPAPT_ACK_TOKEN` are intentionally not mutated by this workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
