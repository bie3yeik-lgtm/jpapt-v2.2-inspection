name: Phase24 Audit

on:
  push:
    branches: [agent/review-minimal-json-bucket-phase24]
    paths:
      - ".github/workflows/phase24-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Audit potentially redundant model configuration fields
        shell: bash
        run: |
          set -euo pipefail
          for term in \
            'storage.hf_target' \
            'candidate_prefix' \
            'reference_prefix' \
            'run_prefix' \
            'benchmark_prefix' \
            'temporary_prefix' \
            'candidate_storage' \
            'release_storage' \
            'run_storage' \
            'benchmark_storage' \
            'store_model_in_git' \
            'store_audio_in_git' \
            'store_large_tensors_in_git' \
            'smoke_config' \
            'parity_config' \
            'full_config' \
            'manifest_root' \
            'reference_revision' \
            'evaluation_schema_revision' \
            'datasets_lock_revision' \
            'provider_configuration_root' \
            'expected_components' \
            'evaluation.metrics' \
            'tolerance_source' \
            'canonical_reference_format'; do
            echo "--- ${term}"
            git grep -nF "$term" -- ':!config/models/*.toml' ':!docs/**' ':!.github/workflows/phase24-audit.yml' || true
          done
          echo '=== required model accessors ==='
          git grep -nE 'model\.(id|family|architecture|language|upstream_repo_id|supported_providers|providers_for_environment)|execution\.supported_providers|execution\.platforms' -- python rust || true
