name: Rust CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust/**"
      - ".github/workflows/rust-*.yml"
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust/**"
      - ".github/workflows/rust-*.yml"

permissions:
  contents: read

jobs:
  formatting:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  check:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-cpu
            os: ubuntu-latest
            features: cpu
          - name: macos-coreml
            os: macos-15
            features: cpu,coreml
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache cargo and ort
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/ort.pyke.io
            target
          key: rust-${{ matrix.name }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust/crates/**/Cargo.toml') }}
      - name: Verify lockfile
        shell: bash
        run: cargo metadata --locked --no-deps --format-version 1 >/dev/null
      - name: Cargo check
        shell: bash
        run: cargo check --locked --workspace --no-default-features --features "${{ matrix.features }}"
      - name: Clippy
        shell: bash
        run: cargo clippy --locked --workspace --all-targets --no-default-features --features "${{ matrix.features }}" -- -D warnings
      - name: Unit tests
        shell: bash
        run: cargo test --locked --workspace --no-default-features --features "${{ matrix.features }}"
