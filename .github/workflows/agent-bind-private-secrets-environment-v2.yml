name: Agent Bind Private Secrets Environment V2

on:
  push:
    branches:
      - docs/current-premiere-integration-spec-20260819

permissions:
  contents: write
  issues: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: docs/current-premiere-integration-spec-20260819
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Patch canonical workflow jobs
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/patch_env.py <<'PY'
          from pathlib import Path

          markers = ("secrets.SOURCE_REPO_TOKEN", "secrets.JPAPT_ACK_TOKEN")
          changed = []

          for path in sorted(Path('.github/workflows').glob('*.yml')):
              if path.name.startswith('agent-'):
                  continue
              lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
              jobs = None
              for i, line in enumerate(lines):
                  if line == 'jobs:\n':
                      jobs = i
                      break
              if jobs is None:
                  continue

              starts = []
              for i in range(jobs + 1, len(lines)):
                  line = lines[i]
                  if line.startswith('  ') and not line.startswith('    ') and line.rstrip().endswith(':'):
                      starts.append(i)

              inserts = []
              for n, start in enumerate(starts):
                  end = starts[n + 1] if n + 1 < len(starts) else len(lines)
                  block = ''.join(lines[start:end])
                  if not any(marker in block for marker in markers):
                      continue
                  if '    environment: Private-Secrets\n' in lines[start:end]:
                      continue
                  inserts.append(start + 1)

              if inserts:
                  for index in reversed(inserts):
                      lines.insert(index, '    environment: Private-Secrets\n')
                  path.write_text(''.join(lines), encoding='utf-8')
                  changed.append(str(path))

          Path('/tmp/changed.txt').write_text('\n'.join(changed) + ('\n' if changed else ''), encoding='utf-8')
          print('\n'.join(changed) if changed else 'no workflow changes')
          PY
          python /tmp/patch_env.py

          cat > scripts/ci/check-private-secrets-environment.py <<'PY'
          #!/usr/bin/env python3
          from pathlib import Path
          import sys

          markers = ("secrets.SOURCE_REPO_TOKEN", "secrets.JPAPT_ACK_TOKEN")
          errors = []
          for path in sorted(Path('.github/workflows').glob('*.yml')):
              if path.name.startswith('agent-'):
                  continue
              lines = path.read_text(encoding='utf-8').splitlines()
              try:
                  jobs = lines.index('jobs:')
              except ValueError:
                  continue
              starts = [
                  i for i in range(jobs + 1, len(lines))
                  if lines[i].startswith('  ')
                  and not lines[i].startswith('    ')
                  and lines[i].endswith(':')
              ]
              for n, start in enumerate(starts):
                  end = starts[n + 1] if n + 1 < len(starts) else len(lines)
                  block = lines[start:end]
                  joined = '\n'.join(block)
                  if not any(marker in joined for marker in markers):
                      continue
                  if '    environment: Private-Secrets' not in block:
                      errors.append(f"{path}:{lines[start].strip()[:-1]}")
          if errors:
              for error in errors:
                  print(f"missing Private-Secrets environment: {error}", file=sys.stderr)
              raise SystemExit(1)
          print('private-secrets environment bindings: ok')
          PY

          cat > .github/workflows/private-secrets-environment-contracts.yml <<'YAML'
          name: Private Secrets Environment Contracts

          on:
            push:
              branches: [main]
            pull_request:
              branches: [main]

          permissions:
            contents: read

          jobs:
            validate:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v7
                - uses: actions/setup-python@v7
                  with:
                    python-version: "3.12"
                - run: python scripts/ci/check-private-secrets-environment.py
          YAML

          python scripts/ci/check-private-secrets-environment.py
          git diff --check

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows scripts/ci/check-private-secrets-environment.py
          if git diff --cached --quiet; then
            echo 'committed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m 'fix(ci): bind environment-scoped protocol secrets'
          git push origin HEAD:docs/current-premiere-integration-spec-20260819
          echo 'committed=true' >> "$GITHUB_OUTPUT"
      - name: Report result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMITTED: ${{ steps.patch.outputs.committed }}
          OUTCOME: ${{ steps.patch.outcome }}
        run: |
          set -euo pipefail
          body=$(cat <<EOF
          Private-Secrets canonical workflow binding patch result.

          - workflow run: \`$GITHUB_RUN_ID\`
          - input head: \`$GITHUB_SHA\`
          - outcome: \`${OUTCOME:-unknown}\`
          - committed canonical changes: \`${COMMITTED:-unknown}\`

          The patch requires every canonical job that references \`secrets.SOURCE_REPO_TOKEN\` or \`secrets.JPAPT_ACK_TOKEN\` to declare \`environment: Private-Secrets\`, and adds a PR/push regression check.
          EOF
          )
          gh issue comment 109 --repo "$GITHUB_REPOSITORY" --body "$body"
