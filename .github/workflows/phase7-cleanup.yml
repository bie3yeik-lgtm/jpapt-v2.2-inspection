name: Phase7 Cleanup

on:
  push:
    branches: [agent/rust-run-context-phase7-final]
    paths:
      - ".github/workflows/phase7-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/rust-run-context-phase7-final
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Remove unused helper and format
        shell: python
        run: |
          from pathlib import Path
          import re
          path = Path("rust/crates/asr-contracts/src/project_config.rs")
          text = path.read_text()
          text, count = re.subn(
              r'\nimpl ResolvedProjectConfig \{\n    pub fn manifest_path\(&self, repository_root: &Path\) -> PathBuf \{.*?\n    \}\n\}\n',
              '\n',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit("manifest_path helper was not uniquely found")
          path.write_text(text)
      - run: cargo fmt --all
      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/crates/asr-contracts/src/project_config.rs
          git commit -m "Clean up Rust project config CLI module"
          git push origin HEAD:agent/rust-run-context-phase7-final
