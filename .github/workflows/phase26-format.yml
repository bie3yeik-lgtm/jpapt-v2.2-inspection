name: Phase 26 Rust Formatter

on:
  push:
    branches: [agent/ghcr-ci-phase25]
    paths:
      - "rust/crates/asr-contracts/src/bin/asr-workflow-dispatch.rs"
      - ".github/workflows/phase26-format.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/ghcr-ci-phase25
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format and commit
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add rust/crates/asr-contracts/src/bin/asr-workflow-dispatch.rs
          git commit -m "Format workflow dispatch resolver"
          git push origin HEAD:agent/ghcr-ci-phase25
