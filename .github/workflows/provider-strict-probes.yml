name: Provider Strict Probes

on:
  workflow_dispatch:
  push:
    branches:
      - agent/provider-strict-probes
    paths:
      - ".github/workflows/provider-strict-probes.yml"
      - "scripts/ci/e2e-provider-ctc.py"
      - "scripts/ci/resolve-candidate-artifacts.py"
      - "rust/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: read

concurrency:
  group: provider-strict-probes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provider-build-gate:
    name: ${{ matrix.provider }} compile/link gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            provider: coreml
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build provider-specific Rust evaluator
        shell: bash
        run: cargo build --locked --release -p asr-eval --no-default-features --features "${{ matrix.provider }}"

  coreml-strict-runtime:
    name: CoreML strict runtime probe
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Sync minimal authoritative environment
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --locked --extra onnx
      - name: Materialize synthetic CTC provider probe
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/ci/e2e-provider-ctc.py --output .ci/provider-probe
          uv run python scripts/ci/resolve-candidate-artifacts.py \
            --candidate-dir .ci/provider-probe/candidate \
            --runtime-variant ctc \
            --contract-out .ci/provider-probe/candidate-contract.json
          cargo run --quiet --locked -p asr-contracts --bin asr-provider-probe-context -- \
            --contract .ci/provider-probe/candidate-contract.json \
            --provider coreml \
            --output .ci/provider-probe/run-context.json
      - name: Build CoreML evaluator
        shell: bash
        run: cargo build --locked --release -p asr-eval --no-default-features --features coreml
      - name: Measure strict CoreML readiness
        id: coreml
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          target/release/asr-eval evaluate \
            --provider coreml \
            --candidate-contract .ci/provider-probe/candidate-contract.json \
            --run-context .ci/provider-probe/run-context.json \
            --resolved-manifest .ci/provider-probe/resolved-manifest.json \
            --output .ci/provider-probe/results \
            > .ci/provider-probe/coreml.stdout.txt \
            2> .ci/provider-probe/coreml.stderr.txt
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Classify strict CoreML readiness
        if: always()
        shell: bash
        env:
          COREML_OUTCOME: ${{ steps.coreml.outcome }}
          COREML_EXIT_CODE: ${{ steps.coreml.outputs.exit_code }}
        run: |
          set -euo pipefail
          ARGS=(
            --provider coreml
            --root .ci/provider-probe
            --step-outcome "${COREML_OUTCOME:-unknown}"
          )
          if [[ -n "${COREML_EXIT_CODE:-}" ]]; then
            ARGS+=(--exit-code "${COREML_EXIT_CODE}")
          fi
          cargo run --quiet --locked -p asr-contracts --bin asr-provider-readiness -- "${ARGS[@]}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coreml-strict-provider-probe
          path: .ci/provider-probe
          if-no-files-found: ignore
          retention-days: 7
