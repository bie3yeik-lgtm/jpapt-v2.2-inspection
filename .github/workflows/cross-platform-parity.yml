name: Cross Platform ONNX Parity

on:
  workflow_dispatch:
    inputs:
      candidate_id:
        description: "HF Bucket candidates/<candidate_id>"
        required: true
        type: string

      evaluation:
        description: "Evaluation suite"
        required: false
        default: "parity"
        type: choice
        options:
          - smoke
          - parity
          - coreml-parity

permissions:
  contents: read

concurrency:
  group: cross-platform-${{ inputs.candidate_id }}-${{ inputs.evaluation }}
  cancel-in-progress: true

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF_BUCKET: ${{ vars.HF_BUCKET }}
  HF_MODEL_REPO: ${{ vars.HF_MODEL_REPO }}

jobs:
  evaluate:
    name: ${{ matrix.result_name }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            provider: cpu
            environment: linux
            result_name: linux-cpu
            benchmark_name: linux-cpu

          - os: windows-latest
            provider: cpu
            environment: windows
            result_name: windows-cpu
            benchmark_name: windows-cpu

          - os: macos-15
            provider: cpu
            environment: macos
            result_name: macos-cpu
            benchmark_name: macos-cpu

          - os: macos-15
            provider: coreml
            environment: macos
            result_name: macos-coreml
            benchmark_name: coreml

    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate GitHub configuration
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${HF_TOKEN:-}" ]]; then
            echo "::error::HF_TOKEN secret is not configured."
            exit 1
          fi

          if [[ -z "${HF_BUCKET:-}" ]]; then
            echo "::error::HF_BUCKET repository variable is not configured."
            exit 1
          fi

          if [[ -z "${HF_MODEL_REPO:-}" ]]; then
            echo "::error::HF_MODEL_REPO repository variable is not configured."
            exit 1
          fi

      - name: Show runner information
        shell: bash
        run: |
          set -euo pipefail

          echo "Runner OS:   ${{ runner.os }}"
          echo "Runner arch: ${{ runner.arch }}"
          echo "Matrix OS:   ${{ matrix.os }}"
          echo "Provider:    ${{ matrix.provider }}"
          echo "Environment: ${{ matrix.environment }}"

          uname -a || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python project
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install -e ".[datasets,onnx,dev]"
          python -m pip install --upgrade huggingface_hub

          python -c "import parakeet_onnx"
          hf --version

      - name: Prepare directories
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            .cache/huggingface \
            .cache/models \
            .cache/evaluation/audio \
            .ci/hf/config/revisions \
            .ci/candidate \
            .ci/reference \
            "results/${{ matrix.result_name }}"

          echo "HF_HOME=$(pwd)/.cache/huggingface" >> "${GITHUB_ENV}"

      - name: Fetch revision locks
        shell: bash
        run: |
          set -euo pipefail

          bash scripts/hf/hf-fetch-revisions.sh

          python scripts/ci/validate-revisions.py \
            --root .ci/hf/config/revisions

      - name: Cache model and evaluation assets
        uses: actions/cache@v4
        with:
          path: |
            .cache/huggingface
            .cache/models
            .cache/evaluation
            .ci/candidate
            .ci/reference
          key: >-
            py-eval-${{ matrix.os }}-${{ runner.arch }}-${{
              inputs.candidate_id
            }}-${{
              hashFiles(
                '.ci/hf/config/revisions/reference.json',
                '.ci/hf/config/revisions/evaluation-schema.json',
                '.ci/hf/config/revisions/datasets-lock.json',
                'pyproject.toml'
              )
            }}
          restore-keys: |
            py-eval-${{ matrix.os }}-${{ runner.arch }}-${{ inputs.candidate_id }}-

      - name: Fetch candidate
        shell: bash
        run: |
          set -euo pipefail

          bash scripts/hf/hf-fetch-candidate.sh \
            "${{ inputs.candidate_id }}"

      - name: Fetch reference assets
        shell: bash
        run: |
          set -euo pipefail

          bash scripts/hf/hf-fetch-reference.sh || true

      - name: Locate ONNX model
        id: model
        shell: bash
        run: |
          set -euo pipefail

          MODEL="$(find .ci/candidate -type f -name '*.onnx' -print -quit)"

          if [[ -z "${MODEL}" ]]; then
            echo "::error::No ONNX model was found under .ci/candidate."
            exit 1
          fi

          echo "path=${MODEL}" >> "${GITHUB_OUTPUT}"
          echo "ONNX model: ${MODEL}"

      - name: Verify Python-first package
        shell: bash
        run: |
          set -euo pipefail

          python scripts/dev/verify-python-first.py

      - name: Evaluate candidate with Python
        shell: bash
        run: |
          set -euo pipefail

          python -m parakeet_onnx.cli.evaluate \
            --provider "${{ matrix.provider }}" \
            --environment "${{ matrix.environment }}" \
            --evaluation "${{ inputs.evaluation }}" \
            --model "${{ steps.model.outputs.path }}" \
            --candidate-dir ".ci/candidate" \
            --candidate-id "${{ inputs.candidate_id }}" \
            --revisions ".ci/hf/config/revisions" \
            --output "results/${{ matrix.result_name }}"

      - name: Validate result contract
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f "results/${{ matrix.result_name }}/run-context.json" ]]; then
            python scripts/ci/validate-result.py \
              "results/${{ matrix.result_name }}"
          fi

      - name: Upload run to HF Bucket
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f "results/${{ matrix.result_name }}/run-context.json" ]]; then
            bash scripts/hf/hf-push-run.sh \
              "results/${{ matrix.result_name }}"
          fi

      - name: Publish benchmark
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          bash scripts/hf/hf-push-benchmark.sh \
            "results/${{ matrix.result_name }}/metrics.json" \
            "${{ matrix.benchmark_name }}"

      - name: Upload lightweight GitHub artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-${{ matrix.result_name }}-${{ inputs.candidate_id }}
          path: |
            results/${{ matrix.result_name }}/run-context.json
            results/${{ matrix.result_name }}/metrics.json
            results/${{ matrix.result_name }}/samples.jsonl
          retention-days: 7
          if-no-files-found: warn
