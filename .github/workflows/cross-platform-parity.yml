name: Cross Platform ONNX Parity

on:
  workflow_dispatch:
    inputs:
      hf_bucket:
        description: "HF_BUCKET value from vars.HF_TARGETS_JSON"
        required: true
        default: gawohok7/jpapt-v2.2-dev-bucket
        type: string
      candidate_id:
        description: "Existing HF Bucket candidates/<candidate_id> to evaluate"
        required: true
        type: string
      evaluation:
        description: "Evaluation suite"
        required: false
        default: "parity"
        type: choice
        options: [smoke, parity, coreml-parity]

permissions:
  contents: read
  actions: write

concurrency:
  group: cross-platform-${{ inputs.hf_bucket }}-${{ inputs.candidate_id }}-${{ inputs.evaluation }}
  cancel-in-progress: true

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF_TARGETS_JSON: ${{ vars.HF_TARGETS_JSON }}
  GH_TOKEN: ${{ secrets.HF_ALLOCATOR_GITHUB_TOKEN || github.token }}
  HF_ALLOCATOR_REPOSITORY: bie3yeik-lgtm/jpapt-v2.2-inspection

jobs:
  allocate-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      experiment_id: ${{ steps.allocate.outputs.experiment_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - id: allocate
        name: Allocate ID through central allocator
        shell: bash
        env:
          HF_BUCKET: ${{ inputs.hf_bucket }}
          CANDIDATE_ID: ${{ inputs.candidate_id }}
          EVALUATION_ID: ${{ inputs.evaluation }}
        run: |
          set -euo pipefail
          ID="$(bash scripts/hf/hf-allocate-id.sh experiments cross-platform-parity)"
          echo "experiment_id=${ID}" >> "${GITHUB_OUTPUT}"
          echo "Experiment: ${ID}"

  evaluate:
    needs: allocate-experiment
    name: ${{ matrix.result_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            provider: cpu
            environment: linux
            result_name: linux-cpu
            benchmark_name: linux-cpu
          - os: windows-latest
            provider: cpu
            environment: windows
            result_name: windows-cpu
            benchmark_name: windows-cpu
          - os: macos-15
            provider: cpu
            environment: macos
            result_name: macos-cpu
            benchmark_name: macos-cpu
          - os: macos-15
            provider: coreml
            environment: macos
            result_name: macos-coreml
            benchmark_name: macos-coreml
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      HF_BUCKET: ""
      HF_MODEL_REPO: ""
      EXPECTED_DEVELOPMENT_REPO_ID: ""
      EXPECTED_UPSTREAM_REPO_ID: ""
      EXPECTED_TOKENIZER_REPO_ID: ""
      EXPECTED_FRAMEWORK: ""
      EXPECTED_DECODER: ""
      HF_TARGET_ID: ""
      EXPERIMENT_ID: ${{ needs.allocate-experiment.outputs.experiment_id }}

    steps:
      - uses: actions/checkout@v7
      - name: Show runner information
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner OS: ${{ runner.os }}"
          echo "Runner arch: ${{ runner.arch }}"
          echo "Provider: ${{ matrix.provider }}"
          echo "Experiment: ${EXPERIMENT_ID}"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Python project
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[datasets,onnx,transformers-runtime,dev]"
          python -m pip install --upgrade huggingface_hub
      - name: Resolve HF Bucket
        id: hf
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${HF_TARGETS_JSON:-}" ]] || { echo "::error::HF_TARGETS_JSON is required."; exit 1; }
          python scripts/ci/resolve-hf-target.py \
            --bucket "${{ inputs.hf_bucket }}" \
            --targets-json "${HF_TARGETS_JSON}" \
            --github-env "${GITHUB_ENV}" \
            --github-output "${GITHUB_OUTPUT}"
      - name: Prepare directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/huggingface .cache/models .cache/evaluation/audio \
            .ci/hf/config/revisions .ci/candidate .ci/reference \
            "results/${{ matrix.result_name }}"
          echo "HF_HOME=$(pwd)/.cache/huggingface" >> "${GITHUB_ENV}"
      - name: Fetch and validate revision locks
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/hf/hf-fetch-revisions.sh
          python scripts/ci/validate-revisions.py \
            --root .ci/hf/config/revisions \
            --expected-development-repo-id "${EXPECTED_DEVELOPMENT_REPO_ID}" \
            --expected-upstream-repo-id "${EXPECTED_UPSTREAM_REPO_ID}" \
            --expected-tokenizer-repo-id "${EXPECTED_TOKENIZER_REPO_ID}" \
            --expected-framework "${EXPECTED_FRAMEWORK}" \
            --expected-decoder "${EXPECTED_DECODER}"
      - name: Cache model and evaluation assets
        uses: actions/cache@6
        with:
          path: |
            .cache/huggingface
            .cache/models
            .cache/evaluation
            .ci/candidate
            .ci/reference
          key: py-eval-${{ steps.hf.outputs.target_id }}-${{ matrix.os }}-${{ runner.arch }}-${{ inputs.candidate_id }}-${{ hashFiles('.ci/hf/config/revisions/reference.json', '.ci/hf/config/revisions/evaluation-schema.json', '.ci/hf/config/revisions/datasets-lock.json', 'pyproject.toml') }}
      - name: Fetch candidate
        shell: bash
        run: bash scripts/hf/hf-fetch-candidate.sh "${{ inputs.candidate_id }}"
      - name: Validate evaluator and candidate capability
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/validate-evaluator-capability.py \
            --evaluator python-onnx \
            --decoder "${EXPECTED_DECODER}" \
            --provider "${{ matrix.provider }}" \
            --candidate-dir .ci/candidate
      - name: Fetch reference assets
        shell: bash
        run: bash scripts/hf/hf-fetch-reference.sh || true
      - name: Evaluate candidate with Python
        shell: bash
        run: |
          set -euo pipefail
          python -m parakeet_onnx.cli.evaluate \
            --provider "${{ matrix.provider }}" \
            --environment "${{ matrix.environment }}" \
            --evaluation "${{ inputs.evaluation }}" \
            --model-config "${HF_TARGET_ID}" \
            --candidate-dir .ci/candidate \
            --candidate-id "${{ inputs.candidate_id }}" \
            --experiment-id "${EXPERIMENT_ID}" \
            --revisions .ci/hf/config/revisions \
            --output "results/${{ matrix.result_name }}"
      - name: Validate result contract
        if: always()
        shell: bash
        run: |
          if [[ -f "results/${{ matrix.result_name }}/run-context.json" ]]; then
            python scripts/ci/validate-result.py "results/${{ matrix.result_name }}"
          fi
      - name: Upload run to HF Bucket
        if: always()
        shell: bash
        run: |
          if [[ -f "results/${{ matrix.result_name }}/run-context.json" ]]; then
            bash scripts/hf/hf-push-run.sh "results/${{ matrix.result_name }}"
          fi
      - name: Publish benchmark
        if: success()
        shell: bash
        run: bash scripts/hf/hf-push-benchmark.sh "results/${{ matrix.result_name }}/metrics.json" "${{ matrix.benchmark_name }}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: parity-${{ steps.hf.outputs.target_id }}-${{ matrix.result_name }}-${{ inputs.candidate_id }}
          path: results/${{ matrix.result_name }}
          retention-days: 7
          if-no-files-found: warn
