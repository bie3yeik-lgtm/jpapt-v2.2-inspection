name: Candidate Completion Receipt

on:
  repository_dispatch:
    types: [jpapt.candidate-completed]
  workflow_dispatch:
    inputs:
      receipt_json:
        description: CandidateCompletionReceiptV1 JSON payload
        required: true
        type: string

permissions:
  contents: read

jobs:
  receipt:
    name: Validate and acknowledge completion receipt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Materialize receipt payload
        shell: bash
        env:
          PROTOCOL_PAYLOAD: ${{ toJSON(github.event.client_payload.protocol_payload) }}
          LEGACY_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          RECEIPT_JSON: ${{ inputs.receipt_json }}
        run: |
          set -euo pipefail
          mkdir -p .ci
          if [[ "$GITHUB_EVENT_NAME" == "repository_dispatch" ]]; then
            if [[ "$PROTOCOL_PAYLOAD" != "null" && -n "$PROTOCOL_PAYLOAD" ]]; then
              printf '%s\n' "$PROTOCOL_PAYLOAD" > .ci/candidate-completion-receipt.json
            else
              printf '%s\n' "$LEGACY_PAYLOAD" > .ci/candidate-completion-receipt.json
            fi
          else
            printf '%s\n' "$RECEIPT_JSON" > .ci/candidate-completion-receipt.json
          fi
      - name: Validate CandidateCompletionReceiptV1
        run: >-
          python scripts/ci/build-candidate-completion-receipt.py
          --validate .ci/candidate-completion-receipt.json
      - name: Validate receiver and orchestrator binding
        env:
          ALLOWED_ORCHESTRATORS: ${{ vars.JPAPT_ORCHESTRATOR_REPOSITORIES }}
        run: >-
          python scripts/ci/validate-candidate-protocol-binding.py
          --receipt .ci/candidate-completion-receipt.json
          --receiver-repository "${{ github.repository }}"
          --allowed-orchestrators "$ALLOWED_ORCHESTRATORS"
      - name: Build CandidateCompletionAckV1
        env:
          RECEIVER_REPOSITORY: ${{ github.repository }}
          RECEIVER_RUN_ID: ${{ github.run_id }}
          RECEIVER_RUN_ATTEMPT: ${{ github.run_attempt }}
          RECEIVER_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          python scripts/ci/build-candidate-completion-ack.py
          --receipt .ci/candidate-completion-receipt.json
          --ack .ci/candidate-completion-ack.json
          --dispatch-body .ci/candidate-completion-ack-dispatch.json
      - name: Preserve received receipt and acknowledgement
        uses: actions/upload-artifact@v7
        with:
          name: received-candidate-completion-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .ci/candidate-completion-receipt.json
            .ci/candidate-completion-ack.json
          retention-days: 30
      - name: Dispatch acknowledgement to orchestrator
        if: ${{ github.event_name == 'repository_dispatch' }}
        shell: bash
        env:
          ACK_TOKEN: ${{ secrets.JPAPT_ACK_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ORCHESTRATOR_REPOSITORY="$(jq -er '.orchestrator_repository' .ci/candidate-completion-receipt.json)"
          token="$ACK_TOKEN"
          if [[ -z "$token" && "$ORCHESTRATOR_REPOSITORY" == "$GITHUB_REPOSITORY" ]]; then
            token="$GITHUB_TOKEN"
          fi
          [[ -n "$token" ]] || {
            echo "::error::JPAPT_ACK_TOKEN is required to acknowledge receipt to $ORCHESTRATOR_REPOSITORY"
            exit 1
          }
          GH_TOKEN="$token" bash scripts/ci/repository-dispatch-with-retry.sh \
            "$ORCHESTRATOR_REPOSITORY" \
            .ci/candidate-completion-ack-dispatch.json \
            3
