name: Candidate Workflow Dispatch Retry Contracts

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/candidate-workflow-dispatch-retry-contracts.yml
      - scripts/ci/workflow-dispatch-with-retry.sh
      - .github/workflows/candidate-request-gateway.yml
      - .github/workflows/candidate-package-evaluate.yml
      - .github/workflows/hf-jobs-smoke.yml
  pull_request:
    paths:
      - .github/workflows/candidate-workflow-dispatch-retry-contracts.yml
      - scripts/ci/workflow-dispatch-with-retry.sh
      - .github/workflows/candidate-request-gateway.yml
      - .github/workflows/candidate-package-evaluate.yml
      - .github/workflows/hf-jobs-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-workflow-dispatch-retry-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Validate workflow dispatch retry behavior
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Validate helper syntax and consumers
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/ci/workflow-dispatch-with-retry.sh
          grep -F 'workflow-dispatch-with-retry.sh' .github/workflows/candidate-package-evaluate.yml
          grep -F 'workflow-dispatch-with-retry.sh' .github/workflows/candidate-request-gateway.yml
          grep -F 'workflow-dispatch-with-retry.sh' .github/workflows/hf-jobs-smoke.yml
          grep -F 'GITHUB_REF_NAME' .github/workflows/hf-jobs-smoke.yml
          if grep -F -- '--arg ref "$GITHUB_SHA"' .github/workflows/hf-jobs-smoke.yml; then
            echo 'HF Jobs Smoke must dispatch a branch/tag ref, not a commit SHA' >&2
            exit 1
          fi
      - name: Retry transient failures and succeed on third attempt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fake-bin
          cat > /tmp/fake-bin/gh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          count_file=/tmp/workflow-dispatch-count
          count=0
          [[ ! -f "$count_file" ]] || count="$(cat "$count_file")"
          count=$((count + 1))
          printf '%s' "$count" > "$count_file"
          [[ "$count" -ge 3 ]]
          SH
          chmod +x /tmp/fake-bin/gh
          printf '{"ref":"main","inputs":{}}\n' > /tmp/body.json
          rm -f /tmp/workflow-dispatch-count
          PATH="/tmp/fake-bin:$PATH" GH_TOKEN=synthetic \
            bash scripts/ci/workflow-dispatch-with-retry.sh owner/repo workflow.yml /tmp/body.json 3
          test "$(cat /tmp/workflow-dispatch-count)" = 3
      - name: Accept valid dot-prefixed repository identities
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/fake-bin/gh <<'SH'
          #!/usr/bin/env bash
          exit 0
          SH
          chmod +x /tmp/fake-bin/gh
          for repository in .owner/repo owner/.github owner/repo-1 owner/repo_name; do
            PATH="/tmp/fake-bin:$PATH" GH_TOKEN=synthetic \
              bash scripts/ci/workflow-dispatch-with-retry.sh "$repository" workflow.yml /tmp/body.json 1
          done
      - name: Stop at retry limit
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/fake-bin/gh <<'SH'
          #!/usr/bin/env bash
          exit 1
          SH
          chmod +x /tmp/fake-bin/gh
          if PATH="/tmp/fake-bin:$PATH" GH_TOKEN=synthetic \
            bash scripts/ci/workflow-dispatch-with-retry.sh owner/repo workflow.yml /tmp/body.json 2; then
            echo 'retry exhaustion unexpectedly succeeded' >&2
            exit 1
          fi
      - name: Reject malformed invocation before dispatch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/fake-bin/gh <<'SH'
          #!/usr/bin/env bash
          echo invoked >> /tmp/unexpected-workflow-gh
          exit 99
          SH
          chmod +x /tmp/fake-bin/gh
          rm -f /tmp/unexpected-workflow-gh
          for repository in invalid ./repo ../repo owner/. owner/.. owner/repo/extra owner//repo 'owner/répo'; do
            if PATH="/tmp/fake-bin:$PATH" GH_TOKEN=synthetic \
              bash scripts/ci/workflow-dispatch-with-retry.sh "$repository" workflow.yml /tmp/body.json 3; then
              echo "invalid repository unexpectedly accepted: $repository" >&2
              exit 1
            fi
          done
          if PATH="/tmp/fake-bin:$PATH" GH_TOKEN=synthetic \
            bash scripts/ci/workflow-dispatch-with-retry.sh owner/repo path/workflow.yml /tmp/body.json 3; then
            exit 1
          fi
          test ! -e /tmp/unexpected-workflow-gh
      - name: Reject malformed dispatch body before dispatch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/fake-bin/gh <<'SH'
          #!/usr/bin/env bash
          echo 'gh must not be called for invalid body' >&2
          exit 99
          SH
          chmod +x /tmp/fake-bin/gh

          printf '{broken\n' > /tmp/invalid-json.json
          printf '{"inputs":{}}\n' > /tmp/missing-ref.json
          printf '{"ref":"","inputs":{}}\n' > /tmp/empty-ref.json
          printf '{"ref":"main","inputs":[]}\n' > /tmp/bad-inputs.json
          printf '{"ref":"0123456789abcdef0123456789abcdef01234567","inputs":{}}\n' > /tmp/raw-sha40.json
          printf '{"ref":"0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef","inputs":{}}\n' > /tmp/raw-sha64.json

          for body in \
            /tmp/invalid-json.json \
            /tmp/missing-ref.json \
            /tmp/empty-ref.json \
            /tmp/bad-inputs.json \
            /tmp/raw-sha40.json \
            /tmp/raw-sha64.json; do
            if PATH="/tmp/fake-bin:$PATH" GH_TOKEN=synthetic \
              bash scripts/ci/workflow-dispatch-with-retry.sh owner/repo workflow.yml "$body" 3; then
              echo "invalid dispatch body unexpectedly succeeded: $body" >&2
              exit 1
            fi
          done
