name: Agent Bind Private Secrets Environment

on:
  push:
    branches:
      - docs/current-premiere-integration-spec-20260819

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: docs/current-premiere-integration-spec-20260819
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Attach Private-Secrets to secret-consuming jobs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          secret_markers = (
              "secrets.SOURCE_REPO_TOKEN",
              "secrets.JPAPT_ACK_TOKEN",
          )

          changed = []
          for path in sorted(Path('.github/workflows').glob('*.yml')):
              if path.name.startswith('agent-'):
                  continue
              text = path.read_text(encoding='utf-8')
              lines = text.splitlines(keepends=True)
              try:
                  jobs_index = next(i for i, line in enumerate(lines) if line == 'jobs:\n')
              except StopIteration:
                  continue

              job_starts = []
              for i in range(jobs_index + 1, len(lines)):
                  line = lines[i]
                  if line.startswith('  ') and not line.startswith('    ') and line.rstrip().endswith(':'):
                      key = line.strip()[:-1]
                      if key and not key.startswith('#'):
                          job_starts.append(i)
              if not job_starts:
                  continue

              inserts = []
              for pos, start in enumerate(job_starts):
                  end = job_starts[pos + 1] if pos + 1 < len(job_starts) else len(lines)
                  block = ''.join(lines[start:end])
                  if not any(marker in block for marker in secret_markers):
                      continue
                  if '\n    environment: Private-Secrets\n' in '\n' + block:
                      continue
                  inserts.append(start + 1)

              if not inserts:
                  continue
              for index in reversed(inserts):
                  lines.insert(index, '    environment: Private-Secrets\n')
              path.write_text(''.join(lines), encoding='utf-8')
              changed.append(str(path))

          checker = Path('scripts/ci/check-private-secrets-environment.py')
          checker.write_text('''#!/usr/bin/env python3\nfrom pathlib import Path\nimport sys\n\nSECRET_MARKERS = (\n    "secrets.SOURCE_REPO_TOKEN",\n    "secrets.JPAPT_ACK_TOKEN",\n)\nENVIRONMENT_LINE = "    environment: Private-Secrets"\n\nerrors = []\nfor path in sorted(Path(".github/workflows").glob("*.yml")):\n    if path.name.startswith("agent-"):\n        continue\n    lines = path.read_text(encoding="utf-8").splitlines()\n    try:\n        jobs_index = lines.index("jobs:")\n    except ValueError:\n        continue\n    starts = []\n    for i in range(jobs_index + 1, len(lines)):\n        line = lines[i]\n        if line.startswith("  ") and not line.startswith("    ") and line.endswith(":"):\n            starts.append(i)\n    for pos, start in enumerate(starts):\n        end = starts[pos + 1] if pos + 1 < len(starts) else len(lines)\n        block = lines[start:end]\n        joined = "\\n".join(block)\n        if not any(marker in joined for marker in SECRET_MARKERS):\n            continue\n        job = lines[start].strip()[:-1]\n        if ENVIRONMENT_LINE not in block:\n            errors.append(f"{path}:{job}: missing environment: Private-Secrets")\n\nif errors:\n    for error in errors:\n        print(error, file=sys.stderr)\n    raise SystemExit(1)\nprint("private-secrets environment bindings: ok")\n''', encoding='utf-8')

          contract = Path('.github/workflows/private-secrets-environment-contracts.yml')
          contract.write_text('''name: Private Secrets Environment Contracts\n\non:\n  push:\n    branches: [main]\n  pull_request:\n    branches: [main]\n\npermissions:\n  contents: read\n\njobs:\n  validate:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v7\n      - uses: actions/setup-python@v7\n        with:\n          python-version: "3.12"\n      - name: Verify Environment bindings\n        run: python scripts/ci/check-private-secrets-environment.py\n''', encoding='utf-8')

          print('patched workflows:')
          for item in changed:
              print(f'- {item}')
          PY
          python scripts/ci/check-private-secrets-environment.py
          git diff --check
      - name: Commit environment binding changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git status --porcelain | grep -qv .; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows scripts/ci/check-private-secrets-environment.py
          if git diff --cached --quiet; then
            echo 'No staged changes required.'
            exit 0
          fi
          git commit -m 'fix(ci): bind environment-scoped protocol secrets'
          git push origin HEAD:docs/current-premiere-integration-spec-20260819
