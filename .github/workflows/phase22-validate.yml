name: Phase22 Validate

on:
  push:
    branches: [agent/rust-provider-readiness-phase22]
    paths:
      - ".github/workflows/phase22-validate.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/rust-provider-readiness-phase22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Validate provider readiness policy
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo clippy --locked -p asr-contracts --all-targets -- -D warnings
          cargo test --locked -p asr-contracts

          root="$(mktemp -d)"
          mkdir -p "$root/results"
          cat > "$root/results/metrics.json" <<'JSON'
          {"provider":{"execution_proven":true,"fallback_detected":false,"requested":"coreml"}}
          JSON
          cargo run --quiet --locked -p asr-contracts --bin asr-provider-readiness -- \
            --provider coreml --root "$root" --step-outcome success --exit-code 0
          grep -q '"classification": "strict_execution_proven"' "$root/coreml-readiness.json"

          cat > "$root/results/metrics.json" <<'JSON'
          {"provider":{"execution_proven":true,"requested":"directml"}}
          JSON
          cargo run --quiet --locked -p asr-contracts --bin asr-provider-readiness -- \
            --provider directml --root "$root" --step-outcome success --exit-code 0
          grep -q '"execution_proven": true' "$root/directml-readiness.json"

          rm -f "$root/results/metrics.json"
          if cargo run --quiet --locked -p asr-contracts --bin asr-provider-readiness -- \
            --provider coreml --root "$root" --step-outcome failure --exit-code 1; then
            echo 'unknown CoreML failure was incorrectly accepted' >&2
            exit 1
          fi
          grep -q '"classification": "unknown_failure"' "$root/coreml-readiness.json"
          rm -rf "$root"
      - name: Commit normalized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/crates/asr-contracts/src/bin/asr-provider-readiness.rs
          if git diff --cached --quiet; then
            echo 'already normalized'
          else
            git commit -m 'Normalize Rust provider readiness policy'
            git push origin HEAD:agent/rust-provider-readiness-phase22
          fi
