name: Candidate Protocol E2E

on:
  workflow_dispatch:
    inputs:
      receipt_repository:
        description: External receiver repository in owner/name form
        required: true
        type: string
      hf_bucket:
        description: Existing HF Bucket used only for request resolution in dry-run
        required: true
        type: string
      source_repository:
        description: Optional source repository; blank uses this orchestrator repository
        required: false
        default: ""
        type: string
      timeout_seconds:
        description: Maximum time to wait for end-to-end acknowledgement
        required: false
        default: "600"
        type: string

permissions:
  contents: read
  actions: write

env:
  SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}

concurrency:
  group: candidate-protocol-e2e-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  e2e:
    name: Verify external completion and acknowledgement loop
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Validate E2E configuration
        id: config
        shell: bash
        env:
          RECEIPT_REPOSITORY: ${{ inputs.receipt_repository }}
          HF_BUCKET: ${{ inputs.hf_bucket }}
          SOURCE_REPOSITORY_INPUT: ${{ inputs.source_repository }}
          TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
        run: |
          set -euo pipefail
          repo_re='^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'
          [[ "$RECEIPT_REPOSITORY" =~ $repo_re ]] || {
            echo "::error::receipt_repository must use owner/name"
            exit 1
          }
          [[ "$RECEIPT_REPOSITORY" != "$GITHUB_REPOSITORY" ]] || {
            echo "::error::Candidate Protocol E2E requires a different receiver repository"
            exit 1
          }
          [[ "$HF_BUCKET" =~ $repo_re ]] || {
            echo "::error::hf_bucket must use namespace/name"
            exit 1
          }
          [[ "$TIMEOUT_SECONDS" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::timeout_seconds must be a positive integer"
            exit 1
          }
          (( TIMEOUT_SECONDS >= 60 && TIMEOUT_SECONDS <= 1200 )) || {
            echo "::error::timeout_seconds must be between 60 and 1200"
            exit 1
          }
          source_repository="${SOURCE_REPOSITORY_INPUT:-$GITHUB_REPOSITORY}"
          [[ "$source_repository" =~ $repo_re ]] || {
            echo "::error::source_repository must use owner/name"
            exit 1
          }
          request_id="e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          request_key="$(python scripts/ci/build-candidate-request-lifecycle.py --request-key "$request_id")"
          {
            echo "source_repository=$source_repository"
            echo "request_id=$request_id"
            echo "request_key=$request_key"
          } >> "$GITHUB_OUTPUT"

      - name: Preflight external receiver
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
          RECEIPT_REPOSITORY: ${{ inputs.receipt_repository }}
        run: |
          set -euo pipefail
          [[ -n "${GH_TOKEN:-}" ]] || {
            echo "::error::SOURCE_REPO_TOKEN is required for cross-repository E2E delivery and preflight"
            exit 1
          }
          gh api "/repos/$RECEIPT_REPOSITORY/actions/workflows/candidate-completion-receipt.yml" >/dev/null || {
            echo "::error::receiver workflow candidate-completion-receipt.yml is not installed or not accessible"
            exit 1
          }
          for path in \
            scripts/ci/build-candidate-completion-receipt.py \
            scripts/ci/build-candidate-completion-ack.py \
            scripts/ci/validate-candidate-protocol-binding.py \
            scripts/ci/repository-dispatch-with-retry.sh; do
            gh api "/repos/$RECEIPT_REPOSITORY/contents/$path" >/dev/null || {
              echo "::error::receiver dependency missing: $path"
              exit 1
            }
          done

      - name: Dispatch dry-run evaluation V2
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_ID: ${{ steps.config.outputs.request_id }}
          SOURCE_REPOSITORY: ${{ steps.config.outputs.source_repository }}
          RECEIPT_REPOSITORY: ${{ inputs.receipt_repository }}
          HF_BUCKET: ${{ inputs.hf_bucket }}
        run: |
          set -euo pipefail
          jq -n \
            --arg ref "$GITHUB_REF_NAME" \
            --arg request_id "$REQUEST_ID" \
            --arg source_repository "$SOURCE_REPOSITORY" \
            --arg receipt_repository "$RECEIPT_REPOSITORY" \
            --arg hf_bucket "$HF_BUCKET" \
            '{
              ref: $ref,
              inputs: {
                request_id: $request_id,
                source_repository: $source_repository,
                receipt_repository: $receipt_repository,
                hf_bucket: $hf_bucket,
                candidate_id: "",
                package_name: "",
                dataset_source: "auto",
                dataset_id: "",
                suite: "probe",
                executor: "github",
                environment: "linux-cpu",
                hf_flavor: "cpu-basic",
                hf_jobs_image: "",
                dry_run: true
              }
            }' > /tmp/e2e-dispatch.json
          gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/candidate-package-evaluate-v2.yml/dispatches" \
            --input /tmp/e2e-dispatch.json

      - name: Wait for acknowledged lifecycle
        id: wait
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_KEY: ${{ steps.config.outputs.request_key }}
          TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + TIMEOUT_SECONDS))
          last_state=dispatched
          while (( SECONDS < deadline )); do
            for state in acknowledged completed running; do
              name="candidate-lifecycle-$REQUEST_KEY-$state"
              artifact_id="$(gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100&name=$name" \
                --jq '.artifacts | sort_by(.created_at) | reverse | .[0].id // empty')"
              if [[ -n "$artifact_id" ]]; then
                if [[ "$state" != "$last_state" ]]; then
                  echo "[e2e] observed state=$state artifact_id=$artifact_id"
                  last_state="$state"
                fi
                if [[ "$state" == acknowledged ]]; then
                  {
                    echo "artifact_id=$artifact_id"
                    echo "state=$state"
                  } >> "$GITHUB_OUTPUT"
                  exit 0
                fi
                break
              fi
            done
            sleep 10
          done
          echo "::error::timed out waiting for acknowledged lifecycle; last observed state=$last_state"
          exit 1

      - name: Recover and validate E2E evidence
        id: evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ACK_LIFECYCLE_ARTIFACT_ID: ${{ steps.wait.outputs.artifact_id }}
          REQUEST_ID: ${{ steps.config.outputs.request_id }}
          RECEIPT_REPOSITORY: ${{ inputs.receipt_repository }}
        run: |
          set -euo pipefail
          mkdir -p .ci/e2e/lifecycle .ci/e2e/receipt .ci/e2e/ack
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ACK_LIFECYCLE_ARTIFACT_ID/zip" > /tmp/lifecycle.zip
          unzip -q /tmp/lifecycle.zip -d .ci/e2e/lifecycle
          lifecycle=.ci/e2e/lifecycle/candidate-request-lifecycle.json
          python scripts/ci/build-candidate-request-lifecycle.py --validate "$lifecycle"

          readarray -t fields < <(python - "$lifecycle" <<'PY'
          import json
          import sys
          from pathlib import Path
          value = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          print(value['request_id'])
          print(value['state'])
          print(value['receipt_repository'])
          print(value['evaluation_run_id'])
          print(value['evaluation_run_attempt'])
          print(value['receipt_sha256'])
          PY
          )
          [[ "${fields[0]}" == "$REQUEST_ID" ]] || { echo "::error::E2E request_id mismatch"; exit 1; }
          [[ "${fields[1]}" == acknowledged ]] || { echo "::error::E2E lifecycle is not acknowledged"; exit 1; }
          [[ "${fields[2]}" == "$RECEIPT_REPOSITORY" ]] || { echo "::error::E2E receiver mismatch"; exit 1; }
          evaluation_run_id="${fields[3]}"
          evaluation_run_attempt="${fields[4]}"
          receipt_sha="${fields[5]}"

          receipt_name="candidate-completion-$evaluation_run_id-$evaluation_run_attempt"
          receipt_artifact_id="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$evaluation_run_id/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.name == \"$receipt_name\") | .id" | head -n1)"
          [[ -n "$receipt_artifact_id" ]] || { echo "::error::E2E completion receipt artifact missing"; exit 1; }
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$receipt_artifact_id/zip" > /tmp/receipt.zip
          unzip -q /tmp/receipt.zip -d .ci/e2e/receipt
          receipt=.ci/e2e/receipt/candidate-completion-receipt.json
          python scripts/ci/build-candidate-completion-receipt.py --validate "$receipt"

          ack_name="candidate-completion-ack-$receipt_sha"
          ack_artifact_id="$(gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100&name=$ack_name" \
            --jq '.artifacts | sort_by(.created_at) | reverse | .[0].id // empty')"
          [[ -n "$ack_artifact_id" ]] || { echo "::error::E2E acknowledgement artifact missing"; exit 1; }
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ack_artifact_id/zip" > /tmp/ack.zip
          unzip -q /tmp/ack.zip -d .ci/e2e/ack
          ack=.ci/e2e/ack/candidate-completion-ack.json
          python scripts/ci/build-candidate-completion-ack.py --validate "$ack"
          python scripts/ci/validate-candidate-protocol-binding.py \
            --receipt "$receipt" \
            --ack "$ack" \
            --orchestrator-repository "$GITHUB_REPOSITORY"

          python - "$receipt" "$REQUEST_ID" "$RECEIPT_REPOSITORY" <<'PY'
          import json
          import sys
          from pathlib import Path
          receipt = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert receipt['request_id'] == sys.argv[2]
          assert receipt['receipt_repository'] == sys.argv[3]
          assert receipt['dry_run'] is True
          assert receipt['conclusion'] == 'success'
          PY
          {
            echo "evaluation_run_id=$evaluation_run_id"
            echo "evaluation_run_attempt=$evaluation_run_attempt"
            echo "receipt_sha256=$receipt_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Preserve synthetic E2E evidence
        uses: actions/upload-artifact@v7
        with:
          name: candidate-protocol-e2e-${{ steps.config.outputs.request_key }}
          path: .ci/e2e
          retention-days: 30

      - name: E2E summary
        shell: bash
        env:
          REQUEST_ID: ${{ steps.config.outputs.request_id }}
          RECEIPT_REPOSITORY: ${{ inputs.receipt_repository }}
          EVALUATION_RUN_ID: ${{ steps.evidence.outputs.evaluation_run_id }}
          RECEIPT_SHA256: ${{ steps.evidence.outputs.receipt_sha256 }}
        run: |
          {
            echo '## Candidate protocol cross-repository E2E'
            echo
            printf -- '- request id: `%s`\n' "$REQUEST_ID"
            printf -- '- receiver: `%s`\n' "$RECEIPT_REPOSITORY"
            printf -- '- evaluation run: `%s`\n' "$EVALUATION_RUN_ID"
            printf -- '- receipt sha256: `%s`\n' "$RECEIPT_SHA256"
            printf -- '- compute mode: `dry_run=true`\n'
            printf -- '- terminal protocol state: **acknowledged**\n'
          } >> "$GITHUB_STEP_SUMMARY"
