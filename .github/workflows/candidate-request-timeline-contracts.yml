name: Candidate Request Timeline Contracts

on:
  push:
    branches: [main]
    paths:
      - .github/actionlint.yaml
      - .github/workflows/candidate-request-timeline.yml
      - .github/workflows/candidate-request-timeline-contracts.yml
      - contracts/candidate-request-lifecycle.schema.json
      - contracts/candidate-request-timeline.schema.json
      - scripts/ci/build-candidate-request-lifecycle.py
      - scripts/ci/build-candidate-request-timeline.py
      - scripts/ci/candidate_lifecycle_common.py
  pull_request:
    paths:
      - .github/actionlint.yaml
      - .github/workflows/candidate-request-timeline.yml
      - .github/workflows/candidate-request-timeline-contracts.yml
      - contracts/candidate-request-lifecycle.schema.json
      - contracts/candidate-request-timeline.schema.json
      - scripts/ci/build-candidate-request-lifecycle.py
      - scripts/ci/build-candidate-request-timeline.py
      - scripts/ci/candidate_lifecycle_common.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-request-timeline-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Validate request timeline reduction
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: false
      - name: Install validation tools
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          python -m pip install --disable-pip-version-check "jsonschema>=4.23,<5"
      - name: Lint timeline workflows
        run: >-
          actionlint -color -ignore 'SC2016'
          .github/workflows/candidate-request-timeline.yml
          .github/workflows/candidate-request-timeline-contracts.yml
      - name: Validate helper and schema syntax
        run: |
          python -m py_compile \
            scripts/ci/candidate_lifecycle_common.py \
            scripts/ci/build-candidate-request-timeline.py
          python -m json.tool contracts/candidate-request-timeline.schema.json >/dev/null
      - name: Verify shared lifecycle ordering
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'from candidate_lifecycle_common import (' scripts/ci/build-candidate-request-timeline.py
          PYTHONPATH=scripts/ci python - <<'PY'
          from candidate_lifecycle_common import STATES, STATE_RANK
          assert STATES == (
              "planned",
              "dispatched",
              "running",
              "rejected",
              "completed",
              "acknowledged",
          )
          assert [STATE_RANK[state] for state in STATES] == list(range(len(STATES)))
          PY
      - name: Verify timeline query workflow wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'gh api --paginate' .github/workflows/candidate-request-timeline.yml
          grep -F 'candidate-lifecycle-$request_key-$state' .github/workflows/candidate-request-timeline.yml
          grep -F 'build-candidate-request-timeline.py' .github/workflows/candidate-request-timeline.yml
          grep -F 'candidate-request-timeline-' .github/workflows/candidate-request-timeline.yml
      - name: Build retry-aware lifecycle fixtures
        shell: bash
        run: |
          set -euo pipefail
          REQUEST_ID=timeline-001 \
          SOURCE_REPOSITORY=owner/source \
          RECEIPT_REPOSITORY=owner/receiver \
          ORCHESTRATOR_REPOSITORY=owner/orchestrator \
          GATEWAY_RUN_ID=100 \
          UPDATED_AT=2026-08-17T10:00:00Z \
          python scripts/ci/build-candidate-request-lifecycle.py \
            --state planned --output /tmp/planned.json >/dev/null

          REQUEST_ID=timeline-001 \
          SOURCE_REPOSITORY=owner/source \
          RECEIPT_REPOSITORY=owner/receiver \
          ORCHESTRATOR_REPOSITORY=owner/orchestrator \
          EVALUATION_RUN_ID=200 \
          EVALUATION_RUN_ATTEMPT=1 \
          RECEIPT_SHA256=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
          RECEIVER_RUN_ID=300 \
          UPDATED_AT=2026-08-17T11:00:00Z \
          python scripts/ci/build-candidate-request-lifecycle.py \
            --state acknowledged --output /tmp/old-ack.json >/dev/null

          REQUEST_ID=timeline-001 \
          SOURCE_REPOSITORY=owner/source \
          RECEIPT_REPOSITORY=owner/receiver \
          ORCHESTRATOR_REPOSITORY=owner/orchestrator \
          EVALUATION_RUN_ID=400 \
          EVALUATION_RUN_ATTEMPT=1 \
          UPDATED_AT=2026-08-17T12:00:00Z \
          python scripts/ci/build-candidate-request-lifecycle.py \
            --state running --output /tmp/new-running.json >/dev/null
      - name: Build timeline, deduplicate observations, and choose latest retry
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/build-candidate-request-timeline.py \
            --request-id timeline-001 \
            --candidate artifact=/tmp/planned.json \
            --candidate artifact=/tmp/old-ack.json \
            --candidate bucket=/tmp/old-ack.json \
            --candidate artifact=/tmp/new-running.json \
            --output /tmp/timeline.json >/dev/null
          python scripts/ci/build-candidate-request-timeline.py --validate /tmp/timeline.json >/dev/null
          test "$(jq -r .event_count /tmp/timeline.json)" = 3
          test "$(jq -r .current_state /tmp/timeline.json)" = running
          test "$(jq -r '.events[1].sources | join(",")' /tmp/timeline.json)" = artifact,bucket
          test "$(jq -r '.events[2].snapshot.evaluation_run_id' /tmp/timeline.json)" = 400
      - name: Validate generated timeline against Draft 2020-12 schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          from referencing import Registry, Resource

          lifecycle = json.loads(Path('contracts/candidate-request-lifecycle.schema.json').read_text())
          timeline = json.loads(Path('contracts/candidate-request-timeline.schema.json').read_text())
          instance = json.loads(Path('/tmp/timeline.json').read_text())
          Draft202012Validator.check_schema(lifecycle)
          Draft202012Validator.check_schema(timeline)
          registry = Registry().with_resource(lifecycle['$id'], Resource.from_contents(lifecycle))
          Draft202012Validator(timeline, registry=registry).validate(instance)
          PY
      - name: Reject cross-request timeline contamination
        shell: bash
        run: |
          set -euo pipefail
          REQUEST_ID=timeline-other \
          SOURCE_REPOSITORY=owner/source \
          RECEIPT_REPOSITORY=owner/receiver \
          ORCHESTRATOR_REPOSITORY=owner/orchestrator \
          GATEWAY_RUN_ID=999 \
          UPDATED_AT=2026-08-17T13:00:00Z \
          python scripts/ci/build-candidate-request-lifecycle.py \
            --state planned --output /tmp/other.json >/dev/null
          if python scripts/ci/build-candidate-request-timeline.py \
            --request-id timeline-001 \
            --candidate artifact=/tmp/other.json \
            --output /tmp/invalid-timeline.json; then
            echo 'cross-request snapshot unexpectedly accepted' >&2
            exit 1
          fi
