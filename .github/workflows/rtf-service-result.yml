name: RTF Service Result Collection

on:
  workflow_call:
    inputs:
      run_id: {required: true, type: string}
      service_id: {required: true, type: string}
      status: {required: true, type: string}
      provider: {required: true, type: string}
      environment: {required: true, type: string}
      inspection_profile: {required: true, type: string}
      gpu: {required: true, type: string}
      batch_size: {required: true, type: string}
      job_id: {required: false, type: string, default: ""}
      result_uri: {required: false, type: string, default: ""}
      result_sha256: {required: false, type: string, default: ""}
      metrics_sha256: {required: false, type: string, default: ""}
      metrics_uri: {required: false, type: string, default: ""}
      error_code: {required: false, type: string, default: ""}
      error_message: {required: false, type: string, default: ""}
      score_root: {required: false, type: string, default: "rtf-scores"}
    secrets:
      HF_TOKEN: {required: false}
      RUNPOD_TOKEN: {required: false}
  workflow_dispatch:
    inputs:
      run_id:
        description: Immutable benchmark run identity
        required: true
        type: string
      service_id:
        description: Service that executed the benchmark
        required: true
        type: choice
        options: [hf-inference-endpoint, hf-jobs, runpod-pod, runpod-serverless, vast]
      status:
        description: Provider execution status
        required: true
        type: choice
        options: [completed, failed, blocked, not_verified]
      provider:
        description: Logical execution provider
        required: true
        type: choice
        options: [cpu, cuda, coreml]
      environment:
        description: Named execution environment
        required: true
        type: choice
        options: [linux, windows, macos]
      inspection_profile:
        description: Result profile
        required: true
        type: choice
        options: [smoke, pref, probe]
      gpu:
        description: Benchmark GPU
        required: true
        type: string
      batch_size:
        description: Benchmark batch size
        required: true
        type: string
      job_id:
        description: Remote provider job identity, if available
        required: false
        default: ""
        type: string
      result_uri:
        description: Immutable result URI, required for completed status
        required: false
        default: ""
        type: string
      result_sha256:
        description: SHA-256 of the immutable result
        required: false
        default: ""
        type: string
      metrics_sha256:
        description: SHA-256 of the metrics payload
        required: false
        default: ""
        type: string
      metrics_uri:
        description: HTTPS URI of the metrics payload to fetch and validate
        required: false
        default: ""
        type: string
      error_code:
        description: Required for failed/blocked/not_verified status
        required: false
        default: ""
        type: string
      error_message:
        description: Non-secret diagnostic message
        required: false
        default: ""
        type: string
      score_root:
        description: Repository root for persisted score output
        required: false
        default: rtf-scores
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install latest released Rust CLI
        env:
          GH_TOKEN: ${{ github.token }}
          RUST_CLI_RELEASE_TAG: ${{ vars.RUST_CLI_RELEASE_TAG }}
        run: scripts/ci/install-rust-cli.sh --bin-dir "$RUNNER_TEMP/rust-cli"

      - name: Verify provider credential
        env:
          SERVICE_ID: ${{ inputs.service_id }}
          STATUS: ${{ inputs.status }}
          SCORE_ROOT: ${{ inputs.score_root }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          RUNPOD_TOKEN: ${{ secrets.RUNPOD_TOKEN }}
        run: |
          set -euo pipefail
          case "$SERVICE_ID" in
            hf-inference-endpoint|hf-jobs)
              [[ -n "$HF_TOKEN" ]] || { echo 'HF_TOKEN secret is required'; exit 1; }
              curl --fail --silent --show-error -H "Authorization: Bearer $HF_TOKEN" \
                https://huggingface.co/api/whoami-v2 >/dev/null
              ;;
            runpod-pod|runpod-serverless)
              [[ -n "$RUNPOD_TOKEN" ]] || { echo 'RUNPOD_TOKEN secret is required'; exit 1; }
              curl --fail --silent --show-error \
                -H "Authorization: Bearer $RUNPOD_TOKEN" \
                -H 'Content-Type: application/json' \
                --data '{"query":"query { myself { id } }"}' \
                https://api.runpod.io/graphql >/dev/null
              [[ "$STATUS" != completed || -n "$HF_TOKEN" ]] || {
                echo 'HF_TOKEN is required to fetch and persist completed RunPod metrics'; exit 1;
              }
              ;;
            vast)
              [[ "$STATUS" != completed || -n "$HF_TOKEN" ]] || {
                echo 'HF_TOKEN is required to fetch and persist completed Vast metrics'; exit 1;
              }
              ;;
            *) echo "unsupported service_id: $SERVICE_ID"; exit 1 ;;
          esac

      - name: Write service result envelope
        shell: bash
        env:
          RUN_ID: ${{ inputs.run_id }}
          SERVICE_ID: ${{ inputs.service_id }}
          STATUS: ${{ inputs.status }}
          PROVIDER: ${{ inputs.provider }}
          ENVIRONMENT: ${{ inputs.environment }}
          JOB_ID: ${{ inputs.job_id }}
          RESULT_URI: ${{ inputs.result_uri }}
          RESULT_SHA256: ${{ inputs.result_sha256 }}
          METRICS_SHA256: ${{ inputs.metrics_sha256 }}
          METRICS_URI: ${{ inputs.metrics_uri }}
          ERROR_CODE: ${{ inputs.error_code }}
          ERROR_MESSAGE: ${{ inputs.error_message }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p results/rtf-service
          if [[ "$STATUS" == completed ]]; then
            [[ "$JOB_ID" != "" && "$RESULT_URI" != "" && "$RESULT_SHA256" != "" && "$METRICS_URI" != "" && "$METRICS_SHA256" != "" ]] || {
              echo 'completed result requires job_id, result_uri, result_sha256, metrics_uri, and metrics_sha256' >&2
              exit 2
            }
            [[ "$RESULT_URI" == "$METRICS_URI" && "$RESULT_SHA256" == "$METRICS_SHA256" ]] || {
              echo 'result and metrics identity must match for the benchmark publisher' >&2
              exit 2
            }
            [[ "$METRICS_URI" =~ ^https://huggingface\.co/datasets/gawohok7/rtf-benchmark-fixtures/resolve/[0-9a-f]{40}/results/.+/metrics\.json$ ]] || {
              echo 'metrics_uri is not an immutable fixture-repository URI' >&2
              exit 2
            }
            [[ -n "$HF_TOKEN" ]] || { echo 'HF_TOKEN is required to fetch completed metrics'; exit 1; }
          fi
          [[ "$SCORE_ROOT" =~ ^[A-Za-z0-9._-]+$ ]] || {
            echo 'score_root must be a single safe repository directory name' >&2
            exit 2
          }
          if [[ -n "$METRICS_URI" ]]; then
            curl --fail --location --proto '=https' --tlsv1.2 \
              -H "Authorization: Bearer $HF_TOKEN" "$METRICS_URI" \
              -o results/rtf-service/metrics.json
            jq -e \
              --arg run_id "$RUN_ID" \
              --arg service_id "$SERVICE_ID" \
              --arg provider "$PROVIDER" \
              --arg environment "$ENVIRONMENT" \
              --arg gpu "${{ inputs.gpu }}" \
              --arg batch_size "${{ inputs.batch_size }}" \
              --arg profile "${{ inputs.inspection_profile }}" \
              '(.run_id == $run_id) and (.service_id == $service_id) and (.provider == $provider) and (.environment == $environment) and (.gpu == $gpu) and (.batch_size == ($batch_size | tonumber)) and (.inspection_profile == $profile)' \
              results/rtf-service/metrics.json >/dev/null || {
                echo 'metrics identity does not match service collection inputs' >&2
                exit 2
              }
          fi
          jq -n \
            --arg run_id "$RUN_ID" \
            --arg service_id "$SERVICE_ID" \
            --arg status "$STATUS" \
            --arg provider "$PROVIDER" \
            --arg environment "$ENVIRONMENT" \
            --arg job_id "$JOB_ID" \
            --arg result_uri "$RESULT_URI" \
            --arg result_sha256 "$RESULT_SHA256" \
            --arg metrics_sha256 "$METRICS_SHA256" \
            --arg metrics_uri "$METRICS_URI" \
            --arg error_code "$ERROR_CODE" \
            --arg error_message "$ERROR_MESSAGE" \
            '{schema_version:1,run_id:$run_id,service_id:$service_id,status:$status,provider:$provider,environment:$environment,job_id:($job_id | if . == "" then null else . end),result_uri:($result_uri | if . == "" then null else . end),result_sha256:($result_sha256 | if . == "" then null else . end),metrics_uri:($metrics_uri | if . == "" then null else . end),metrics_path:(if $metrics_uri == "" then null else "results/rtf-service/metrics.json" end),metrics_sha256:($metrics_sha256 | if . == "" then null else . end),error_code:($error_code | if . == "" then null else . end),error_message:($error_message | if . == "" then null else . end)}' \
            > results/rtf-service/service-result.json

      - name: Validate service result envelope
        run: |
          "$RUNNER_TEMP/rust-cli/asr-rtf-service" validate results/rtf-service/service-result.json

      - name: Validate and build benchmark record
        if: inputs.status == 'completed'
        run: |
          set -euo pipefail
          python scripts/ci/build-rtf-benchmark-record.py \
            --metrics results/rtf-service/metrics.json \
            --service-result results/rtf-service/service-result.json \
            --profile '${{ inputs.inspection_profile }}' \
            --output results/rtf-service/benchmark-record.json
          python -m json.tool results/rtf-service/benchmark-record.json >/dev/null

      - name: Write Actions summary
        shell: bash
        run: |
          mkdir -p .ci/rtf-service
          {
            echo '## RTF service result'
            echo
            jq -r '"- run_id: `\(.run_id)`\n- service: `\(.service_id)`\n- status: `\(.status)`\n- provider: `\(.provider)`\n- environment: `\(.environment)`"' results/rtf-service/service-result.json
          } | tee .ci/rtf-service/summary.md >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ inputs.status }}" == completed ]]; then
            jq \
              --arg provider "${{ inputs.service_id == 'runpod-pod' && 'runpod' || (inputs.service_id == 'vast' && 'vast' || 'hf') }}" \
              '{
                model: .model_id,
                provider: $provider,
                gpu: (if .service_id == "runpod-pod" then
                        ({a5000:"NVIDIA RTX A5000",a4000:"NVIDIA RTX A4000",a4500:"NVIDIA RTX A4500",a40:"NVIDIA A40","rtx2000-ada":"NVIDIA RTX 2000 Ada Generation","rtx4000-ada":"NVIDIA RTX 4000 Ada Generation",l4:"NVIDIA L4",rtx3090:"NVIDIA GeForce RTX 3090",rtx4090:"NVIDIA GeForce RTX 4090"}[.gpu] // .gpu)
                      else .gpu end),
                batch_size,
                decoder,
                precision: (if .dtype == "float16" then "fp16" elif .dtype == "bfloat16" then "bf16" else .dtype end),
                audio_seconds: .audio_duration_sec,
                elapsed_seconds: .processing_duration_sec,
                rtf,
                rtfx,
                peak_vram_gb: (if .peak_vram_bytes == null then null else (.peak_vram_bytes / 1073741824) end),
                cer,
                gpu_price_hour: .gpu_price_per_hour,
                cost_per_audio_hour
              }' results/rtf-service/metrics.json > .ci/rtf-service/benchmark-summary.json
          fi

      - name: Persist RTF score in repository
        shell: bash
        env:
          RUN_ID: ${{ inputs.run_id }}
          SERVICE_ID: ${{ inputs.service_id }}
          INSPECTION_PROFILE: ${{ inputs.inspection_profile }}
          GPU: ${{ inputs.gpu }}
          BATCH_SIZE: ${{ inputs.batch_size }}
          SCORE_ROOT: ${{ inputs.score_root }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          destination="${SCORE_ROOT}/${INSPECTION_PROFILE}/${SERVICE_ID}/${GPU}/batch-${BATCH_SIZE}"
          artifact_branch="inspection/${RUN_ID}-${INSPECTION_PROFILE}-${SERVICE_ID}-${GPU}-batch-${BATCH_SIZE}"

          # Keep generated measurements independent from the workflow's source
          # branch. This also works when that branch is protected or read-only.
          git fetch --no-tags origin main
          if git ls-remote --exit-code --heads origin "${artifact_branch}" >/dev/null 2>&1; then
            git fetch --no-tags origin "${artifact_branch}:${artifact_branch}"
            git checkout "${artifact_branch}"
          else
            git checkout --no-track -b "${artifact_branch}" origin/main
          fi
          mkdir -p "$destination"
          cp .ci/rtf-service/summary.md "${destination}/summary.md"
          if [[ -f .ci/rtf-service/benchmark-summary.json ]]; then
            cp .ci/rtf-service/benchmark-summary.json "${destination}/benchmark-summary.json"
          fi
          cp results/rtf-service/service-result.json "${destination}/service-result.json"
          if [[ -f results/rtf-service/metrics.json ]]; then
            cp results/rtf-service/metrics.json "${destination}/metrics.json"
          fi
          if [[ -f results/rtf-service/benchmark-record.json ]]; then
            cp results/rtf-service/benchmark-record.json "${destination}/benchmark-record.json"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${destination}"
          if git diff --cached --quiet; then
            echo 'No new RTF score content to commit.'
          else
            git commit -m "chore: persist RTF score ${RUN_ID} ${SERVICE_ID}"
            git push --set-upstream origin "${artifact_branch}"
          fi

          if ! gh pr view "${artifact_branch}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh pr create \
              --repo "${GITHUB_REPOSITORY}" \
              --base main \
              --head "${artifact_branch}" \
              --title "chore: persist RTF score ${RUN_ID} ${SERVICE_ID}" \
              --body "Automated RTF service result persistence for run \`${RUN_ID}\` and service \`${SERVICE_ID}\`."
          fi

      - name: Upload validated service result
        uses: actions/upload-artifact@v7
        with:
          name: rtf-service-result-${{ inputs.run_id }}
          path: results/rtf-service/
          if-no-files-found: error
