name: RTF Benchmark Run

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Remote benchmark provider
        required: true
        type: choice
        options: [hf, runpod]
      gpu:
        description: Provider GPU name
        required: true
        type: choice
        options: [t4, l4, a5000, a4000, a4500, a40, rtx2000-ada, rtx4000-ada, rtx3090, rtx4090]
      runpod_cloud_type:
        description: RunPod cloud tier; auto selects a tier where this GPU is currently available
        required: false
        default: auto
        type: choice
        options: [auto, SECURE, COMMUNITY]
      model_id:
        description: Model repository ID
        required: true
        default: nvidia/parakeet-tdt_ctc-0.6b-ja
        type: string
      model_revision:
        description: Optional model commit; blank resolves the current HF model commit
        required: false
        type: string
      dataset_revision:
        description: Immutable Common Voice revision
        required: true
        default: bf8819e8d9a5feb51b0c718686bd20ea67a3c729
        type: string
      inspection_profile:
        description: Fixture sizing profile; Phase 1 uses smoke
        required: true
        default: smoke
        type: choice
        options: [smoke]
      cost_mode:
        description: Guarded stops after a failed batch; full-matrix is explicitly more expensive
        required: true
        default: guarded
        type: choice
        options: [guarded, full-matrix]
      cuda_diagnostics:
        description: Enable synchronous CUDA diagnostics for provider failure investigation
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write
  packages: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    # Three provider batches may each spend up to two hours downloading the
    # digest-pinned image/model/fixture and running inference. 180 minutes
    # could cancel a valid sequential full-matrix run mid-collection.
    timeout-minutes: 360
    outputs:
      receipts: ${{ steps.receipts.outputs.receipts }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve immutable image and model revisions
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_JOB_NAMESPACE: gawohok7
          MODEL_ID: ${{ inputs.model_id }}
        run: |
          set -euo pipefail
          image_name="ghcr.io/${GITHUB_REPOSITORY_OWNER}/parakeet-rtf-benchmark"
          for attempt in {1..20}; do
            if image="$(bash scripts/ci/resolve-ghcr-package-digest.sh "$image_name" 2>/dev/null)"; then
              break
            fi
            [[ "$attempt" -lt 20 ]] || {
              echo 'latest GHCR package digest was not available within the retry window' >&2
              exit 1
            }
            {
              echo "Waiting for latest GHCR package digest (attempt ${attempt}/20)"
              sleep 15
            }
          done
          [[ "$image" =~ ^ghcr\.io/[A-Za-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]] || {
            echo 'resolved image must be an immutable GHCR digest reference' >&2
            exit 2
          }

          [[ -n "${HF_TOKEN:-}" ]] || { echo 'HF_TOKEN is required to resolve model revision'; exit 1; }
          model_revision="$(curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $HF_TOKEN" \
            "https://huggingface.co/api/models/${MODEL_ID}" | jq -er '.sha')"
          [[ "$model_revision" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'HF model API did not return an immutable 40-character commit SHA' >&2
            exit 2
          }
          {
            echo "image=$image"
            echo "model_revision=$model_revision"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved image: $image"
          echo "Resolved model revision: $model_revision"
      - name: Verify resolved image contains the RTF loader safety policy
        env:
          IMAGE: ${{ steps.resolve.outputs.image }}
          GH_TOKEN: ${{ github.token }}
          IMAGE_PULL_TIMEOUT_MINUTES: 15
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io \
            --username "${GITHUB_ACTOR:-github-actions[bot]}" --password-stdin >/dev/null
          timeout --signal=TERM "${IMAGE_PULL_TIMEOUT_MINUTES}m" docker pull "$IMAGE" >/dev/null || {
            echo "RTF image pull did not complete within ${IMAGE_PULL_TIMEOUT_MINUTES} minutes" >&2
            exit 124
          }
          docker image inspect "$IMAGE" | jq -e '
            .[0].Config.Entrypoint == ["/opt/rtf-benchmark/entrypoint.sh"] and
            .[0].Config.Cmd == ["sleep", "infinity"]
          ' >/dev/null || {
            echo 'RTF image ENTRYPOINT/CMD contract is invalid' >&2
            exit 2
          }
          docker run --rm --entrypoint /bin/bash "$IMAGE" -s <<'CONTAINER_SCRIPT'
          set -euo pipefail
          if command -v python >/dev/null 2>&1; then
              python_bin="$(command -v python)"
          elif command -v python3 >/dev/null 2>&1; then
              python_bin="$(command -v python3)"
          else
              for candidate in /opt/venv/bin/python /opt/conda/bin/python /usr/local/bin/python3 /usr/bin/python3; do
                  if [[ -x "$candidate" ]]; then python_bin="$candidate"; break; fi
              done
          fi
          : "${python_bin:?RTF image has no usable Python interpreter}"
          "$python_bin" -c '
          from pathlib import Path
          path = Path("/opt/rtf-benchmark/benchmark-runner/benchmark_runner/transcribe_compat.py")
          source = path.read_text(encoding="utf-8")
          required = ("RTF_DATALOADER_POLICY=", "num_workers", "pin_memory", "use_lhotse")
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit(f"RTF image is missing loader safety policy: {missing}")
          print("RTF image loader safety policy: present")
          '
          CONTAINER_SCRIPT
      - name: Restore provider package cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: rtf-benchmark-pip-${{ runner.os }}-${{ hashFiles('docker/rtf-benchmark/requirements.lock') }}
          restore-keys: |
            rtf-benchmark-pip-${{ runner.os }}-
      - name: Install provider CLIs
        run: |
          python -m pip install --disable-pip-version-check --upgrade huggingface_hub
          if [[ '${{ inputs.provider }}' == 'runpod' ]]; then
            curl -fsSL https://cli.runpod.net | sudo bash
          fi
      - name: Install latest released Rust CLI
        env:
          GH_TOKEN: ${{ github.token }}
          RUST_CLI_RELEASE_TAG: ${{ vars.RUST_CLI_RELEASE_TAG }}
        run: scripts/ci/install-rust-cli.sh --bin-dir "$RUNNER_TEMP/rust-cli"
      - name: Configure RunPod CLI
        if: inputs.provider == 'runpod'
        env:
          RUNPOD_TOKEN: ${{ secrets.RUNPOD_TOKEN }}
          RTF_GPU: ${{ inputs.gpu }}
        run: |
          set -euo pipefail
          [[ -n "$RUNPOD_TOKEN" ]] || { echo 'RUNPOD_TOKEN is required'; exit 1; }
          mkdir -p "$HOME/.runpod"
          touch "$HOME/.runpod/.runpod.yaml"
          runpodctl config --apiKey="$RUNPOD_TOKEN"
          # Provider configuration must not hold a runner forever before a
          # Pod is created. The timeout is pre-provider and therefore cannot
          # create GPU cost; a timeout fails the run closed.
          doctor_json="$(timeout --signal=TERM 90s runpodctl doctor --output json)" || {
            echo 'RUNPOD_CLI_DOCTOR_TIMEOUT_OR_FAILURE: RunPod CLI doctor did not complete within 90 seconds' >&2
            exit 124
          }
          echo "$doctor_json" | jq .
          jq -e '.healthy == true' <<<"$doctor_json" >/dev/null || {
            echo 'RunPod CLI doctor did not report a healthy configuration' >&2
            exit 1
          }
          runpodctl gpu list --include-unavailable --output json > .ci/runpod-gpu-inventory.json
          python scripts/ci/check-runpod-rtf-services.py \
            --config .github/runpod-rtf-services.json \
            --inventory .ci/runpod-gpu-inventory.json \
            --output .ci/runpod-rtf-service-report.json \
            --require-gpu "$RTF_GPU"
      - name: Validate Rust cost policy before provider execution
        run: |
          set -euo pipefail
          mkdir -p .ci
          policy_url="${RTF_COST_POLICY_URL:-https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/evaluation/manifests/rtf-cost-policy.json}"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 "$policy_url" -o .ci/rtf-cost-policy-definition.json
          cost_args=(
            --provider '${{ inputs.provider }}' --gpu '${{ inputs.gpu }}'
            --batch-size 1 --repeat 3 --sample-count 50
            --target-total-sec 5400 --max-duration-sec 600
            --mode '${{ inputs.cost_mode }}'
          )
          if [[ '${{ inputs.cost_mode }}' == full-matrix ]]; then
            cost_args+=(--allow-expensive-matrix)
          fi
          "$RUNNER_TEMP/rust-cli/asr-rtf-cost-policy" --policy .ci/rtf-cost-policy-definition.json \
            "${cost_args[@]}" | tee .ci/rtf-cost-policy.json
      - name: Run cost-guarded benchmark batch sizes sequentially
        id: execute
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          RUNPOD_TOKEN: ${{ secrets.RUNPOD_TOKEN }}
          HF_JOB_NAMESPACE: gawohok7
          RUNPOD_REGISTRY_AUTH_ID: ${{ secrets.RUNPOD_REGISTRY_AUTH_ID }}
          RTF_RUNPOD_REQUIRE_REGISTRY_AUTH: '1'
          RTF_MODEL_ID: ${{ inputs.model_id }}
          RTF_MODEL_REVISION: ${{ steps.resolve.outputs.model_revision }}
          RTF_DATASET_ID: japanese-asr/ja_asr.common_voice_8_0
          RTF_DATASET_REVISION: ${{ inputs.dataset_revision }}
          RTF_FIXTURE_REPO_ID: ''
          RTF_FIXTURE_REVISION: ''
          RTF_RESULT_REPO_ID: gawohok7/rtf-benchmark-fixtures
          RTF_IMAGE_DIGEST: ${{ steps.resolve.outputs.image }}
          RTF_INSPECTION_PROFILE: ${{ inputs.inspection_profile }}
          RTF_GPU: ${{ inputs.gpu }}
          RTF_REPEAT: 3
          RTF_DATASET_CONFIGURATION: default
          RTF_DATASET_SPLIT: test
          RTF_DATASET_SEED: rtf-benchmark-v1-common-voice-ja
          RTF_DATASET_COUNT_MIN: 20
          RTF_DATASET_COUNT_MAX: 50
          RTF_DATASET_TARGET_TOTAL_SEC: 5400
          RTF_DATASET_MAX_DURATION_SEC: 600
          RTF_FIXTURE_FILENAME: benchmark-v1.jsonl
          RTF_FIXTURE_MANIFEST_SHA256: ''
          RTF_CUDA_DIAGNOSTICS: ${{ inputs.cuda_diagnostics && '1' || '0' }}
        run: |
          set -euo pipefail
          [[ -f rtf-scores/benchmark/benchmark-v1.fixture.json ]] || {
            echo 'Resolver fixture pointer is missing; merge the RTF Resolver PR first' >&2
            exit 2
          }
          export RTF_FIXTURE_REPO_ID="$(jq -er '.fixture_repo_id' rtf-scores/benchmark/benchmark-v1.fixture.json)"
          export RTF_FIXTURE_REVISION="$(jq -er '.fixture_revision' rtf-scores/benchmark/benchmark-v1.fixture.json)"
          export RTF_FIXTURE_MANIFEST_SHA256="$(jq -er '.manifest_sha256' rtf-scores/benchmark/benchmark-v1.receipt.json)"
          export RTF_IMAGE_DIGEST="${RTF_IMAGE_DIGEST##*@}"
          pointer_fixture_revision="$(jq -er '.fixture_revision' rtf-scores/benchmark/benchmark-v1.fixture.json)"
          receipt_fixture_repo_id="$(jq -er '.fixture_repo_id' rtf-scores/benchmark/benchmark-v1.receipt.json)"
          receipt_fixture_revision="$(jq -er '.fixture_revision' rtf-scores/benchmark/benchmark-v1.receipt.json)"
          receipt_image_digest="$(jq -er '.image | split("@")[1]' rtf-scores/benchmark/benchmark-v1.receipt.json)"
          [[ "$pointer_fixture_revision" == "$RTF_FIXTURE_REVISION" ]] || {
            echo 'RTF_FIXTURE_POINTER_MISMATCH: fixture pointer and receipt revisions differ' >&2
            exit 2
          }
          [[ "$receipt_fixture_repo_id" == "$RTF_FIXTURE_REPO_ID" ]] || {
            echo 'RTF_FIXTURE_REPOSITORY_MISMATCH: fixture pointer and receipt repositories differ' >&2
            exit 2
          }
          [[ "$receipt_fixture_revision" == "$RTF_FIXTURE_REVISION" ]] || {
            echo 'RTF_FIXTURE_RECEIPT_REVISION_MISMATCH: receipt revision does not match pointer' >&2
            exit 2
          }
          [[ "$receipt_image_digest" == "$RTF_IMAGE_DIGEST" ]] || {
            echo "RTF_FIXTURE_IMAGE_MISMATCH: fixture was resolved for $receipt_image_digest, but benchmark image is $RTF_IMAGE_DIGEST" >&2
            exit 2
          }
          export RTF_HF_TIMEOUT=2h
          export RTF_RUNPOD_MAX_HOURS=2
          export RTF_RUNPOD_WAIT_TIMEOUT_MINUTES=30
          export RTF_RUNPOD_SSH_INFO_WAIT_MINUTES=5
          export RTF_RUNPOD_MIN_CUDA_VERSION="$(jq -er '.minimum_cuda_version' .github/runpod-rtf-services.json)"
          export RTF_RUNPOD_CLOUD_TYPE='${{ inputs.runpod_cloud_type }}'
          echo "Using fixture repository: $RTF_FIXTURE_REPO_ID"
          echo "Using fixture revision: $RTF_FIXTURE_REVISION"
          case '${{ inputs.provider }}:${{ inputs.gpu }}' in
            hf:t4|hf:l4|runpod:a5000|runpod:a4000|runpod:a4500|runpod:a40|runpod:rtx2000-ada|runpod:rtx4000-ada|runpod:l4|runpod:rtx3090|runpod:rtx4090) ;;
            *) echo 'provider/GPU is outside the Phase 1 RTF matrix' >&2; exit 2 ;;
          esac
          mkdir -p results/batches
          successful_batches=0
          cost_guard_failed=0
          matrix_oom_guard_failed=0
          batch_sizes=(1)
          if [[ '${{ inputs.cost_mode }}' == full-matrix ]]; then
            batch_sizes=(1 8 32)
          fi
          for batch_size in "${batch_sizes[@]}"; do
            batch_run_id="rtf-${{ inputs.provider }}-${{ github.run_id }}-b${batch_size}"
            batch_dir="results/batches/batch-${batch_size}"
            mkdir -p "$batch_dir"
            if [[ "$cost_guard_failed" -eq 1 && ( '${{ inputs.cost_mode }}' == guarded || "$matrix_oom_guard_failed" -eq 1 ) ]]; then
              jq -n \
                --arg run_id "$batch_run_id" \
                --arg error_code "$(if [[ "$matrix_oom_guard_failed" -eq 1 ]]; then echo OOM_GUARD_SKIPPED; else echo COST_GUARD_SKIPPED; fi)" \
                --arg error_message "$(if [[ "$matrix_oom_guard_failed" -eq 1 ]]; then echo 'skipped after a CUDA OOM to avoid repeated provider cost'; else echo 'skipped after an earlier guarded batch failed'; fi)" \
                '{schema_version:1,run_id:$run_id,status:"blocked",job_id:null,result_uri:null,result_sha256:null,metrics_uri:null,metrics_sha256:null,error_code:$error_code,error_message:$error_message}' \
                > "$batch_dir/result-receipt.json"
              jq -n \
                --arg run_id "$batch_run_id" --arg model_id "$RTF_MODEL_ID" --arg model_revision "$RTF_MODEL_REVISION" \
                --arg dataset_id "$RTF_DATASET_ID" --arg dataset_revision "$RTF_DATASET_REVISION" --arg image_digest "$RTF_IMAGE_DIGEST" \
                --arg fixture_repo_id "$RTF_FIXTURE_REPO_ID" --arg fixture_revision "$RTF_FIXTURE_REVISION" --arg manifest_sha256 "$RTF_FIXTURE_MANIFEST_SHA256" \
                --arg gpu "$RTF_GPU" --arg inspection_profile "$RTF_INSPECTION_PROFILE" --arg batch_size "$batch_size" \
                --arg error_code "$(if [[ "$matrix_oom_guard_failed" -eq 1 ]]; then echo OOM_GUARD_SKIPPED; else echo COST_GUARD_SKIPPED; fi)" \
                --arg error_message "$(if [[ "$matrix_oom_guard_failed" -eq 1 ]]; then echo 'provider execution was not attempted after a CUDA OOM'; else echo 'provider execution was not attempted'; fi)" \
                '{schema_version:1,run_id:$run_id,status:"blocked",error_code:$error_code,error_message:$error_message,model_id:$model_id,model_revision:$model_revision,dataset_id:$dataset_id,dataset_revision:$dataset_revision,decoder:"tdt",precision:"float16",batch_size:($batch_size|tonumber),repeat:3,provider:"cuda",environment:"linux",service_id:(if "${{ inputs.provider }}" == "hf" then "hf-jobs" else "runpod-pod" end),gpu:$gpu,inspection_profile:$inspection_profile,fixture_repo_id:$fixture_repo_id,fixture_revision:$fixture_revision,manifest_sha256:$manifest_sha256,image_digest:$image_digest,sample_index:0,audio_path:"",reference_text:"",content_available:false}' \
                > "$batch_dir/content.json"
              continue
            fi
            export RTF_RUN_ID="$batch_run_id"
            export RTF_BATCH_SIZE="$batch_size"
            export RTF_LOCAL_OUTPUT="$batch_dir/metrics.json"
            export RTF_LOCAL_CONTENT="$batch_dir/content.json"
            export RTF_LOCAL_RECEIPT="$batch_dir/result-receipt.json"
            export RTF_LOCAL_PROVIDER_DIAGNOSTICS="$batch_dir/provider-diagnostics.json"
            export RTF_HF_LOG="$batch_dir/hf-job.log"
            export RTF_RUNPOD_LOG="$batch_dir/runpod-job.log"
            export RTF_RUNPOD_CONTAINER_LOG_TAIL=100
            set +e
            ./scripts/run-benchmark.sh \
              --provider '${{ inputs.provider }}' \
              --image '${{ steps.resolve.outputs.image }}'
            execute_status=$?
            set -e
            if [[ ! -s "$RTF_LOCAL_RECEIPT" ]]; then
              jq -n \
                --arg run_id "$batch_run_id" \
                --arg error_message "provider execution did not produce a result receipt for batch ${batch_size}" \
                '{schema_version:1,run_id:$run_id,status:"blocked",job_id:null,result_uri:null,result_sha256:null,metrics_uri:null,metrics_sha256:null,error_code:"PROVIDER_EXECUTION_FAILED",error_message:$error_message}' \
                > "$RTF_LOCAL_RECEIPT"
            fi
            if [[ ! -s "$RTF_LOCAL_CONTENT" ]]; then
              jq -n \
                --arg run_id "$batch_run_id" \
                --arg model_id "$RTF_MODEL_ID" --arg model_revision "$RTF_MODEL_REVISION" \
                --arg dataset_id "$RTF_DATASET_ID" --arg dataset_revision "$RTF_DATASET_REVISION" \
                --arg image_digest "$RTF_IMAGE_DIGEST" --arg fixture_repo_id "$RTF_FIXTURE_REPO_ID" \
                --arg fixture_revision "$RTF_FIXTURE_REVISION" --arg manifest_sha256 "$RTF_FIXTURE_MANIFEST_SHA256" \
                --arg gpu "$RTF_GPU" --arg inspection_profile "$RTF_INSPECTION_PROFILE" \
                --arg error_message "provider content gate did not produce content evidence for batch ${batch_size}" \
                '{schema_version:1,run_id:$run_id,status:"blocked",model_id:$model_id,model_revision:$model_revision,dataset_id:$dataset_id,dataset_revision:$dataset_revision,decoder:"tdt",precision:"float16",provider:"cuda",environment:"linux",service_id:(if "${{ inputs.provider }}" == "hf" then "hf-jobs" else "runpod-pod" end),gpu:$gpu,image_digest:$image_digest,inspection_profile:$inspection_profile,fixture_repo_id:$fixture_repo_id,fixture_revision:$fixture_revision,manifest_sha256:$manifest_sha256,sample_index:0,audio_path:"",reference_text:"",content_available:false,error_code:"PROVIDER_CONTENT_MISSING",error_message:$error_message}' \
                > "$batch_dir/content.json"
            fi
            jq -e --arg run_id "$batch_run_id" '(.schema_version == 1) and (.run_id == $run_id)' "$RTF_LOCAL_RECEIPT" >/dev/null
            if [[ "$execute_status" -ne 0 ]] || ! jq -e '.status == "completed"' "$RTF_LOCAL_RECEIPT" >/dev/null 2>&1; then
              cost_guard_failed=1
            fi
            if [[ '${{ inputs.cost_mode }}' == full-matrix ]] && jq -e '.error_code == "PROVIDER_CUDA_OOM"' "$RTF_LOCAL_RECEIPT" >/dev/null 2>&1; then
              matrix_oom_guard_failed=1
              echo "batch ${batch_size} hit CUDA OOM; later matrix batches will be recorded as skipped" >&2
            fi
            if [[ "$execute_status" -ne 0 ]]; then
              echo "batch ${batch_size} exited with status ${execute_status}; continuing remaining batches" >&2
            elif jq -e '.status == "completed"' "$RTF_LOCAL_RECEIPT" >/dev/null; then
              successful_batches=$((successful_batches + 1))
            fi
          done
          if [[ "$successful_batches" -eq 0 ]]; then
            echo 'all benchmark batches failed; marking the benchmark job as FAILURE' >&2
            exit 1
          fi
      - name: Cleanup RunPod Pods after benchmark
        if: always() && inputs.provider == 'runpod'
        env:
          RUNPOD_TOKEN: ${{ secrets.RUNPOD_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$RUNPOD_TOKEN" ]] || { echo 'RUNPOD_TOKEN is required for RunPod cleanup'; exit 1; }
          batch_sizes=(1)
          if [[ '${{ inputs.cost_mode }}' == full-matrix ]]; then
            batch_sizes=(1 8 32)
          fi
          for batch_size in "${batch_sizes[@]}"; do
            run_id="rtf-runpod-${{ github.run_id }}-b${batch_size}"
            candidate_ids="$(runpodctl pod list --all --name "$run_id" --output json 2>/dev/null \
              | jq -r '.[] | (.id // .podId // .pod_id)' 2>/dev/null || true)"
            while IFS= read -r candidate_id; do
              [[ -n "$candidate_id" ]] || continue
              echo "Deleting RunPod cleanup candidate $candidate_id for $run_id"
              runpodctl pod delete "$candidate_id" >/dev/null || \
                echo "::error::failed to delete RunPod cleanup candidate $candidate_id"
            done <<< "$candidate_ids"
          done
      - name: Normalize provider receipts
        id: receipts
        if: always()
        run: |
          set -euo pipefail
          batch_sizes=(1)
          if [[ '${{ inputs.cost_mode }}' == full-matrix ]]; then
            batch_sizes=(1 8 32)
          fi
          for batch_size in "${batch_sizes[@]}"; do
            receipt_path="results/batches/batch-${batch_size}/result-receipt.json"
            if [[ ! -s "$receipt_path" ]]; then
              mkdir -p "$(dirname "$receipt_path")"
              jq -n \
                --arg run_id "rtf-${{ inputs.provider }}-${{ github.run_id }}-b${batch_size}" \
                --arg error_message "benchmark setup did not produce a result receipt for batch ${batch_size}" \
                '{schema_version:1,run_id:$run_id,status:"blocked",job_id:null,result_uri:null,result_sha256:null,metrics_uri:null,metrics_sha256:null,error_code:"BENCHMARK_SETUP_FAILED",error_message:$error_message}' \
                > "$receipt_path"
            fi
          done
          receipts="$(for batch_size in "${batch_sizes[@]}"; do
            jq --arg batch_size "$batch_size" \
              '. + {batch_size:($batch_size | tonumber)}' \
              "results/batches/batch-${batch_size}/result-receipt.json"
          done | jq -sc '.')"
          echo "receipts=$receipts" >> "$GITHUB_OUTPUT"
      - name: Upload collected result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rtf-benchmark-${{ github.run_id }}
          path: |
            results/batches/
            if-no-files-found: ignore

  collect:
    needs: benchmark
    if: always()
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        result: ${{ fromJSON(needs.benchmark.outputs.receipts) }}
    uses: ./.github/workflows/rtf-service-result.yml
    with:
      run_id: ${{ matrix.result.run_id }}
      service_id: ${{ inputs.provider == 'hf' && 'hf-jobs' || 'runpod-pod' }}
      status: ${{ matrix.result.status }}
      provider: cuda
      environment: linux
      inspection_profile: ${{ inputs.inspection_profile }}
      gpu: ${{ inputs.gpu }}
      batch_size: ${{ matrix.result.batch_size }}
      job_id: ${{ matrix.result.job_id || '' }}
      result_uri: ${{ matrix.result.result_uri || '' }}
      result_sha256: ${{ matrix.result.result_sha256 || '' }}
      metrics_uri: ${{ matrix.result.metrics_uri || '' }}
      metrics_sha256: ${{ matrix.result.metrics_sha256 || '' }}
      error_code: ${{ matrix.result.error_code || '' }}
      error_message: ${{ matrix.result.error_message || '' }}
    secrets: inherit
