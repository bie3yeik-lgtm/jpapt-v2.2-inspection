name: RTF Benchmark Run

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Remote benchmark provider
        required: true
        type: choice
        options: [hf, runpod]
      image:
        description: Optional image override; blank resolves the latest GHCR package digest
        required: false
        type: string
      gpu:
        description: Provider GPU name
        required: true
        type: choice
        options: [t4, l4, a5000, rtx3090, rtx4090]
      model_id:
        description: Model repository ID
        required: true
        default: nvidia/parakeet-tdt_ctc-0.6b-ja
        type: string
      model_revision:
        description: Optional model commit; blank resolves the current HF model commit
        required: false
        type: string
      dataset_revision:
        description: Immutable Common Voice revision
        required: true
        default: bf8819e8d9a5feb51b0c718686bd20ea67a3c729
        type: string
      batch_size:
        description: Benchmark batch size
        required: true
        default: "1"
        type: choice
        options: ["1", "8", "32"]
      inspection_profile:
        description: Fixture sizing profile; Phase 1 uses lough inspection
        required: true
        default: lough inspection
        type: choice
        options: [lough inspection]

permissions:
  contents: write
  pull-requests: write
  packages: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      status: ${{ steps.receipt.outputs.status }}
      job_id: ${{ steps.receipt.outputs.job_id }}
      result_uri: ${{ steps.receipt.outputs.result_uri }}
      result_sha256: ${{ steps.receipt.outputs.result_sha256 }}
      metrics_uri: ${{ steps.receipt.outputs.metrics_uri }}
      metrics_sha256: ${{ steps.receipt.outputs.metrics_sha256 }}
      error_code: ${{ steps.receipt.outputs.error_code }}
      error_message: ${{ steps.receipt.outputs.error_message }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve immutable image and model revisions
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          IMAGE_INPUT: ${{ inputs.image }}
          MODEL_ID: ${{ inputs.model_id }}
        run: |
          set -euo pipefail
          image_input="${IMAGE_INPUT:-}"
          if [[ -n "$image_input" ]]; then
            image="$image_input"
          else
            package_digest="$(gh api --paginate --slurp \
              "/users/${GITHUB_REPOSITORY_OWNER}/packages/container/parakeet-rtf-benchmark/versions?per_page=100" \
              | jq -er 'add | (map(select((.metadata.container.tags // []) | index("latest"))) // []) as $tagged | (if ($tagged | length) > 0 then $tagged else . end) | max_by(.updated_at) | .metadata.container.digest')" || {
                echo 'unable to resolve a GHCR package version digest' >&2
                exit 2
              }
            image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/parakeet-rtf-benchmark@${package_digest}"
          fi
          [[ "$image" =~ ^ghcr\.io/[A-Za-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]] || {
            echo 'resolved image must be an immutable GHCR digest reference' >&2
            exit 2
          }

          [[ -n "${HF_TOKEN:-}" ]] || { echo 'HF_TOKEN is required to resolve model revision'; exit 1; }
          model_revision="$(curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $HF_TOKEN" \
            "https://huggingface.co/api/models/${MODEL_ID}" | jq -er '.sha')"
          [[ "$model_revision" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'HF model API did not return an immutable 40-character commit SHA' >&2
            exit 2
          }
          {
            echo "image=$image"
            echo "model_revision=$model_revision"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved image: $image"
          echo "Resolved model revision: $model_revision"
      - name: Restore provider package cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: rtf-benchmark-pip-${{ runner.os }}-${{ hashFiles('docker/rtf-benchmark/requirements.lock') }}
          restore-keys: |
            rtf-benchmark-pip-${{ runner.os }}-
      - name: Install provider CLIs
        run: |
          python -m pip install --disable-pip-version-check --upgrade huggingface_hub
          if [[ '${{ inputs.provider }}' == 'runpod' ]]; then
            curl -fsSL https://cli.runpod.net | sudo bash
          fi
      - name: Configure RunPod CLI
        if: inputs.provider == 'runpod'
        env:
          RUNPOD_TOKEN: ${{ secrets.RUNPOD_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$RUNPOD_TOKEN" ]] || { echo 'RUNPOD_TOKEN is required'; exit 1; }
          runpodctl config --apiKey="$RUNPOD_TOKEN"
      - name: Run all benchmark targets
        id: execute
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          RTF_RUN_ID: rtf-${{ inputs.provider }}-${{ github.run_id }}
          RTF_MODEL_ID: ${{ inputs.model_id }}
          RTF_MODEL_REVISION: ${{ steps.resolve.outputs.model_revision }}
          RTF_DATASET_ID: japanese-asr/ja_asr.common_voice_8_0
          RTF_DATASET_REVISION: ${{ inputs.dataset_revision }}
          RTF_FIXTURE_REPO_ID: ''
          RTF_FIXTURE_REVISION: ''
          RTF_RESULT_REPO_ID: gawohok7/rtf-benchmark-fixtures
          RTF_IMAGE_DIGEST: ${{ steps.resolve.outputs.image }}
          RTF_LOCAL_RECEIPT: result-receipt.json
          RTF_INSPECTION_PROFILE: ${{ inputs.inspection_profile }}
          RTF_GPU: ${{ inputs.gpu }}
          RTF_BATCH_SIZE: ${{ inputs.batch_size }}
          RTF_REPEAT: 3
          RTF_DATASET_CONFIGURATION: default
          RTF_DATASET_SPLIT: test
          RTF_DATASET_SEED: rtf-benchmark-v1-common-voice-ja
          RTF_DATASET_COUNT_MIN: 20
          RTF_DATASET_COUNT_MAX: 50
          RTF_DATASET_TARGET_TOTAL_SEC: 5400
          RTF_DATASET_MAX_DURATION_SEC: 600
          RTF_FIXTURE_FILENAME: benchmark-v1.jsonl
          RTF_FIXTURE_MANIFEST_SHA256: ''
          RUNPOD_GPU_ID: ${{ inputs.gpu }}
        run: |
          set -euo pipefail
          [[ -f rtf-scores/benchmark/benchmark-v1.fixture.json ]] || {
            echo 'Resolver fixture pointer is missing; merge the RTF Resolver PR first' >&2
            exit 2
          }
          export RTF_FIXTURE_REPO_ID="$(jq -er '.fixture_repo_id' rtf-scores/benchmark/benchmark-v1.fixture.json)"
          export RTF_FIXTURE_REVISION="$(jq -er '.fixture_revision' rtf-scores/benchmark/benchmark-v1.fixture.json)"
          export RTF_FIXTURE_MANIFEST_SHA256="$(jq -er '.manifest_sha256' rtf-scores/benchmark/benchmark-v1.receipt.json)"
          echo "Using fixture repository: $RTF_FIXTURE_REPO_ID"
          echo "Using fixture revision: $RTF_FIXTURE_REVISION"
          case '${{ inputs.provider }}:${{ inputs.gpu }}' in
            hf:t4|hf:l4|runpod:a5000|runpod:l4|runpod:rtx3090|runpod:rtx4090) ;;
            *) echo 'provider/GPU is outside the Phase 1 RTF matrix' >&2; exit 2 ;;
          esac
          ./scripts/run-benchmark.sh \
            --provider '${{ inputs.provider }}' \
            --image '${{ steps.resolve.outputs.image }}'
      - name: Normalize provider receipt
        id: receipt
        if: always()
        env:
          EXECUTE_OUTCOME: ${{ steps.execute.outcome }}
        run: |
          set -euo pipefail
          if [[ -f result-receipt.json ]]; then
            jq -e '(.schema_version == 1) and (.run_id | length > 0)' result-receipt.json >/dev/null
          else
            jq -n \
              --arg run_id "rtf-${{ inputs.provider }}-${{ github.run_id }}" \
              --arg status "blocked" \
              --arg error_code "PROVIDER_EXECUTION_FAILED" \
              --arg error_message "provider execution did not produce a result receipt" \
              '{schema_version:1,run_id:$run_id,status:$status,job_id:null,result_uri:null,result_sha256:null,metrics_uri:null,metrics_sha256:null,error_code:$error_code,error_message:$error_message}' \
              > result-receipt.json
          fi
          status="$(jq -r '.status // "blocked"' result-receipt.json)"
          [[ "$EXECUTE_OUTCOME" == success && "$status" == completed ]] || status=blocked
          {
            echo "status=$status"
            echo "job_id=$(jq -r '.job_id // empty' result-receipt.json)"
            echo "result_uri=$(jq -r '.result_uri // empty' result-receipt.json)"
            echo "result_sha256=$(jq -r '.result_sha256 // empty' result-receipt.json)"
            echo "metrics_uri=$(jq -r '.metrics_uri // empty' result-receipt.json)"
            echo "metrics_sha256=$(jq -r '.metrics_sha256 // empty' result-receipt.json)"
            echo "error_code=$(jq -r '.error_code // empty' result-receipt.json)"
            echo "error_message=$(jq -r '.error_message // empty' result-receipt.json | tr '\n' ' ')"
          } >> "$GITHUB_OUTPUT"
      - name: Upload collected result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rtf-benchmark-${{ github.run_id }}
          path: |
            metrics.json
            result-receipt.json
            hf-job.log
          if-no-files-found: ignore

  collect:
    needs: benchmark
    if: always()
    uses: ./.github/workflows/rtf-service-result.yml
    with:
      run_id: rtf-${{ inputs.provider }}-${{ github.run_id }}
      service_id: ${{ inputs.provider == 'hf' && 'hf-jobs' || 'runpod-pod' }}
      status: ${{ needs.benchmark.outputs.status }}
      provider: cuda
      environment: linux
      inspection_profile: ${{ inputs.inspection_profile == 'lough inspection' && 'lough' || 'precise' }}
      gpu: ${{ inputs.gpu }}
      batch_size: ${{ inputs.batch_size }}
      job_id: ${{ needs.benchmark.outputs.job_id }}
      result_uri: ${{ needs.benchmark.outputs.result_uri }}
      result_sha256: ${{ needs.benchmark.outputs.result_sha256 }}
      metrics_uri: ${{ needs.benchmark.outputs.metrics_uri }}
      metrics_sha256: ${{ needs.benchmark.outputs.metrics_sha256 }}
      error_code: ${{ needs.benchmark.outputs.error_code }}
      error_message: ${{ needs.benchmark.outputs.error_message }}
    secrets: inherit
