name: Phase8 Audit

on:
  push:
    branches: [agent/rust-hf-target-routing-phase8]
    paths:
      - ".github/workflows/phase8-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Find legacy HF target resolver callers
        shell: bash
        run: |
          set -euo pipefail
          git grep -n 'resolve-hf-target.py' || true
