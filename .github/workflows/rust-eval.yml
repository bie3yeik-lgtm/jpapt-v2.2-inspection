name: Rust Cross Platform Evaluation

on:
  workflow_dispatch:
    inputs:
      hf_target:
        description: "Source-controlled HF target ID"
        required: true
        default: parakeet-tdt_ctc-0.6b-ja
        type: string
      candidate_id:
        description: "Optional candidate-NNNNNN (blank = latest candidate in target Bucket)"
        required: false
        default: ""
        type: string
      runtime_variant:
        description: "Runtime variant from the target profile set (blank = catalog default)"
        required: false
        default: ""
        type: string
      evaluation:
        description: "Evaluation suite"
        required: false
        default: smoke
        type: choice
        options: [smoke, parity, coreml-parity, full]
      strict_provider:
        description: "Disable CPU fallback for accelerator proof runs"
        required: false
        default: true
        type: boolean
      optimization_level:
        description: "ORT graph optimization level"
        required: false
        default: configured
        type: choice
        options: [configured, disable, basic, extended, all]

permissions:
  contents: read
  actions: write

concurrency:
  group: rust-eval-${{ inputs.hf_target }}-${{ inputs.candidate_id || 'latest' }}-${{ inputs.runtime_variant || 'default' }}-${{ inputs.evaluation }}-${{ inputs.strict_provider }}-${{ inputs.optimization_level }}
  cancel-in-progress: true

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  GH_TOKEN: ${{ secrets.HF_ALLOCATOR_GITHUB_TOKEN || github.token }}
  HF_ALLOCATOR_REPOSITORY: bie3yeik-lgtm/jpapt-v2.2-inspection

jobs:
  allocate-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      experiment_id: ${{ steps.allocate.outputs.experiment_id }}
      candidate_id: ${{ steps.candidate.outputs.candidate_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Hugging Face CLI
        run: python -m pip install --disable-pip-version-check --upgrade huggingface_hub
      - name: Resolve target
        shell: bash
        run: |
          set -euo pipefail
          ARGS=(resolve-target --target "${{ inputs.hf_target }}" --github-env "${GITHUB_ENV}")
          if [[ -n "${{ inputs.runtime_variant }}" ]]; then
            ARGS+=(--runtime-variant "${{ inputs.runtime_variant }}")
          fi
          cargo run --quiet --locked -p asr-hf -- "${ARGS[@]}"
      - name: Resolve candidate from Bucket
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          candidate="${{ inputs.candidate_id }}"
          if [[ -n "$candidate" ]]; then
            [[ "$candidate" =~ ^candidate-[0-9]{6}$ ]] || { echo "::error::candidate_id must use candidate-NNNNNN"; exit 1; }
          else
            listing="$(mktemp)"
            trap 'rm -f "$listing"' EXIT
            hf buckets list --token "$HF_TOKEN" "hf://buckets/${HF_BUCKET}/candidates" -R -q > "$listing"
            summary="$(cargo run --quiet --locked -p asr-hf -- resolve-candidate-location --listing "$listing" --runtime-variant "$ASR_RUNTIME_VARIANT")"
            candidate="$(printf '%s\n' "$summary" | sed -n 's/^candidate_id=//p')"
            legacy="$(printf '%s\n' "$summary" | sed -n 's/^legacy=//p')"
            [[ "$legacy" != true ]] || echo "::warning::Using legacy Bucket candidate layout for ${candidate}; new candidates are written canonically."
          fi
          echo "candidate_id=${candidate}" >> "$GITHUB_OUTPUT"
      - id: allocate
        name: Allocate ID through central allocator
        shell: bash
        env:
          CANDIDATE_ID: ${{ steps.candidate.outputs.candidate_id }}
          EVALUATION_ID: ${{ inputs.evaluation }}
        run: |
          set -euo pipefail
          ID="$(bash scripts/hf/hf-allocate-id.sh experiments)"
          echo "experiment_id=${ID}" >> "${GITHUB_OUTPUT}"
          echo "Experiment: ${ID}"

  evaluate:
    needs: allocate-experiment
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-cpu
            os: ubuntu-latest
            environment: linux
            provider: cpu
            features: cpu
          - name: windows-cpu
            os: windows-latest
            environment: windows
            provider: cpu
            features: cpu
          - name: windows-directml
            os: windows-latest
            environment: windows
            provider: directml
            features: cpu,directml
          - name: macos-cpu
            os: macos-15
            environment: macos
            provider: cpu
            features: cpu
          - name: macos-coreml
            os: macos-15
            environment: macos
            provider: coreml
            features: cpu,coreml
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      HF_BUCKET: ""
      HF_MODEL_REPO: ""
      EXPECTED_DEVELOPMENT_REPO_ID: ""
      EXPECTED_UPSTREAM_REPO_ID: ""
      EXPECTED_TOKENIZER_REPO_ID: ""
      EXPECTED_FRAMEWORK: ""
      HF_PROFILE_SET: ""
      ASR_RUNTIME_VARIANT: ""
      EXPECTED_RUNTIME_PROFILE: ""
      EXPECTED_DECODER: ""
      HF_TARGET_ID: ""
      CANDIDATE_ID: ${{ needs.allocate-experiment.outputs.candidate_id }}
      EXPERIMENT_ID: ${{ needs.allocate-experiment.outputs.experiment_id }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Python preparation layer
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[datasets,onnx,dev]"
          python -m pip install --upgrade huggingface_hub

      - name: Resolve HF target and runtime variant
        id: hf
        shell: bash
        run: |
          set -euo pipefail
          ARGS=(
            resolve-target
            --target "${{ inputs.hf_target }}"
            --github-env "${GITHUB_ENV}"
            --github-output "${GITHUB_OUTPUT}"
          )
          if [[ -n "${{ inputs.runtime_variant }}" ]]; then
            ARGS+=(--runtime-variant "${{ inputs.runtime_variant }}")
          fi
          cargo run --quiet --locked -p asr-hf -- "${ARGS[@]}"

      - name: Prepare revision locks and candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci/hf/config/revisions .cache/evaluation/audio "results/${{ matrix.name }}"
          echo "HF_HOME=$(pwd)/.cache/huggingface" >> "$GITHUB_ENV"
          bash scripts/hf/hf-fetch-revisions.sh
          bash scripts/ci/validate-revisions.sh \
            --root .ci/hf/config/revisions \
            --expected-development-repo-id "${EXPECTED_DEVELOPMENT_REPO_ID}" \
            --expected-upstream-repo-id "${EXPECTED_UPSTREAM_REPO_ID}" \
            --expected-tokenizer-repo-id "${EXPECTED_TOKENIZER_REPO_ID}" \
            --expected-framework "${EXPECTED_FRAMEWORK}" \
            --expected-profile-set "${HF_PROFILE_SET}" \
            --runtime-variant "${ASR_RUNTIME_VARIANT}" \
            --expected-runtime-profile "${EXPECTED_RUNTIME_PROFILE}" \
            --expected-decoder "${EXPECTED_DECODER}"
          bash scripts/hf/hf-fetch-candidate.sh "$CANDIDATE_ID"

      - name: Generate strict candidate execution contract
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/resolve-candidate-artifacts.py \
            --candidate-dir .ci/candidate \
            --runtime-variant "${ASR_RUNTIME_VARIANT}" \
            --contract-out .ci/candidate-contract.json \
            --github-output "${GITHUB_OUTPUT}"

      - name: Verify strict candidate execution contract
        id: candidate-verify
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_ID" == "${{ steps.candidate.outputs.candidate_id }}" ]] || {
            echo "::error::resolved candidate does not match materialized candidate identity"
            exit 1
          }
          [[ "${EXPECTED_RUNTIME_PROFILE}" == "${{ steps.candidate.outputs.runtime_profile }}" ]] || {
            echo "::error::candidate runtime profile does not match resolved target profile"
            exit 1
          }
          [[ "${{ steps.candidate.outputs.tokenizer_kind }}" == "vocabulary" ]] || {
            echo "::error::Rust CTC evaluator requires a vocabulary tokenizer"
            exit 1
          }

      - name: Validate Rust evaluator capability
        shell: bash
        run: |
          set -euo pipefail
          cargo run --quiet --locked -p asr-contracts --bin asr-evaluator-policy -- \
            --evaluator rust-onnx \
            --decoder "${EXPECTED_DECODER}" \
            --runtime-variant "${ASR_RUNTIME_VARIANT}" \
            --provider "${{ matrix.provider }}" \
            --candidate-contract .ci/candidate-contract.json

      - name: Materialize locked dataset selection
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/prepare-rust-manifest.py \
            --provider "${{ matrix.provider }}" \
            --evaluation "${{ inputs.evaluation }}" \
            --environment "${{ matrix.environment }}" \
            --model-config "${HF_TARGET_ID}" \
            --revisions .ci/hf/config/revisions \
            --output .ci/resolved-manifest.json

      - name: Build canonical Rust run context
        shell: bash
        run: |
          set -euo pipefail
          ARGS=(
            build-run-context
            --repository-root .
            --model "${HF_TARGET_ID}"
            --provider "${{ matrix.provider }}"
            --evaluation "${{ inputs.evaluation }}"
            --environment "${{ matrix.environment }}"
            --revisions .ci/hf/config/revisions
            --candidate-contract .ci/candidate-contract.json
            --runtime-variant "${ASR_RUNTIME_VARIANT}"
            --experiment-id "${EXPERIMENT_ID}"
            --optimization-level "${{ inputs.optimization_level }}"
            --output .ci/run-context.json
          )
          if [[ "${{ inputs.strict_provider }}" == "true" && "${{ matrix.provider }}" != "cpu" ]]; then
            ARGS+=(--strict-provider)
          fi
          cargo run --quiet --locked -p asr-contracts --bin asr-contracts -- "${ARGS[@]}"

      - name: Build Rust evaluator
        shell: bash
        run: cargo build --locked --release -p asr-eval --no-default-features --features "${{ matrix.features }}"

      - name: Evaluate with Rust
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/release/asr-eval"
          [[ "${{ runner.os }}" == "Windows" ]] && BIN="target/release/asr-eval.exe"
          "$BIN" evaluate \
            --provider "${{ matrix.provider }}" \
            --candidate-contract .ci/candidate-contract.json \
            --run-context .ci/run-context.json \
            --resolved-manifest .ci/resolved-manifest.json \
            --output "results/${{ matrix.name }}"

      - name: Validate shared JSON contracts with Rust
        if: always()
        shell: bash
        run: |
          if [[ -f "results/${{ matrix.name }}/metrics.json" ]]; then
            cargo run --quiet --locked -p asr-contracts --bin asr-contracts -- \
              validate-run "results/${{ matrix.name }}"
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rust-eval-${{ steps.hf.outputs.target_id }}-${{ steps.hf.outputs.runtime_variant }}-${{ matrix.name }}-${{ needs.allocate-experiment.outputs.candidate_id }}
          path: results/${{ matrix.name }}
          retention-days: 7
          if-no-files-found: warn
