name: Rust Cross Platform Evaluation

on:
  workflow_dispatch:
    inputs:
      hf_bucket:
        description: "HF_BUCKET value from vars.HF_TARGETS_JSON"
        required: true
        default: gawohok7/jpapt-v2.2-dev-bucket
        type: string
      candidate_id:
        description: "Existing HF Bucket candidates/<candidate_id> to evaluate"
        required: true
        type: string
      runtime_variant:
        description: "Runtime variant from the target profile set (blank = catalog default)"
        required: false
        default: ""
        type: string
      evaluation:
        description: "Evaluation suite"
        required: false
        default: smoke
        type: choice
        options: [smoke, parity, coreml-parity, full]

permissions:
  contents: read
  actions: write

concurrency:
  group: rust-eval-${{ inputs.hf_bucket }}-${{ inputs.candidate_id }}-${{ inputs.runtime_variant || 'default' }}-${{ inputs.evaluation }}
  cancel-in-progress: true

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF_TARGETS_JSON: ${{ vars.HF_TARGETS_JSON }}
  GH_TOKEN: ${{ secrets.HF_ALLOCATOR_GITHUB_TOKEN || github.token }}
  HF_ALLOCATOR_REPOSITORY: bie3yeik-lgtm/jpapt-v2.2-inspection

jobs:
  allocate-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      experiment_id: ${{ steps.allocate.outputs.experiment_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install project for catalog resolution
        run: python -m pip install -e ".[dev]"
      - id: allocate
        name: Allocate ID through central allocator
        shell: bash
        env:
          HF_BUCKET: ${{ inputs.hf_bucket }}
          CANDIDATE_ID: ${{ inputs.candidate_id }}
          EVALUATION_ID: ${{ inputs.evaluation }}
          ASR_RUNTIME_VARIANT: ${{ inputs.runtime_variant }}
        run: |
          set -euo pipefail
          ID="$(bash scripts/hf/hf-allocate-id.sh experiments experiment.rust_eval)"
          echo "experiment_id=${ID}" >> "${GITHUB_OUTPUT}"
          echo "Experiment: ${ID}"

  evaluate:
    needs: allocate-experiment
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-cpu
            os: ubuntu-latest
            environment: linux
            provider: cpu
            features: cpu
          - name: windows-cpu
            os: windows-latest
            environment: windows
            provider: cpu
            features: cpu
          - name: macos-cpu
            os: macos-15
            environment: macos
            provider: cpu
            features: cpu
          - name: macos-coreml
            os: macos-15
            environment: macos
            provider: coreml
            features: cpu,coreml
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      HF_BUCKET: ""
      HF_MODEL_REPO: ""
      EXPECTED_DEVELOPMENT_REPO_ID: ""
      EXPECTED_UPSTREAM_REPO_ID: ""
      EXPECTED_TOKENIZER_REPO_ID: ""
      EXPECTED_FRAMEWORK: ""
      HF_PROFILE_SET: ""
      ASR_RUNTIME_VARIANT: ""
      EXPECTED_RUNTIME_PROFILE: ""
      EXPECTED_DECODER: ""
      HF_TARGET_ID: ""
      EXPERIMENT_ID: ${{ needs.allocate-experiment.outputs.experiment_id }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python preparation layer
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[datasets,onnx,dev]"
          python -m pip install --upgrade huggingface_hub

      - name: Resolve HF Bucket and runtime variant
        id: hf
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${HF_TARGETS_JSON:-}" ]] || { echo "::error::HF_TARGETS_JSON is required."; exit 1; }
          ARGS=(
            --bucket "${{ inputs.hf_bucket }}"
            --targets-json "${HF_TARGETS_JSON}"
            --github-env "${GITHUB_ENV}"
            --github-output "${GITHUB_OUTPUT}"
          )
          if [[ -n "${{ inputs.runtime_variant }}" ]]; then
            ARGS+=(--runtime-variant "${{ inputs.runtime_variant }}")
          fi
          python scripts/ci/resolve-hf-target.py "${ARGS[@]}"

      - name: Prepare directories and revision locks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci/hf/config/revisions .ci/candidate .cache/evaluation/audio "results/${{ matrix.name }}"
          echo "HF_HOME=$(pwd)/.cache/huggingface" >> "$GITHUB_ENV"
          bash scripts/hf/hf-fetch-revisions.sh
          python scripts/ci/validate-revisions.py \
            --root .ci/hf/config/revisions \
            --expected-development-repo-id "${EXPECTED_DEVELOPMENT_REPO_ID}" \
            --expected-upstream-repo-id "${EXPECTED_UPSTREAM_REPO_ID}" \
            --expected-tokenizer-repo-id "${EXPECTED_TOKENIZER_REPO_ID}" \
            --expected-framework "${EXPECTED_FRAMEWORK}" \
            --expected-profile-set "${HF_PROFILE_SET}" \
            --runtime-variant "${ASR_RUNTIME_VARIANT}" \
            --expected-runtime-profile "${EXPECTED_RUNTIME_PROFILE}" \
            --expected-decoder "${EXPECTED_DECODER}"
          bash scripts/hf/hf-fetch-candidate.sh "${{ inputs.candidate_id }}"

      - name: Validate Rust evaluator and candidate capability
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/validate-evaluator-capability.py \
            --evaluator rust-onnx \
            --decoder "${EXPECTED_DECODER}" \
            --runtime-variant "${ASR_RUNTIME_VARIANT}" \
            --provider "${{ matrix.provider }}" \
            --candidate-dir .ci/candidate

      - name: Resolve selected candidate variant
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/resolve-candidate-artifacts.py \
            --candidate-dir .ci/candidate \
            --runtime-variant "${ASR_RUNTIME_VARIANT}" \
            --github-output "${GITHUB_OUTPUT}"
          [[ "${{ inputs.candidate_id }}" == "${{ steps.candidate.outputs.candidate_id }}" ]] || {
            echo "::error::candidate_id input does not match metadata.json"
            exit 1
          }
          [[ "${EXPECTED_RUNTIME_PROFILE}" == "${{ steps.candidate.outputs.runtime_profile }}" ]] || {
            echo "::error::candidate runtime profile does not match resolved target profile"
            exit 1
          }
          [[ "${{ steps.candidate.outputs.tokenizer_kind }}" == "vocabulary" ]] || {
            echo "::error::Rust CTC evaluator requires the selected profile tokenizer kind to be vocabulary"
            exit 1
          }

      - name: Materialize locked dataset selection
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/prepare-rust-manifest.py \
            --provider "${{ matrix.provider }}" \
            --evaluation "${{ inputs.evaluation }}" \
            --environment "${{ matrix.environment }}" \
            --model-config "${HF_TARGET_ID}" \
            --revisions .ci/hf/config/revisions \
            --output .ci/resolved-manifest.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Build Rust evaluator
        shell: bash
        run: cargo build --release -p asr-eval --no-default-features --features "${{ matrix.features }}"

      - name: Evaluate with Rust
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/release/asr-eval"
          [[ "${{ runner.os }}" == "Windows" ]] && BIN="target/release/asr-eval.exe"
          "$BIN" evaluate \
            --provider "${{ matrix.provider }}" \
            --model "${{ steps.candidate.outputs.primary_artifact }}" \
            --candidate-dir .ci/candidate \
            --candidate-id "${{ inputs.candidate_id }}" \
            --experiment-id "${EXPERIMENT_ID}" \
            --vocabulary "${{ steps.candidate.outputs.tokenizer_path }}" \
            --resolved-manifest .ci/resolved-manifest.json \
            --evaluation "${{ inputs.evaluation }}" \
            --model-id "${HF_TARGET_ID}" \
            --revisions .ci/hf/config/revisions \
            --output "results/${{ matrix.name }}"

      - name: Validate shared JSON contracts
        if: always()
        shell: bash
        run: |
          if [[ -f "results/${{ matrix.name }}/metrics.json" ]]; then
            python scripts/ci/validate-result.py "results/${{ matrix.name }}"
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rust-eval-${{ steps.hf.outputs.target_id }}-${{ steps.hf.outputs.runtime_variant }}-${{ matrix.name }}-${{ inputs.candidate_id }}
          path: results/${{ matrix.name }}
          retention-days: 7
          if-no-files-found: warn
