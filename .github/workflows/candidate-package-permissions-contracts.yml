name: Candidate Package Permission Contracts

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/candidate-package-evaluate-v2.yml
      - .github/workflows/candidate-package-permissions-contracts.yml
      - scripts/ci/check-candidate-package-permissions.py
  pull_request:
    paths:
      - .github/workflows/candidate-package-evaluate-v2.yml
      - .github/workflows/candidate-package-permissions-contracts.yml
      - scripts/ci/check-candidate-package-permissions.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-package-permissions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Validate V2 package permissions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: false
      - name: Install pinned validators
        run: |
          python -m pip install --disable-pip-version-check 'PyYAML>=6,<7'
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Lint V2 and permission contract workflows
        run: >-
          actionlint -color -ignore 'SC2016'
          .github/workflows/candidate-package-evaluate-v2.yml
          .github/workflows/candidate-package-permissions-contracts.yml
      - name: Validate permission checker syntax
        run: python -m py_compile scripts/ci/check-candidate-package-permissions.py
      - name: Enforce least-privilege package permissions
        run: python scripts/ci/check-candidate-package-permissions.py
