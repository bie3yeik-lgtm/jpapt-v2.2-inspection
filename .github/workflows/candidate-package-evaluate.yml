name: Candidate Package Evaluate
run-name: >-
  Candidate · ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.source_repository || inputs.source_repository }} · ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.suite || inputs.suite || 'smoke' }}

on:
  repository_dispatch:
    types: [jpapt.candidate-evaluate]
  workflow_dispatch:
    inputs:
      source_repository:
        description: "Source GitHub repository (owner/name)"
        required: true
        type: string
      hf_bucket:
        description: "Optional namespace/bucket; blank = source repo config or <repo>-bucket"
        required: false
        default: ""
        type: string
      candidate_id:
        description: "candidate-NNNNNN; blank = latest"
        required: false
        default: ""
        type: string
      package_name:
        description: "GHCR package name; blank = source repo name"
        required: false
        default: ""
        type: string
      dataset_source:
        description: "Dataset routing"
        required: false
        default: bucket
        type: choice
        options: [bucket, repository, custom]
      dataset_id:
        description: "Custom HF dataset repo id when dataset_source=custom"
        required: false
        default: ""
        type: string
      suite:
        description: "Validation suite"
        required: false
        default: smoke
        type: choice
        options: [smoke, parity, probe]
      executor:
        description: "Execution backend"
        required: false
        default: github
        type: choice
        options: [github, hf_jobs]
      environment:
        description: "Runtime environment"
        required: false
        default: linux-cpu
        type: choice
        options: [linux-cpu, linux-cuda, macos-coreml, windows-directml]
      hf_flavor:
        description: "HF Jobs hardware flavor"
        required: false
        default: cpu-basic
        type: string
      dry_run:
        description: "Resolve inputs and estimate runtime without building/running"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: candidate-package-${{ github.run_id }}
  cancel-in-progress: false

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
  HF_DEFAULT_NAMESPACE: ${{ vars.HF_DEFAULT_NAMESPACE }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      source_repository: ${{ steps.resolve.outputs.source_repository }}
      hf_bucket: ${{ steps.resolve.outputs.hf_bucket }}
      candidate_id: ${{ steps.resolve.outputs.candidate_id }}
      package_name: ${{ steps.resolve.outputs.package_name }}
      image: ${{ steps.resolve.outputs.image }}
      dataset_source: ${{ steps.resolve.outputs.dataset_source }}
      dataset_id: ${{ steps.resolve.outputs.dataset_id }}
      suite: ${{ steps.resolve.outputs.suite }}
      executor: ${{ steps.resolve.outputs.executor }}
      environment: ${{ steps.resolve.outputs.environment }}
      provider: ${{ steps.resolve.outputs.provider }}
      runner: ${{ steps.resolve.outputs.runner }}
      hf_flavor: ${{ steps.resolve.outputs.hf_flavor }}
      dry_run: ${{ steps.resolve.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --upgrade "huggingface_hub>=1.0,<2"
      - id: resolve
        shell: bash
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          I_SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          I_HF_BUCKET: ${{ inputs.hf_bucket }}
          I_CANDIDATE_ID: ${{ inputs.candidate_id }}
          I_PACKAGE_NAME: ${{ inputs.package_name }}
          I_DATASET_SOURCE: ${{ inputs.dataset_source }}
          I_DATASET_ID: ${{ inputs.dataset_id }}
          I_SUITE: ${{ inputs.suite }}
          I_EXECUTOR: ${{ inputs.executor }}
          I_ENVIRONMENT: ${{ inputs.environment }}
          I_HF_FLAVOR: ${{ inputs.hf_flavor }}
          I_DRY_RUN: ${{ inputs.dry_run }}
          GH_FALLBACK_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          get(){ if [[ "${GITHUB_EVENT_NAME}" == repository_dispatch ]]; then jq -r --arg k "$1" --arg d "$2" '.[$k] // $d' <<<"$PAYLOAD"; else local v="$3"; printf '%s\n' "${v:-$2}"; fi; }
          source_repository="$(get source_repository '' "$I_SOURCE_REPOSITORY")"
          [[ "$source_repository" =~ ^[^/]+/[^/]+$ ]] || { echo '::error::source_repository must be owner/name'; exit 1; }
          repo_name="${source_repository##*/}"
          hf_bucket="$(get hf_bucket '' "$I_HF_BUCKET")"
          candidate_id="$(get candidate_id '' "$I_CANDIDATE_ID")"
          package_name="$(get package_name "$repo_name" "$I_PACKAGE_NAME" | tr '[:upper:]' '[:lower:]')"
          dataset_source="$(get dataset_source bucket "$I_DATASET_SOURCE")"
          dataset_id="$(get dataset_id '' "$I_DATASET_ID")"
          suite="$(get suite smoke "$I_SUITE")"
          executor="$(get executor github "$I_EXECUTOR")"
          environment="$(get environment linux-cpu "$I_ENVIRONMENT")"
          hf_flavor="$(get hf_flavor cpu-basic "$I_HF_FLAVOR")"
          dry_run="$(get dry_run false "$I_DRY_RUN")"

          config_json='{}'
          token="${SOURCE_REPO_TOKEN:-$GH_FALLBACK_TOKEN}"
          encoded="$(GH_TOKEN="$token" gh api "/repos/$source_repository/contents/.jpapt/hf-bucket.yml" --jq .content 2>/dev/null || true)"
          if [[ -n "$encoded" ]]; then
            printf '%s' "$encoded" | tr -d '\n' | base64 -d > /tmp/hf-bucket.yml
            python - <<'PY' >/tmp/repo-config.json
import json, pathlib
try:
 import yaml
except Exception:
 yaml=None
p=pathlib.Path('/tmp/hf-bucket.yml')
if yaml:
 print(json.dumps(yaml.safe_load(p.read_text()) or {}))
else:
 d={}
 for line in p.read_text().splitlines():
  if ':' in line and not line.startswith(' '):
   k,v=line.split(':',1); d[k.strip()]=v.strip()
 print(json.dumps(d))
PY
            config_json="$(cat /tmp/repo-config.json)"
          fi

          if [[ -z "$hf_bucket" ]]; then
            hf_bucket="$(jq -r '.hf_bucket // empty' <<<"$config_json")"
          fi
          if [[ -z "$hf_bucket" ]]; then
            namespace="${HF_DEFAULT_NAMESPACE:-}"
            if [[ -z "$namespace" && -n "${HF_TOKEN:-}" ]]; then
              namespace="$(HF_TOKEN="$HF_TOKEN" hf auth whoami --format json 2>/dev/null | jq -r '.name // .user // empty' || true)"
            fi
            [[ -n "$namespace" ]] || { echo '::error::Cannot infer HF namespace'; exit 1; }
            hf_bucket="$namespace/${repo_name}-bucket"
          fi

          if [[ "$dataset_source" == repository && -z "$dataset_id" ]]; then
            dataset_id="$(jq -r '.datasets.repository_dataset // empty' <<<"$config_json")"
          fi

          case "$environment" in
            linux-cpu) runner=ubuntu-latest; provider=CPUExecutionProvider ;;
            linux-cuda) runner=ubuntu-latest; provider=CUDAExecutionProvider ;;
            macos-coreml) runner=macos-14; provider=CoreMLExecutionProvider ;;
            windows-directml) runner=windows-latest; provider=DmlExecutionProvider ;;
            *) echo "::error::unsupported environment=$environment"; exit 1 ;;
          esac
          [[ "$executor" != hf_jobs || "$environment" == linux-* ]] || { echo '::error::HF Jobs supports this workflow only for Linux environments'; exit 1; }
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$package_name"

          for pair in source_repository="$source_repository" hf_bucket="$hf_bucket" candidate_id="$candidate_id" package_name="$package_name" image="$image" dataset_source="$dataset_source" dataset_id="$dataset_id" suite="$suite" executor="$executor" environment="$environment" provider="$provider" runner="$runner" hf_flavor="$hf_flavor" dry_run="$dry_run"; do echo "$pair" >> "$GITHUB_OUTPUT"; done

      - name: Dry-run estimate
        shell: bash
        run: |
          set -euo pipefail
          suite='${{ steps.resolve.outputs.suite }}'; executor='${{ steps.resolve.outputs.executor }}'; env='${{ steps.resolve.outputs.environment }}'
          case "$suite" in smoke) eval_min=5;; probe) eval_min=3;; parity) eval_min=25;; esac
          case "$env" in linux-cpu) mult=2;; linux-cuda) mult=1;; macos-coreml) mult=2;; windows-directml) mult=2;; esac
          total=$((8 + eval_min * mult))
          [[ "$executor" == hf_jobs ]] && total=$((total + 4))
          {
            echo '## Candidate package plan'
            echo '- Bucket: `${{ steps.resolve.outputs.hf_bucket }}`'
            echo '- Candidate: `${{ steps.resolve.outputs.candidate_id || 'latest' }}`'
            echo '- Image: `${{ steps.resolve.outputs.image }}`'
            echo '- Suite: `${{ steps.resolve.outputs.suite }}`'
            echo '- Executor/environment: `${{ steps.resolve.outputs.executor }}` / `${{ steps.resolve.outputs.environment }}`'
            echo "- Coarse estimate: **~${total} min** (candidate size, cache hit rate and dataset size can dominate)"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: prepare
    if: needs.prepare.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    outputs:
      candidate_id: ${{ steps.candidate.outputs.candidate_id }}
      image_ref: ${{ steps.push.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install --disable-pip-version-check --upgrade "huggingface_hub>=1.0,<2"
      - id: candidate
        env:
          HF_BUCKET: ${{ needs.prepare.outputs.hf_bucket }}
          CANDIDATE_ID: ${{ needs.prepare.outputs.candidate_id }}
        run: bash scripts/hf/hf-fetch-candidate.sh "${CANDIDATE_ID:-}"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: push
        shell: bash
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          SOURCE_REPOSITORY: ${{ needs.prepare.outputs.source_repository }}
          HF_BUCKET: ${{ needs.prepare.outputs.hf_bucket }}
          PACKAGE_NAME: ${{ needs.prepare.outputs.package_name }}
          CANDIDATE_ID: ${{ steps.candidate.outputs.candidate_id }}
        run: |
          set -euo pipefail
          tag="$IMAGE:$CANDIDATE_ID"
          docker buildx build \
            -f docker/candidate-package/Dockerfile . \
            --build-arg SOURCE_REPOSITORY="$SOURCE_REPOSITORY" \
            --build-arg SOURCE_BUCKET="$HF_BUCKET" \
            --build-arg CANDIDATE_ID="$CANDIDATE_ID" \
            --build-arg PACKAGE_NAME="$PACKAGE_NAME" \
            --cache-from type=gha,scope="candidate-$PACKAGE_NAME" \
            --cache-to type=gha,mode=max,scope="candidate-$PACKAGE_NAME" \
            --tag "$tag" --tag "$IMAGE:latest" --push
          echo "image_ref=$tag" >> "$GITHUB_OUTPUT"

  evaluate-github:
    needs: [prepare, build]
    if: needs.prepare.outputs.dry_run != 'true' && needs.prepare.outputs.executor == 'github'
    runs-on: ${{ needs.prepare.outputs.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - name: Install transport/runtime
        run: python -m pip install --disable-pip-version-check --upgrade "huggingface_hub>=1.0,<2" onnxruntime numpy
      - name: Fetch dataset selection
        shell: bash
        env:
          HF_BUCKET: ${{ needs.prepare.outputs.hf_bucket }}
          DATASET_SOURCE: ${{ needs.prepare.outputs.dataset_source }}
          DATASET_ID: ${{ needs.prepare.outputs.dataset_id }}
        run: |
          set -euo pipefail
          mkdir -p .ci/dataset results/candidate-package
          if [[ "$DATASET_SOURCE" == bucket ]]; then
            hf buckets sync --token "$HF_TOKEN" "hf://buckets/$HF_BUCKET/datasets" .ci/dataset || true
          elif [[ -n "$DATASET_ID" ]]; then
            hf download --repo-type dataset "$DATASET_ID" --local-dir .ci/dataset --token "$HF_TOKEN"
          fi
      - name: Evaluate selected package contract
        shell: bash
        env:
          IMAGE: ${{ needs.build.outputs.image_ref }}
          SUITE: ${{ needs.prepare.outputs.suite }}
          PROVIDER: ${{ needs.prepare.outputs.provider }}
        run: |
          set -euo pipefail
          if [[ "${{ needs.prepare.outputs.environment }}" == linux-* ]]; then
            echo "$CR_PAT" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            docker pull "$IMAGE"
            docker run --rm \
              -v "$PWD/.ci/dataset:/data:ro" \
              -v "$PWD/results/candidate-package:/results" \
              "$IMAGE" --suite "$SUITE" --provider "$PROVIDER" --dataset-dir /data --output /results/result.json
          else
            echo '::notice::OCI package execution is Linux-only on hosted runners; probing candidate natively for the selected OS/provider.'
            HF_BUCKET='${{ needs.prepare.outputs.hf_bucket }}' CANDIDATE_ID='${{ needs.build.outputs.candidate_id }}' bash scripts/hf/hf-fetch-candidate.sh "$CANDIDATE_ID"
            python scripts/ci/generic-candidate-evaluate.py --candidate-dir .ci/candidate --dataset-dir .ci/dataset --suite "$SUITE" --provider "$PROVIDER" --output results/candidate-package/result.json
          fi
        env:
          CR_PAT: ${{ github.token }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: candidate-package-${{ needs.build.outputs.candidate_id }}-${{ needs.prepare.outputs.environment }}-${{ needs.prepare.outputs.suite }}
          path: results/candidate-package
          retention-days: 14

  evaluate-hf-jobs:
    needs: [prepare, build]
    if: needs.prepare.outputs.dry_run != 'true' && needs.prepare.outputs.executor == 'hf_jobs'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check --upgrade "huggingface_hub>=1.0,<2"
      - name: Submit HF Job
        shell: bash
        env:
          IMAGE: ${{ needs.build.outputs.image_ref }}
          SUITE: ${{ needs.prepare.outputs.suite }}
          PROVIDER: ${{ needs.prepare.outputs.provider }}
          HF_BUCKET: ${{ needs.prepare.outputs.hf_bucket }}
          DATASET_SOURCE: ${{ needs.prepare.outputs.dataset_source }}
          DATASET_ID: ${{ needs.prepare.outputs.dataset_id }}
          FLAVOR: ${{ needs.prepare.outputs.hf_flavor }}
        run: |
          set -euo pipefail
          volume_args=()
          if [[ "$DATASET_SOURCE" == bucket ]]; then
            volume_args=(-v "hf://buckets/$HF_BUCKET/datasets:/data:ro")
          elif [[ -n "$DATASET_ID" ]]; then
            volume_args=(-v "hf://datasets/$DATASET_ID:/data:ro")
          fi
          hf jobs run --token "$HF_TOKEN" --flavor "$FLAVOR" \
            --name "jpapt-${{ needs.build.outputs.candidate_id }}-$SUITE" \
            "${volume_args[@]}" \
            "$IMAGE" \
            --suite "$SUITE" --provider "$PROVIDER" --dataset-dir /data --output /tmp/result.json
