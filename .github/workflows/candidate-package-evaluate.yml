name: Candidate Package Evaluate

# Compatibility entrypoint only. New callers should use Candidate Request Gateway
# or Candidate Package Evaluate V2 directly. This workflow intentionally contains
# no candidate build/evaluation implementation.
on:
  repository_dispatch:
    types:
      - jpapt.candidate-evaluate
  workflow_dispatch:
    inputs:
      request_id:
        description: Optional caller correlation ID
        required: false
        default: ""
        type: string
      source_repository:
        description: Source GitHub repo owner/name
        required: true
        type: string
      receipt_repository:
        description: Completion receipt repo owner/name; blank = source repository
        required: false
        default: ""
        type: string
      hf_bucket:
        description: Optional namespace/bucket
        required: false
        default: ""
        type: string
      candidate_id:
        description: candidate-NNNNNN; blank = repository default/latest
        required: false
        default: ""
        type: string
      package_name:
        description: GHCR package name; blank = repository config/repo name
        required: false
        default: ""
        type: string
      dataset_source:
        description: auto, bucket, repository, or custom
        required: false
        default: auto
        type: choice
        options: [auto, bucket, repository, custom]
      dataset_id:
        description: HF dataset repo id for custom/repository source
        required: false
        default: ""
        type: string
      suite:
        description: Validation suite
        required: false
        default: smoke
        type: choice
        options: [smoke, parity, probe]
      executor:
        description: Execution backend
        required: false
        default: github
        type: choice
        options: [github, hf_jobs]
      environment:
        description: Execution environment
        required: false
        default: linux-cpu
        type: choice
        options: [linux-cpu, linux-cuda, macos-coreml]
      hf_flavor:
        description: HF Jobs flavor
        required: false
        default: cpu-basic
        type: string
      hf_jobs_image:
        description: Optional image override that HF Jobs can pull; blank = built digest
        required: false
        default: ""
        type: string
      dry_run:
        description: Resolve and estimate only
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: read

jobs:
  forward:
    name: Forward legacy request to V2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Normalize compatibility request
        id: request
        shell: bash
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          I_REQUEST_ID: ${{ inputs.request_id }}
          I_SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          I_RECEIPT_REPOSITORY: ${{ inputs.receipt_repository }}
          I_HF_BUCKET: ${{ inputs.hf_bucket }}
          I_CANDIDATE_ID: ${{ inputs.candidate_id }}
          I_PACKAGE_NAME: ${{ inputs.package_name }}
          I_DATASET_SOURCE: ${{ inputs.dataset_source }}
          I_DATASET_ID: ${{ inputs.dataset_id }}
          I_SUITE: ${{ inputs.suite }}
          I_EXECUTOR: ${{ inputs.executor }}
          I_ENVIRONMENT: ${{ inputs.environment }}
          I_HF_FLAVOR: ${{ inputs.hf_flavor }}
          I_HF_JOBS_IMAGE: ${{ inputs.hf_jobs_image }}
          I_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          value() {
            local key="$1"
            local default_value="$2"
            local manual_value="${3:-}"
            if [[ "$GITHUB_EVENT_NAME" == repository_dispatch ]]; then
              jq -r --arg key "$key" --arg default_value "$default_value" '.[$key] // $default_value | tostring' <<<"$PAYLOAD"
            elif [[ -n "$manual_value" ]]; then
              printf '%s\n' "$manual_value"
            else
              printf '%s\n' "$default_value"
            fi
          }
          request_id="$(value request_id '' "$I_REQUEST_ID")"
          source_repository="$(value source_repository '' "$I_SOURCE_REPOSITORY")"
          receipt_repository="$(value receipt_repository '' "$I_RECEIPT_REPOSITORY")"
          hf_bucket="$(value hf_bucket '' "$I_HF_BUCKET")"
          candidate_id="$(value candidate_id '' "$I_CANDIDATE_ID")"
          package_name="$(value package_name '' "$I_PACKAGE_NAME")"
          dataset_source="$(value dataset_source auto "$I_DATASET_SOURCE")"
          dataset_id="$(value dataset_id '' "$I_DATASET_ID")"
          suite="$(value suite smoke "$I_SUITE")"
          executor="$(value executor github "$I_EXECUTOR")"
          environment="$(value environment linux-cpu "$I_ENVIRONMENT")"
          hf_flavor="$(value hf_flavor cpu-basic "$I_HF_FLAVOR")"
          hf_jobs_image="$(value hf_jobs_image '' "$I_HF_JOBS_IMAGE")"
          dry_run="$(value dry_run false "$I_DRY_RUN")"
          bash scripts/ci/validate-repository-identity.sh "$source_repository" source_repository >/dev/null
          [[ -n "$receipt_repository" ]] || receipt_repository="$source_repository"
          bash scripts/ci/validate-repository-identity.sh "$receipt_repository" receipt_repository >/dev/null
          [[ -n "$request_id" ]] || request_id="legacy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          [[ "$request_id" =~ ^[A-Za-z0-9._:-]{1,128}$ ]] || { echo "::error::request_id is invalid"; exit 1; }
          case "$dry_run" in true|false) ;; *) echo "::error::dry_run must be true or false"; exit 1 ;; esac
          jq -n \
            --arg ref "$GITHUB_REF_NAME" --arg request_id "$request_id" \
            --arg source_repository "$source_repository" --arg receipt_repository "$receipt_repository" \
            --arg hf_bucket "$hf_bucket" --arg candidate_id "$candidate_id" --arg package_name "$package_name" \
            --arg dataset_source "$dataset_source" --arg dataset_id "$dataset_id" --arg suite "$suite" \
            --arg executor "$executor" --arg environment "$environment" --arg hf_flavor "$hf_flavor" \
            --arg hf_jobs_image "$hf_jobs_image" --arg dry_run "$dry_run" \
            '{ref:$ref,inputs:{request_id:$request_id,source_repository:$source_repository,receipt_repository:$receipt_repository,hf_bucket:$hf_bucket,candidate_id:$candidate_id,package_name:$package_name,dataset_source:$dataset_source,dataset_id:$dataset_id,suite:$suite,executor:$executor,environment:$environment,hf_flavor:$hf_flavor,hf_jobs_image:$hf_jobs_image,dry_run:$dry_run}}' \
            > /tmp/v2-dispatch.json
          {
            echo "request_id=$request_id"
            echo "source_repository=$source_repository"
            echo "receipt_repository=$receipt_repository"
            echo "dry_run=$dry_run"
          } >> "$GITHUB_OUTPUT"
      - name: Dispatch canonical V2 evaluator with bounded retry
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          bash scripts/ci/workflow-dispatch-with-retry.sh
          "$GITHUB_REPOSITORY"
          candidate-package-evaluate-v2.yml
          /tmp/v2-dispatch.json
          3
      - name: Write compatibility summary
        shell: bash
        env:
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
          SOURCE_REPOSITORY: ${{ steps.request.outputs.source_repository }}
          RECEIPT_REPOSITORY: ${{ steps.request.outputs.receipt_repository }}
          DRY_RUN: ${{ steps.request.outputs.dry_run }}
        run: |
          {
            echo "## Legacy candidate evaluation compatibility wrapper"
            echo
            echo "> This entrypoint no longer evaluates candidates directly. The request was forwarded to candidate-package-evaluate-v2.yml."
            echo
            printf -- '- request id: <code>%s</code>\n' "$REQUEST_ID"
            printf -- '- source repository: <code>%s</code>\n' "$SOURCE_REPOSITORY"
            printf -- '- receipt repository: <code>%s</code>\n' "$RECEIPT_REPOSITORY"
            printf -- '- dry run: <code>%s</code>\n' "$DRY_RUN"
          } >> "$GITHUB_STEP_SUMMARY"
