name: Resolve Package Base Image

on:
  pull_request:
    paths:
      - .github/workflows/resolve-package-base-image.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'agent/resolve-package-base-image-20260820' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Resolve anonymous registry manifest digest
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          image='python:3.12-slim'
          output="$(docker buildx imagetools inspect "$image")"
          printf '%s\n' "$output"
          digest="$(awk '/^Digest:/ {print $2; exit}' <<<"$output")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::unable to resolve immutable digest for $image"
            exit 1
          }
          pinned="docker.io/library/python@${digest}"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
          {
            echo '### Reviewed base-image resolution'
            echo
            echo "- tag: \`$image\`"
            echo "- digest: \`$digest\`"
            echo "- pinned reference: \`$pinned\`"
            echo '- operation: anonymous registry manifest inspection only'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build evidence
        shell: bash
        env:
          DIGEST: ${{ steps.resolve.outputs.digest }}
          PINNED: ${{ steps.resolve.outputs.pinned }}
        run: |
          set -euo pipefail
          mkdir -p base-image-resolution
          jq -n \
            --arg tag 'python:3.12-slim' \
            --arg digest "$DIGEST" \
            --arg pinned "$PINNED" \
            '{schema_version:1,tag:$tag,digest:$digest,pinned_reference:$pinned,anonymous_registry_inspection:true,docker_build:false,docker_pull:false,hf_jobs:false,model_compute:false}' \
            > base-image-resolution/evidence.json
      - uses: actions/upload-artifact@v7
        with:
          name: package-base-image-resolution-${{ github.run_id }}-${{ github.run_attempt }}
          path: base-image-resolution/
          if-no-files-found: error
          retention-days: 30
