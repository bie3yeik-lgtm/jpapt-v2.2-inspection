name: Phase16 Validate

on:
  push:
    branches: [agent/rust-asr-catalog-phase16-clean]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/rust-asr-catalog-phase16-clean
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate Phase 16
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --locked -p asr-contracts --all-targets -- -D warnings
          cargo test --locked -p asr-contracts

          RUST_ID="$(cargo run --quiet --locked -p asr-contracts --bin asr-catalog -- fingerprint catalog_id)"
          RUST_SHA="$(cargo run --quiet --locked -p asr-contracts --bin asr-catalog -- fingerprint sha256)"
          RUST_PROFILE="$(cargo run --quiet --locked -p asr-contracts --bin asr-catalog -- profile ctc-v1 artifact_contract)"
          RUST_DEFAULT="$(cargo run --quiet --locked -p asr-contracts --bin asr-catalog -- profile-set parakeet-tdt-ctc-v1 default_variant)"
          RUST_TDT="$(cargo run --quiet --locked -p asr-contracts --bin asr-catalog -- profile-set parakeet-tdt-ctc-v1 --variant tdt profile_id)"

          mapfile -t PY_OUT < <(PYTHONPATH=python/src python - <<'PY'
          from pathlib import Path
          from parakeet_onnx.config.catalog import load_repository_catalog
          c = load_repository_catalog(Path.cwd())
          print(c.catalog_id)
          print(c.sha256)
          print(c.decoder_profile("ctc-v1").artifact_contract)
          print(c.profile_set("parakeet-tdt-ctc-v1").default_variant)
          print(c.profile_set("parakeet-tdt-ctc-v1").profile_id_for("tdt"))
          PY
          )
          test "$RUST_ID" = "${PY_OUT[0]}"
          test "$RUST_SHA" = "${PY_OUT[1]}"
          test "$RUST_PROFILE" = "${PY_OUT[2]}"
          test "$RUST_DEFAULT" = "${PY_OUT[3]}"
          test "$RUST_TDT" = "${PY_OUT[4]}"

          if git grep -n 'resolve-asr-catalog.py' -- ':!.github/workflows/phase16-validate.yml'; then
            echo 'deleted Python resolver still has callers' >&2
            exit 1
          fi
      - name: Normalize production files and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          rm -f .github/workflows/phase16-validate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/crates/asr-contracts/src/bin/asr-catalog.rs .github/workflows/phase16-validate.yml
          if ! git diff --cached --quiet; then
            git commit -m 'Normalize Rust ASR catalog resolver'
            git push origin HEAD:agent/rust-asr-catalog-phase16-clean
          fi
