schema_version = 2

[evaluator]
id = "rust-onnx"
implementation = "rust"
backend = "onnxruntime"

[capabilities]
supported_decoders = ["ctc"]
supported_providers = ["cpu", "cuda", "directml", "coreml"]
supported_artifact_contracts = [
  "ctc-single-graph-v0",
  "ctc-single-graph-v1",
]

[decoder_features.ctc]
kv_cache = false
multi_graph = false
transformers_processor = false
external_frontend = false
timestamps = false
