schema_version = 2

[evaluator]
id = "python-onnx"
implementation = "python"
backend = "onnxruntime"

[capabilities]
supported_decoders = ["ctc", "tdt", "whisper_autoregressive"]
supported_providers = ["cpu", "cuda", "directml", "coreml"]
supported_artifact_contracts = [
  "ctc-single-graph-v0",
  "ctc-single-graph-v1",
  "tdt-multi-graph-v1",
  "whisper-autoregressive-v1",
]

[features]
kv_cache = true
multi_graph = true
transformers_processor = true
external_frontend = false
timestamps = false
