# Canonical configuration for kotoba-tech/kotoba-whisper-v2.2.
#
# The upstream Transformers checkpoint is the canonical reference.
# ONNX development artifacts are stored in:
#   model repo: gawohok7/tf-v2.2-onnx-dev
#   bucket:     gawohok7/tf-v2.2-onnx-dev-bucket
#
# Exact upstream/dataset revisions remain pinned in the selected HF Bucket.

schema_version = 1

[model]
id = "kotoba-whisper-v2.2"
display_name = "Kotoba Whisper v2.2"
family = "whisper"
task = "automatic-speech-recognition"
language = "ja"
framework = "transformers"
architecture = "whisper_seq2seq"
role = "transformers_reference"

[upstream]
provider = "huggingface"
repo_type = "model"
repo_id = "kotoba-tech/kotoba-whisper-v2.2"
revision_source = "hf_bucket"
revision_config = "config/revisions/reference.json"
allow_floating_revision = false

[reference]
runtime = "transformers"
loader = "AutoModelForSpeechSeq2Seq.from_pretrained"
processor_loader = "AutoProcessor.from_pretrained"
required_before_onnx_validation = true

[audio]
sample_rate_hz = 16000
channels = 1
require_mono = true
input_format = "waveform"
waveform_dtype = "float32"
waveform_min = -1.0
waveform_max = 1.0
allow_resample = true

[frontend]
implementation = "transformers_whisper_processor"
configuration_source = "upstream_processor"
allow_local_parameter_override = false
output_dtype = "float32"

[encoder]
type = "whisper_encoder"
tensor_contract_source = "candidate_metadata"

[decoders]
supported = ["whisper_autoregressive"]
default = "whisper_autoregressive"
deployment_priority = ["whisper_autoregressive"]

[decoder.whisper_autoregressive]
enabled = true
primary_onnx_target = true
runtime_control = "transformers_generate"
requires_generation_loop = true
requires_kv_cache = true
requires_decoder_input_ids = true
cache_position_support = "candidate_specific"

[decoder.whisper_autoregressive.generation]
configuration_source = "upstream_generation_config"
language = "ja"
task = "transcribe"
special_tokens_source = "upstream_model"
timestamp_tokens = true

[tokenizer]
type = "whisper"
configuration_source = "upstream_processor"
revision_locked = true
apply_runtime_normalization = false

[text]
language = "ja"
punctuation_supported = true
translation_supported = false

[onnx]
enabled = true
role = "deployment_candidate"
canonical_reference_format = "transformers"
artifact_strategy = "portable_baseline"
os_specific_artifacts = false
allow_backend_optimized_variants = true
initial_decoder = "whisper_autoregressive"

[onnx.validation]
require_reference_parity = true
required_checkpoints = [
    "frontend",
    "encoder",
    "decoder_logits",
    "tokens",
    "transcript",
]

[execution]
supported_providers = [
    "cpu",
    "cuda",
    "directml",
    "coreml",
]
reference_provider = "cpu"

[execution.platforms]
linux = ["cpu", "cuda"]
windows = ["cpu", "cuda", "directml"]
macos = ["cpu", "coreml"]

[evaluation.reference]
implementation = "transformers"

[compatibility]
mlx = false
native_coreml_conversion = false
coreml_execution_provider = true
directml_execution_provider = true
cuda_execution_provider = true

[rust]
# Public candidate execution currently routes Whisper through the Python ONNX
# runtime/controller because the Rust evaluator is not the autoregressive
# generation authority for this profile.
planned = true
require_python_parity = true
runtime_complexity = "autoregressive_with_cache"

[metadata]
description = """
Transformers/Whisper v2.2 target used by the private TF v2.2 ONNX development
line. The canonical source is kotoba-tech/kotoba-whisper-v2.2; ONNX candidates
and runs are isolated in gawohok7/tf-v2.2-onnx-dev and its development bucket.
"""
