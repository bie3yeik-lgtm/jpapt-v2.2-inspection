[workspace]
resolver = "3"
members = [
    "rust/crates/asr-runtime",
    "rust/crates/asr-audio",
    "rust/crates/asr-metrics",
    "rust/crates/asr-eval",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
uuid = { version = "1", features = ["v4"] }
hound = "3.5"
unicode-normalization = "0.1"
sysinfo = "0.37"
ort = { version = "=2.0.0-rc.13", features = ["download-binaries"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
